<!doctype html><meta charset=utf-8>
<title>smoke topbar</title>
<style>body{font-family:monospace;padding:20px;white-space:pre-wrap;font-size:11px}</style>
<div id="out">chargement…</div>
<iframe id="f" src="http://127.0.0.1:8734/index.html?seed=1" width="375" height="667" style="border:1px solid #444"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
function tap(el){ if(!el) throw new Error("tap: absent"); el.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true})); }
const f = document.getElementById('f');
const errs = [];
window.addEventListener('error', e => errs.push('parent: ' + e.message));
f.addEventListener('load', async () => {
  const cw = f.contentWindow, cd = f.contentDocument;
  cw.addEventListener('error', e => errs.push('iframe: ' + e.message));
  await wait(300);
  tap(cd.querySelector('#boot [data-act="bootStart"]'));
  await wait(200);
  const topbar = cd.querySelector('.topbar');
  const buttons = Array.from(cd.querySelectorAll('.topbar button'));
  const tb = topbar.getBoundingClientRect();
  const scrollW = topbar.scrollWidth;
  const clientW = topbar.clientWidth;
  const lines = [
    `topbar clientW=${clientW} scrollW=${scrollW} (scrollable=${scrollW>clientW})`,
  ];
  for (const b of buttons) {
    const r = b.getBoundingClientRect();
    lines.push(`  ${b.textContent.padEnd(10)} x=${r.left.toFixed(0)}..${r.right.toFixed(0)} w=${r.width.toFixed(0)} visible=${r.right <= 375}`);
  }
  // Scroll topbar to right and tap COURS
  topbar.scrollLeft = 500;
  await wait(100);
  const coursBtn = cd.querySelector('.topbar [data-act="cours"]');
  const r = coursBtn.getBoundingClientRect();
  lines.push(`AFTER scrollLeft=${topbar.scrollLeft} : COURS x=${r.left.toFixed(0)}..${r.right.toFixed(0)}`);
  tap(coursBtn);
  await wait(200);
  const cours = cd.getElementById('cours');
  lines.push(`cours.show=${cours.classList.contains('show')} items=${cd.querySelectorAll('#cours .cours-index-item').length}`);
  document.getElementById('out').textContent = 'errs='+errs.length+'\n'+errs.join('\n')+'\n'+lines.join('\n');
});
</script>
