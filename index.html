K", "concave stricte en K, à rendements décroissants", "identique à celle de Solow, avec Cobb-Douglas standard", "toujours à rendements constants en L uniquement"], "a": 0, "why": "AK : Y = A·K, linéaire. C'est ce qui rend la croissance ENDOGÈNE : pas de rendement décroissant du capital, donc pas d'état régulier borné. L'investissement peut soutenir la croissance à long terme. Partie_2_C2C3_Paul_Romer.txt lignes 216-251.", "id": "ak-001"}, {"cat": "ak", "mat": "croissance", "ch": 3, "diff": 3, "q": "Comment Frankel (1962) obtient-il une fonction agrégée de type AK à partir d'une Cobb-Douglas au niveau firme ?", "choices": ["en supposant une externalité de learning by doing où le stock agrégé K améliore la productivité de chaque firme", "en supposant que le progrès technique est exogène et constant", "en supposant que les firmes maximisent la production sans contrainte de coût", "en éliminant le facteur travail de la fonction agrégée"], "a": 0, "why": "Frankel (1962), repris par Romer (1986) : chaque firme voit Y_i = K_i^α · (K_agr · L_i)^(1−α). L'externalité positive du stock agrégé compense les rendements décroissants privés → agrégation Cobb-Douglas donne Y = A·K. Partie_2_C2C3_Paul_Romer.txt lignes 242-293.", "id": "ak-002"}, {"cat": "ak", "mat": "croissance", "ch": 3, "diff": 2, "q": "L'enjeu central de la modélisation AK est d'obtenir :", "choices": ["un modèle où la croissance de long terme dépend de choix économiques (épargne)", "un modèle sans progrès technique ni démographie", "une fonction de production concave stricte", "un cadre théorique parfaitement compatible avec l'école autrichienne du cycle des affaires"], "a": 0, "why": "AK rend la croissance ENDOGÈNE : g_LT dépend du taux d'épargne (contrairement à Solow où g_LT = g_A exogène). C'est ce qui distingue les théories de croissance endogène (Frankel, Romer, Lucas). Partie_2_C2C3_Paul_Romer.txt lignes 251-296.", "id": "ak-003"}, {"cat": "romer", "mat": "croissance", "ch": 3, "diff": 1, "q": "Selon Paul Romer, l'exemple des « quatre éléments » (supraconducteur, alliages…) illustre :", "choices": ["la théorie des jeux", "l'explosion combinatoire des idées possibles", "la loi classique des rendements décroissants et fixes des facteurs", "le paradoxe de la valeur"], "a": 1, "why": "Romer utilise l'explosion combinatoire (nombre de combinaisons de quelques éléments) pour montrer que le stock d'idées possibles est immense — la croissance par les idées n'est pas bornée. Partie_2_C2C3_Paul_Romer.txt lignes 23-27.", "id": "romer-001"}, {"cat": "romer", "mat": "croissance", "ch": 3, "diff": 2, "q": "Pour Romer, une idée (technologie) se distingue d'un facteur de production classique (K ou L) parce qu'elle est :", "choices": ["rare", "non-rivale (peut être utilisée simultanément partout)", "toujours brevetée", "purement immatérielle et sans support physique nécessaire"], "a": 1, "why": "Non-rivalité : une même idée peut servir simultanément à plusieurs producteurs sans épuisement. Contrairement au capital physique (rival). C'est la propriété clé qui fonde la modélisation de la croissance endogène par les idées. Partie_2_C2C3_Paul_Romer.txt lignes 5-15.", "id": "romer-002"}, {"cat": "romer", "mat": "croissance", "ch": 3, "diff": 3, "q": "Selon Gordon (2000, cité par Rubin), quel constat empirique fait débat sur la vague technologique récente ?", "choices": ["la 3ᵉ vague TIC a un effet strictement plus fort sur la productivité que la 2ᵉ (électricité)", "la productivité du travail américaine croît régulièrement depuis 1900", "la dernière vague (TIC) n'a pas un effet aussi fort sur la productivité du travail que les précédentes", "l'électricité est la seule innovation qui a eu un vrai impact productif"], "a": 2, "why": "Gordon (2000) : la productivité américaine croît ~2 %/an longtemps ; ralentit après 1972 ; petite reprise ~2000 ; puis rechute. La 3ᵉ vague (TIC) déçoit par rapport à l'électricité. Partie_2_C2C3_Paul_Romer.txt lignes 72-81.", "id": "romer-003"}, {"cat": "aghion", "mat": "croissance", "ch": 4, "diff": 2, "q": "Selon Jones, la critique principale adressée aux modèles de Romer (1990) est :", "choices": ["l'absence de dépréciation du capital humain", "la présence d'un effet d'échelle non validé empiriquement", "l'oubli de l'ouverture commerciale internationale dans l'analyse", "le rejet de la Cobb-Douglas"], "a": 1, "why": "Jones : l'effet d'échelle implique que doubler le nombre de chercheurs devrait doubler g. Or aux USA 1950-88, la R&D est ×5, la part des chercheurs ×3, mais g_PTF reste plutôt constante. Rejet empirique de Romer 1990. Partie_2_Chap4_Jones_Aghion.txt lignes 1-40.", "id": "aghion-001"}, {"cat": "aghion", "mat": "croissance", "ch": 4, "diff": 3, "q": "Dans la fonction de production d'idées révisée par Jones (semi-endogène), l'introduction de 0 < λ < 1 modélise :", "choices": ["une hausse permanente et purement exogène de la productivité des chercheurs employés", "une externalité de connaissance parfaite", "un effet de duplication qui réduit la productivité marginale des chercheurs", "une dépréciation du capital physique"], "a": 2, "why": "λ < 1 dans Ȧ = δ · L_A · A^φ ou variantes traduit la duplication : plusieurs chercheurs travaillent sur la même idée. Externalité de connaissance moins puissante que chez Romer 1990. Partie_2_Chap4_Jones_Aghion.txt lignes 45-55.", "id": "aghion-002"}, {"cat": "aghion", "mat": "croissance", "ch": 4, "diff": 3, "q": "Dans la croissance semi-endogène (Jones), le taux de croissance à long terme dépend :", "choices": ["du taux de croissance de la population et non plus de la part de chercheurs seule", "uniquement de la part de chercheurs (comme Romer 1990)", "du taux d'épargne s comme dans les modèles AK à rendements constants dans le capital", "d'une simple règle exogène fixée par le planificateur"], "a": 0, "why": "Semi-endogène : g_A dépend de n (démographie), la politique de R&D affecte le NIVEAU des idées mais pas le taux de croissance de long terme. Résultat central de Jones (1995). Différence-clé avec Romer 1990.", "id": "aghion-003"}, {"cat": "malthus", "mat": "croissance", "ch": 4, "diff": 1, "q": "Selon la périodisation du cours (Rubin, Partie 3), l'humanité connaît trois grandes époques historiques de croissance :", "choices": ["ère préindustrielle, révolution industrielle, ère post-1945", "ère malthusienne, ère post-malthusienne, ère moderne", "empires, féodalité, capitalisme", "Antiquité, Moyen Âge, Modernité"], "a": 1, "why": "Périodisation du cours : (1) malthusienne — croissance nulle ou faible, y ≈ constant, jusqu'à ~1800 ; (2) post-malthusienne — hausse conjointe de la population et du revenu ; (3) moderne — transition démographique, éducation, croissance accélérée. Partie_3_Chap1_Pop.txt lignes 15-60.", "id": "malthus-001"}, {"cat": "malthus", "mat": "croissance", "ch": 4, "diff": 2, "q": "Le taux de croissance planétaire du revenu par habitant entre l'an 1000 et 1820 (source Maddison, cité par Rubin) est estimé à environ :", "choices": ["environ 1,5 % par an, comme au XXᵉ siècle en moyenne planétaire", "0,5 % par an", "0,05 % par an", "0 % (nul)"], "a": 2, "why": "Maddison : g_y ≈ 0,05 %/an entre 1000 et 1820, très faible mais non nul. Le revenu moyen planétaire atteint 670 $ en 1820 (avec 1200 $ en Europe industrialisée). C'est l'ère malthusienne — quasi-stagnation. Partie_3_Chap1_Pop.txt lignes 20-30.", "id": "malthus-002"}, {"cat": "malthus", "mat": "croissance", "ch": 4, "diff": 2, "q": "Ce qui caractérise l'ère post-malthusienne (~1820-1913) par rapport à l'ère précédente :", "choices": ["un effondrement de la population mondiale", "un revenu par habitant qui recommence à baisser malgré l'industrialisation", "une hausse simultanée de la population ET du revenu par habitant", "l'apparition d'un contrôle centralisé des naissances"], "a": 2, "why": "Nouveauté post-malthusienne : la croissance démographique ne fait plus baisser y (comme dans Malthus). Au contraire, y croît PLUS vite que L. Débute en Europe de l'Ouest, se diffuse. Éducation reste faible. Partie_3_Chap1_Pop.txt lignes 40-55.", "id": "malthus-003"}, {"cat": "malthus", "mat": "croissance", "ch": 4, "diff": 3, "q": "La transition démographique se caractérise dans les pays développés européens par une chute du taux de fertilité, atteignant vers 1970 environ :", "choices": ["1 enfant par femme", "2 enfants par femme (seuil de remplacement)", "3 enfants par femme, soit un niveau intermédiaire entre l'ère malthusienne et le seuil de remplacement démographique", "0 enfant (stérilité massive)"], "a": 1, "why": "Table du cours : dans les pays européens post-1970, F ≈ 2 (Pays-Bas, Allemagne, Royaume-Uni, France passent tous de 4-6 à ~2). Sous 2, la population cesse mécaniquement de croître à long terme (2019 : Allemagne 1,6). Partie_3_Chap1_Pop.txt lignes 60-70.", "id": "malthus-004"}, {"cat": "olg", "mat": "croissance", "ch": 3, "diff": 2, "q": "Dans le modèle de Diamond à générations imbriquées (1965), la population à la période t se compose de :", "choices": ["seulement les agents jeunes", "seulement les agents âgés", "jeunes producteurs et âgés inactifs, en cohabitation", "d'une population homogène, continue et infinie sur toutes les périodes futures"], "a": 2, "why": "OLG (Diamond) : deux générations coexistent chaque période. Les jeunes produisent et épargnent ; les âgés consomment l'épargne de leur jeunesse. La population croît au taux n. Partie_2_Chap1_Epargne_endogène.txt lignes 25-40.", "id": "olg-001"}, {"cat": "olg", "mat": "croissance", "ch": 3, "diff": 3, "q": "Dans le modèle OLG, quelle décision l'agent jeune doit-il prendre à chaque période ?", "choices": ["arbitrer entre consommation présente et épargne pour sa vieillesse", "décider s'il aura des enfants", "voter la politique monétaire et budgétaire nationale au niveau du parlement", "choisir sa profession"], "a": 0, "why": "Décision d'épargne intertemporelle : maximiser l'utilité U(c1_t, c2_{t+1}) sous contraintes budgétaires des deux périodes. Les âgés n'ont plus de choix, ils consomment leur épargne accumulée. Partie_2_Chap1_Epargne_endogène.txt lignes 40-50.", "id": "olg-002"}, {"cat": "olg", "mat": "croissance", "ch": 3, "diff": 3, "q": "Le paramètre σ (élasticité de substitution intertemporelle inverse) dans la fonction d'utilité U = c^(1−σ)/(1−σ) contrôle :", "choices": ["la démographie", "la courbure des courbes d'indifférence et le degré de préférence intertemporelle pour la variété", "le taux d'inflation", "la structure de la BdP"], "a": 1, "why": "σ mesure la préférence pour lisser la consommation dans le temps. σ = 0 : linéaire (indifférent au lissage) ; σ élevé : courbe très convexe (préférence forte pour lisser). Cas limite σ → 1 : utilité logarithmique. Partie_2_Chap1_Epargne_endogène.txt lignes 15-22.", "id": "olg-003"}, {"cat": "harrod", "mat": "croissance", "ch": 1, "diff": 2, "q": "Le modèle de Harrod-Domar (1939, 1947) est présenté dans le cours comme :", "choices": ["un modèle purement classique fondé sur la loi de Say et l'équilibre général walrasien de Léon", "une version dynamique de la théorie keynésienne mêlant croissance et cycle", "un modèle où le progrès technique est intégralement endogène par la R&D", "un modèle à mobilité parfaite du capital international entre nations"], "a": 1, "why": "Harrod (1936, 1939) et Domar (1947) : dynamisation de la macro keynésienne. Fondé sur épargne et investissement, la « croissance sur le fil du rasoir » traduit l'instabilité intrinsèque. Introduction_2025-2026.txt lignes 54-60.", "id": "harrod-001"}, {"cat": "harrod", "mat": "croissance", "ch": 1, "diff": 2, "q": "L'expression « croissance sur le fil du rasoir » chez Harrod-Domar traduit le fait que :", "choices": ["les grandes banques centrales fixent unilatéralement le taux de croissance mondial", "seule une valeur précise de g permet à l'économie de croître sans instabilité (chômage ou surchauffe)", "la croissance est toujours parfaitement stable si le taux d'épargne s est parfaitement optimal du point de vue social", "seule la démographie détermine à long terme le rythme de la croissance"], "a": 1, "why": "Fil du rasoir : le taux de croissance équilibré g = n exige une coordination précise, sans mécanisme automatique. Tout écart provoque instabilité (surinvestissement/récession). Introduction_2025-2026.txt lignes 58-63 ; Partie_1_Solow.txt lignes 365-380.", "id": "harrod-002"}, {"cat": "harrod", "mat": "croissance", "ch": 1, "diff": 3, "q": "Quelle est la critique principale que Solow (1956) adresse au modèle Harrod-Domar ?", "choices": ["l'absence totale de progrès technique exogène dans la formulation Harrod-Domar initiale", "l'instabilité repose sur la rigidité stricte des coefficients de production (impossibilité de substituer K et L)", "l'oubli complet des externalités de connaissance et d'apprentissage dans le processus productif national", "l'exclusion arbitraire des choix intertemporels des ménages représentatifs"], "a": 1, "why": "Solow (1956) : l'instabilité Harrod-Domar disparaît si K et L peuvent se substituer (fonction de production néoclassique à coefficients variables). Le mécanisme de retour à l'état régulier remplace le fil du rasoir. Partie_1_Solow.txt lignes 10-15.", "id": "harrod-003"}, {"cat": "convergence", "mat": "croissance", "ch": 2, "diff": 2, "q": "Selon le modèle de Solow, deux pays identiques en tous points sauf leur revenu initial :", "choices": ["conservent leur écart de revenu indéfiniment", "convergent vers le même sentier régulier de long terme", "divergent car les rendements du capital sont croissants à l'échelle agrégée nationale", "voient leur revenu par tête devenir aléatoire au fil du temps"], "a": 1, "why": "Convergence absolue : deux pays partageant s, n, δ, g_A et la même fonction de production convergent vers le même k*, donc vers le même sentier régulier. Le pays initialement plus pauvre croît plus vite (rendements décroissants du capital).", "id": "convergence-001"}, {"cat": "convergence", "mat": "croissance", "ch": 2, "diff": 3, "q": "Pourquoi n'observe-t-on pas de convergence absolue au niveau planétaire (MRW 1992) ?", "choices": ["parce que la fonction de production diffère qualitativement d'un pays à l'autre", "parce que les taux d'épargne, d'investissement en capital humain et de démographie diffèrent entre pays", "parce que le progrès technique est structurellement décroissant dans les pays pauvres depuis 1990 selon les données", "parce que la production est plus faible dans les pays avec démocratie parlementaire classique"], "a": 1, "why": "Convergence conditionnelle : chaque pays converge vers SON sentier régulier, qui dépend de s, n, taux d'accumulation H. Les différences structurelles expliquent l'absence de convergence absolue planétairee. Partie_1_Solow.txt lignes 1180-1200.", "id": "convergence-002"}, {"cat": "convergence", "mat": "croissance", "ch": 2, "diff": 2, "q": "Un pays qui régresse (recule sur le sentier de croissance) peut s'expliquer par le modèle de Solow parce que :", "choices": ["son revenu d'état régulier a diminué OU il s'est éloigné de son état régulier", "les rendements du capital sont devenus négatifs de façon exceptionnelle sur une longue période historique", "la fonction de production a été remplacée par une CES exotique", "les agents ont brutalement décidé de cesser toute épargne domestique"], "a": 0, "why": "Solow explique la régression par (a) baisse structurelle du k* d'équilibre (n↑, s↓, δ↑) OU (b) choc transitoire (guerre, choc pétrolier, réforme). Cadre applicable à Brexit, Ukraine, Trump-tariffs. Partie_1_Solow.txt lignes 1195-1210.", "id": "convergence-003"}, {"cat": "institutions", "mat": "croissance", "ch": 5, "diff": 2, "q": "Comment Douglas North (1990) définit-il les « institutions » ?", "choices": ["les seules administrations publiques d'un État", "les règles et contraintes pesant sur les comportements individuels, formelles ou informelles", "un synonyme d'organisations, comme entreprises et associations", "l'ensemble des normes internationales adoptées par consensus au sein des organisations internationales"], "a": 1, "why": "North (1990) : institutions = règles du jeu (formelles : constitution, lois, règles électorales ; informelles : culture, normes). À distinguer des « organisations » qui sont les joueurs. Partie_3_Chap2_Institutions.txt lignes 1-7.", "id": "institutions-001"}, {"cat": "institutions", "mat": "croissance", "ch": 5, "diff": 2, "q": "Selon Acemoglu (2009), les 4 grandes catégories de « causes fondamentales » de la croissance sont :", "choices": ["chance, géographie, institutions, culture", "capital, travail, terre, technologie", "monnaie, dette, épargne, investissement", "population, éducation, santé, urbanisation"], "a": 0, "why": "Acemoglu distingue les 4 causes fondamentales. La chance renvoie aux équilibres multiples ; les 3 autres (géographie, institutions, culture) sont testables empiriquement. Rubin insiste sur institutions et culture. Partie_3_Chap2_Institutions.txt lignes 25-30.", "id": "institutions-002"}, {"cat": "institutions", "mat": "croissance", "ch": 5, "diff": 3, "q": "L'exemple canonique du cours qui invalide l'explication géographique pure de la croissance selon Acemoglu est :", "choices": ["la comparaison instructive France / Belgique après la Seconde Guerre mondiale sur cinq décennies de croissance", "l'écart Chine/Europe au XVᵉ siècle : Chine plus peuplée et technologiquement avancée, mais industrialisation en Europe", "le développement économique remarquable de Singapour depuis 1965 sous Lee Kuan Yew", "le décollage économique fulgurant du Japon après l'ère Meiji au XIXᵉ siècle"], "a": 1, "why": "Argument Acemoglu-Rubin : au XVᵉ siècle, la Chine dépasse l'Europe (population, horloge, tissage). Si la géographie ou l'échelle expliquaient tout, l'industrialisation devrait démarrer là. Elle démarre en Europe → besoin d'expliquer par institutions/culture. Partie_3_Chap2_Institutions.txt lignes 22-28.", "id": "institutions-003"}], "VF": [{"id": "bdp-003", "cat": "bdp", "ch": 1, "diff": 1, "q": "Une hausse des réserves officielles de change apparaît avec un signe positif dans le compte financier.", "a": true, "trap": "signe-bdp", "why": "Hausse des réserves ⇔ sortie nette de capitaux au sens de la balance ⇔ solde CF positif (convention du cours).", "mat": "emi"}, {"id": "bdp-004", "cat": "bdp", "ch": 1, "diff": 2, "q": "La capacité (ou besoin) de financement d'un pays est égale à TC + CC.", "a": true, "trap": "bc-bcour", "why": "Positif = capacité (excès d'épargne, sortie de capitaux) ; négatif = besoin (déficit courant financé par entrée de capitaux).", "mat": "emi"}, {"id": "pen-003", "cat": "pen", "ch": 1, "diff": 2, "q": "Les effets de valorisation peuvent modifier la PEN d'une période à l'autre sans qu'aucun flux financier ne soit intervenu.", "a": true, "trap": "stock-flux", "why": "La PEN est un stock d'actifs et de passifs libellés en devises et cotés : leur revalorisation change la PEN, indépendamment des flux.", "mat": "emi"}, {"id": "si-002", "cat": "si", "ch": 1, "diff": 2, "q": "Le paradoxe de Feldstein-Horioka (1980) constate que l'épargne et l'investissement restent fortement corrélés à l'échelle nationale, ce qui contredit une mobilité parfaite des capitaux.", "a": true, "why": "Épargne et investissement nationaux devraient se découpler en mobilité parfaite ; Feldstein-Horioka montre qu'ils restent liés.", "mat": "emi"}, {"id": "si-003", "cat": "si", "ch": 1, "diff": 2, "q": "Le paradoxe de Lucas (1990) est que le capital circule massivement des pays pauvres vers les pays riches.", "a": false, "why": "Lucas constate le contraire : le capital NE va PAS des pays riches vers les pauvres autant que la théorie le prédit (risque, capital humain).", "mat": "emi"}, {"id": "forex-003", "cat": "forex", "ch": 2, "diff": 1, "q": "Le marché des changes est un marché organisé, avec un carnet d'ordres central et des prix publics.", "a": false, "why": "C'est un marché OTC (de gré à gré), interbancaire, décentralisé : pas de carnet d'ordres public unique.", "mat": "emi"}, {"id": "forex-004", "cat": "forex", "ch": 2, "diff": 2, "q": "Un swap de change combine un achat au comptant et une vente à terme (ou l'inverse), sur la même paire de devises, à la même contrepartie.", "a": true, "why": "Un swap = deux jambes simultanées de sens opposé : c'est un instrument de trésorerie sans exposition nette au risque de change.", "mat": "emi"}, {"id": "cot-003", "cat": "cot", "ch": 2, "diff": 1, "q": "Le taux au certain et le taux à l'incertain sont réciproques : S_incertain = 1 / S_certain.", "a": true, "trap": "certain-incertain", "why": "1 € = 1,10 $ (certain, point de vue européen) ⇔ 1 $ ≈ 0,91 € (incertain, même point de vue) : ce sont deux façons d'écrire le même prix.", "mat": "emi"}, {"id": "tcr-002", "cat": "tcr", "ch": 2, "diff": 2, "q": "Le taux de change effectif nominal en niveau se calcule comme une moyenne géométrique pondérée par les parts commerciales des partenaires.", "a": true, "trap": "niveau-log", "why": "En niveau : moyenne géométrique. En log : moyenne arithmétique pondérée. Piège : additionner directement des taux en niveau.", "mat": "emi"}, {"id": "tcr-003", "cat": "tcr", "ch": 2, "diff": 2, "q": "Une hausse de TCER = TCEN × P/P* traduit à la fois une perte de compétitivité-prix et un gain de pouvoir d'achat pour les résidents.", "a": true, "why": "Nos biens deviennent relativement plus chers pour l'étranger (compétitivité ↓), et nos revenus achètent plus de biens étrangers (pouvoir d'achat ↑).", "mat": "emi"}, {"id": "smi-003", "cat": "smi", "ch": 2, "diff": 3, "q": "En régime de changes fixes avec mobilité parfaite des capitaux, la banque centrale peut mener une politique monétaire autonome.", "a": false, "trap": "mf-regime", "why": "Triangle d'incompatibilité : fixe + mobilité parfaite ⇒ la politique monétaire est asservie à la défense de la parité.", "mat": "emi"}, {"id": "parite-003", "cat": "parite", "ch": 3, "diff": 2, "q": "Sous PNCTI, à anticipation eᵃ donnée, une hausse surprise du taux d'intérêt domestique i entraîne une appréciation immédiate du taux au certain e.", "a": true, "trap": "sens-parite", "why": "e = eᵃ + (i − i*) : i ↑ ⇒ e ↑ (appréciation immédiate) pour rétablir une anticipation de dépréciation qui compense le nouveau différentiel.", "mat": "emi"}, {"id": "parite-004", "cat": "parite", "ch": 3, "diff": 2, "q": "La PCTI (parité couverte) relie le taux au comptant, le taux à terme et le différentiel d'intérêt sans hypothèse sur les anticipations.", "a": true, "why": "PCTI est une relation d'arbitrage sans risque via le marché à terme : elle tient exactement, sans anticipations. La PNCTI, elle, en dépend.", "mat": "emi"}, {"id": "monet-002", "cat": "monet", "ch": 3, "diff": 3, "q": "Le modèle de Dornbusch prévoit un surajustement (overshooting) du taux de change nominal à court terme, au-delà de sa variation de long terme.", "a": true, "trap": "statique-dyn", "why": "Prix rigides à court terme + parfaite mobilité des capitaux ⇒ le taux surréagit puis revient lentement vers le nouvel équilibre de long terme.", "mat": "emi"}, {"id": "monet-003", "cat": "monet", "ch": 3, "diff": 2, "q": "L'étude de Meese et Rogoff (1983) conclut que les modèles structurels de change battent nettement la marche aléatoire à horizon court.", "a": false, "why": "C'est le résultat inverse : à court terme, aucun modèle structurel ne bat la marche aléatoire — d'où la « déconnexion du change ».", "mat": "emi"}, {"id": "depr-003", "cat": "depr", "ch": 4, "diff": 2, "q": "Le pricing to market (PTM) amortit la répercussion d'une variation du taux de change sur les prix affichés à l'importation.", "a": true, "why": "Les exportateurs ajustent leurs marges pour préserver leurs parts de marché : le pass-through du change vers les prix est incomplet.", "mat": "emi"}, {"id": "equil-002", "cat": "equil", "ch": 5, "diff": 2, "q": "La PPA absolue postule qu'une même monnaie confère le même pouvoir d'achat dans tous les pays.", "a": true, "why": "PPA absolue = loi du prix unique généralisée : E × P* = P, donc E = P / P*. Peu vérifiée à cause des biens non échangeables.", "mat": "emi"}, {"id": "equil-003", "cat": "equil", "ch": 5, "diff": 3, "q": "Dans Balassa-Samuelson, la contagion salariale du secteur échangeable vers le secteur abrité est le maillon central de l'appréciation réelle.", "a": true, "trap": "bs-etapes", "why": "Sans cette contagion (marché du travail unifié), la productivité du secteur échangeable n'entraînerait pas de hausse des prix des non-échangeables.", "mat": "emi"}, {"id": "mf-003", "cat": "mf", "ch": 6, "diff": 3, "q": "Une intervention stérilisée sur le marché des changes modifie l'offre de monnaie nationale et déplace la courbe LM.", "a": false, "trap": "sterilise", "why": "La stérilisation neutralise l'effet monétaire (open market compensatoire) : offre de monnaie inchangée, LM ne bouge pas.", "mat": "emi"}, {"id": "mf-004", "cat": "mf", "ch": 6, "diff": 2, "q": "Le modèle de Mundell-Fleming est un modèle à prix fixes et à horizon statique.", "a": true, "trap": "statique-dyn", "why": "Prix rigides, statique comparative. Le passage à Dornbusch (prix flexibles à long terme + rigidité à court terme) apporte la dynamique.", "mat": "emi"}, {"id": "bdp-007", "cat": "bdp", "ch": 1, "diff": 2, "q": "Le poste « erreurs et omissions » (EO) de la balance des paiements peut être positif ou négatif selon la période et n'est jamais nul en pratique.", "a": true, "why": "EO capte les écarts statistiques entre CC et CF ; il n'est presque jamais nul.", "mat": "emi"}, {"id": "pen-006", "cat": "pen", "ch": 1, "diff": 1, "q": "Un pays dont la PEN est positive est appelé pays débiteur net vis-à-vis du reste du monde.", "a": false, "trap": "stock-flux", "why": "PEN positive = pays créancier net. Débiteur net = PEN négative.", "mat": "emi"}, {"id": "pen-007", "cat": "pen", "ch": 1, "diff": 2, "q": "Hors effets de valorisation, l'accumulation d'excédents courants sur plusieurs années fait mécaniquement croître la PEN.", "a": true, "trap": "stock-flux", "why": "ΔPEN = CC hors valorisation : le flux d'excédent alimente le stock d'actifs nets.", "mat": "emi"}, {"id": "si-007", "cat": "si", "ch": 1, "diff": 1, "q": "En économie fermée, l'égalité S = I est une contrainte comptable et non un mécanisme d'équilibre.", "a": true, "why": "L'identité comptable Y = C + I + G impose S = I une fois retirée la consommation et l'État.", "mat": "emi"}, {"id": "forex-007", "cat": "forex", "ch": 2, "diff": 1, "q": "Selon les enquêtes BRI, le dollar intervient dans plus de 85 % des transactions du marché des changes.", "a": true, "why": "Rôle de monnaie véhiculaire : la plupart des paires exotiques passent par le dollar (≈ 88 % dans le cours).", "mat": "emi"}, {"id": "cot-006", "cat": "cot", "ch": 2, "diff": 2, "q": "Si 1 € = 1,25 $ au certain (point de vue européen), alors 1 $ = 0,80 € à l'incertain (même point de vue).", "a": true, "trap": "certain-incertain", "why": "Réciprocité S_I = 1/S_C : 1 / 1,25 = 0,80.", "mat": "emi"}, {"id": "cot-007", "cat": "cot", "ch": 2, "diff": 2, "q": "L'arbitrage triangulaire fait converger le taux croisé calculé et le taux directement coté, sinon un profit sans risque existe.", "a": true, "why": "Loi du prix unique : la convergence est instantanée sur un marché liquide comme le forex.", "mat": "emi"}, {"id": "tcr-007", "cat": "tcr", "ch": 2, "diff": 2, "q": "Le taux de change effectif réel est un indicateur de compétitivité-prix : une hausse traduit une perte de compétitivité.", "a": true, "why": "Q ↑ ⇒ les prix nationaux augmentent relativement aux prix étrangers convertis dans la monnaie nationale.", "mat": "emi"}, {"id": "smi-006", "cat": "smi", "ch": 2, "diff": 2, "q": "Le régime de l'étalon-or classique (avant 1914) supposait libre convertibilité or, mobilité des capitaux et parités fixes.", "a": true, "why": "Trois piliers : convertibilité or, absence de contrôle des capitaux, parités fixes ancrées au prix légal de l'or.", "mat": "emi"}, {"id": "smi-007", "cat": "smi", "ch": 2, "diff": 2, "q": "Après 1976, tous les grands pays ont adopté des changes purement flottants sans intervention des banques centrales.", "a": false, "why": "La plupart des banques centrales pratiquent un flottement géré. Certaines économies conservent des ancrages fixes ou glissants.", "mat": "emi"}, {"id": "parite-007", "cat": "parite", "ch": 3, "diff": 2, "q": "La PCTI (parité couverte) suppose une aversion pour le risque de change des investisseurs pour tenir.", "a": false, "trap": "sens-parite", "why": "PCTI = arbitrage sans risque via le marché à terme, indépendante des préférences. C'est la PNCTI qui suppose la neutralité au risque.", "mat": "emi"}, {"id": "monet-008", "cat": "monet", "ch": 3, "diff": 2, "q": "Le modèle monétaire à prix flexibles (Frenkel) suppose la PPA vérifiée à chaque instant.", "a": true, "trap": "fixe-flexible", "why": "Hypothèse centrale : PPA continue. Ms/Ms* = e via l'équation quantitative. Dornbusch rompt cette hypothèse à court terme.", "mat": "emi"}, {"id": "depr-007", "cat": "depr", "ch": 4, "diff": 2, "q": "La courbe en J indique qu'une dépréciation dégrade toujours définitivement le solde commercial.", "a": false, "trap": "ml-symetrie", "why": "Court terme : dégradation. Moyen/long terme : si Marshall-Lerner tient, le solde s'améliore.", "mat": "emi"}, {"id": "depr-008", "cat": "depr", "ch": 4, "diff": 3, "q": "Le pricing to market atténue le pass-through et allonge la phase descendante de la courbe en J.", "a": true, "why": "Les marges absorbent le change ⇒ ajustement des prix (et donc des volumes) plus lent ⇒ creux du J prolongé.", "mat": "emi"}, {"cat": "bdp", "ch": 1, "diff": 1, "q": "Le compte courant (CC) inclut la balance commerciale des biens, la balance des services et les revenus primaires et secondaires.", "a": true, "why": "Structure du CC dans la comptabilité BdP : biens + services + revenus + transferts courants.", "id": "bdp-010", "mat": "emi"}, {"cat": "bdp", "ch": 1, "diff": 2, "q": "Le compte de capital (TC) et le compte financier (CF) mesurent la même chose sous deux angles différents.", "a": false, "trap": "bc-bcour", "why": "TC = transferts en capital (remises de dettes, brevets). CF = flux de financement (IDE, portefeuille, réserves). Différents postes.", "id": "bdp-011", "mat": "emi"}, {"cat": "pen", "ch": 1, "diff": 2, "q": "Un pays créancier net dont la monnaie s'apprécie voit mécaniquement sa PEN baisser (effets de valorisation).", "a": true, "trap": "stock-flux", "why": "Actifs à l'étranger libellés en devises valent moins en monnaie nationale forte.", "id": "pen-010", "mat": "emi"}, {"cat": "si", "ch": 1, "diff": 2, "q": "Les déficits jumeaux (twin deficits) traduisent la propagation d'un déficit budgétaire vers un déficit courant, toutes choses égales par ailleurs.", "a": true, "why": "(S − I) + (T − G) = X − M : à S, I inchangés, (T − G) ↓ ⇒ X − M ↓.", "id": "si-009", "mat": "emi"}, {"cat": "forex", "ch": 2, "diff": 2, "q": "Une option d'achat (call) donne l'obligation d'acheter la devise au prix d'exercice.", "a": false, "why": "Une option donne le DROIT (pas l'obligation) d'acheter (call) ou de vendre (put).", "id": "forex-010", "mat": "emi"}, {"cat": "forex", "ch": 2, "diff": 1, "q": "Le marché des changes fonctionne 24 h/24 grâce à la succession des places (Sydney → Tokyo → Londres → New York).", "a": true, "why": "Marché mondial décentralisé, actif en continu du lundi matin au vendredi soir.", "id": "forex-011", "mat": "emi"}, {"cat": "cot", "ch": 2, "diff": 1, "q": "L'euro est traditionnellement coté au certain (1 € = X $), en cohérence avec l'usage européen.", "a": true, "why": "Convention historique : les paires impliquant l'euro sont cotées avec l'euro comme monnaie de base.", "id": "cot-010", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 2, "q": "Une baisse du taux de change effectif réel (TCER) traduit un gain de compétitivité-prix.", "a": true, "why": "TCER ↓ ⇒ prix relatifs domestiques baissent ⇒ compétitivité ↑ (image miroir de la hausse).", "id": "tcr-009", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 2, "q": "En base de logs, le TCER est simplement la somme pondérée des taux réels bilatéraux.", "a": true, "trap": "niveau-log", "why": "En logs, produit géométrique ⇒ somme arithmétique. En niveaux : moyenne géométrique.", "id": "tcr-010", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 2, "q": "Sous Bretton Woods, seules les banques centrales pouvaient convertir des dollars en or auprès de la Fed.", "a": true, "why": "Convertibilité or restreinte : les particuliers en étaient exclus, seules les BC officielles y avaient accès.", "id": "smi-010", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 3, "q": "Le dilemme de Triffin ne s'applique qu'à un régime d'étalon-or et ne concerne pas les monnaies fiat modernes.", "a": false, "why": "Il est un enseignement plus général : toute monnaie internationale doit être fournie en excès par son émetteur, ce qui pose des tensions sur sa crédibilité.", "id": "smi-011", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 2, "q": "L'hypothèse d'anticipations rationnelles est nécessaire pour que la PNCTI tienne empiriquement.", "a": false, "why": "Même avec anticipations rationnelles, la PNCTI est régulièrement rejetée empiriquement (forward premium puzzle).", "id": "parite-010", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "q": "Le « forward premium puzzle » observe que des taux d'intérêt élevés sont associés en moyenne à des appréciations, pas à des dépréciations.", "a": true, "why": "Contredit la PNCTI : ex ante on prédit une dépréciation, ex post on observe souvent l'inverse.", "id": "parite-011", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 2, "q": "Dans Dornbusch, à long terme le change nominal revient exactement à sa valeur de PPA.", "a": true, "trap": "statique-dyn", "why": "Le surajustement est un phénomène de court terme ; à long terme la PPA est rétablie.", "id": "monet-011", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 2, "q": "La « guerre des monnaies » désigne les tentatives concurrentes de dépréciation compétitive pour améliorer la balance commerciale.", "a": true, "why": "Chaque pays cherche à faire baisser sa monnaie pour gagner en compétitivité ; comportement non coopératif à somme nulle.", "id": "monet-012", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 2, "q": "L'effet valeur d'une dépréciation joue en faveur de la balance commerciale dès le premier jour.", "a": false, "trap": "ml-symetrie", "why": "L'effet valeur est défavorable à court terme (imports plus chers), ce qui creuse temporairement le déficit.", "id": "depr-011", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 2, "q": "Une dépréciation améliore mécaniquement le solde courant si le pays n'exporte pratiquement pas.", "a": false, "why": "Sans exportations, l'effet volume est nul et l'effet valeur (imports plus chers) dégrade uniquement le solde.", "id": "depr-012", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 3, "q": "Le TCEF (FEER) est atteignable à court terme par une intervention concertée des banques centrales.", "a": false, "why": "TCEF est un concept de moyen terme et de convergence ; il ne se pilote pas au comptant.", "id": "equil-010", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 2, "q": "La loi du prix unique est mieux vérifiée pour les biens standardisés (matières premières) que pour les services locaux.", "a": true, "why": "Écarts persistants sur les biens non échangeables (services, immobilier) ; convergence forte sur les biens homogènes internationaux.", "id": "equil-011", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 2, "q": "En Mundell-Fleming, en changes fixes et sans mobilité des capitaux, la politique monétaire est efficace.", "a": true, "trap": "mf-regime", "why": "Sans mobilité, la BC contrôle Ms sans être contrainte par les flux ; la politique monétaire retrouve son effet expansionniste sur Y.", "id": "mf-012", "mat": "emi"}, {"cat": "bdp", "ch": 1, "diff": 2, "q": "La convention du cours voit un excédent courant comme équivalent à un CF positif (sortie nette de capitaux).", "a": true, "trap": "signe-bdp", "why": "TC + CC − CF ≈ 0 → si CC > 0, CF > 0 : sortie nette (le pays place son épargne à l'étranger).", "id": "bdp-017", "mat": "emi"}, {"cat": "pen", "ch": 1, "diff": 2, "q": "Un excédent courant permanent conduit toujours à une PEN qui augmente, effets de valorisation inclus.", "a": false, "trap": "stock-flux", "why": "Hors valorisation, oui. Mais les effets de valorisation peuvent inverser localement le mouvement (voir États-Unis à long terme).", "id": "pen-016", "mat": "emi"}, {"cat": "cot", "ch": 2, "diff": 1, "q": "L'usage international dominant cote le dollar à l'incertain contre la plupart des devises.", "a": true, "why": "1 USD = X yens, 1 USD = X JPY, etc. Exceptions notables : EUR/USD, GBP/USD, AUD/USD, NZD/USD (au certain).", "id": "cot-017", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 3, "q": "Sous Bretton Woods, les taux étaient fixes avec une bande de fluctuation autorisée de ±1 % autour de la parité.", "a": true, "why": "Bande officielle ±1 % ; élargie à ±2,25 % en 1971 avant l'abandon complet en 1973.", "id": "smi-018", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "q": "La condition d'égalité des rendements ex ante en économie ouverte est appelée « parité d'intérêt non couverte » (PNCTI).", "a": true, "why": "PNCTI = uncovered interest parity (UIP) : les rendements attendus sont égaux ex ante, indépendamment du risque.", "id": "parite-020", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "q": "Dans un modèle Mundell-Fleming avec régime intermédiaire (crawling peg, bandes larges), les résultats extrêmes s'atténuent mais restent qualitativement similaires.", "a": true, "why": "Régime intermédiaire = mélange de fixe et flexible : les politiques ont un effet non nul mais amoindri.", "id": "mf-022", "mat": "emi"}, {"cat": "pen", "mat": "emi", "ch": 1, "diff": 2, "q": "La position extérieure nette (PEN) est un stock qui varie exclusivement au rythme du solde courant cumulé.", "a": false, "trap": "stock-flux", "why": "Faux. PEN_t = A_{t-1}(1+i_A) − L_{t-1}(1+i_L) + BC_t (ou avec effets de valorisation E_{t-1}/E_t si A est en devise étrangère). La PEN varie aussi par les intérêts et par les effets de valorisation liés aux taux de change et aux prix d'actifs — le solde courant cumulé n'en est qu'une composante.", "id": "pen-019"}, {"cat": "tcr", "mat": "emi", "ch": 2, "diff": 2, "q": "Le taux de change effectif réel (TCER) d'un pays s'obtient en multipliant le TCEN par le ratio des prix étrangers sur prix domestiques : TCER = TCEN × P*/P.", "a": false, "trap": "niveau-log", "why": "Attention au sens du ratio : TCER = TCEN × P/P*, prix domestique au numérateur. Une hausse du TCER = appréciation réelle (les biens domestiques deviennent chers relativement). En variation : Δq ≈ Δe + (π − π*), avec Δe = variation du TCEN.", "id": "tcr-023"}, {"cat": "residu", "mat": "croissance", "ch": 1, "diff": 2, "q": "Le résidu de Solow est une mesure directe et non biaisée du progrès technique.", "a": false, "why": "Faux : c'est un résidu comptable qui absorbe le progrès technique ET tout ce qui n'est pas mesuré (qualité des facteurs, réallocation sectorielle, changement institutionnel, erreurs de mesure). Partie 1 Solow, section E.", "id": "residu-004"}, {"cat": "solow", "mat": "croissance", "ch": 2, "diff": 2, "q": "Dans le modèle de Solow avec progrès technique exogène g_A, le taux de croissance de long terme du PIB par tête vaut g_A.", "a": true, "why": "Vrai. À l'état régulier avec PT exogène, y croît au taux g_A. Solow est un modèle de croissance EXOGÈNE — c'est ce qui a motivé les modèles endogènes (Romer, Lucas, Aghion) où g dépend des choix des agents.", "id": "solow-005"}, {"cat": "solow", "mat": "croissance", "ch": 2, "diff": 2, "q": "Épargner au-dessus du taux d'or (s > s_or) permet d'augmenter la consommation à long terme.", "a": false, "why": "Faux : c'est l'inverse. Au-delà de s_or, la consommation d'état régulier c* = (1−s)·f(k*) diminue avec s (inefficience dynamique). Réduire s permet alors d'augmenter la consommation.", "id": "solow-006"}, {"cat": "kaldor", "mat": "croissance", "ch": 1, "diff": 1, "q": "Selon les faits stylisés du cours (Introduction), la croissance moderne est un phénomène historique récent (moins de 3 siècles à l'échelle mondiale).", "a": true, "why": "Vrai : fait stylisé n°2 (« phénomène récent à l'échelle de l'histoire de l'humanité »). Avant la Révolution industrielle, croissance quasi-nulle du PIB par tête. Décollage progressif à partir de la fin du XVIIIᵉ siècle.", "id": "kaldor-003"}, {"cat": "kaldor", "mat": "croissance", "ch": 1, "diff": 2, "q": "Le fait stylisé n°1 de Kaldor postule que le taux de croissance du PIB par tête est fortement instable dans le long terme.", "a": false, "why": "Faux : c'est l'inverse. Fait n°1 : « taux de croissance moyen positif et relativement constant » à l'échelle du long terme. La stabilité du taux est un fait fondamental à expliquer.", "id": "kaldor-004"}, {"cat": "mrw", "mat": "croissance", "ch": 2, "diff": 2, "q": "L'introduction du capital humain (MRW 1992) rend la croissance de long terme endogène.", "a": false, "why": "Faux. MRW reste un modèle de Solow augmenté : la croissance de LT est toujours g_A (progrès technique exogène). MRW améliore la CONVERGENCE et la variance expliquée entre pays, mais pas la nature de la croissance.", "id": "mrw-004"}, {"cat": "ak", "mat": "croissance", "ch": 3, "diff": 2, "q": "Dans un modèle AK avec Y = A·K, une hausse permanente du taux d'épargne s accroît le taux de croissance de long terme.", "a": true, "why": "Vrai. En AK, g = s·A − (δ+n). Le taux d'épargne devient un déterminant permanent de la croissance, à la différence de Solow (où s n'a qu'un effet de niveau).", "id": "ak-004"}, {"cat": "romer", "mat": "croissance", "ch": 3, "diff": 2, "q": "La non-rivalité des idées implique qu'elles peuvent être appropriées gratuitement par tous, sans besoin de brevet.", "a": false, "why": "Faux : non-rivalité ≠ non-excluabilité. Une idée peut être non-rivale (usage simultané) MAIS excluable via brevets, secrets, complexité. Sans excluabilité, pas d'incitation privée à investir dans la recherche — d'où le besoin de propriété intellectuelle.", "id": "romer-004"}, {"cat": "aghion", "mat": "croissance", "ch": 4, "diff": 2, "q": "Dans la croissance semi-endogène de Jones, la politique publique de R&D affecte le taux de croissance de long terme.", "a": false, "why": "Faux. Jones : politique de R&D affecte le NIVEAU des idées (effet transitoire) mais pas le taux de croissance de long terme, qui dépend de la démographie n. C'est ce qui rend la croissance « semi » endogène. Contraste avec Romer 1990 (endogène pure).", "id": "aghion-004"}, {"cat": "malthus", "mat": "croissance", "ch": 4, "diff": 2, "q": "Dans l'ère malthusienne, la population mondiale a stagné pendant plusieurs millénaires.", "a": false, "why": "Faux : la population a augmenté lentement mais de façon accélérée. De 125 000 à 230 millions entre −1 M d'années et l'an 0, puis 438 millions en 1500, 1,04 milliards en 1820. Croissance faible mais positive. Partie_3_Chap1_Pop.txt lignes 30-35.", "id": "malthus-005"}, {"cat": "olg", "mat": "croissance", "ch": 3, "diff": 2, "q": "Dans le modèle OLG, les âgés arbitrent entre consommation présente et épargne comme les jeunes.", "a": false, "why": "Faux. Les âgés n'ont plus de choix : ils consomment intégralement leur épargne accumulée jeunes (pas de legs, pas d'autre revenu). Seuls les jeunes prennent une décision intertemporelle. Partie_2_Chap1_Epargne_endogène.txt lignes 40-45.", "id": "olg-004"}, {"cat": "harrod", "mat": "croissance", "ch": 1, "diff": 2, "q": "Dans le modèle de Solow, le fil du rasoir de Harrod-Domar disparaît grâce à la substituabilité entre capital et travail.", "a": true, "why": "Vrai. Solow (1956) introduit la Cobb-Douglas (ou toute fonction néoclassique) où K et L sont substituables. La production s'ajuste continûment et l'économie converge vers un état régulier stable — plus d'instabilité.", "id": "harrod-004"}, {"cat": "convergence", "mat": "croissance", "ch": 2, "diff": 2, "q": "MRW (1992) montrent empiriquement que la convergence conditionnelle est compatible avec les données inter-pays de la période 1960-1985.", "a": true, "why": "Vrai. MRW régressent la croissance de y sur y initial et les déterminants structurels (s, n, école). Le coefficient sur y initial est négatif et significatif : les pays initialement plus pauvres (relativement à leur état régulier) croissent plus vite. Partie_1_Solow.txt lignes 1037-1062.", "id": "convergence-004"}, {"cat": "institutions", "mat": "croissance", "ch": 5, "diff": 2, "q": "Selon North (1990), les institutions se réduisent à leurs composantes formelles (constitutions, lois, règles écrites).", "a": false, "why": "Faux : North inclut aussi les institutions informelles (culture, normes sociales, croyances). Distinction reprise par Acemoglu qui parle plutôt de « culture » pour les informelles. Partie_3_Chap2_Institutions.txt lignes 1-10.", "id": "institutions-004"}], "SENS": [{"id": "parite-005", "cat": "parite", "ch": 3, "diff": 2, "ctx": "PNCTI, i* et eᵃ inchangés, e = log du taux au certain", "shock": "Hausse surprise du taux d'intérêt domestique i", "var": "Taux de change au certain e", "a": "up", "trap": "sens-parite", "why": "e = eᵃ + (i − i*) : i ↑ ⇒ e ↑ (appréciation immédiate).", "mat": "emi"}, {"id": "parite-006", "cat": "parite", "ch": 3, "diff": 2, "ctx": "PNCTI, i et i* inchangés", "shock": "Hausse de l'anticipation eᵃ (dépréciation anticipée)", "var": "Taux de change au certain e à l'impact", "a": "up", "trap": "sens-parite", "why": "e = eᵃ + (i − i*) : à i − i* donné, eᵃ ↑ ⇒ e ↑ dès aujourd'hui.", "mat": "emi"}, {"id": "mf-005", "cat": "mf", "ch": 6, "diff": 2, "ctx": "Mundell-Fleming, change flexible, mobilité parfaite des capitaux", "shock": "Hausse des dépenses publiques G", "var": "Production Y à l'équilibre", "a": "same", "trap": "mf-regime", "why": "G ↑ ⇒ i ↑ ⇒ entrées de capitaux ⇒ appréciation ⇒ X − M ↓ : éviction totale, Y inchangé.", "mat": "emi"}, {"id": "mf-006", "cat": "mf", "ch": 6, "diff": 2, "ctx": "Mundell-Fleming, change flexible, mobilité parfaite", "shock": "Hausse permanente de l'offre de monnaie", "var": "Production Y", "a": "up", "trap": "mf-regime", "why": "Ms ↑ ⇒ LM se déplace à droite ⇒ i ↓ ⇒ sortie de capitaux ⇒ dépréciation ⇒ X − M ↑ ⇒ Y ↑.", "mat": "emi"}, {"id": "mf-007", "cat": "mf", "ch": 6, "diff": 3, "ctx": "Mundell-Fleming, changes fixes, mobilité parfaite", "shock": "Hausse des dépenses publiques G", "var": "Production Y", "a": "up", "trap": "mf-regime", "why": "En fixe + mobilité parfaite, i doit rester = i*. La BC accommode l'entrée de capitaux ⇒ Ms ↑ ⇒ Y ↑. La politique budgétaire est efficace.", "mat": "emi"}, {"id": "mf-008", "cat": "mf", "ch": 6, "diff": 2, "ctx": "Marché des changes, régime fixe, mobilité parfaite, la BC intervient de façon stérilisée", "shock": "Vente stérilisée de devises par la banque centrale", "var": "Offre de monnaie nationale Ms", "a": "same", "trap": "sterilise", "why": "La stérilisation compense l'intervention par une opération d'open market inverse : Ms ne bouge pas.", "mat": "emi"}, {"id": "depr-004", "cat": "depr", "ch": 4, "diff": 2, "ctx": "Condition Marshall-Lerner vérifiée, moyen/long terme", "shock": "Dépréciation du taux de change nominal", "var": "Solde commercial X − M", "a": "up", "trap": "ml-symetrie", "why": "εX + εM > 1 : les effets volumes l'emportent, le solde s'améliore à moyen terme.", "mat": "emi"}, {"id": "depr-005", "cat": "depr", "ch": 4, "diff": 2, "ctx": "Court terme, contrats de commerce en cours", "shock": "Dépréciation du taux de change nominal", "var": "Solde commercial X − M", "a": "down", "trap": "ml-symetrie", "why": "Volumes rigides à court terme, l'effet valeur domine : le solde se dégrade avant de se redresser (courbe en J).", "mat": "emi"}, {"id": "equil-004", "cat": "equil", "ch": 5, "diff": 3, "ctx": "Balassa-Samuelson, pays émergent qui rattrape technologiquement", "shock": "Gain de productivité dans le secteur échangeable", "var": "Taux de change réel (au certain)", "a": "up", "trap": "bs-etapes", "why": "Productivité ↑ ⇒ salaires ↑ ⇒ contagion à l'abrité ⇒ prix des non-échangeables ↑ ⇒ appréciation réelle.", "mat": "emi"}, {"id": "equil-005", "cat": "equil", "ch": 5, "diff": 2, "ctx": "PPA relative, long terme, taux au certain", "shock": "Différentiel d'inflation π > π* (inflation domestique supérieure à l'étrangère)", "var": "Taux de change nominal au certain", "a": "down", "trap": "certain-incertain", "why": "PPA relative : Δe ≈ π* − π. π > π* ⇒ e ↓ (dépréciation nominale).", "mat": "emi"}, {"id": "monet-004", "cat": "monet", "ch": 3, "diff": 2, "ctx": "Modèle monétaire prix flexibles (Frenkel), long terme", "shock": "Hausse permanente de l'offre de monnaie nationale", "var": "Taux de change au certain", "a": "down", "trap": "fixe-flexible", "why": "Prix flexibles + PPA : Ms ↑ x% ⇒ P ↑ x% ⇒ e ↓ x% (dépréciation nominale).", "mat": "emi"}, {"id": "monet-005", "cat": "monet", "ch": 3, "diff": 3, "ctx": "Dornbusch, court terme (prix rigides, PNCTI, mobilité parfaite)", "shock": "Hausse permanente de l'offre de monnaie nationale", "var": "Taux de change au certain à court terme", "a": "down", "trap": "statique-dyn", "why": "Surajustement : e sous-tire au-delà de sa valeur de long terme, puis revient — mais à court terme, e ↓ plus qu'à long terme.", "mat": "emi"}, {"id": "bdp-005", "cat": "bdp", "ch": 1, "diff": 2, "ctx": "Convention du cours : CF > 0 = sortie nette de capitaux", "shock": "Le pays enregistre d'importantes entrées nettes de capitaux", "var": "Solde du compte financier CF", "a": "down", "trap": "signe-bdp", "why": "Entrées nettes ⇒ signe négatif de CF (convention du cours). Ne pas confondre avec l'usage international inverse.", "mat": "emi"}, {"id": "bdp-006", "cat": "bdp", "ch": 1, "diff": 2, "ctx": "Identité TC + CC − CF + EO = 0", "shock": "Creusement du déficit courant (CC < 0)", "var": "Compte financier CF (hors EO)", "a": "down", "trap": "signe-bdp", "why": "TC + CC − CF ≈ 0 ⇒ CF ≈ TC + CC. Si CC ↓, alors CF ↓ (négatif) : le pays reçoit des capitaux pour financer le déficit.", "mat": "emi"}, {"id": "pen-004", "cat": "pen", "ch": 1, "diff": 2, "ctx": "Hors effets de valorisation", "shock": "Excédent courant persistant sur plusieurs années", "var": "Position extérieure nette (PEN)", "a": "up", "trap": "stock-flux", "why": "ΔPEN = CC hors valorisation : un flux d'excédent alimente le stock d'actifs nets.", "mat": "emi"}, {"id": "si-004", "cat": "si", "ch": 1, "diff": 2, "ctx": "Économie ouverte, (S − I) + (T − G) = X − M", "shock": "Hausse de l'épargne privée S à I, T, G donnés", "var": "Solde courant X − M", "a": "up", "why": "L'excès d'épargne se déverse à l'étranger : X − M ↑ (excédent courant).", "mat": "emi"}, {"id": "forex-005", "cat": "forex", "ch": 2, "diff": 2, "ctx": "Marché au comptant, cotation au certain 1 € = X $", "shock": "Hausse durable de la demande d'euros", "var": "Taux 1 € = X $", "a": "up", "trap": "certain-incertain", "why": "Demande d'euros ↑ ⇒ prix de l'euro ↑ ⇒ X ↑ : appréciation de l'euro (au certain).", "mat": "emi"}, {"id": "cot-004", "cat": "cot", "ch": 2, "diff": 2, "ctx": "Réciprocité : S_incertain = 1 / S_certain", "shock": "Appréciation de la monnaie nationale (au certain S_C ↑)", "var": "Taux à l'incertain S_I", "a": "down", "trap": "certain-incertain", "why": "S_I = 1/S_C : quand S_C monte, S_I baisse. Piège de lecture inverse.", "mat": "emi"}, {"id": "tcr-004", "cat": "tcr", "ch": 2, "diff": 2, "ctx": "TCER = TCEN × P/P* (défini au certain)", "shock": "Hausse de l'inflation domestique π > π*, à TCEN inchangé", "var": "Taux de change réel", "a": "up", "why": "TCER ↑ ⇒ appréciation réelle : perte de compétitivité-prix, gain de pouvoir d'achat.", "mat": "emi"}, {"id": "smi-004", "cat": "smi", "ch": 2, "diff": 3, "ctx": "Régime de changes fixes, mobilité parfaite, la BC défend la parité", "shock": "Sortie durable de capitaux (défiance)", "var": "Réserves de change officielles", "a": "down", "trap": "mf-regime", "why": "Pour maintenir la parité, la BC vend des devises contre sa monnaie : les réserves diminuent.", "mat": "emi"}, {"id": "parite-008", "cat": "parite", "ch": 3, "diff": 2, "ctx": "PNCTI, i et eᵃ inchangés", "shock": "Hausse du taux d'intérêt étranger i*", "var": "Taux de change au certain e à l'impact", "a": "down", "trap": "sens-parite", "why": "e = eᵃ + (i − i*) : i* ↑ ⇒ e ↓ (dépréciation immédiate).", "mat": "emi"}, {"id": "monet-009", "cat": "monet", "ch": 3, "diff": 2, "ctx": "Modèle monétaire à prix flexibles, long terme, PPA vérifiée", "shock": "Hausse durable de la production nationale Y", "var": "Taux de change au certain e", "a": "up", "trap": "fixe-flexible", "why": "Y ↑ ⇒ demande de monnaie ↑ ⇒ P ↓ (à Ms donné) ⇒ par PPA, e ↑.", "mat": "emi"}, {"id": "depr-009", "cat": "depr", "ch": 4, "diff": 2, "ctx": "Marshall-Lerner NON vérifiée (εX + εM < 1)", "shock": "Dépréciation nominale de la monnaie", "var": "Solde commercial X − M", "a": "down", "trap": "ml-symetrie", "why": "Sans condition ML, l'effet valeur domine l'effet volume : le solde se dégrade même à moyen terme.", "mat": "emi"}, {"id": "tcr-008", "cat": "tcr", "ch": 2, "diff": 2, "ctx": "TCEN = moyenne pondérée des taux bilatéraux par les parts commerciales", "shock": "Réorientation du commerce : le poids ωus du partenaire américain double", "var": "Sensibilité du TCEN aux variations du dollar", "a": "up", "why": "Poids ωus plus élevé ⇒ le TCEN devient mécaniquement plus réactif aux mouvements du taux €/$.", "mat": "emi"}, {"id": "smi-008", "cat": "smi", "ch": 2, "diff": 3, "ctx": "Bretton Woods, dollars fournis à l'international par le déficit américain", "shock": "Encours international de dollars très supérieur au stock d'or de la Fed", "var": "Crédibilité de la convertibilité or à 35 $ l'once", "a": "down", "why": "Dilemme de Triffin : plus de dollars ⇒ moins de crédibilité. Résultat historique : abandon de la convertibilité en 1971.", "mat": "emi"}, {"id": "bdp-008", "cat": "bdp", "ch": 1, "diff": 2, "ctx": "Convention du cours : CF > 0 = sortie nette de capitaux", "shock": "Le pays accumule des réserves officielles de change", "var": "Solde du compte financier CF", "a": "up", "trap": "signe-bdp", "why": "Hausse des réserves = achat d'actifs étrangers par la BC = sortie nette ⇒ CF > 0 (convention).", "mat": "emi"}, {"id": "pen-008", "cat": "pen", "ch": 1, "diff": 3, "ctx": "Pays avec beaucoup d'actifs libellés en devises étrangères", "shock": "Forte appréciation de la monnaie nationale", "var": "Valeur en monnaie nationale de la PEN (effet de valorisation)", "a": "down", "trap": "stock-flux", "why": "Les avoirs en devises valent moins une fois convertis dans la monnaie nationale appréciée : la PEN diminue par pure valorisation.", "mat": "emi"}, {"id": "si-008", "cat": "si", "ch": 1, "diff": 2, "ctx": "Économie ouverte, (S − I) + (T − G) = X − M", "shock": "Creusement du déficit public (T − G ↓)", "var": "Solde courant X − M", "a": "down", "why": "Toutes choses égales par ailleurs : (T − G) ↓ ⇒ X − M ↓ (déficits jumeaux).", "mat": "emi"}, {"id": "forex-008", "cat": "forex", "ch": 2, "diff": 2, "ctx": "Écart persistant entre le taux €/$ à New York et à Londres", "shock": "Communication publique de cet écart aux salles de marché", "var": "Volume des ordres d'arbitrage", "a": "up", "why": "Les arbitragistes se saisissent de l'écart et poussent les ordres jusqu'à faire converger les cours (loi du prix unique).", "mat": "emi"}, {"id": "cot-008", "cat": "cot", "ch": 2, "diff": 2, "ctx": "Cotation au certain, point de vue européen, 1 € = X $", "shock": "Appréciation du dollar face à l'euro", "var": "Taux X (dollars par euro)", "a": "down", "trap": "certain-incertain", "why": "Dollar plus fort ⇒ il faut moins de dollars pour un euro ⇒ X baisse (l'euro se déprécie au certain).", "mat": "emi"}, {"id": "equil-008", "cat": "equil", "ch": 5, "diff": 3, "ctx": "Balassa-Samuelson, pays émergent MAIS marché du travail dual (pas de contagion salariale vers l'abrité)", "shock": "Gain de productivité dans le secteur échangeable", "var": "Taux de change réel", "a": "same", "trap": "bs-etapes", "why": "Sans contagion des salaires, les prix des non-échangeables ne montent pas : l'appréciation réelle prévue par BS ne se produit pas.", "mat": "emi"}, {"id": "mf-010", "cat": "mf", "ch": 6, "diff": 3, "ctx": "Mundell-Fleming, changes fixes, mobilité parfaite des capitaux", "shock": "Hausse permanente des dépenses publiques G", "var": "Réserves de change officielles", "a": "up", "trap": "mf-regime", "why": "G ↑ ⇒ i tend à ↑ ⇒ entrées de capitaux ⇒ la BC achète des devises pour tenir la parité ⇒ réserves ↑.", "mat": "emi"}, {"cat": "bdp", "ch": 1, "diff": 2, "ctx": "Économie ouverte, hors effets de valorisation", "shock": "Hausse simultanée des exports et baisse des imports", "var": "Solde courant CC", "a": "up", "why": "Excédent commercial ↑ + inchangé sur revenus/transferts ⇒ CC augmente.", "id": "bdp-012", "mat": "emi"}, {"cat": "pen", "ch": 1, "diff": 2, "ctx": "Effets de valorisation neutres sur la période", "shock": "Chute durable des exportations d'un pays", "var": "Position extérieure nette PEN à moyen terme", "a": "down", "trap": "stock-flux", "why": "Chute des X ⇒ CC ↓ (déficits) ⇒ ΔPEN cumulée négative ⇒ PEN baisse.", "id": "pen-011", "mat": "emi"}, {"cat": "si", "ch": 1, "diff": 2, "ctx": "Économie ouverte, S et I inchangés", "shock": "Hausse de l'épargne publique (T − G ↑)", "var": "Solde courant X − M", "a": "up", "why": "(S − I) + (T − G) = X − M : à S, I fixes, la hausse de T − G se retrouve dans X − M.", "id": "si-010", "mat": "emi"}, {"cat": "forex", "ch": 2, "diff": 2, "ctx": "Salle de marché, contrats d'options sur EUR/USD", "shock": "Hausse de la volatilité anticipée de l'EUR/USD", "var": "Prime d'une option (call ou put)", "a": "up", "why": "La valeur temps d'une option croît avec la volatilité (formule de Black-Scholes).", "id": "forex-012", "mat": "emi"}, {"cat": "cot", "ch": 2, "diff": 2, "ctx": "Cotation au certain, taux croisé, S(EUR/USD) et S(EUR/JPY) montent conjointement du même pourcentage", "shock": "Appréciation identique de l'euro face aux deux devises", "var": "Taux croisé S(USD/JPY)", "a": "same", "why": "Si l'euro s'apprécie identiquement face aux deux, le taux croisé USD/JPY reste inchangé (les effets s'annulent dans la division).", "id": "cot-011", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 2, "ctx": "TCER au certain, TCEN inchangé", "shock": "Inflation étrangère supérieure à l'inflation domestique (π* > π)", "var": "Taux de change réel TCER", "a": "down", "why": "Δq = Δe + (π − π*) : à Δe = 0, π < π* ⇒ q ↓ (dépréciation réelle, gain de compétitivité).", "id": "tcr-011", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 3, "ctx": "Régime de changes fixes, mobilité parfaite des capitaux", "shock": "La banque centrale baisse son taux directeur", "var": "Réserves de change officielles", "a": "down", "trap": "mf-regime", "why": "i < i* ⇒ sortie de capitaux ⇒ BC vend des devises pour tenir la parité ⇒ réserves ↓.", "id": "smi-012", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "ctx": "PCTI en logs, à couvert", "shock": "Hausse du taux d'intérêt domestique i (i* et e inchangés)", "var": "Taux à terme f (au certain)", "a": "down", "trap": "sens-parite", "why": "PCTI : f − e = i* − i. Si i ↑ à i* et e donnés, alors f − e diminue ⇒ f baisse : la monnaie est en décote à terme.", "id": "parite-012", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "ctx": "PNCTI, prime de risque ρ > 0 exigée par les investisseurs", "shock": "Introduction d'une prime de risque positive sur la monnaie domestique", "var": "Taux de change au certain e à l'impact", "a": "down", "trap": "sens-parite", "why": "i = i* + ρ − (eᵃ − e). ρ ↑ ⇒ à i, i*, eᵃ donnés, e ↓ (dépréciation compensatoire immédiate).", "id": "parite-013", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 3, "ctx": "Modèle Frenkel, PPA vérifiée, long terme", "shock": "Hausse permanente de l'offre de monnaie étrangère Ms*", "var": "Taux de change au certain e (domestique)", "a": "up", "trap": "fixe-flexible", "why": "Ms* ↑ ⇒ P* ↑ ⇒ par PPA, e = P/P* : e ↑ (monnaie domestique s'apprécie relativement).", "id": "monet-013", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 2, "ctx": "Condition Marshall-Lerner vérifiée, moyen terme", "shock": "Appréciation nominale de la monnaie", "var": "Solde commercial X − M", "a": "down", "trap": "ml-symetrie", "why": "Effet symétrique à la dépréciation : appréciation + ML vérifiée ⇒ solde ↓.", "id": "depr-013", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 2, "ctx": "PPA relative, long terme, taux au certain", "shock": "Différentiel d'inflation négatif : π < π* durablement", "var": "Taux de change nominal au certain", "a": "up", "why": "PPA relative : Δe = π* − π > 0 ⇒ appréciation nominale de la monnaie domestique.", "id": "equil-012", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "ctx": "Mundell-Fleming, change flexible, mobilité parfaite", "shock": "Hausse permanente de l'offre de monnaie Ms", "var": "Solde commercial X − M à moyen terme", "a": "up", "trap": "mf-regime", "why": "Ms ↑ ⇒ i ↓ ⇒ sortie K ⇒ dépréciation ⇒ X − M ↑ ⇒ Y ↑.", "id": "mf-013", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "ctx": "Mundell-Fleming, mobilité imparfaite (contrôle partiel des capitaux), régime fixe", "shock": "Hausse des dépenses publiques G", "var": "Production Y", "a": "up", "trap": "mf-regime", "why": "Sans mobilité parfaite, l'ajustement des capitaux est incomplet : la politique budgétaire garde une efficacité, Y augmente.", "id": "mf-014", "mat": "emi"}, {"cat": "cot", "ch": 2, "diff": 2, "ctx": "Taux croisé mécanique : S(A/B) × S(B/C) = S(A/C)", "shock": "Hausse de S(A/B) à S(A/C) inchangé", "var": "Taux croisé S(B/C)", "a": "down", "trap": "certain-incertain", "why": "Si le produit reste constant et l'un des facteurs monte, l'autre baisse (arithmétique).", "id": "cot-012", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "ctx": "PNCTI, i et i* inchangés", "shock": "Le pays subit un choc négatif de crédibilité (défiance)", "var": "Anticipation eᵃ (dépréciation anticipée à l'horizon)", "a": "down", "trap": "sens-parite", "why": "Défiance → les agents anticipent une dépréciation future de la monnaie → eᵃ ↓ (au certain, la valeur future baisse).", "id": "parite-021", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 3, "ctx": "Modèle monétaire à prix flexibles, PPA, choc à l'étranger", "shock": "Choc positif de productivité chez le partenaire (Y* ↑)", "var": "Taux de change au certain de la monnaie domestique", "a": "down", "trap": "fixe-flexible", "why": "Y* ↑ ⇒ demande de monnaie étrangère ↑ ⇒ P* ↓ (à Ms* donné) ⇒ par PPA, e = P/P* : e ↓ (monnaie domestique se déprécie relativement).", "id": "monet-021", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 3, "ctx": "Dépréciation nominale de 10 %, ML vérifiée, court terme", "shock": "Contrats commerciaux existants (volumes rigides)", "var": "Solde commercial X − M à horizon 3 mois", "a": "down", "trap": "ml-symetrie", "why": "À CT, effet valeur domine (imports 10 % plus chers), volumes ne bougent pas → solde se dégrade avant de remonter.", "id": "depr-021", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 3, "ctx": "PPA relative, deux pays A et B, tous deux en changes flexibles", "shock": "Le pays A adopte un policy mix plus expansionniste (π_A ↑ durablement)", "var": "Taux de change nominal e (A/B, au certain de A)", "a": "down", "why": "PPA relative : Δe ≈ π_B − π_A. π_A ↑ ⇒ Δe < 0, la monnaie A se déprécie.", "id": "equil-019", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "ctx": "Mundell-Fleming, changes fixes, mobilité parfaite", "shock": "Baisse permanente des impôts (T ↓)", "var": "Production Y", "a": "up", "trap": "mf-regime", "why": "T ↓ ⇒ IS à droite ⇒ i tend à ↑ ⇒ entrées de K ⇒ BC achète devises ⇒ Ms ↑ ⇒ Y ↑ (budgétaire efficace en fixe).", "id": "mf-023", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 2, "ctx": "Zone euro, TCER agrégé, période 2000-2010", "shock": "Divergence d'inflation : Allemagne à 1,5 % vs Espagne à 3,5 % par an durablement", "var": "TCER espagnol par rapport à l'Allemagne (au certain)", "a": "up", "why": "Δq ≈ Δe + (π_ES − π_DE). e fixé (zone euro) → Δq = 2 %/an : appréciation réelle espagnole cumulative de ~20 % en 10 ans.", "id": "tcr-017", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "ctx": "PCTI en logs, mobilité parfaite, arbitrage sans risque", "shock": "Hausse simultanée de i et i* du même montant (+100 pb chacun)", "var": "Taux à terme f (au certain)", "a": "same", "trap": "sens-parite", "why": "PCTI : f − e = i* − i. Les deux montent d'autant ⇒ différentiel inchangé ⇒ f inchangé (à e donné).", "id": "parite-025", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "ctx": "Mundell-Fleming, régime intermédiaire (crawling peg) mobilité imparfaite", "shock": "Hausse permanente de G", "var": "Taux d'intérêt domestique i à l'équilibre", "a": "up", "trap": "mf-regime", "why": "G ↑ ⇒ IS à droite ⇒ i monte (le mécanisme d'ajustement des K est incomplet, donc i n'est pas fixé par i*).", "id": "mf-026", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 3, "ctx": "Modèle monétaire prix flexibles (Frenkel), long terme", "shock": "Hausse durable du différentiel d'intérêt i − i*", "var": "Taux de change au certain e", "a": "down", "why": "Chez Frenkel : i ↑ ⇒ demande de monnaie L(Y, i) baisse ⇒ P ↑ ⇒ par PPA, e ↓. Différent de Dornbusch qui prédit l'inverse à court terme.", "id": "monet-024", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 3, "ctx": "Économie ouverte, biens échangeables et non-échangeables, court terme", "shock": "Libéralisation du secteur des services (secteur abrité)", "var": "Taux de change réel TCR", "a": "down", "why": "Libéralisation ⇒ P_N ↓ (concurrence accrue) ⇒ à P_T donné, TCR = e × P*/P baisse (dépréciation réelle) ⇒ gain de compétitivité.", "id": "depr-025", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 2, "ctx": "PPA relative, deux pays, longue période", "shock": "Politique désinflationniste efficace dans le pays A (π_A baisse durablement sous π_B)", "var": "Taux de change nominal du pays A (au certain)", "a": "up", "why": "Δe ≈ π_B − π_A. π_A < π_B ⇒ Δe > 0 : appréciation nominale du pays désinflationnaire (cas Allemagne années 80).", "id": "equil-023", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 2, "ctx": "TCER en niveau, base 100 en année t₀", "shock": "Appréciation nominale continue de la monnaie sur 5 ans (Δe = +5 %/an cumulatifs, π ≈ π*)", "var": "TCER par rapport à la base", "a": "up", "why": "Δq ≈ Δe + (π − π*) ≈ +5 %/an ⇒ TCER cumulé × 1,05⁵ ≈ 1,28 : appréciation réelle de ~28 % en 5 ans.", "id": "tcr-020", "mat": "emi"}, {"cat": "bdp", "ch": 1, "diff": 2, "ctx": "BdP française, convention du cours", "shock": "Les résidents français rapatrient massivement leurs avoirs à l'étranger", "var": "Solde du compte financier CF", "a": "down", "trap": "signe-bdp", "why": "Rapatriement = désinvestissement à l'étranger = entrée nette de capitaux ⇒ CF < 0 (convention du cours).", "id": "bdp-020", "mat": "emi"}, {"cat": "pen", "mat": "emi", "ch": 1, "diff": 3, "ctx": "Pays créancier net : actif A libellé en dollars (monnaie étrangère), passif L libellé en euros (monnaie nationale). E = nombre de dollars par euro (taux au certain).", "shock": "Dépréciation surprise de l'euro (E baisse : moins de dollars pour un euro)", "var": "Valeur en euros de la PEN, effet de valorisation de la période", "a": "up", "trap": "certain-incertain", "why": "PEN_t = A_{t-1}(1+i_A) × (E_{t-1}/E_t) − L_{t-1}(1+i_L) + BC_t. E↓ ⇒ E_{t-1}/E_t > 1 ⇒ la valeur en euros de l'actif en $ augmente. Pour un pays créancier en devise étrangère, une dépréciation nationale améliore la PEN par effet de valorisation, indépendamment du solde courant.", "id": "pen-020"}, {"cat": "si", "mat": "emi", "ch": 1, "diff": 2, "ctx": "Théorie néoclassique : le capital doit affluer des pays riches (rendement faible du capital) vers les pays pauvres (rendement élevé). Lucas (1990) constate le paradoxe : ces flux Nord → Sud sont bien plus faibles qu'attendu.", "shock": "Aggravation de l'instabilité politique et détérioration de la protection sociale dans un pays du Sud", "var": "Flux nets d'investissements Nord → Sud vers ce pays", "a": "down", "trap": "endo-exo", "why": "Lucas identifie parmi les explications : coût du capital physique, corruption, main-d'œuvre peu qualifiée, instabilité politique, système financier peu développé, faible protection sociale (qui pousse à l'épargne locale). Aggraver ces facteurs réduit encore les flux entrants — le paradoxe s'accentue.", "id": "si-018"}, {"cat": "forex", "mat": "emi", "ch": 2, "diff": 1, "ctx": "Exportateur français facturant 1 M$ payable dans 3 mois ; son risque est une dépréciation du dollar avant l'échéance (moins d'euros au paiement).", "shock": "Vente à terme (forward) des 1 M$ au cours à 3 mois", "var": "Exposition résiduelle de l'exportateur au risque de change", "a": "down", "trap": "endo-exo", "why": "La vente à terme fixe dès aujourd'hui le taux de change du paiement futur : l'exportateur connaît la contre-valeur en euros avec certitude. Exposition résiduelle = 0 (couverture parfaite tant que la contrepartie honore le contrat). Coût = renoncer au gain si le $ s'apprécie.", "id": "forex-019"}, {"cat": "smi", "mat": "emi", "ch": 2, "diff": 2, "ctx": "Régime de l'étalon-or 1870-1914 : chaque monnaie est convertible en or à parité fixe et officielle, les taux de change bilatéraux sont donc quasi-fixes.", "shock": "Éclatement de la Première Guerre mondiale (1914) : suspension par les belligérants de la convertibilité or", "var": "Volatilité des taux de change nominaux", "a": "up", "trap": "fixe-flexible", "why": "L'étalon-or ne résiste pas à la guerre : la convertibilité est suspendue dès 1914. Les taux de change deviennent flottants et volatils. Les tentatives de restauration dans l'entre-deux-guerres (livre 1925, franc 1928) échouent — le SMI d'avant 1914 n'est jamais recréé durablement.", "id": "smi-021"}, {"cat": "solow", "mat": "croissance", "ch": 2, "diff": 2, "ctx": "Modèle de Solow avec progrès technique exogène, économie initialement à l'état régulier", "shock": "Hausse permanente du taux d'épargne s", "var": "Niveau du revenu par travailleur efficace ŷ = Y/(A·L) à long terme", "a": "up", "why": "↑s ⇒ ↑k* ⇒ ↑ŷ*. Effet de NIVEAU sur ŷ mais le taux de croissance de long terme (g_A) reste inchangé — c'est le point central du modèle.", "id": "solow-007"}, {"cat": "solow", "mat": "croissance", "ch": 2, "diff": 2, "ctx": "Modèle de Solow, économie à l'état régulier", "shock": "Hausse permanente du taux de dépréciation δ", "var": "Capital par tête d'état régulier k*", "a": "down", "why": "s·f(k*) = (δ+n)·k*. ↑δ ⇒ droite d'investissement de maintien plus pentue ⇒ nouveau k* plus faible. La dépréciation érode plus vite le stock, moins de capital soutenable.", "id": "solow-008"}, {"cat": "solow", "mat": "croissance", "ch": 2, "diff": 3, "ctx": "Modèle de Solow avec progrès technique exogène g_A, économie à l'état régulier", "shock": "Hausse permanente de la démographie n", "var": "Taux de croissance du PIB PAR TÊTE à long terme", "a": "same", "why": "Le taux de croissance du PIB par tête à long terme reste g_A, indépendant de n. En revanche, k* et ŷ* baissent (effets de niveau). Piège classique : confondre PIB total et PIB par tête.", "id": "solow-009"}, {"cat": "kaldor", "mat": "croissance", "ch": 1, "diff": 2, "ctx": "Faits stylisés de Kaldor sur le long terme d'une économie développée", "shock": "Hausse tendancielle observée du PIB par tête sur plusieurs décennies", "var": "Ratio capital/PIB (K/Y) sur la même période", "a": "same", "why": "Fait stylisé n°5 : K/Y reste stable dans le long terme, malgré la croissance du PIB par tête. C'est l'un des faits fondamentaux que Solow et ses successeurs cherchent à reproduire théoriquement.", "id": "kaldor-005"}, {"cat": "mrw", "mat": "croissance", "ch": 2, "diff": 2, "ctx": "Modèle de Solow augmenté du capital humain (MRW), économie à l'état régulier", "shock": "Hausse permanente de l'investissement en capital humain (part du PIB consacrée à l'éducation)", "var": "Niveau du revenu par tête à long terme", "a": "up", "why": "↑ investissement en H ⇒ ↑H* ⇒ ↑Y*/L via Y = K^α · H^β · (A·L)^(1−α−β). Effet de niveau. La pente de croissance reste g_A exogène.", "id": "mrw-005"}, {"cat": "ak", "mat": "croissance", "ch": 3, "diff": 2, "ctx": "Modèle AK avec Y = A·K, économie sur son sentier de croissance équilibré", "shock": "Hausse permanente du taux d'épargne s", "var": "Taux de croissance du PIB par tête à long terme", "a": "up", "why": "En AK, g_y = s·A − (δ+n). ↑s ⇒ ↑g_y de façon permanente. C'est la différence fondamentale avec Solow, où s n'a qu'un effet de niveau.", "id": "ak-005"}, {"cat": "romer", "mat": "croissance", "ch": 3, "diff": 3, "ctx": "Modèle de Romer (1990) avec R&D et brevets, économie en régime stationnaire", "shock": "Renforcement de la protection des brevets (durée légale augmentée)", "var": "Taux d'investissement en R&D", "a": "up", "why": "Brevets plus protecteurs ⇒ rente d'innovation plus longue ⇒ profit anticipé de la R&D ↑ ⇒ investissement en R&D ↑. Piège : brevets trop longs peuvent aussi freiner la diffusion (arbitrage incitation/diffusion).", "id": "romer-005"}, {"cat": "aghion", "mat": "croissance", "ch": 4, "diff": 3, "ctx": "Modèle de croissance semi-endogène (Jones), économie sur son sentier de croissance équilibré", "shock": "Hausse permanente de la part des chercheurs (s_R) dans la population", "var": "Taux de croissance de long terme du PIB par tête", "a": "same", "why": "Semi-endogène : s_R affecte le NIVEAU des idées, pas le taux de long terme. Ce dernier dépend de n. Contraste avec Romer 1990 où s_R ↑ ⇒ g ↑. C'est le résultat que Jones défend empiriquement.", "id": "aghion-005"}, {"cat": "malthus", "mat": "croissance", "ch": 4, "diff": 2, "ctx": "Modèle malthusien avec terre fixe et loi de fertilité endogène", "shock": "Progrès technique qui améliore la productivité agricole (choc positif ponctuel)", "var": "Revenu par habitant à long terme", "a": "same", "why": "Piège malthusien : le progrès technique fait TRANSITOIREMENT monter y, ce qui déclenche une hausse de la fertilité, donc de L, qui ramène y à son niveau de subsistance. Résultat de long terme : y inchangé. Malthus (1798). Partie_3_Chap1_Pop.txt lignes 70+.", "id": "malthus-006"}, {"cat": "olg", "mat": "croissance", "ch": 3, "diff": 2, "ctx": "Modèle OLG de Diamond, économie à l'état régulier", "shock": "Hausse permanente du taux d'intérêt réel r (rendement du capital)", "var": "Épargne des jeunes", "a": "ambig", "why": "Deux effets opposés : effet de substitution (r ↑ ⇒ épargne plus rentable ⇒ épargner plus) et effet de revenu (r ↑ ⇒ moins besoin d'épargner pour atteindre un niveau donné de c2). Sens dépend du σ (élasticité de substitution intertemporelle). Ambigu en général.", "id": "olg-005"}, {"cat": "harrod", "mat": "croissance", "ch": 1, "diff": 2, "ctx": "Modèle de Harrod-Domar, économie initialement sur son sentier de croissance équilibrée g = n", "shock": "Augmentation soudaine et permanente du taux d'épargne s (choc positif exogène)", "var": "Stabilité de la croissance (variance des taux de croissance ex-post autour de la trajectoire)", "a": "up", "why": "Chez Harrod-Domar, tout écart à g = n est instable (fil du rasoir). ↑s modifie le taux garanti g = s/v, écart à n, spirale de sur/sous-investissement. La variance monte.", "id": "harrod-005"}, {"cat": "convergence", "mat": "croissance", "ch": 2, "diff": 2, "ctx": "Modèle de Solow, deux pays A et B avec mêmes paramètres structurels, mais A démarre avec y_A < y_B", "shock": "Rien : on observe simplement la dynamique de convergence sur plusieurs décennies", "var": "Écart de revenu entre A et B au fil du temps", "a": "down", "why": "Convergence absolue conditionnelle à mêmes paramètres : le pays plus pauvre croît plus vite (rendements décroissants), l'écart se réduit. À long terme, les deux convergent vers le même sentier.", "id": "convergence-005"}, {"cat": "institutions", "mat": "croissance", "ch": 5, "diff": 3, "ctx": "Deux pays comparables en dotation initiale de facteurs (K, L, H) mais avec institutions inclusives pour l'un, extractives pour l'autre (Acemoglu-Robinson)", "shock": "Aucun choc extérieur, on laisse les deux systèmes fonctionner sur plusieurs décennies", "var": "Écart de PIB par tête entre les deux pays au bout de 50 ans", "a": "up", "why": "Thèse d'Acemoglu-Robinson (Why Nations Fail 2012) : les institutions inclusives (droits de propriété, incitations, contestabilité politique) favorisent l'innovation et l'investissement ; les extractives les freinent. L'écart se creuse dans le temps.", "id": "institutions-005"}], "ORDRE": [{"cat": "equil", "ch": 5, "diff": 2, "ctx": "Effet Balassa-Samuelson dans un pays émergent", "title": "Remettre les étapes de l'effet Balassa-Samuelson dans l'ordre", "steps": ["Gains de productivité dans le secteur échangeable", "Hausse des salaires dans le secteur échangeable", "Contagion des salaires au secteur abrité (marché du travail unique)", "Hausse des prix des non-échangeables", "Hausse du niveau général des prix ⇒ appréciation réelle"], "trap": "bs-etapes", "why": "Le prof exige toutes les étapes : la contagion salariale du secteur échangeable vers l'abrité est celle qu'on oublie.", "id": "equil-013", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 2, "ctx": "Après une dépréciation de la monnaie nationale, avec Marshall-Lerner vérifiée", "title": "Ordonner les étapes de la courbe en J", "steps": ["Court terme : contrats en cours, volumes rigides", "Effet valeur domine (imports plus chers en monnaie nationale)", "Solde commercial se dégrade", "Moyen terme : les volumes s'ajustent", "Effet volume l'emporte (Marshall-Lerner) ⇒ solde s'améliore"], "trap": "ml-symetrie", "why": "Court terme : creux du J. Moyen/long terme : remontée quand ML tient.", "id": "depr-014", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 3, "ctx": "Modèle de Dornbusch, hausse permanente et anticipée de l'offre de monnaie", "title": "Ordonner les étapes du surajustement", "steps": ["Prix rigides à court terme, Ms ↑", "Le taux d'intérêt domestique baisse", "Par PNCTI, la monnaie doit se déprécier de plus que sa valeur de long terme", "Long terme : les prix montent ⇒ retour à la PPA", "Le taux revient vers son nouvel équilibre de long terme"], "trap": "statique-dyn", "why": "Le surajustement est le pas de côté à court terme pour compenser la rigidité des prix ; la dynamique corrige à long terme.", "id": "monet-014", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "ctx": "Mundell-Fleming, changes fixes, mobilité parfaite des capitaux", "title": "Ordonner les effets d'une hausse permanente de G", "steps": ["G ↑ ⇒ courbe IS se déplace à droite", "Le taux d'intérêt tend à monter", "Entrées de capitaux pour arbitrer i > i*", "La banque centrale achète des devises pour tenir la parité", "Ms ↑ ⇒ courbe LM se déplace à droite ⇒ Y ↑"], "trap": "mf-regime", "why": "En fixe + mobilité parfaite, la politique budgétaire est efficace : la BC accommode l'entrée de capitaux.", "id": "mf-015", "mat": "emi"}, {"cat": "bdp", "ch": 1, "diff": 2, "ctx": "Un pays enregistre un déficit courant important", "title": "Ordonner les conséquences comptables (convention du cours)", "steps": ["CC < 0 : besoin de financement", "TC + CC ≈ 0 (négatif) ⇒ le pays a un besoin de financement", "CF < 0 par l'identité TC + CC − CF + EO = 0", "CF négatif ⇒ entrée nette de capitaux", "Le pays est financé par le reste du monde"], "trap": "signe-bdp", "why": "Convention du cours : CF < 0 = entrée nette. Le déficit courant appelle mécaniquement des capitaux extérieurs.", "id": "bdp-013", "mat": "emi"}, {"cat": "forex", "ch": 2, "diff
