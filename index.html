// Liste unique des matières effectivement présentes dans la banque d'items
// (§2 SPEC). Se base sur les items — pas sur DATA.CATS — pour que le
// sélecteur reste transparent tant qu'aucun item d'une matière n'existe,
// même si des CATS de cette matière ont déjà été déclarées (structure prête).
function getMats() {
  const set = new Set();
  const bank = [].concat(
    DATA.QCM || [], DATA.VF || [], DATA.SENS || [],
    DATA.ORDRE || [], DATA.OUVERTE || [], DATA.ETOILE || []
  );
  for (const it of bank) {
    if (typeof it.mat === "string" && it.mat.trim()) set.add(it.mat);
  }
  return Array.from(set);
}

// Ids des catégories de la matière donnée.
function catIdsFor(mat) {
  const cats = DATA.CATS || {};
  return Object.keys(cats).filter(cid => cats[cid] && cats[cid].mat === mat);
}

function loadSettings() {
  const mats = getMats();
  const defaultMat = mats[0] || "emi";
  const s = loadJSON(KEY_SETTINGS, null);
  if (!s) {
    const cids = catIdsFor(defaultMat);
    return { mat: defaultMat, cats: cids.slice(), sfx: true, express: false };
  }
  // Rétro-compat : injecte mat si absent.
  if (!s.mat || !mats.includes(s.mat)) s.mat = defaultMat;
  const cids = catIdsFor(s.mat);
  if (!Array.isArray(s.cats)) s.cats = cids.slice();
  // Nettoyage : ne garde que les cats valides ET dans la matière courante.
  s.cats = s.cats.filter(c => cids.includes(c));
  if (!s.cats.length) s.cats = cids.slice();
  return s;
}
function saveSettings(o) { saveJSON(KEY_SETTINGS, o); }

// ---------- SRS ----------
function srsUpdate(id, ok) {
  const srs = loadSRS();
  const now = Date.now();
  const cur = srs[id] || { box: 0, due: now, ok: 0, ko: 0, last: 0 };
  if (ok) {
    cur.box = Math.min(4, cur.box + 1);
    cur.ok = (cur.ok | 0) + 1;
    cur.due = now + INTERVAL_MS[cur.box];
  } else {
    cur.box = 0;
    cur.ko = (cur.ko | 0) + 1;
    cur.due = now;
  }
  cur.last = now;
  srs[id] = cur;
  saveSRS(srs);
}

// SPEC §5.2 : priorité échus (par box ↑) → jamais vus → autres (par due ↑).
// Pas de pondération par faiblesse de catégorie en J1 (NOTES §5).
function pickDue(fmt, cats) {
  const bank =
    (fmt === "qcm")     ? DATA.QCM :
    (fmt === "vf")      ? DATA.VF :
    (fmt === "sens")    ? DATA.SENS :
    (fmt === "ordre")   ? DATA.ORDRE :
    (fmt === "ouverte") ? DATA.OUVERTE :
    null;
  if (!bank) throw new Error("pickDue: format inconnu " + fmt);
  const now = Date.now();
  const srs = loadSRS();
  const asked = new Set(S ? S.asked : []);
  const mat = S && S.mat;
  // Filtre matière (défense en profondeur : les cats sélectionnées sont
  // déjà restreintes à la matière, mais on refiltre explicitement au cas
  // où un item aurait migré de matière sans que la sélection ait suivi).
  const inCats = bank.filter(it =>
    cats.includes(it.cat) && (!mat || it.mat === mat)
  );

  let cands = inCats.filter(it => !asked.has(it.id));
  if (!cands.length) {
    // Banque épuisée pour la session : on ignore le filtre « non posés ».
    if (S && !S.warned[fmt]) {
      console.log("[emi] banque " + fmt + " épuisée pour cats=" + cats.join(","));
      S.warned[fmt] = true;
    }
    cands = inCats;
    if (!cands.length) return null;
  }

  const due = [];
  const fresh = [];
  const later = [];
  for (const it of cands) {
    const st = srs[it.id];
    if (!st) fresh.push(it);
    else if (st.due <= now) due.push(it);
    else later.push(it);
  }
  due.sort((a, b) => srs[a.id].box - srs[b.id].box);
  later.sort((a, b) => srs[a.id].due - srs[b.id].due);

  const pool = due.length ? due : (fresh.length ? fresh : later);
  return rngPick(pool);
}

// ---------- générateurs calc (SPEC §4) ----------
// Chaque GEN[name](rng) retourne { q, choices, a, why, cat, ch, diff }.
// Contraintes : faisable de tête, distracteurs = confusions du prof.
const GEN = {
  // 1. Taux croisé au certain à partir de deux taux à l'incertain.
  //    1 USD = A JPY  et  1 USD = B EUR  →  1 EUR = A/B JPY
  cross(rng) {
    const A = 100 + rngInt(4) * 10;     // 100, 110, 120, 130
    const Bs = [0.8, 0.9, 1.0, 1.25];
    const B = Bs[rngInt(Bs.length)];
    const good = Math.round(A / B);
    const bad1 = Math.round(A * B);      // mauvais sens (mul au lieu de div)
    const bad2 = Math.round(B / A * 10000) / 10000;  // inverse
    const bad3 = Math.round(A / B / 2);  // moitié
    return {
      cat: "cot", ch: 2, diff: 2,
      q: `1 USD = ${A} JPY et 1 USD = ${B} EUR (à l'incertain, point de vue américain). Combien vaut 1 EUR en JPY ?`,
      choices: [
        good + " JPY",
        bad1 + " JPY",
        bad2 + " JPY",
        bad3 + " JPY"
      ],
      a: 0,
      why: `1 EUR = A/B = ${A}/${B} = ${good} JPY. Attention : A×B (${bad1}) confond le sens du taux ; 1/(A×B) (${bad2}) inverse tout.`
    };
  },

  // 2. Variation du TCR (log-linéarisée) : Δq = Δe + (π − π*).
  varTCR(rng) {
    const dE  = [-5, -3, 2, 4, 5][rngInt(5)];
    const pi  = [1, 2, 3, 4][rngInt(4)];
    const piS = [0, 1, 2][rngInt(3)];
    const good = dE + (pi - piS);
    const bad1 = dE;                    // oubli de l'inflation
    const bad2 = dE + (piS - pi);       // signe inversé
    const bad3 = pi - piS;              // oubli de Δe
    return {
      cat: "tcr", ch: 2, diff: 2,
      q: `Δe = ${dE} %, π = ${pi} %, π* = ${piS} %. Variation du TCR (au certain) ?`,
      choices: [good + " %", bad1 + " %", bad2 + " %", bad3 + " %"],
      a: 0,
      why: `Δq ≈ Δe + (π − π*) = ${dE} + (${pi} − ${piS}) = ${good} %. Distracteurs : oubli d'un terme, signe inversé.`
    };
  },

  // 3. Variation du TCEN pondérée : Σ ω_i Δe_i.
  neer(rng) {
    const w1s = [0.5, 0.6, 0.7, 0.8];
    const w1 = w1s[rngInt(w1s.length)];
    const w2 = Math.round((1 - w1) * 10) / 10;
    const dE1 = [-4, -2, 2, 4, 5][rngInt(5)];
    const dE2 = [-3, -1, 1, 3][rngInt(4)];
    const good = Math.round((w1 * dE1 + w2 * dE2) * 10) / 10;
    const bad1 = Math.round((dE1 + dE2) / 2 * 10) / 10; // moyenne non pondérée
    const bad2 = dE1 + dE2;                             // somme brute
    const bad3 = Math.round(w1 * dE1 * 10) / 10;        // 1 partenaire seul
    return {
      cat: "tcr", ch: 2, diff: 2,
      q: `Deux partenaires : ω₁ = ${w1}, Δe₁ = ${dE1} % ; ω₂ = ${w2}, Δe₂ = ${dE2} %. Variation du TCEN ?`,
      choices: [good + " %", bad1 + " %", bad2 + " %", bad3 + " %"],
      a: 0,
      why: `Δe_TCEN = ω₁ Δe₁ + ω₂ Δe₂ = ${w1}×${dE1} + ${w2}×${dE2} = ${good} %.`
    };
  },

  // 4. Solde d'un compte à partir de crédits/débits (biens + services).
  bdp(rng) {
    const xB = 100 + rngInt(20) * 5;    // exports biens
    const mB = 100 + rngInt(20) * 5;
    const xS = 20 + rngInt(10) * 5;     // exports services
    const mS = 20 + rngInt(10) * 5;
    const good = (xB - mB) + (xS - mS); // solde CC (biens+services)
    const bad1 = (xB - mB);             // oubli des services
    const bad2 = (mB - xB) + (mS - xS); // signe inversé
    const bad3 = (xB + xS) - (mB - mS); // erreur d'inversion crédit/débit
    return {
      cat: "bdp", ch: 1, diff: 2,
      q: `Balance des paiements (Md€) : exports biens ${xB}, imports biens ${mB}, exports services ${xS}, imports services ${mS}. Solde biens + services ?`,
      choices: [good + " Md€", bad1 + " Md€", bad2 + " Md€", bad3 + " Md€"],
      a: 0,
      why: `Solde = (X_B − M_B) + (X_S − M_S) = (${xB} − ${mB}) + (${xS} − ${mS}) = ${good} Md€.`
    };
  },

  // 5. Capacité (besoin) de financement = TC + CC, et sens du CF.
  capfin(rng) {
    const TC = -rngInt(10) - 1;              // TC négatif petit
    const CC = [-20, -10, 10, 20][rngInt(4)];
    const good = TC + CC;
    // Signe du CF (convention du cours) : CapFin > 0 → CF > 0 (sortie K).
    const cfSign = good >= 0 ? "positif (sortie nette de capitaux)"
                              : "négatif (entrée nette de capitaux)";
    const goodTxt = good + " Md€ · CF " + cfSign;
    const bad1 = TC - CC;                     // erreur signe CC
    const bad2 = CC;                          // TC omis
    const bad3 = (good) + " Md€ · CF " + (good >= 0 ? "négatif (entrée)" : "positif (sortie)");
    return {
      cat: "bdp", ch: 1, diff: 3,
      q: `TC = ${TC} Md€, CC = ${CC} Md€. Capacité (+) ou besoin (−) de financement et sens du compte financier ?`,
      choices: [goodTxt, bad1 + " Md€", bad2 + " Md€ · TC omis", bad3],
      a: 0,
      why: `CapFin = TC + CC = ${TC} + ${CC} = ${good} Md€. Convention du cours : CapFin > 0 ⇒ CF > 0 = sortie nette de capitaux.`
    };
  },

  // 6. Parité PNCTI : e = eᵃ + (i − i*) sur horizon annualisé/trimestriel.
  uip(rng) {
    // Taux annuels, horizon trimestriel (÷ 4).
    const i  = 4 * (rngInt(5) + 2);   // 8, 12, 16, 20, 24 %
    const iS = 4 * (rngInt(4) + 1);   // 4, 8, 12, 16 %
    const eA = 100;                    // eᵃ = 100 (base 100)
    // PNCTI : e = eᵃ + (i − i*) sur l'horizon → sur 3 mois : (i − i*)/4
    const diff = (i - iS) / 4;
    const good = eA + diff;
    const bad1 = eA + (i - iS);        // oubli de l'horizon
    const bad2 = eA - diff;             // signe inversé
    const bad3 = eA + (iS - i) / 4;     // i et i* inversés
    return {
      cat: "parite", ch: 3, diff: 3,
      q: `PNCTI : eᵃ = 100, i = ${i} % annuel, i* = ${iS} % annuel. Horizon 3 mois. Taux e aujourd'hui ?`,
      choices: [good.toFixed(2), bad1.toFixed(2), bad2.toFixed(2), bad3.toFixed(2)],
      a: 0,
      why: `e = eᵃ + (i − i*)/horizon = 100 + (${i} − ${iS})/4 = ${good.toFixed(2)}. Piège : oublier l'annualisation (${bad1.toFixed(2)}).`
    };
  },

  // 7. PPA relative : Δe ≈ π* − π (au certain, log-linéarisée).
  ppa(rng) {
    const pi  = [1, 2, 3, 4, 5][rngInt(5)];
    const piS = [0, 1, 2, 3][rngInt(4)];
    const good = piS - pi;
    const bad1 = pi - piS;             // signe inversé (piège classique)
    const bad2 = pi + piS;             // somme au lieu de différence
    const bad3 = 0;                    // ignore PPA relative
    return {
      cat: "equil", ch: 5, diff: 2,
      q: `PPA relative sur un an : π = ${pi} %, π* = ${piS} %. Variation attendue du taux de change au certain (Δe) ?`,
      choices: [`${good} %`, `${bad1} %`, `${bad2} %`, `${bad3} %`],
      a: 0,
      why: `PPA relative : Δe ≈ π* − π = ${piS} − ${pi} = ${good} %. Δe < 0 = dépréciation nominale (l'inflation domestique dépasse l'étrangère).`
    };
  },

  // 8. Effet de valorisation sur la PEN (SPEC §1, chap. 1).
  //    ΔPEN = CC + effet valo. Ici on isole l'effet valo pur.
  pen_valo(rng) {
    const avoirs = 200 + rngInt(6) * 50;       // 200 à 450 Md€
    const engagts = 100 + rngInt(6) * 50;      // 100 à 350 Md€
    const dPct = [-10, -5, 5, 10][rngInt(4)];  // variation % des avoirs en devises
    // Effet de valorisation sur les avoirs (engagements en monnaie nationale ici).
    const good = Math.round(avoirs * dPct / 100);
    const bad1 = Math.round(engagts * dPct / 100);         // confond avoirs / engagements
    const bad2 = Math.round((avoirs + engagts) * dPct / 100); // total et non net
    const bad3 = -good;                                     // signe inversé
    const sens = dPct > 0 ? "hausse" : "baisse";
    return {
      cat: "pen", ch: 1, diff: 3,
      q: `PEN : avoirs en devises ${avoirs} Md€, engagements en monnaie nationale ${engagts} Md€. Les actifs étrangers subissent une ${sens} de ${Math.abs(dPct)} % (effet de valorisation). Impact sur la PEN ?`,
      choices: [`${good} Md€`, `${bad1} Md€`, `${bad2} Md€`, `${bad3} Md€`],
      a: 0,
      trap: "stock-flux",
      why: `Seuls les avoirs libellés en devises sont revalorisés : ΔPEN_valo = ${avoirs} × ${dPct}/100 = ${good} Md€. Les engagements en monnaie nationale ne bougent pas.`
    };
  }
};

function fmtForNext() {
  // Alternance des formats selon la manche.
  if (S.manche === "envoi") return (S.qIdx % 2 === 0) ? "qcm" : "vf";
  if (S.manche === "cpc")   return (S.qIdx % 2 === 0) ? "sens" : "ordre";
  throw new Error("fmtForNext: manche non gérée " + S.manche);
}

function maxQForManche(m) {
  const ex = isExpress();
  if (m === "envoi")  return ex ? 4 : 8;
  if (m === "cpc")    return ex ? 3 : 6;
  if (m === "maitre") return ex ? 3 : 5;
  return 0;
}

function fatalClockMs() {
  return isExpress() ? 60000 : 90000;
}

function nextQ() {
  const fmt = fmtForNext();
  const it = pickDue(fmt, S.cats);
  if (!it) {
    // Aucune banque disponible dans les cats cochées pour ce format :
    // tenter l'autre format de la manche (fallback pédagogique).
    const otherFmt =
      (fmt === "qcm")  ? "vf"   :
      (fmt === "vf")   ? "qcm"  :
      (fmt === "sens") ? "ordre":
      "sens";
    const it2 = pickDue(otherFmt, S.cats);
    if (!it2) { endManche(); return; }
    S.q = it2;
    S.qFmt = otherFmt;
  } else {
    S.q = it;
    S.qFmt = fmt;
  }
  S.asked.push(S.q.id);
  S.phase = "q";
  S.answered = null;
  S.orderPick = null;
  S.orderPerm = null;
  render();
}

// Renvoie la liste des indices de bots qui passent NOUVELLEMENT au rouge
// (feu 1 → 2) sur cette question, dans l'ordre où ils sont joués.
function botAnswerAll(fmt) {
  const newlyRed = [];
  for (let i = 1; i < S.players.length; i++) {
    const b = S.players[i];
    if (b.out) continue;
    const acc = (b.acc && typeof b.acc[fmt] === "number") ? b.acc[fmt] : 0.5;
    const botOk = rng() < acc;
    const prev = b.feu;
    if (botOk) {
      b.score += POINTS[fmt] | 0;
    } else {
      b.feu = Math.min(2, b.feu + 1);
    }
    if (b.feu === 2 && prev < 2) newlyRed.push(i);
  }
  return newlyRed;
}

// answer({ok, given}) : goulot unique (SPEC §6.4).
// Route selon la phase courante : duel → answerDuel, sinon flux normal.
function answer(payload) {
  if (S && S.duel) { answerDuel(payload); return; }
  resolveNormal(payload);
}

function resolveNormal(payload) {
  const p = S.players[0];
  const fmt = S.qFmt;
  const ok = !!payload.ok;
  const prevFeuJ = p.feu;

  if (ok) {
    const mul = (p.combo >= 3) ? 1.5 : 1;
    const pts = Math.floor(POINTS[fmt] * mul);
    p.score += pts;
    p.combo = (p.combo | 0) + 1;
    banner("good", T.correct + " +" + pts);
  } else {
    p.combo = 1;
    p.feu = Math.min(2, p.feu + 1);
    S.errors.push({ id: S.q.id, fmt, given: payload.given, ok: false });
    if (p.feu === 2)      banner("bad", T.feuRouge);
    else if (p.feu === 1) banner("warn", T.feuOrange);
    else                  banner("bad", T.wrong);
  }
  srsUpdate(S.q.id, ok);
  const newlyRedBots = botAnswerAll(fmt);

  const newlyRed = [];
  if (p.feu === 2 && prevFeuJ < 2) newlyRed.push(0);
  for (const b of newlyRedBots) newlyRed.push(b);
  S.newlyRed = newlyRed;

  S.answered = { given: payload.given, ok };
  S.phase = "why";
  S.after = "nextQ";
  render();
}

function pickDuelOpponent(red) {
  // Adversaire = candidat au score le plus bas parmi les vivants, hors red.
  let best = -1, bestScore = Infinity;
  for (let i = 0; i < S.players.length; i++) {
    if (i === red) continue;
    const p = S.players[i];
    if (p.out) continue;
    if (p.score < bestScore) { best = i; bestScore = p.score; }
  }
  return best;
}

function endQ() {
  // La question qui vient d'être répondue compte : on incrémente qIdx.
  S.qIdx = (S.qIdx | 0) + 1;
  const max = maxQForManche(S.manche);

  // Duel déclenché par feu rouge ?
  if (S.newlyRed && S.newlyRed.length > 0) {
    const red = S.newlyRed[0]; // priorité à l'ordre de résolution
    S.newlyRed = null;
    const opp = pickDuelOpponent(red);
    if (opp >= 0) {
      const afterCont = (max && S.qIdx >= max) ? "endManche" : "nextQ";
      enterDuel(red, opp, afterCont);
      return;
    }
  }

  // Flux normal.
  if (max && S.qIdx >= max) {
    checkEndOfManche();
    return;
  }
  nextQ();
}

// ---------- duel ----------
function enterDuel(a, b, afterCont) {
  S.duel = { a: a, b: b, wins: [0, 0], n: 0 };
  S.after = afterCont;
  const pA = S.players[a], pB = S.players[b];

  // Bot vs bot : résolution synchrone, on ne montre pas les 3 questions.
  if (pA.bot && pB.bot) {
    const res = playBotDuel(a, b);
    S.duel.wins = res.wins;
    S.duel.n = res.n;
    finishDuel(res.winner, res.loser);
    return;
  }

  // Joueur dans le duel : première question sens.
  const it = pickDue("sens", S.cats);
  if (!it) {
    // Aucune sens dispo — le score le plus bas est éliminé par défaut.
    const loser = (pA.score <= pB.score) ? a : b;
    const winner = (loser === a) ? b : a;
    finishDuel(winner, loser);
    return;
  }
  S.q = it;
  S.qFmt = "sens";
  S.asked.push(it.id);
  S.phase = "duel";
  S.answered = null;
  banner("info", "DUEL · " + pA.name + " vs " + pB.name);
  render();
}

function playBotDuel(a, b) {
  const pA = S.players[a], pB = S.players[b];
  const wins = [0, 0];
  let n = 0;
  while (true) {
    n++;
    const okA = rng() < (pA.acc && pA.acc.sens != null ? pA.acc.sens : 0.5);
    const okB = rng() < (pB.acc && pB.acc.sens != null ? pB.acc.sens : 0.5);
    if (okA && !okB) wins[0]++;
    else if (!okA && okB) wins[1]++;
    if (wins[0] >= 2) return { winner: a, loser: b, wins: wins, n: n };
    if (wins[1] >= 2) return { winner: b, loser: a, wins: wins, n: n };
    if (n >= 3 && wins[0] !== wins[1]) {
      const winner = wins[0] > wins[1] ? a : b;
      const loser  = winner === a ? b : a;
      return { winner: winner, loser: loser, wins: wins, n: n };
    }
    if (n > 30) {
      // Filet ultime en cas de bots à égalité stricte prolongée.
      return { winner: a, loser: b, wins: wins, n: n };
    }
  }
}

function answerDuel(payload) {
  const d = S.duel;
  const pA = S.players[d.a], pB = S.players[d.b];
  let okA, okB;
  if (!pA.bot) {
    okA = payload.ok;
    okB = rng() < (pB.acc && pB.acc.sens != null ? pB.acc.sens : 0.5);
  } else {
    okA = rng() < (pA.acc && pA.acc.sens != null ? pA.acc.sens : 0.5);
    okB = payload.ok;
  }
  if (okA && !okB) d.wins[0]++;
  else if (!okA && okB) d.wins[1]++;
  d.n++;
  // SRS : uniquement pour la réponse du joueur.
  srsUpdate(S.q.id, payload.ok);
  if (!payload.ok) S.errors.push({ id: S.q.id, fmt: "sens", given: payload.given, ok: false });
  S.answered = { okA: okA, okB: okB, given: payload.given, ok: payload.ok };
  S.phase = "why";
  render();
}

function endDuelQ() {
  const d = S.duel;
  const done =
    (d.wins[0] >= 2 || d.wins[1] >= 2) ||
    (d.n >= 3 && d.wins[0] !== d.wins[1]);
  if (done) {
    const winner = d.wins[0] > d.wins[1] ? d.a : d.b;
    const loser  = (winner === d.a) ? d.b : d.a;
    finishDuel(winner, loser);
    return;
  }
  // Prochaine question sens.
  const it = pickDue("sens", S.cats);
  if (!it) {
    const loser = (S.players[d.a].score <= S.players[d.b].score) ? d.a : d.b;
    const winner = (loser === d.a) ? d.b : d.a;
    finishDuel(winner, loser);
    return;
  }
  S.q = it;
  S.qFmt = "sens";
  S.asked.push(it.id);
  S.phase = "duel";
  S.answered = null;
  render();
}

function finishDuel(winnerIdx, loserIdx) {
  S.players[loserIdx].out = true;
  // Feux des survivants remis à zéro (§1.3).
  for (const p of S.players) { if (!p.out) p.feu = 0; }
  const afterCont = S.after || "nextQ";
  const winsCopy = S.duel ? S.duel.wins.slice() : [0, 0];
  S.duel = null;
  S.after = null;
  S.elimInfo = {
    kind: "duel",
    winnerName: S.players[winnerIdx].name,
    loserName: S.players[loserIdx].name,
    wins: winsCopy,
    cont: afterCont,
  };
  S.phase = "elim";
  render();
}

function checkEndOfManche() {
  // §1.3 al. 2 : fin de manche sans rouge → dernier au score en danger.
  let last = -1, lastScore = Infinity;
  for (let i = 0; i < S.players.length; i++) {
    const p = S.players[i];
    if (p.out) continue;
    if (p.score < lastScore) { lastScore = p.score; last = i; }
  }
  if (last < 0) { endManche(); return; }

  // Joueur dernier → duel vs avant-dernier.
  if (last === 0) {
    let second = -1, secondScore = Infinity;
    for (let i = 1; i < S.players.length; i++) {
      const p = S.players[i];
      if (p.out) continue;
      if (p.score < secondScore) { secondScore = p.score; second = i; }
    }
    if (second < 0) { endManche(); return; }
    enterDuel(0, second, "endManche");
    return;
  }
  // Bot dernier → out direct.
  S.players[last].out = true;
  S.elimInfo = {
    kind: "danger",
    winnerName: null,
    loserName: S.players[last].name,
    wins: null,
    cont: "endManche",
  };
  S.phase = "elim";
  render();
}

function emissionOver() {
  clearTimers();
  // Joueur out. Passe par endEmission qui gère l'archivage éventuel.
  endEmission();
}

// ---------- étoile mystérieuse (SPEC §1.7) ----------
function startEtoile() {
  clearTimers();
  const regne = loadRegne();
  // Récupère l'étoile en cours (si le règne en portait déjà une non trouvée)
  // ou tire une nouvelle étoile fraîche (pas dans etoilesTrouvees).
  let etoileMeta = null;
  if (regne.etoile && regne.etoile.id) {
    etoileMeta = (DATA.ETOILE || []).find(e => e.id === regne.etoile.id) || null;
  }
  if (!etoileMeta) {
    const done = new Set(regne.etoilesTrouvees || []);
    const mat = S && S.mat;
    const remaining = (DATA.ETOILE || []).filter(e =>
      !done.has(e.id) && (!mat || e.mat === mat)
    );
    if (!remaining.length) {
      // Toutes les étoiles ont déjà été trouvées : rien à jouer.
      endEmission();
      return;
    }
    etoileMeta = rngPick(remaining);
  }
  // SPEC §1.7 : "Chaque coup de maître réussi révèle un indice de plus."
  // On stocke le compteur des indices révélés dans regne.etoile.indices.
  const prev = (regne.etoile && regne.etoile.id === etoileMeta.id) ? (regne.etoile.indices | 0) : 0;
  const indicesRevealed = Math.min(5, prev + 1);
  S.etoile = {
    id: etoileMeta.id,
    name: etoileMeta.name,
    aliases: etoileMeta.aliases || [],
    clues: etoileMeta.clues || [],
    indicesRevealed: indicesRevealed,
    proposed: false,
    guessValue: "",
    matched: false,
  };
  S.manche = "etoile";
  S.phase = "guess";
  render();
}

function submitEtoile(rawGuess) {
  const et = S.etoile;
  if (!et || et.proposed) return;
  const g = norm(rawGuess || "");
  et.guessValue = rawGuess;
  et.proposed = true;
  // Match : nom normalisé OU un alias normalisé.
  const nName = norm(et.name);
  const cand = new Set([nName, ...(et.aliases || []).map(a => norm(a))]);
  et.matched = cand.has(g) && g.length > 0;
  if (et.matched) S.etoileWon = true;
  render();
}

// ---------- fin d'émission : mise à jour du règne (§1.8) ----------
function endEmission() {
  clearTimers();
  if (S.regneSaved) { S.screen = "bilan"; render(); return; }
  S.regneSaved = true;
  const regne = loadRegne();
  const joueurOut = !!S.players[0].out;

  if (!joueurOut) {
    // Le joueur est resté vivant (ou a gagné le fatal + éventuellement
    // le coup de maître). Il devient / reste Maître de midi.
    if (!regne.maitre) { regne.maitre = true; regne.jours = 1; }
    else regne.jours += 1;
    regne.cagnotte = (regne.cagnotte | 0) + (S.cagnotte | 0);
    if (S.etoileWon && S.etoile) {
      regne.etoilesTrouvees.push(S.etoile.id);
      regne.etoile = null;                    // prochain tirage à la reprise
    } else if (S.etoile) {
      regne.etoile = { id: S.etoile.id, indices: S.etoile.indicesRevealed | 0 };
    }
    saveRegne(regne);
    S.screen = "bilan";
    S.phase = "victory";
    render();
    return;
  }

  // Joueur éliminé.
  if (regne.maitre) {
    regne.palmares.push({
      jours: regne.jours | 0,
      cagnotte: regne.cagnotte | 0,
      etoiles: (regne.etoilesTrouvees || []).slice(),
    });
    regne.palmares.sort((a, b) => (b.jours - a.jours) || (b.cagnotte - a.cagnotte));
    regne.palmares = regne.palmares.slice(0, 5);
    // Reset règne, étoile en cours conservée (SPEC §1.8).
    const savedEtoile = regne.etoile;
    regne.maitre = false;
    regne.jours = 0;
    regne.cagnotte = 0;
    regne.etoilesTrouvees = [];
    regne.etoile = savedEtoile;
    saveRegne(regne);
  }
  S.screen = "bilan";
  S.phase = "over";
  render();
}

function endManche() {
  // Transition manche → manche suivante (SPEC §1.4).
  // Joueur out ? emissionOver a déjà été appelé.
  const alive = S.players.filter(p => !p.out).map((p, i) => S.players.indexOf(p));
  const aliveBots = S.players.slice(1).filter(p => !p.out).length;

  if (S.manche === "envoi") {
    if (aliveBots < 1) { emissionOver(); return; }
    // Si seulement 2 joueurs vivants au sortir du coup d'envoi, on saute
    // le coup par coup et on va direct au coup fatal (SPEC §1.5 : 2
    // candidats). Sinon transition cpc.
    if (S.players.filter(p => !p.out).length <= 2) {
      startFatal();
      return;
    }
    S.manche = "cpc";
    S.qIdx = 0;
    S.newlyRed = null;
    S.elimInfo = null;
    S.coupBas = true;         // relance le droit au coup bas (SPEC §1.4)
    S.orderPick = null;
    S.orderPerm = null;
    S.phase = "intro";
    render();
    return;
  }

  if (S.manche === "cpc") {
    // Fin cpc → fatal.
    if (aliveBots < 1) { emissionOver(); return; }
    startFatal();
    return;
  }

  if (S.manche === "fatal") {
    // Cas rare : les deux clocks ont expiré simultanément (impossible en
    // pratique), ou banque épuisée. Fallback → bilan.
    S.screen = "bilan";
    S.phase = "endfatal";
    render();
    return;
  }

  // Manches maitre/etoile pas encore implémentées (J5).
  S.screen = "bilan";
  S.phase = "";
  render();
}

// ---------- coup fatal (SPEC §1.5) ----------
function startFatal() {
  // 2 candidats : le joueur si vivant + le bot au plus haut score parmi
  // les vivants (au sens du cours, on affronte le meilleur bot restant).
  clearTimers();
  const joueurAlive = !S.players[0].out;
  const bots = S.players.slice(1).map((p, i) => ({ p, idx: i + 1 })).filter(x => !x.p.out);
  bots.sort((x, y) => y.p.score - x.p.score);
  if (!joueurAlive) {
    // Deux meilleurs bots s'affrontent.
    if (bots.length < 2) { emissionOver(); return; }
    S.fatal = { a: bots[0].idx, b: bots[1].idx, cur: 0 };
  } else {
    if (!bots.length) { emissionOver(); return; }
    S.fatal = { a: 0, b: bots[0].idx, cur: 0 };
  }
  S.manche = "fatal";
  S.qIdx = 0;
  const clk = fatalClockMs();
  S.clocks = [clk, clk];
  S.newlyRed = null;
  S.elimInfo = null;
  S.phase = "intro";
  S.fatalMsg = null;
  render();
}

function fatalPlayerIdx(cur) {
  return cur === 0 ? S.fatal.a : S.fatal.b;
}

function nextFatalQ() {
  clearTimers();
  S.qIdx = (S.qIdx | 0) + 1;
  // Alterne calc / qcm3.
  const fmt = (S.qIdx % 2 === 1) ? "calc" : "qcm3";
  let item;
  if (fmt === "calc") {
    const names = Object.keys(GEN);
    const name = rngPick(names);
    const gen = GEN[name](rng);
    item = Object.assign({}, gen, {
      id: "calc-" + name + "-" + S.qIdx + "-" + SEED.toString(16),
      _generated: true,
      _gen: name,
    });
  } else {
    // qcm à 3 choix : tirer un qcm ordinaire, retirer un distracteur.
    const q = pickDue("qcm", S.cats);
    if (!q) { finishFatal(1 - S.fatal.cur); return; }
    item = shrinkQCM(q);
    S.asked.push(q.id);
  }
  S.q = item;
  S.qFmt = fmt;
  S.phase = "q";
  S.answered = null;
  S.fatalMsg = null;
  // Démarre le chrono du candidat actuel.
  startClock();
  // Si c'est un bot, planifier la réponse après réflexion.
  const p = S.players[fatalPlayerIdx(S.fatal.cur)];
  if (p.bot) scheduleBotAnswerFatal();
  render();
}

function shrinkQCM(q) {
  // Copie profonde, retire un distracteur au hasard (jamais la bonne).
  // Faute de marqueur trapIdx, on retire aléatoirement un mauvais choix.
  // Le distracteur du trap peut donc être supprimé (limite documentée
  // dans NOTES.md, à corriger avec un champ optionnel trapIdx en J5+).
  const goodIdx = q.a;
  const badIdxs = [0, 1, 2, 3].filter(i => i !== goodIdx);
  const dropIdx = rngPick(badIdxs);
  const keep = [0, 1, 2, 3].filter(i => i !== dropIdx);
  const choices = keep.map(i => q.choices[i]);
  const newGood = keep.indexOf(goodIdx);
  return {
    id: q.id,
    cat: q.cat,
    ch: q.ch,
    diff: q.diff,
    q: q.q,
    choices: choices,
    a: newGood,
    trap: q.trap || null,
    why: q.why || "",
    _shrunk: true,
    _originalId: q.id,
  };
}

function startClock() {
  clearInterval(TIMERS.clock);
  const step = 100;
  const startedAt = Date.now();
  const cur = S.fatal.cur;
  const startMs = S.clocks[cur];
  TIMERS.clock = setInterval(() => {
    if (!S || S.manche !== "fatal" || S.phase !== "q") return;
    const elapsed = Date.now() - startedAt;
    S.clocks[cur] = Math.max(0, startMs - elapsed);
    if (S.clocks[cur] <= 0) {
      clearInterval(TIMERS.clock); TIMERS.clock = null;
      finishFatal(1 - cur);
      return;
    }
    updateClocksUI();
  }, step);
}

function scheduleBotAnswerFatal() {
  clearTimeout(TIMERS.botThink);
  const think = 4000 + Math.floor(rng() * 8001); // 4 à 12 s
  S.fatalMsg = "Réflexion…";
  TIMERS.botThink = setTimeout(() => {
    if (!S || S.manche !== "fatal" || S.phase !== "q") return;
    const p = S.players[fatalPlayerIdx(S.fatal.cur)];
    const acc = (p.acc && typeof p.acc[S.qFmt] === "number") ? p.acc[S.qFmt] : 0.5;
    const botOk = rng() < acc;
    fatalRespond(botOk, null);
  }, think);
}

function fatalRespond(ok, given) {
  clearInterval(TIMERS.clock); TIMERS.clock = null;
  clearTimeout(TIMERS.botThink); TIMERS.botThink = null;
  // Enregistre pour bilan.
  if (!ok && S.players[fatalPlayerIdx(S.fatal.cur)] && !S.players[fatalPlayerIdx(S.fatal.cur)].bot) {
    S.errors.push({ id: S.q.id, fmt: S.qFmt, given: given, ok: false });
  }
  // SRS uniquement pour le joueur, pas pour les calc générés.
  const curP = S.players[fatalPlayerIdx(S.fatal.cur)];
  if (!curP.bot && !S.q._generated) {
    srsUpdate(S.q._originalId || S.q.id, ok);
  }
  const goodTxt = (S.qFmt === "calc")
    ? String(S.q.choices ? S.q.choices[S.q.a] : "?")
    : (S.q.choices ? String(S.q.choices[S.q.a]) : "?");
  S.fatalMsg = ok ? ("Bonne réponse : " + goodTxt)
                  : ("Mauvaise. Réponse : " + goodTxt);
  banner(ok ? "good" : "bad", curP.name + " " + (ok ? "trouve" : "rate"));

  if (ok) {
    // Change de main.
    S.fatal.cur = 1 - S.fatal.cur;
  }
  // Rerender pour figer l'horloge et afficher le verdict brièvement.
  render();
  // Enchaîne la question suivante après un très court délai (rythme fatal).
  clearTimeout(TIMERS.verdictHide);
  TIMERS.verdictHide = setTimeout(() => {
    if (!S || S.manche !== "fatal") return;
    nextFatalQ();
  }, 1200);
}

function finishFatal(winnerCur) {
  clearTimers();
  const winnerIdx = fatalPlayerIdx(winnerCur);
  const loserIdx = fatalPlayerIdx(1 - winnerCur);
  S.players[loserIdx].out = true;
  S.elimInfo = null;
  S.duel = null;
  S.fatalMsg = null;
  if (winnerIdx === 0) {
    // Joueur vainqueur du coup fatal → coup de maître (§1.6).
    startMaitre();
    return;
  }
  // Joueur perdu → émission terminée.
  endEmission();
}

// ---------- coup de maître (SPEC §1.6) ----------
function startMaitre() {
  clearTimers();
  S.manche = "maitre";
  S.qIdx = 0;
  S.maitre = { n: 0, su: 0, palier: PALIERS[0], revealed: false, timeLeft: MAITRE_TIME_MS };
  S.phase = "intro";
  render();
}

function nextMaitreQ() {
  clearTimers();
  const item = pickDue("ouverte", S.cats);
  if (!item) {
    // Banque épuisée : on figera la cagnotte au palier atteint.
    finishMaitre("banque");
    return;
  }
  S.q = item;
  S.qFmt = "ouverte";
  S.asked.push(item.id);
  S.maitre.n += 1;
  S.maitre.revealed = false;
  S.maitre.timeLeft = MAITRE_TIME_MS;
  S.phase = "q";
  render();
  startMaitreChrono();
}

function startMaitreChrono() {
  clearInterval(TIMERS.clock);
  const step = 100;
  const startedAt = Date.now();
  const startMs = S.maitre.timeLeft;
  TIMERS.clock = setInterval(() => {
    if (!S || S.manche !== "maitre" || S.phase !== "q" || S.maitre.revealed) return;
    S.maitre.timeLeft = Math.max(0, startMs - (Date.now() - startedAt));
    const el = document.getElementById("maitre-chrono");
    if (el) el.textContent = (S.maitre.timeLeft / 1000).toFixed(1) + " s";
    if (S.maitre.timeLeft <= 0) {
      clearInterval(TIMERS.clock); TIMERS.clock = null;
      if (el) el.textContent = "temps écoulé";
    }
  }, step);
}

function grade(kind) {
  // kind ∈ "su", "moitie", "pasSu".
  clearInterval(TIMERS.clock); TIMERS.clock = null;
  const m = S.maitre;
  if (kind === "su") {
    m.su += 1;
    m.palier = PALIERS[Math.min(m.su, PALIERS.length - 1)];
    if (m.su >= maxQForManche("maitre")) { finishMaitre("complete"); return; }
    nextMaitreQ();
    return;
  }
  if (kind === "moitie") {
    if (m.n >= maxQForManche("maitre")) { finishMaitre("run"); return; }
    nextMaitreQ();
    return;
  }
  // Pas su : cagnotte figée au palier atteint (SPEC §1.6).
  finishMaitre("pasSu");
}

function finishMaitre(reason) {
  clearTimers();
  const m = S.maitre;
  S.cagnotte = PALIERS[Math.min(m.su, PALIERS.length - 1)];
  if (m.su >= maxQForManche("maitre")) {
    // Tous les Su décrochés → accès à l'étoile mystérieuse (§1.6).
    startEtoile();
    return;
  }
  // Sinon : fin d'émission (le joueur reste Maître mais n'a pas
  // décroché de nouvelle étoile).
  endEmission();
}

function renderPupitres() {
  const el = document.getElementById("pupitres");
  if (!el) return;
  if (!S || S.screen === "setup") { el.innerHTML = ""; return; }
  const rows = S.players.map((p, i) => {
    const active = (i === 0 && S.screen === "show") ? " active" : "";
    const out = p.out ? " out" : "";
    const feux = [0, 1, 2].map(j => {
      const on = (j <= p.feu) ? (" on-" + p.feu) : "";
      return '<span class="feu' + on + '"></span>';
    }).join("");
    return (
      '<div class="pod' + active + out + '">' +
        '<div class="pod-name">' + esc(p.name) + '</div>' +
        '<div class="feux">' + feux + '</div>' +
        '<div class="pod-score">' + (p.score | 0) + '</div>' +
      '</div>'

}

function renderSetup() {
  const stage = document.getElementById("stage");
  const overlay = document.getElementById("overlay");
  overlay.classList.remove("show"); overlay.innerHTML = "";
  document.getElementById("subtitle").textContent = "Setup";

  const settings = loadSettings();
  const srs = loadSRS();

  const mats = getMats();
  const catsInMat = catIdsFor(settings.mat);
  // Sélecteur matière : visible seulement si plusieurs matières
  // existent dans DATA.CATS (SPEC §2 : étape transparente en v1).
  const matSelector = (mats.length > 1) ? (
    '<div class="mats">' +
      '<div class="mats-lbl">Matière</div>' +
      mats.map(m =>
        '<span class="cat-chip' + (m === settings.mat ? ' on' : '') +
          '" data-act="pickMat" data-v="' + esc(m) + '">' + esc(m.toUpperCase()) + '</span>'
      ).join("") +
    '</div>'
  ) : "";

  const chips = catsInMat.map(cid => {
    const cat = DATA.CATS[cid];
    const on = settings.cats.includes(cid) ? " on" : "";
    // Jauge = part des items de la cat en boîte ≥ 2 (§5.3).
    const bank = [].concat(DATA.QCM || [], DATA.VF || [], DATA.SENS || [], DATA.ORDRE || [], DATA.OUVERTE || []);
    const inCat = bank.filter(it => it.cat === cid);
    const knownIds = Object.keys(srs);
    const good = inCat.filter(it => knownIds.includes(it.id) && srs[it.id].box >= 2).length;
    const pct = inCat.length ? Math.round(100 * good / inCat.length) : 0;
    return (
      '<span class="cat-chip' + on + '" data-act="toggleCat" data-v="' + esc(cid) + '">' +
        esc(cat.name) +
        ' <span class="jauge"><span style="width:' + pct + '%"></span></span>' +
      '</span>'
    );
  }).join("");

  const regne = loadRegne();
  const regneBanner = regne.maitre ? (
    '<div class="regne-banner">' +
      '<div class="rb-title">Jour ' + (regne.jours | 0) + ' du règne</div>' +
      '<div class="rb-sub">Cagnotte : ' + (regne.cagnotte | 0) + ' pts · Étoiles : ' + (regne.etoilesTrouvees || []).length +
        (regne.etoile ? ' · Étoile en cours (' + (regne.etoile.indices | 0) + '/5 indices)' : '') +
      '</div>' +
    '</div>'
  ) : "";

  const expressChip =
    '<div class="setup-toggle">' +
      '<span class="cat-chip' + (settings.express ? ' on' : '') + '" data-act="toggleExpress">' +
        (settings.express ? '⚡ Express' : 'Express') +
      '</span>' +
      '<span class="setup-toggle-hint">' +
        (settings.express ? '4 / 3 / 60 s / 3 — ~5 min' : '8 / 6 / 90 s / 5 — ~12 min') +
      '</span>' +
    '</div>';

  stage.innerHTML =
    '<section class="setup">' +
      regneBanner +
      '<h2>' + esc(T.setup.h) + '</h2>' +
      '<div class="hint">' + esc(T.setup.hint) + '</div>' +
      matSelector +
      '<div class="cats">' + chips + '</div>' +
      expressChip +
      '<div class="btnrow">' +
        '<button class="b-gold" data-act="startShow">' + esc(T.setup.start) + '</button>' +
      '</div>' +
    '</section>';
}

function renderQuestion() {
  const q = S.q;
  const fmt = S.qFmt;
  const cat = (DATA.CATS[q.cat] && DATA.CATS[q.cat].name) || q.cat;
  const eyebrow = esc(cat) + " · " + fmt.toUpperCase();

  if (fmt === "qcm") {
    const choices = q.choices.map((c, i) =>
      '<button data-act="answer" data-v="' + i + '">' + esc(c) + '</button>'
    ).join("");
    return (
      '<article class="card">' +
        '<div class="eyebrow">' + eyebrow + '</div>' +
        '<div class="qtext">' + esc(q.q) + '</div>' +
        '<div class="choices">' + choices + '</div>' +
      '</article>'
    );
  }
  if (fmt === "vf") {
    return (
      '<article class="card">' +
        '<div class="eyebrow">' + eyebrow + '</div>' +
        '<div class="qtext">' + esc(q.q) + '</div>' +
        '<div class="btnrow" style="margin-top:12px">' +
          '<button class="b-vert"  data-act="answer" data-v="true">'  + esc(T.vrai) + '</button>' +
          '<button class="b-rouge" data-act="answer" data-v="false">' + esc(T.faux) + '</button>' +
        '</div>' +
      '</article>'
    );
  }
  if (fmt === "sens") {
    return (
      '<article class="card">' +
        '<div class="eyebrow">' + eyebrow + '</div>' +
        '<div class="sens-ctx">' + esc(q.ctx) + '</div>' +
        '<div class="sens-shock"><span class="sens-lbl">Choc</span> ' + esc(q.shock) + '</div>' +
        '<div class="sens-var"><span class="sens-lbl">Effet sur</span> ' + esc(q.var) + ' ?</div>' +
        '<div class="sens-buttons">' +
          '<button data-act="answer" data-v="up"    class="sens-btn" aria-label="hausse">↑</button>' +
          '<button data-act="answer" data-v="down"  class="sens-btn" aria-label="baisse">↓</button>' +
          '<button data-act="answer" data-v="same"  class="sens-btn" aria-label="inchangé">=</button>' +
          '<button data-act="answer" data-v="ambig" class="sens-btn" aria-label="ambigu">?</button>' +
        '</div>' +
      '</article>'
    );
  }
  if (fmt === "ordre") {
    // Génère la permutation à l'affichage initial.
    if (!S.orderPerm) {
      S.orderPerm = rngShuffle(q.steps.map((_, i) => i));
      S.orderPick = [];
    }
    const pile = q.steps.map((_, i) => {
      const idx = S.orderPick[i];
      if (idx == null) return '<li class="empty">—</li>';
      return '<li>' + esc(q.steps[idx]) + '</li>';
    }).join("");
    const choices = S.orderPerm.map(realIdx => {
      const used = S.orderPick.includes(realIdx);
      return '<button data-act="order" data-v="' + realIdx + '"' + (used ? ' disabled' : '') + '>' +
        esc(q.steps[realIdx]) + '</button>';
    }).join("");
    const canValid = S.orderPick.length === q.steps.length;
    const canUndo  = S.orderPick.length > 0;
    return (
      '<article class="card">' +
        '<div class="eyebrow">' + eyebrow + '</div>' +
        (q.ctx   ? '<div class="sens-ctx">' + esc(q.ctx) + '</div>' : '') +
        (q.title ? '<div class="qtext">' + esc(q.title) + '</div>' : '') +
        '<div class="order-lbl">Ton ordre</div>' +
        '<ol class="order-pile">' + pile + '</ol>' +
        '<div class="order-lbl">Étapes disponibles</div>' +
        '<div class="order-choices">' + choices + '</div>' +
        '<div class="btnrow" style="margin-top:12px">' +
          '<button class="b-gold" data-act="orderValid"' + (canValid ? '' : ' disabled') + '>Valider</button>' +
          '<button class="b-ghost" data-act="orderUndo"' + (canUndo ? '' : ' disabled') + '>Annuler</button>' +
        '</div>' +
      '</article>'
    );
  }
  return '<article class="card"><div class="qtext">Format inconnu : ' + esc(fmt) + '</div></article>';
}

// Rappelle l'énoncé de la question, adapté au format.
function renderQuestionRestate(q, fmt) {
  if (fmt === "sens") {
    return (
      '<div class="sens-ctx">' + esc(q.ctx || "") + '</div>' +
      '<div class="sens-shock"><span class="sens-lbl">Choc</span> ' + esc(q.shock) + '</div>' +
      '<div class="sens-var"><span class="sens-lbl">Effet sur</span> ' + esc(q.var) + ' ?</div>'
    );
  }
  if (fmt === "ordre") {
    return (
      (q.ctx   ? '<div class="sens-ctx">' + esc(q.ctx) + '</div>' : '') +
      (q.title ? '<div class="qtext">' + esc(q.title) + '</div>' : '')
    );
  }
  return '<div class="qtext">' + esc(q.q) + '</div>';
}

// Étiquettes des réponses sens.
const SENS_LABELS = { up: "↑ hausse", down: "↓ baisse", same: "= inchangé", ambig: "? ambigu" };

function renderWhy() {
  const q = S.q;
  const fmt = S.qFmt;
  const cat = (DATA.CATS[q.cat] && DATA.CATS[q.cat].name) || q.cat;
  const eyebrow = esc(cat) + " · " + fmt.toUpperCase() + (S.phase === "why" && S.duel ? " · DUEL" : "");
  const ans = S.answered || {};

  // Bandeau spécifique au coup bas (SPEC §1.4).
  const coupBasHeader = ans.coupBas ? (
    '<div class="coupbas-note">' +
      '<span class="cb-lbl">COUP BAS</span> passé à <b>' + esc(S.players[ans.target].name) + '</b> · ' +
      (ans.botOk ? '<span style="color:var(--vert)">réponse juste</span>'
                 : '<span style="color:var(--rouge)">se trompe</span>') +
      '<div class="cb-hint">La question retombe en boîte 0 : elle reviendra en priorité.</div>' +
    '</div>'
  ) : "";

  let choicesBlock = "";
  let verdict = "";

  if (fmt === "qcm") {
    choicesBlock = '<div class="choices">' + q.choices.map((c, i) => {
      let cls = "";
      if (i === q.a) cls = " correct";
      else if (i === ans.given && !ans.ok) cls = " wrong";
      return '<button class="' + cls.trim() + '" disabled data-v="' + i + '">' + esc(c) + '</button>';
    }).join("") + '</div>';
  } else if (fmt === "vf") {
    const goodLabel = q.a ? T.vrai : T.faux;
    verdict = '<div class="answered-good">Bonne réponse : ' + esc(goodLabel) + '</div>';
    if (!ans.ok && !ans.coupBas) {
      const givenLabel = ans.given ? T.vrai : T.faux;
      verdict += '<div class="answered-bad">Ta réponse : ' + esc(givenLabel) + '</div>';
    }
  } else if (fmt === "sens") {
    const goodLabel = SENS_LABELS[q.a] || q.a;
    verdict = '<div class="answered-good">Bonne réponse : ' + esc(goodLabel) + '</div>';
    if (ans && ans.given && ans.given !== q.a) {
      const givenLabel = SENS_LABELS[ans.given] || ans.given;
      verdict += '<div class="answered-bad">Ta réponse : ' + esc(givenLabel) + '</div>';
    }
  } else if (fmt === "ordre") {
    const correct = q.steps.map(step => '<li>' + esc(step) + '</li>').join("");
    verdict = '<div class="order-lbl" style="color:var(--vert)">Ordre correct</div>' +
              '<ol class="order-recap">' + correct + '</ol>';
    if (!ans.ok && Array.isArray(ans.given)) {
      const yours = ans.given.map((idx, pos) => {
        const cls = (idx === pos) ? "match" : "mismatch";
        return '<li class="' + cls + '">' + esc(q.steps[idx]) + '</li>';
      }).join("");
      verdict += '<div class="order-lbl" style="color:var(--rouge)">Ton ordre</div>' +
                 '<ol class="order-recap">' + yours + '</ol>';
    }
    // Verdict duel : afficher qui a marqué le point ce round.
    if (S.duel) {
      const a = S.players[S.duel.a], b = S.players[S.duel.b];
      const round = 'Manche ' + S.duel.n + '/3 · ' + esc(a.name) + ' ' + S.duel.wins[0] +
                    ' — ' + S.duel.wins[1] + ' ' + esc(b.name);
      verdict = '<div class="duel-round">' + round + '</div>' + verdict;
    }
  }

  const why = q.why ? '<div class="why"><div class="lbl">POURQUOI</div>' + esc(q.why) + '</div>' : '';

  return (
    '<article class="card">' +
      '<div class="eyebrow">' + eyebrow + '</div>' +
      coupBasHeader +
      renderQuestionRestate(q, fmt) +
      choicesBlock + verdict + why +
      '<div class="btnrow" style="margin-top:12px">' +
        '<button class="b-gold" data-act="next">' + esc(T.next) + '</button>' +
      '</div>' +
    '</article>'
  );
}

function renderBilan() {
  const p = S.players[0];
  const nbErr = S.errors.length;
  const asked = S.asked.length;
  const over    = (S.phase === "over");
  const victory = (S.phase === "victory");
  const endcpc  = (S.phase === "endcpc");
  const endfatal = (S.phase === "endfatal");
  const mname = (T.manches[S.manche] || T.manches.envoi).name;
  const regne = loadRegne();
  const title = victory
    ? ("Maître de midi · Jour " + (regne.jours | 0) + " du règne")
    : over    ? "Émission terminée"
    : endcpc  ? "Fin du coup par coup · Coup fatal à venir"
    : endfatal ? "Fin du coup fatal"
    : (T.finManche + " · " + mname);
  const regneLine = (victory || (over && regne.palmares && regne.palmares.length))
    ? ('<div class="hint" style="text-align:center;color:var(--muted);margin-top:4px">' +
         (victory
            ? ('Cagnotte du règne : ' + (regne.cagnotte | 0) + ' pts · étoiles décrochées : ' + (regne.etoilesTrouvees || []).length)
            : ('Règne archivé au palmarès')) +
       '</div>')
    : "";
  const etoileLine = S.etoile
    ? ('<div class="hint" style="text-align:center;color:var(--muted);margin-top:4px">' +
         (S.etoileWon ? '⭐ Étoile trouvée : ' + esc(S.etoile.name)
                      : ('Étoile en cours : ' + (S.etoile.indicesRevealed | 0) + '/5 indices révélés')) +
       '</div>')
    : "";

  // Retrouve chaque item d'erreur pour l'afficher.
  const byId = {};
  for (const list of [DATA.QCM, DATA.VF, DATA.SENS]) {
    for (const it of (list || [])) byId[it.id] = it;
  }
  const errItems = S.errors.map(e => {
    const it = byId[e.id];
    if (!it) return "";
    const cat = (DATA.CATS[it.cat] && DATA.CATS[it.cat].name) || it.cat;
    let qtxt = "";
    let ta = "";
    if (e.fmt === "qcm") {
      qtxt = it.q;
      ta = "<b>OK :</b> " + esc(it.choices[it.a]) +
           " · <i>Toi :</i> " + esc(it.choices[e.given] || "—");
    } else if (e.fmt === "vf") {
      qtxt = it.q;
      const okL = it.a ? T.vrai : T.faux;
      const taL = e.given ? T.vrai : T.faux;
      ta = "<b>OK :</b> " + esc(okL) + " · <i>Toi :</i> " + esc(taL);
    } else if (e.fmt === "sens") {
      qtxt = (it.ctx ? it.ctx + " · " : "") + it.shock + " → " + it.var;
      const okL = SENS_LABELS[it.a] || it.a;
      const taL = SENS_LABELS[e.given] || e.given || "—";
      ta = "<b>OK :</b> " + esc(okL) + " · <i>Toi :</i> " + esc(taL);
    }
    const why = it.why ? '<div class="hint" style="color:var(--muted);font-size:12px;margin-top:4px">' + esc(it.why) + '</div>' : "";
    return (
      '<div class="err">' +
        '<div class="cat">' + esc(cat) + ' · ' + esc(e.fmt) + '</div>' +
        '<div class="qtxt">' + esc(qtxt) + '</div>' +
        '<div class="ta">' + ta + '</div>' +
        why +
      '</div>'
    );
  }).join("");

  // Jauges par catégorie (§5.3) — recalculées à jour ici puisque la SRS
  // a été mise à jour tout au long de l'émission.
  const srs = loadSRS();
  const jaugeMat = S && S.mat;
  const jaugeCats = jaugeMat ? catIdsFor(jaugeMat) : Object.keys(DATA.CATS);
  const jauges = jaugeCats.map(cid => {
    const cat = DATA.CATS[cid];
    const bank = [].concat(DATA.QCM || [], DATA.VF || [], DATA.SENS || [], DATA.ORDRE || [], DATA.OUVERTE || []);
    const inCat = bank.filter(it => it.cat === cid);
    if (!inCat.length) return "";
    const good = inCat.filter(it => srs[it.id] && srs[it.id].box >= 2).length;
    const pct = Math.round(100 * good / inCat.length);
    return (
      '<div class="row">' +
        '<span class="name">' + esc(cat.name) + '</span>' +
        '<span class="bar"><span style="width:' + pct + '%"></span></span>' +
        '<span class="pct">' + pct + '%</span>' +
      '</div>'
    );
  }).join("");

  // Liste « à revoir » : items posés cette émission encore en boîte 0-1.
  const toRevisit = S.asked.filter(id => {
    const st = srs[id];
    return !st || st.box <= 1;
  });
  const revisitBlock = toRevisit.length ? (
    '<h3 style="font-family:var(--sans);letter-spacing:.06em;font-size:14px;color:var(--bleu);margin:14px 0 6px">À revoir · ' + toRevisit.length + '</h3>' +
    '<div class="hint" style="color:var(--muted);font-size:12px">Ces questions vont revenir en priorité à la prochaine émission (SRS boîte 0-1).</div>'
  ) : "";

  return (
    '<section class="bilan">' +
      '<h2>' + esc(title) + '</h2>' +
      '<div class="score-big">' + (p.score | 0) + '</div>' +
      '<div class="hint" style="text-align:center;color:var(--muted)">' +
        asked + ' questions · ' + (asked - nbErr) + ' bonnes · ' + nbErr + ' erreurs' +
      '</div>' +
      regneLine + etoileLine +
      (errItems ? '<h3 style="font-family:var(--sans);letter-spacing:.06em;font-size:14px;color:var(--rouge);margin:16px 0 4px">Erreurs</h3><div class="errlist">' + errItems + '</div>' : "") +
      revisitBlock +
      '<h3 style="font-family:var(--sans);letter-spacing:.06em;font-size:14px;color:var(--vert);margin:16px 0 6px">Jauges par catégorie</h3>' +
      '<div class="jauges">' + jauges + '</div>' +
      '<div class="btnrow">' +
        '<button class="b-gold"  data-act="restart">' + esc(T.rejouer) + '</button>' +
        '<button class="b-ghost" data-act="exportGame">Exporter</button>' +
      '</div>' +
    '</section>'
  );
}

function renderFatalClocks() {
  if (!S || S.manche !== "fatal" || !S.fatal) return "";
  const cur = S.fatal.cur;
  const a = S.players[S.fatal.a];
  const b = S.players[S.fatal.b];
  const pctA = Math.max(0, Math.min(100, (S.clocks[0] / fatalClockMs()) * 100));
  const pctB = Math.max(0, Math.min(100, (S.clocks[1] / fatalClockMs()) * 100));
  const secA = (S.clocks[0] / 1000).toFixed(1);
  const secB = (S.clocks[1] / 1000).toFixed(1);
  return (
    '<div class="clocks">' +
      '<div class="clock' + (cur === 0 ? " active" : "") + '">' +
        '<div class="clock-name">' + esc(a.name) + '</div>' +
        '<div class="clock-bar"><span id="clock-bar-a" style="width:' + pctA.toFixed(1) + '%"></span></div>' +
        '<div class="clock-val" id="clock-val-a">' + secA + ' s</div>' +
      '</div>' +
      '<div class="clock' + (cur === 1 ? " active" : "") + '">' +
        '<div class="clock-name">' + esc(b.name) + '</div>' +
        '<div class="clock-bar"><span id="clock-bar-b" style="width:' + pctB.toFixed(1) + '%"></span></div>' +
        '<div class="clock-val" id="clock-val-b">' + secB + ' s</div>' +
      '</div>' +
    '</div>'
  );
}

function updateClocksUI() {
  // Mise à jour minimaliste des barres et compteurs pendant le tick, sans
  // full render (évite la reconstruction complète 10×/s).
  if (!S || S.manche !== "fatal") return;
  const bA = document.getElementById("clock-bar-a");
  const bB = document.getElementById("clock-bar-b");
  const vA = document.getElementById("clock-val-a");
  const vB = document.getElementById("clock-val-b");
  if (bA) bA.style.width = ((S.clocks[0] / fatalClockMs()) * 100).toFixed(1) + "%";
  if (bB) bB.style.width = ((S.clocks[1] / fatalClockMs()) * 100).toFixed(1) + "%";
  if (vA) vA.textContent = (S.clocks[0] / 1000).toFixed(1) + " s";
  if (vB) vB.textContent = (S.clocks[1] / 1000).toFixed(1) + " s";
}

function renderFatalQuestion() {
  const q = S.q;
  const fmt = S.qFmt;
  const cat = (DATA.CATS[q.cat] && DATA.CATS[q.cat].name) || q.cat;
  const eyebrow = esc(cat) + " · " + fmt.toUpperCase() + " · COUP FATAL";
  const cur = S.fatal.cur;
  const isPlayerTurn = (fatalPlayerIdx(cur) === 0);
  const msg = S.fatalMsg ? '<div class="fatal-msg">' + esc(S.fatalMsg) + '</div>' : '';

  // Si c'est un bot qui réfléchit, on n'expose pas de boutons.
  if (!isPlayerTurn) {
    return (
      '<article class="card">' +
        '<div class="eyebrow">' + eyebrow + '</div>' +
        '<div class="qtext">' + esc(q.q) + '</div>' +
        msg +
        '<div class="hint" style="color:var(--muted);font-size:12px;margin-top:8px">' +
          esc(S.players[fatalPlayerIdx(cur)].name) + ' a la main.' +
        '</div>' +
      '</article>'
    );
  }

  const choices = (q.choices || []).map((c, i) =>
    '<button data-act="answer" data-v="' + i + '">' + esc(c) + '</button>'
  ).join("");
  return (
    '<article class="card">' +
      '<div class="eyebrow">' + eyebrow + '</div>' +
      '<div class="qtext">' + esc(q.q) + '</div>' +
      '<div class="choices">' + choices + '</div>' +
      msg +
    '</article>'
  );
}

function renderMaitre() {
  if (!S.q) return "";
  const q = S.q;
  const cat = (DATA.CATS[q.cat] && DATA.CATS[q.cat].name) || q.cat;
  const eyebrow = esc(cat) + " · OUVERTE · COUP DE MAÎTRE";
  const m = S.maitre;
  const nHead = "Question " + m.n + "/5 · palier " + (m.palier | 0) + " → prochain " + PALIERS[Math.min(m.su + 1, PALIERS.length - 1)];
  const chrono = '<span id="maitre-chrono">' + ((m.timeLeft / 1000).toFixed(1)) + ' s</span>';

  let body;
  if (!m.revealed) {
    body =
      '<div class="qtext">' + esc(q.q) + '</div>' +
      '<div class="maitre-chrono">Chrono indicatif : ' + chrono + '</div>' +
      '<div class="btnrow" style="margin-top:12px">' +
        '<button class="b-gold" data-act="reveal">Voir la réponse</button>' +
      '</div>';
  } else {
    const pointsHtml = (q.points || []).map(p => '<li>' + esc(p) + '</li>').join("");
    const notaHtml = (q.notations || []).map(p => '<li>' + esc(p) + '</li>').join("");
    body =
      '<div class="qtext">' + esc(q.q) + '</div>' +
      '<div class="ouverte-model"><div class="lbl">RÉPONSE-MODÈLE</div>' + esc(q.model) + '</div>' +
      (pointsHtml ? '<div class="ouverte-lbl">Éléments attendus</div><ul class="ouverte-pts">' + pointsHtml + '</ul>' : '') +
      (notaHtml   ? '<div class="ouverte-lbl">Notations à préciser</div><ul class="ouverte-pts">' + notaHtml + '</ul>' : '') +
      '<div class="btnrow" style="margin-top:12px">' +
        '<button class="b-vert"  data-act="grade" data-v="su">Su</button>' +
        '<button class="b-ghost" data-act="grade" data-v="moitie">À moitié</button>' +
        '<button class="b-rouge" data-act="grade" data-v="pasSu">Pas su</button>' +
      '</div>';
  }
  return (
    '<article class="card">' +
      '<div class="eyebrow">' + eyebrow + '</div>' +
      '<div class="hint" style="color:var(--muted);font-size:12px;margin-bottom:6px">' + esc(nHead) + '</div>' +
      body +
    '</article>'
  );
}

function renderEtoile() {
  const el = document.getElementById("etoile");
  const et = S.etoile;
  if (!et) { el.classList.remove("show"); el.innerHTML = ""; return; }
  const slots = [0, 1, 2, 3, 4].map(i => {
    const shown = i < et.indicesRevealed;
    return shown
      ? '<li class="revealed"><span class="clue-n">' + (i + 1) + '</span> ' + esc(et.clues[i] || "") + '</li>'
      : '<li class="masked"><span class="clue-n">' + (i + 1) + '</span> <span class="masked-txt">indice à venir</span></li>';
  }).join("");

  let bottom;
  if (!et.proposed) {
    bottom =
      '<div class="etoile-input">' +
        '<input type="text" id="etoileGuess" placeholder="Ta proposition" autocapitalize="off" autocorrect="off" spellcheck="false">' +
      '</div>' +
      '<div class="btnrow"><button class="b-gold" data-act="etoilePropose">Proposer</button></div>';
  } else {
    const verdict = et.matched
      ? '<div class="etoile-verdict good">Trouvée ! ⭐</div>'
      : '<div class="etoile-verdict bad">Ratée. C\'était : <b>' + esc(et.name) + '</b></div>';
    bottom = verdict +
      '<div class="btnrow"><button class="b-gold" data-act="etoileNext">Continuer</button></div>';
  }

  el.innerHTML =
    '<div class="etoile-sheet">' +
      '<h2>Étoile mystérieuse</h2>' +
      '<div class="etoile-hint">Un concept du cours à deviner. Une seule proposition.</div>' +
      '<ol class="etoile-clues">' + slots + '</ol>' +
      bottom +
    '</div>';
  el.classList.add("show");
}

function renderCheatsheet(filter) {
  const modal = document.getElementById("modal");
  const cs = DATA.CHEATSHEET || { sigles: [], notations: [], conventions: [] };
  const nfilter = norm(filter || "");
  const match = (e) => !nfilter || norm(e.t).includes(nfilter) || norm(e.d).includes(nfilter);
  const sections = [
    { key: "sigles",      label: "Sigles & abréviations" },
    { key: "notations",   label: "Notations mathématiques" },
    { key: "conventions", label: "Conventions du cours" },
  ];
  const blocks = sections.map(sec => {
    const entries = (cs[sec.key] || []).filter(match);
    if (!entries.length) return "";
    const items = entries.map(e =>
      '<dl class="cs-item">' +
        '<dt>' + esc(e.t) + '</dt>' +
        '<dd>' + esc(e.d) + '</dd>' +
      '</dl>'
    ).join("");
    return (
      '<section class="cs-sec">' +
        '<h3>' + esc(sec.label) + ' <span class="cs-count">' + entries.length + '</span></h3>' +
        items +
      '</section>'
    );
  }).join("");
  const total = sections.reduce((n, s) => n + (cs[s.key] || []).filter(match).length, 0);

  modal.innerHTML =
    '<div class="sheet cheatsheet-sheet">' +
      '<div class="cs-head">' +
        '<h2>Mémo</h2>' +
        '<button class="b-ghost b-sm" data-act="cheatClose">Fermer</button>' +
      '</div>' +
      '<input type="text" id="cs-search" placeholder="Rechercher un sigle, une notation, une convention…" ' +
        'autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(filter || "") + '">' +
      (total ? '' : '<div class="cs-empty">Aucun résultat pour « ' + esc(filter) + ' »</div>') +
      '<div class="cs-body">' + blocks + '</div>' +
    '</div>';
  modal.classList.add("show");
  // Listener input, avec préservation du curseur.
  const inp = document.getElementById("cs-search");
  if (inp) {
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.addEventListener("input", ev => {
      renderCheatsheet(ev.target.value);
    });
  }
}

function renderElimOverlay() {

    const scoreLine = info.wins ?
      '<div class="hint" style="color:var(--muted);font-size:13px">' + (info.wins[0] | 0) + ' — ' + (info.wins[1] | 0) + '</div>' : '';

function render() {
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");
  const etoile = document.getElementById("etoile");
  const stage = document.getElementById("stage");
  const sub = document.getElementById("subtitle");

  overlay.classList.remove("show");
  modal.classList.remove("show");
  etoile.classList.remove("show");

  if (!S || S.screen === "setup") {
    renderPupitres();
    renderSetup();
    return;
  }

  renderPupitres();

  if (S.screen === "show") {
    const mname = (T.manches[S.manche] || T.manches.envoi).name;
    const total = S.duel ? "3" : (S.manche === "fatal" ? "∞" : String(maxQForManche(S.manche) || "?"));
    const idx = S.duel ? ((S.duel.n | 0) + 1) : ((S.qIdx | 0) + 1);
    sub.textContent = mname + (S.duel ? " · Duel " : (S.manche === "fatal" ? " · " : " · Question ")) +
      (S.manche === "fatal" ? "Q" + idx : idx + "/" + total);
    if (S.phase === "intro") { renderIntroOverlay(); return; }
    if (S.manche === "fatal" && S.phase === "q") {
      stage.innerHTML = renderFatalClocks() + renderFatalQuestion();
      return;
    }
    if (S.manche === "maitre" && S.phase === "q") {
      stage.innerHTML = renderMaitre();
      return;
    }
    if (S.manche === "etoile" && S.phase === "guess") {
      stage.innerHTML = "";
      renderEtoile();
      return;
    }
    if (S.phase === "q") {
      let html = renderQuestion();
      if (S.manche === "cpc" && S.coupBas) {
        html = '<div class="coup-bas-btn"><button class="b-sm" data-act="coupBas">Coup bas · 1 disponible</button></div>' + html;
      }
      stage.innerHTML = html;
      return;
    }
    if (S.phase === "duel")  { stage.innerHTML = renderQuestion(); return; }
    if (S.phase === "why")   { stage.innerHTML = renderWhy(); return; }
    if (S.phase === "elim")  { renderElimOverlay(); return; }
    stage.innerHTML = "";
    return;
  }

  if (S.screen === "bilan") {
    sub.textContent =
      S.phase === "victory" ? "Maître de midi" :
      S.phase === "over"    ? "Émission terminée" :
      S.phase === "endcpc"  ? "Fin coup par coup" :
      S.phase === "endfatal" ? "Fin coup fatal" :
      "Bilan";
    stage.innerHTML = renderBilan();
    return;
  }

  stage.innerHTML = "";
}

// ---------- table d'actions (délégation) ----------
const ACT = {
  toggleCat(v) {
    const s = loadSettings();
    if (s.cats.includes(v)) s.cats = s.cats.filter(c => c !== v);
    else s.cats = s.cats.concat([v]);
    if (!s.cats.length) s.cats = [v]; // au moins une catégorie
    saveSettings(s);
    render();
  },
  toggleExpress() {
    const s = loadSettings();
    s.express = !s.express;
    saveSettings(s);
    render();
  },
  pickMat(v) {
    // Sélecteur matière (§2). Change la matière courante et resélectionne
    // toutes ses catégories par défaut (l'utilisateur peut décocher ensuite).
    if (!v || !getMats().includes(v)) return;
    const s = loadSettings();
    if (s.mat === v) return;
    s.mat = v;
    s.cats = catIdsFor(v);
    saveSettings(s);
    render();
  },
  startShow() {
    const s = loadSettings();
    if (!s.cats.length) return;
    newShow(s);
    render();
  },
  introOK() {
    if (!S) return;
    if (S.manche === "fatal") {
      S.phase = "q";
      S.qIdx = 0;
      nextFatalQ();
      return;
    }
    if (S.manche === "maitre") {
      nextMaitreQ();
      return;
    }
    S.phase = "q";
    nextQ();
  },
  reveal() {
    if (!S || S.manche !== "maitre" || S.phase !== "q") return;
    if (S.maitre.revealed) return;
    S.maitre.revealed = true;
    clearInterval(TIMERS.clock); TIMERS.clock = null;
    render();
  },
  grade(v) {
    if (!S || S.manche !== "maitre" || S.phase !== "q") return;
    if (!S.maitre.revealed) return;
    if (v !== "su" && v !== "moitie" && v !== "pasSu") return;
    grade(v);
  },
  etoilePropose() {
    if (!S || S.manche !== "etoile" || S.phase !== "guess") return;
    const inp = document.getElementById("etoileGuess");
    submitEtoile(inp ? inp.value : "");
  },
  etoileNext() {
    if (!S || S.manche !== "etoile") return;
    endEmission();
  },
  answer(v) {
    if (!S) return;
    // Fatal : route dédiée (chrono, pas de why).
    if (S.manche === "fatal" && S.phase === "q") {
      // Le joueur ne peut cliquer que quand c'est son tour.
      if (fatalPlayerIdx(S.fatal.cur) !== 0) return;
      const fmt = S.qFmt;
      const nChoices = (S.q.choices || []).length;
      const idx = parseInt(v, 10);
      if (!(idx >= 0 && idx < nChoices)) throw new Error("answer.fatal: v invalide " + v);
      const ok = (idx === S.q.a);
      fatalRespond(ok, idx);
      return;
    }
    // Accepté en phase "q" (envoi/cpc) et "duel" (question sens du duel).
    if (S.phase !== "q" && S.phase !== "duel") return;
    const fmt = S.qFmt;
    let given, ok;
    if (fmt === "qcm") {
      given = parseInt(v, 10);
      if (!(given >= 0 && given < 4)) throw new Error("answer.qcm: v invalide " + v);
      ok = (given === S.q.a);
    } else if (fmt === "vf") {
      if (v !== "true" && v !== "false") throw new Error("answer.vf: v invalide " + v);
      given = (v === "true");
      ok = (given === S.q.a);
    } else if (fmt === "sens") {
      if (v !== "up" && v !== "down" && v !== "same" && v !== "ambig") {
        throw new Error("answer.sens: v invalide " + v);
      }
      given = v;
      ok = (given === S.q.a);
    } else if (fmt === "ordre") {
      // Ordre est validé via ACT.orderValid, pas via ACT.answer.
      throw new Error("answer.ordre: doit passer par orderValid");
    } else {
      throw new Error("answer: format non géré " + fmt);
    }
    answer({ ok, given });
  },
  order(v) {
    if (!S || S.phase !== "q" || S.qFmt !== "ordre") return;
    const idx = parseInt(v, 10);
    if (!Number.isInteger(idx)) throw new Error("order: v invalide " + v);
    if (!Array.isArray(S.orderPick)) S.orderPick = [];
    if (S.orderPick.includes(idx)) return;
    if (idx < 0 || idx >= S.q.steps.length) throw new Error("order: idx hors bornes");
    S.orderPick.push(idx);
    render();
  },
  orderUndo() {
    if (!S || S.phase !== "q" || S.qFmt !== "ordre") return;
    if (!Array.isArray(S.orderPick) || !S.orderPick.length) return;
    S.orderPick.pop();
    render();
  },
  orderValid() {
    if (!S || S.phase !== "q" || S.qFmt !== "ordre") return;
    if (!Array.isArray(S.orderPick) || S.orderPick.length !== S.q.steps.length) return;
    const ok = S.orderPick.every((v, i) => v === i);
    answer({ ok: ok, given: S.orderPick.slice() });
  },
  coupBas() {
    // SPEC §1.4 : « le joueur peut passer une question à un bot ».
    // La question retombe en boîte 0 (coût pédagogique), pas seulement
    // stratégique.
    if (!S || S.phase !== "q" || S.manche !== "cpc" || !S.coupBas) return;
    let target = -1, low = Infinity;
    for (let i = 1; i < S.players.length; i++) {
      const p = S.players[i];
      if (p.out) continue;
      if (p.score < low) { low = p.score; target = i; }
    }
    if (target < 0) return;
    const bot = S.players[target];
    const fmt = S.qFmt;
    const acc = (bot.acc && typeof bot.acc[fmt] === "number") ? bot.acc[fmt] : 0.5;
    const prevFeu = bot.feu;
    const botOk = rng() < acc;
    if (botOk) {
      bot.score += POINTS[fmt] | 0;
    } else {
      bot.feu = Math.min(2, bot.feu + 1);
    }
    // SRS : boîte 0, échue.
    const srs = loadSRS();
    const cur = srs[S.q.id] || { box: 0, due: 0, ok: 0, ko: 0, last: 0 };
    cur.box = 0;
    cur.due = Date.now();
    cur.last = Date.now();
    srs[S.q.id] = cur;
    saveSRS(srs);
    // Détection newlyRed sur ce bot uniquement (les autres bots
    // n'ont pas répondu à cette question).
    S.newlyRed = (bot.feu === 2 && prevFeu < 2) ? [target] : [];
    S.coupBas = false;
    S.answered = { coupBas: true, target: target, botOk: botOk };
    S.phase = "why";
    S.after = "nextQ";
    banner("info", "Coup bas → " + bot.name);
    render();
  },
  next() {
    if (!S) return;
    if (S.phase === "elim") {
      // Reprise post-élimination.
      const info = S.elimInfo || { cont: "endManche" };
      S.elimInfo = null;
      if (S.players[0].out) { emissionOver(); return; }
      const cont = info.cont || "endManche";
      if (cont === "endManche") { endManche(); return; }
      // cont === "nextQ" : la question suivante, en tenant compte de la limite.
      if (S.manche === "envoi" && S.qIdx >= 8) { checkEndOfManche(); return; }
      nextQ();
      return;
    }
    if (S.phase === "why") {
      if (S.duel) { endDuelQ(); return; }
      endQ();
      return;
    }
  },
  restart() {
    // render() traite S=null exactement comme screen:"setup".
    clearTimers();
    S = null;
    render();
  },
  toggleSfx() {
    const s = loadSettings();
    s.sfx = !s.sfx;
    saveSettings(s);
    banner("info", "Son : " + (s.sfx ? "on" : "off"));
  },
  exportGame() {
    if (!S) { banner("info", "Rien à exporter."); return; }
    const payload = { version: 1, ts: Date.now(), S: S, SRS: loadSRS(), REGNE: loadRegne() };
    const s = JSON.stringify(payload);
    const blob = new Blob([s], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "emi-" + new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19) + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
  },
  importGame() {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json";
    inp.addEventListener("change", ev => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        let j;
        try { j = JSON.parse(reader.result); } catch (e) { banner("bad", "Import: JSON invalide."); return; }
        if (!j || j.version !== 1) { banner("bad", "Import: version inattendue."); return; }
        if (j.SRS) saveSRS(j.SRS);
        if (j.REGNE) saveRegne(j.REGNE);
        if (j.S && j.S.players) { S = j.S; render(); banner("info", "Partie restaurée."); }
        else { banner("info", "SRS & règne restaurés."); render(); }
      };
      reader.readAsText(f);
    });
    inp.click();
  },
  cheatsheet() {
    renderCheatsheet("");
  },
  cheatSearch() {
    // pas d'usage direct : le champ de recherche a un listener input()
    // ajouté à la volée dans renderCheatsheet.
  },
  cheatClose() {
    document.getElementById("modal").classList.remove("show");
  },
  palmares() {
    const r = loadRegne();
    const items = (r.palmares || []).map((e, i) => {
      const et = (e.etoiles || []).length;
      return '<div style="margin:6px 0;padding:6px 0;border-bottom:1px solid var(--line)">' +
             '<b>' + (i + 1) + '.</b> ' + (e.jours | 0) + ' jours · ' + (e.cagnotte | 0) + ' pts' +
             (et ? ' · ⭐ ' + et : '') +
             '</div>';
    }).join("") || '<div style="color:var(--muted)">Aucun règne archivé.</div>';
    const current = r.maitre ? (
      '<div style="margin-bottom:10px;padding:8px;border:1px solid rgba(255,201,60,.4);border-radius:8px;background:rgba(255,201,60,.08)">' +
        '<b>Règne actuel :</b> ' + (r.jours | 0) + ' jours · ' + (r.cagnotte | 0) + ' pts · ⭐ ' + (r.etoilesTrouvees || []).length +
      '</div>'
    ) : "";
    const modal = document.getElementById("modal");
    modal.innerHTML =
      '<div class="sheet">' +
        '<h2 style="font-family:var(--sans);letter-spacing:.08em;color:var(--gold);margin:0 0 6px">PALMARÈS</h2>' +
        current + items +
        '<div class="btnrow"><button class="b-ghost" data-act="closeModal">Fermer</button></div>' +
      '</div>';
    modal.classList.add("show");
  },
  closeModal() {
    document.getElementById("modal").classList.remove("show");
  },
};

// Délégation unique : `pointerup` sur document, filtrée par
// `[data-act]`. Aucun `onclick=` inline. SPEC §7.2 mentionne #stage ;
// on étend au document pour couvrir topbar/overlay/modal — la contrainte
// « une seule voie » est respectée (un handler, une table ACT).
function onPointerUp(ev) {
  const el = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el) return;
  const act = el.dataset.act;
  if (!act) return;
  const v = el.dataset.v || "";
  const fn = ACT[act];
  if (!fn) throw new Error("Action inconnue : " + act);
  ev.preventDefault();
  fn(v, el, ev);
}

// ---------- ResizeObserver pour --pile-bas (ARCHITECTURE §2.4 #B2) ----------
// En J1 aucun élément fixe en bas ; le contrat existe pour être branché
// dès qu'on ajoute un #pilebas.
function initBottomPileObserver() {
  const el = document.getElementById("pilebas");
  if (!el || typeof ResizeObserver === "undefined") return;
  const root = document.documentElement;
  const ro = new ResizeObserver(entries => {
    for (const e of entries) {
      const h = Math.ceil(e.contentRect.height);
      root.style.setProperty("--pile-bas", h + "px");
    }
  });
  ro.observe(el);
}

// ---------- boot ----------
(function boot() {
  initPRNG();
  document.addEventListener("pointerup", onPointerUp, { passive: false });
  // Boot IIFE : squelette rendu, puis setup.
  const bootEl = document.getElementById("boot");
  bootEl.innerHTML =
    '<div class="sheet">' +
      '<h1>' + esc(T.bootTitle) + '</h1>' +
      '<div class="hint">' + esc(T.bootHint) + '</div>' +
      '<div class="btnrow">' +
        '<button class="b-gold" data-act="bootStart">' + esc(T.bootStart) + '</button>' +
      '</div>' +
    '</div>';
  bootEl.classList.add("show");
  ACT.bootStart = function () {
    bootEl.classList.remove("show");
    render();
  };
  initBottomPileObserver();
  // Rendu initial silencieux du fond (setup sous le boot).
  render();
})();
</script>
