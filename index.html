": 2, "ctx": "Exportateur français encaissant 100 000 USD dans 3 mois", "title": "Ordonner les étapes de la couverture à terme", "steps": ["Signature du contrat commercial libellé en dollars", "Identification du risque : baisse du dollar dans 3 mois", "Vente des 100 000 USD à terme à 3 mois", "Livraison des dollars par l'importateur", "Conversion au taux fixé à la signature, résultat certain"], "why": "Couverture parfaite : le prix en euros est connu dès la signature.", "id": "forex-013", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 3, "title": "Ordonner les grands moments de l'histoire monétaire internationale", "steps": ["Étalon-or classique (avant 1914)", "Bretton Woods (1944)", "Dilemme de Triffin (années 1960)", "Fin de la convertibilité or (Nixon, 1971)", "Accords de la Jamaïque : changes flottants (1976)"], "why": "Chronologie à connaître par cœur pour le partiel.", "id": "smi-013", "mat": "emi"}, {"cat": "cot", "ch": 2, "diff": 2, "ctx": "On connaît 1 € = 1,25 $ et 1 € = 150 JPY", "title": "Ordonner l'arbitrage triangulaire pour trouver 1 $ = ? JPY", "steps": ["Écrire la relation par la monnaie commune (€)", "Isoler le dollar : 1 $ = 1/1,25 €", "Multiplier par le taux €/JPY", "1 $ = (1/1,25) × 150 = 120 JPY"], "why": "L'arbitrage triangulaire élimine la monnaie de passage par une simple division.", "id": "cot-013", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "ctx": "PNCTI en logs, choc positif de politique monétaire domestique (baisse surprise de i)", "title": "Ordonner les effets immédiats sur le taux de change au certain e", "steps": ["i ↓ (surprise, i* et eᵃ inchangés)", "Différentiel i − i* devient négatif", "e = eᵃ + (i − i*) ⇒ e baisse", "Dépréciation immédiate de la monnaie"], "trap": "sens-parite", "why": "Baisse surprise du taux ⇒ dépréciation immédiate pour rétablir l'arbitrage.", "id": "parite-014", "mat": "emi"}, {"cat": "si", "ch": 1, "diff": 2, "ctx": "Économie ouverte, identité (S − I) + (T − G) = X − M", "title": "Ordonner les étapes d'analyse d'un déficit courant", "steps": ["Constater X − M < 0 (déficit courant)", "En déduire (S − I) + (T − G) < 0", "Insuffisance d'épargne globale par rapport à l'investissement", "Financé par entrée nette de capitaux étrangers"], "why": "Le déficit courant est toujours financé par une entrée équivalente de capitaux — c'est l'autre facette de l'identité.", "id": "si-011", "mat": "emi"}, {"cat": "pen", "ch": 1, "diff": 2, "ctx": "Position extérieure nette (PEN) d'un pays sur deux périodes", "title": "Ordonner le calcul de ΔPEN entre t et t+1", "steps": ["PEN(t) : stock de créances nettes à l'instant t", "Ajouter les flux courants CC(t → t+1)", "Appliquer les effets de valorisation (change, prix des actifs)", "PEN(t+1) = PEN(t) + CC + effets de valorisation"], "trap": "stock-flux", "why": "La PEN est un stock : flux courants et valorisation la modifient simultanément.", "id": "pen-012", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 2, "ctx": "Formule log-linéarisée du TCR", "title": "Ordonner les étapes du passage TCEN → TCR (variation)", "steps": ["Partir de TCER = TCEN × P/P*", "Passer en logs : q = e + p − p*", "Différencier : Δq = Δe + (π − π*)", "Interpréter : appréciation réelle si Δe + π − π* > 0"], "trap": "niveau-log", "why": "En niveau : multiplication et moyenne géométrique. En log : addition et moyenne arithmétique.", "id": "tcr-012", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "title": "Ordonner l'exposé du triangle d'incompatibilité de Mundell", "steps": ["Énoncer les trois objectifs : parité fixe, mobilité parfaite, politique monétaire autonome", "Montrer que la parité fixe fixe i = i* (arbitrage)", "Mobilité parfaite ⇒ tout écart i ≠ i* provoque des flux massifs", "Conclusion : au plus deux objectifs sur trois", "En pratique, chaque pays choisit son coin du triangle"], "why": "Le triangle est un théorème d'impossibilité, à énoncer complètement.", "id": "mf-016", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 3, "ctx": "Condition Marshall-Lerner et effets d'une dépréciation", "title": "Ordonner la démonstration mécanique", "steps": ["Dépréciation nominale de x %", "Effet valeur : prix des importations ↑ en monnaie nationale", "Effet volume : quantités exportées ↑, quantités importées ↓", "Le solde s'améliore ssi εX + εM > 1"], "trap": "ml-symetrie", "why": "La démonstration part de la décomposition prix × quantités : ML se déduit de la comparaison des deux effets.", "id": "depr-015", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 2, "ctx": "Modèle monétaire prix flexibles (Frenkel), PPA vérifiée", "title": "Ordonner les étapes reliant Ms domestique et e nominal", "steps": ["Équation quantitative : Ms/P = L(Y, i)", "Prix flexibles ⇒ P ajuste : P ∝ Ms à Y et i donnés", "PPA absolue : e = P/P*", "Substituer : e ∝ Ms/Ms*"], "trap": "fixe-flexible", "why": "Le lien direct Ms → e passe par P (neutralité monétaire) et la PPA continue.", "id": "monet-015", "mat": "emi"}, {"cat": "bdp", "mat": "emi", "ch": 1, "diff": 2, "ctx": "Balance des paiements — établissement d'un solde du compte courant", "title": "Ordonner les étapes du calcul d'un solde du compte courant", "steps": ["Sommer les crédits (exportations de biens, services, revenus reçus, transferts reçus)", "Sommer les débits (importations de biens, services, revenus versés, transferts versés)", "Calculer le solde = Crédits − Débits pour chaque poste", "Additionner les soldes des sous-comptes (biens + services + revenus + transferts)", "Interpréter : solde > 0 = excédent courant ; solde < 0 = déficit courant"], "trap": "bc-bcour", "why": "Piège classique : oublier les services ou les revenus dans le calcul (balance commerciale ≠ balance courante). Le compte courant inclut biens, services, revenus primaires, revenus secondaires (transferts).", "id": "bdp-023"}, {"cat": "si", "mat": "emi", "ch": 1, "diff": 3, "ctx": "Mise en évidence du paradoxe de Feldstein-Horioka (1980)", "title": "Ordonner les étapes du raisonnement de Feldstein-Horioka", "steps": ["Hypothèse théorique : mobilité parfaite des capitaux ⇒ épargne et investissement nationaux décorrélés", "Régresser I/PIB sur S/PIB en coupe transversale de pays", "Coefficient attendu proche de 0 en cas de mobilité parfaite", "Observation empirique (1980) : coefficient proche de 0,9", "Conclusion : paradoxe — épargne et investissement restent fortement corrélés malgré l'ouverture"], "trap": "endo-exo", "why": "Feldstein-Horioka (1980) : rejet empirique de la mobilité parfaite pour un panel de pays OCDE. Explications possibles : biais méthodologique, contraintes d'endettement, biais national par asymétrie d'information.", "id": "si-019"}, {"cat": "forex", "mat": "emi", "ch": 2, "diff": 2, "ctx": "Arbitrage triangulaire sur trois monnaies (€, $, ¥)", "title": "Ordonner les étapes d'un arbitrage triangulaire profitable", "steps": ["Observer les 3 cotations bilatérales spot : E€$, E$¥, E€¥", "Calculer le taux croisé implicite : E€¥ (via $) = E€$ × E$¥", "Comparer avec le taux direct E€¥ coté sur le marché", "Si taux direct ≠ taux implicite : opportunité d'arbitrage", "Acheter la monnaie là où elle est moins chère, revendre là où elle est plus chère (gain sans risque)"], "trap": "niveau-log", "why": "L'arbitrage triangulaire élimine les écarts entre taux croisé implicite et taux direct. C'est le mécanisme qui garantit la loi du prix unique sur le forex. Attention : formule au certain pour la même monnaie de base.", "id": "forex-020"}, {"cat": "cot", "mat": "emi", "ch": 2, "diff": 1, "ctx": "Passage entre cotations certain / incertain / croisée", "title": "Ordonner les étapes pour obtenir un taux croisé à partir de deux cotations à l'incertain", "steps": ["Lire les cotations à l'incertain : 1 USD = 100 JPY et 1 USD = 0,8 EUR", "Fixer la monnaie de référence commune : le dollar", "Passer par le dollar : 1 EUR = (1/0,8) USD", "Multiplier par la cotation JPY : 1 EUR = (1/0,8) × 100 JPY = 125 JPY", "Vérifier l'ordre de grandeur et le sens (certain pour l'euro contre yen)"], "trap": "certain-incertain", "why": "Attention à ne pas prendre le mauvais sens (inverse = 0,008), le produit brut (80), ou l'incertain à la place du certain (1,25). La règle : identifier la monnaie commune et exprimer les deux cotations dans le même sens.", "id": "cot-020"}, {"cat": "smi", "mat": "emi", "ch": 2, "diff": 2, "ctx": "Grandes étapes du système monétaire international", "title": "Ordonner chronologiquement les grandes étapes du SMI", "steps": ["1870-1914 : étalon-or, monnaies convertibles en or à parité fixe", "1922 (Gênes) : étalon change-or (Gold Exchange Standard) après l'inconvertibilité de 1914-1918", "1944 (Bretton Woods) : étalon dollar-or, dollar pivot, création du FMI", "1971 (Nixon) : suspension de la convertibilité du dollar en or", "1976 (Jamaïque) : légalisation officielle des changes flottants"], "trap": "fixe-flexible", "why": "Le système actuel de changes flottants est post-1971 (Nixon suspend la convertibilité) et institutionnalisé en 1976 (Jamaïque). Le passage étalon-or → Bretton Woods n'est pas direct : il y a la parenthèse Gênes/entre-deux-guerres.", "id": "smi-022"}, {"cat": "mf", "mat": "emi", "ch": 6, "diff": 3, "ctx": "Mundell-Fleming, change flexible, mobilité parfaite des capitaux — expansion monétaire", "title": "Ordonner les étapes du mécanisme d'une expansion monétaire", "steps": ["La banque centrale augmente l'offre de monnaie ⇒ LM se déplace vers la droite", "Le taux d'intérêt domestique tend à baisser sous i*", "Sortie de capitaux ⇒ dépréciation de la monnaie nationale", "Amélioration de X − M (moins d'imports, plus d'exports) ⇒ IS se déplace vers la droite", "Nouvel équilibre à i = i* et Y plus élevé : politique monétaire pleinement efficace"], "trap": "mf-regime", "why": "En change flexible + mobilité parfaite, la politique monétaire est totalement efficace car l'ajustement se fait par le taux de change (canal externe), sans blocage sur le taux d'intérêt qui reste ancré à i*.", "id": "mf-027"}, {"cat": "equil", "mat": "emi", "ch": 5, "diff": 2, "ctx": "Convergence vers la parité de pouvoir d'achat (PPA) après un choc d'inflation", "title": "Ordonner les étapes de l'ajustement PPA relative", "steps": ["Le pays subit une inflation π supérieure à celle du reste du monde π*", "Les prix domestiques P montent plus vite que les prix étrangers P*", "La compétitivité-prix se dégrade : biens domestiques deviennent chers", "Le taux de change nominal se déprécie (E augmente si e = incertain) pour rétablir la PPA relative", "Long terme : Δe ≈ π − π* (variation nominale absorbe le différentiel d'inflation)"], "trap": "niveau-log", "why": "PPA relative : Δe ≈ π − π*. C'est un ajustement de long terme (Rogoff parle de plusieurs années). La PPA absolue (E = P/P*) est rarement vérifiée à cause des biens non-échangeables, des coûts de transport et de l'effet Balassa-Samuelson.", "id": "equil-024"}, {"cat": "parite", "mat": "emi", "ch": 3, "diff": 3, "ctx": "Dérivation de la PNCTI depuis l'absence d'arbitrage entre deux placements internationaux", "title": "Ordonner les étapes de la dérivation de la PNCTI", "steps": ["Placement domestique 1 € pendant un an : rend 1 + i (en euros)", "Placement étranger équivalent : convertir 1 € en E dollars (E = certain), placer, obtenir E(1+i*) dollars", "Reconvertir au taux anticipé Eᵃ : rend E(1+i*)/Eᵃ (en euros)", "Absence d'arbitrage (agent neutre au risque) : 1 + i = E(1+i*)/Eᵃ", "Log-linéarisation : i ≈ i* − (eᵃ − e), soit e = eᵃ + (i − i*)"], "trap": "sens-parite", "why": "PNCTI dérivée de l'égalité des rendements espérés. Attention au signe : i↑ à eᵃ donné ⇒ e↑ (appréciation immédiate, la monnaie doit ensuite se déprécier vers eᵃ).", "id": "parite-026"}, {"cat": "pen", "mat": "emi", "ch": 1, "diff": 3, "ctx": "Comment un pays créancier peut voir sa PEN se détériorer sans déficit courant", "title": "Ordonner les mécanismes qui font varier la PEN indépendamment du solde courant", "steps": ["Cas de départ : PEN = A − L, actif A libellé en devise étrangère (dollars)", "Solde courant BC_t = 0 sur la période (pas de flux net)", "Appréciation surprise de la monnaie nationale (E monte, plus de $ pour un €)", "Effet de valorisation : la valeur en euros de l'actif $ diminue (E_{t-1}/E_t < 1)", "PEN diminue malgré BC nul : c'est l'effet de valorisation à taux de change"], "trap": "stock-flux", "why": "La PEN est un stock qui varie via (1) le solde courant, (2) les intérêts, (3) les effets de valorisation (change et prix d'actifs). Un pays peut voir sa PEN se dégrader sans déficit courant, uniquement par appréciation nominale. Cf. Lane-Milesi-Ferretti pour la mesure empirique.", "id": "pen-022"}, {"cat": "tcr", "mat": "emi", "ch": 2, "diff": 2, "ctx": "Construction pas à pas d'un taux de change effectif réel (TCER)", "title": "Ordonner les étapes de construction du TCER", "steps": ["Choisir les J partenaires commerciaux pertinents (poids ωᵢ, Σωᵢ = 1)", "Calculer les J taux de change bilatéraux nominaux Eᵢ (au certain pour i)", "Agréger : TCEN = moyenne géométrique pondérée (niveau) ou arithmétique pondérée (log)", "Corriger par les prix relatifs : TCER = TCEN × P/P* (P domestique au numérateur)", "Interpréter : ↑TCER = appréciation réelle (biens domestiques deviennent chers)"], "trap": "niveau-log", "why": "Ne pas oublier le ratio P/P* (dans le bon sens : P au numérateur) et la pondération par les parts commerciales. En variation : Δq ≈ Δe + (π − π*). Le TCER mesure la compétitivité-prix multilatérale.", "id": "tcr-024"}, {"cat": "residu", "mat": "croissance", "ch": 1, "diff": 2, "ctx": "Comptabilité de la croissance (Solow 1957)", "title": "Ordonner les étapes du calcul du résidu de Solow", "steps": ["Mesurer g_Y (taux de croissance du PIB) dans la comptabilité nationale", "Mesurer g_K (croissance du stock de capital) et g_L (croissance de l'emploi)", "Choisir α (part du capital) et 1−α (part du travail) selon les parts factorielles observées", "Calculer la contribution imputée : α·g_K + (1−α)·g_L", "Déduire g_A = g_Y − α·g_K − (1−α)·g_L : c'est le résidu (PTF)"], "why": "Le résidu se déduit par soustraction — d'où son nom. Il absorbe le progrès technique ET tout ce qui n'a pas été mesuré. Partie_1_Solow.txt lignes 919-948.", "id": "residu-005"}, {"cat": "solow", "mat": "croissance", "ch": 2, "diff": 2, "ctx": "Convergence vers l'état régulier k* dans le modèle de Solow", "title": "Ordonner les phases de la dynamique d'accumulation", "steps": ["Économie initialement en dessous de k* (k_0 < k*)", "Investissement s·f(k) supérieur à la dilution (δ+n)·k", "Δk > 0 : le capital par tête augmente", "La productivité marginale du capital décroît à mesure que k monte", "Convergence vers l'état régulier stable k*"], "why": "Convergence monotone garantie par les conditions d'Inada. En dessous de k*, l'investissement > usure ; le mouvement ralentit à mesure qu'on approche du point fixe.", "id": "solow-010"}, {"cat": "kaldor", "mat": "croissance", "ch": 1, "diff": 2, "ctx": "Faits stylisés de la croissance moderne (Kaldor)", "title": "Ordonner chronologiquement les périodes historiques du taux de croissance planétaire", "steps": ["An 0 à 1000 : croissance quasi-nulle du revenu par tête", "1000 à 1820 : g_y ≈ 0,05 %/an (ère malthusienne)", "1820 à 1913 : g_y ≈ 0,5-1,3 %/an (post-malthusien)", "1950 à 1973 : g_y > 2 %/an (Trente Glorieuses)", "Après 1980 : ralentissement dans les pays avancés"], "why": "Périodisation Maddison / Rubin : décollage industriel puis expansion soutenue, puis ralentissement récent.", "id": "kaldor-006"}, {"cat": "mrw", "mat": "croissance", "ch": 2, "diff": 2, "ctx": "Modèle de Solow augmenté par le capital humain (MRW 1992)", "title": "Ordonner les étapes de la construction du modèle MRW", "steps": ["Constat empirique : Solow standard sous-explique la variance inter-pays du PIB", "Introduction du capital humain H dans la fonction : Y = K^α · H^β · (A·L)^(1−α−β)", "Approximation empirique de H par la scolarisation secondaire (proxy)", "Estimation économétrique : α ≈ 1/3, β ≈ 1/3, 1−α−β ≈ 1/3", "Meilleure explication empirique de la variance inter-pays"], "why": "MRW réconcilie mieux Solow avec les données via H. Chaque facteur ≈ 1/3 du revenu. Partie_1_Solow.txt lignes 1004-1065.", "id": "mrw-006"}, {"cat": "ak", "mat": "croissance", "ch": 3, "diff": 3, "ctx": "Modèle AK avec externalité de connaissance à la Frankel (1962)", "title": "Ordonner les étapes de l'agrégation de Frankel", "steps": ["Chaque firme i produit : y_i = f(k_i, K̄) avec K̄ stock agrégé donné", "Rendements décroissants privés en k_i (concurrence parfaite au niveau firme)", "Externalité positive : K̄ améliore la productivité de chaque firme", "Sommation : Y = A · K̄ (fonction agrégée linéaire en K̄)", "À l'équilibre : g_LT dépend de s (croissance endogène)"], "why": "Astuce Frankel : concurrence parfaite privée + externalité = agrégat AK. Fondation micro pour la croissance endogène. Partie_2_C2C3_Paul_Romer.txt lignes 242-296.", "id": "ak-006"}, {"cat": "romer", "mat": "croissance", "ch": 3, "diff": 2, "ctx": "Modèle de Romer (1990) avec R&D et brevets", "title": "Ordonner les étapes du mécanisme d'innovation chez Romer", "steps": ["Le secteur R&D produit de nouvelles idées, financé par les profits futurs", "Chaque idée devient un brevet excluable (rente d'innovation temporaire)", "Le secteur intermédiaire produit avec ces brevets et perçoit une rente", "La production finale utilise les biens intermédiaires (variété croissante)", "Croissance de long terme endogène, fonction de la part de chercheurs"], "why": "Romer 1990 : R&D → brevets → rente → incitation privée à investir en R&D. Croissance de long terme endogène (avant critique Jones).", "id": "romer-006"}, {"cat": "aghion", "mat": "croissance", "ch": 4, "diff": 3, "ctx": "Modèle semi-endogène de Jones (1995) — dérivation du taux de croissance de long terme", "title": "Ordonner les étapes du raisonnement de Jones", "steps": ["Fonction de production d'idées révisée : Ȧ = δ · L_A^λ · A^φ avec 0 < λ < 1 et φ < 1", "Sur le sentier régulier, g_A doit être constant", "Transformation logarithmique et dérivation par rapport au temps", "Le taux de croissance de A dépend du taux de croissance de la population n", "Politique de R&D : effet sur le NIVEAU d'idées, pas sur g_A à long terme"], "why": "Résultat central Jones : g_LT dépend de n, pas de s_R. C'est ce qui rend la croissance « semi » endogène. Partie_2_Chap4_Jones_Aghion.txt lignes 40-70.", "id": "aghion-006"}, {"cat": "malthus", "mat": "croissance", "ch": 4, "diff": 2, "ctx": "Piège malthusien : réponse démographique à un choc positif de productivité", "title": "Ordonner les étapes du piège malthusien", "steps": ["Choc positif : progrès technique améliore la productivité agricole", "Le revenu par tête y augmente transitoirement au-dessus de la subsistance", "La fertilité augmente (plus de nourriture disponible)", "La population L augmente en conséquence", "Avec la terre fixe, y retombe à son niveau de subsistance (rendements décroissants)"], "why": "Le piège malthusien : tout gain de productivité est absorbé par la démographie. Résultat empiriquement observé jusqu'à ~1800. Partie_3_Chap1_Pop.txt lignes 75+.", "id": "malthus-007"}, {"cat": "olg", "mat": "croissance", "ch": 3, "diff": 3, "ctx": "Modèle OLG de Diamond — dérivation du choix d'épargne d'un agent jeune", "title": "Ordonner les étapes du programme du jeune", "steps": ["Contrainte budgétaire période 1 : c1 + s = w (salaire perçu)", "Contrainte budgétaire période 2 : c2 = s · (1+r)", "Substitution : contrainte intertemporelle c1 + c2/(1+r) = w", "Maximisation de U(c1, c2) sous cette contrainte (Lagrangien)", "Équation d'Euler : U'(c1) = (1+r) · β · U'(c2), qui fixe s optimal"], "why": "Démarche standard : contrainte intertemporelle + condition d'Euler. Résultat : s dépend de w, r, β, σ. Partie_2_Chap1_Epargne_endogène.txt lignes 40-60.", "id": "olg-006"}, {"cat": "harrod", "mat": "croissance", "ch": 1, "diff": 2, "ctx": "Mécanisme d'instabilité de Harrod-Domar (fil du rasoir)", "title": "Ordonner les étapes de l'instabilité chez Harrod-Domar", "steps": ["Économie initialement sur son sentier équilibré (g = n = g_garanti)", "Choc positif : les entrepreneurs surinvestissent au-delà de g_garanti", "La capacité de production dépasse la demande effective", "Les entrepreneurs constatent le surinvestissement et réduisent l'investissement", "Spirale récessive : sous-investissement futur, chômage cumulatif"], "why": "Fil du rasoir : tout écart au sentier équilibré est amplifié, pas corrigé. C'est l'absence de mécanisme de substitution K/L qui produit cette instabilité chez Harrod-Domar.", "id": "harrod-006"}, {"cat": "convergence", "mat": "croissance", "ch": 2, "diff": 2, "ctx": "Analyse de la convergence conditionnelle chez MRW (1992)", "title": "Ordonner les étapes de l'analyse de la convergence conditionnelle", "steps": ["Chaque pays a un sentier régulier propre (k*_i) fonction de ses paramètres (s, n, H)", "Ce qui est comparable c'est l'écart y_i à son propre y*_i", "Test empirique : régresser g_i (croissance moyenne) sur y_i initial et déterminants", "Coefficient sur y_i initial négatif et significatif : convergence conditionnelle", "Interprétation : les pays « en retard sur leur propre potentiel » croissent plus vite"], "why": "MRW : la convergence est CONDITIONNELLE aux paramètres structurels. Explique l'absence de convergence absolue mondiale — les pays ne convergent pas tous vers le même y*. Partie_1_Solow.txt lignes 1180-1200.", "id": "convergence-006"}, {"cat": "institutions", "mat": "croissance", "ch": 5, "diff": 3, "ctx": "Argument d'Acemoglu-Robinson sur le rôle causal des institutions", "title": "Ordonner les étapes de la causalité institutionnelle chez Acemoglu", "steps": ["Point de départ : deux pays comparables en facteurs (K, L, H) mais institutions différentes", "Institutions inclusives : droits de propriété, incitations à investir, contestabilité politique", "Institutions extractives : rentes, insécurité juridique, capture des ressources par une élite", "Les incitations à innover, épargner et investir divergent structurellement", "L'écart de PIB par tête se creuse durablement sur plusieurs décennies"], "why": "Thèse Acemoglu-Robinson : les institutions sont causes fondamentales via le canal des incitations. Nord/Sud Corée = exemple canonique. Partie_3_Chap2_Institutions.txt.", "id": "institutions-006"}], "OUVERTE": [{"cat": "bdp", "ch": 1, "diff": 2, "q": "Rappeler l'identité comptable de la balance des paiements et préciser le sens conventionnel du compte financier.", "model": "TC + CC − CF + EO = 0. Convention du cours : CF > 0 = sortie nette de capitaux (excédent courant, capacité de financement).", "points": ["identité complète", "présence du signe − devant CF", "convention du signe (sortie/entrée)", "notion de capacité / besoin de financement"], "notations": ["TC transferts", "CC compte courant", "CF compte financier", "EO erreurs et omissions"], "why": "Identité au cœur du chapitre 1 : le signe − vient de la convention (CF > 0 = sortie).", "id": "bdp-014", "mat": "emi"}, {"cat": "bdp", "ch": 1, "diff": 3, "q": "Un pays enregistre CC = −40 Md€, TC = 0, EO = 0. Calculer CF et interpréter en termes de flux de capitaux.", "model": "TC + CC − CF + EO = 0 ⇒ 0 − 40 − CF + 0 = 0 ⇒ CF = −40 Md€. CF < 0 = entrée nette de capitaux : le pays est financé par le reste du monde.", "points": ["application de l'identité", "calcul CF = −40", "convention du signe", "interprétation flux entrant"], "notations": ["CF (Md€)", "signe négatif = entrée"], "why": "Le déficit courant appelle mécaniquement un financement extérieur — c'est l'autre facette de la comptabilité.", "id": "bdp-015", "mat": "emi"}, {"cat": "pen", "ch": 1, "diff": 2, "q": "Distinguer position extérieure nette et solde courant. Écrire l'équation d'accumulation hors valorisation.", "model": "PEN = stock d'actifs nets (avoirs − engagements). Solde courant = flux annuel. Hors effets de valorisation : ΔPEN = CC.", "points": ["PEN est un stock", "CC est un flux", "équation d'accumulation ΔPEN = CC", "mention hors valorisation"], "notations": ["PEN(t)", "CC de t à t+1"], "why": "Piège classique : confondre le stock (PEN) et le flux (CC).", "id": "pen-013", "mat": "emi"}, {"cat": "pen", "ch": 1, "diff": 3, "q": "Expliquer comment une appréciation de la monnaie nationale peut faire baisser la PEN sans qu'aucun flux courant ne soit intervenu.", "model": "Les avoirs libellés en devises étrangères valent moins une fois convertis en monnaie nationale appréciée. C'est un effet de valorisation : le stock PEN change sans flux de capitaux ni de biens.", "points": ["effet de valorisation", "actifs en devises perdent de la valeur", "aucun flux courant/financier", "stock modifié"], "notations": ["valorisation", "PEN en monnaie nationale"], "why": "Illustre la nature de stock de la PEN et l'importance des effets de valorisation.", "id": "pen-014", "mat": "emi"}, {"cat": "si", "ch": 1, "diff": 2, "q": "Établir l'identité (S − I) + (T − G) = X − M en économie ouverte et commenter son sens.", "model": "Y = C + I + G + X − M et Y = C + T + S ⇒ S + T = I + G + X − M ⇒ (S − I) + (T − G) = X − M. L'excédent courant correspond à un excès d'épargne domestique.", "points": ["PIB par la dépense", "PIB par le revenu", "manipulation aboutissant à l'identité", "interprétation économique"], "notations": ["S épargne privée", "I investissement", "T impôts", "G dépenses publiques"], "why": "Fondement du cours : le solde courant est structurellement lié à l'équilibre épargne-investissement.", "id": "si-012", "mat": "emi"}, {"cat": "si", "ch": 1, "diff": 3, "q": "Énoncer et expliquer le paradoxe de Feldstein-Horioka (1980).", "model": "L'épargne et l'investissement nationaux restent fortement corrélés à l'échelle des pays, contredisant l'hypothèse d'une mobilité parfaite des capitaux. Interprétation : biais de proximité, contrainte prudentielle, préférence nationale.", "points": ["année 1980", "corrélation S/I nationale", "contradiction avec mobilité parfaite", "interprétations possibles"], "notations": ["S", "I", "coefficient de corrélation"], "why": "Un des trois grands paradoxes du chapitre 1 (avec Lucas et zone euro).", "id": "si-013", "mat": "emi"}, {"cat": "forex", "ch": 2, "diff": 2, "q": "Décrire les instruments principaux du marché des changes (spot, terme, swap, option) et leur usage.", "model": "Spot : livraison immédiate. Terme : prix fixé à la signature, livraison future. Swap : achat spot + vente à terme, gestion trésorerie sans exposition nette. Option : droit (pas obligation) d'acheter (call) ou vendre (put) à un prix d'exercice.", "points": ["spot (immédiat)", "terme (forward)", "swap (deux jambes)", "option (droit, pas obligation)"], "notations": ["S taux comptant", "F taux à terme", "K prix d'exercice"], "why": "Panorama des instruments de couverture et de spéculation du chapitre 2.", "id": "forex-014", "mat": "emi"}, {"cat": "forex", "ch": 2, "diff": 2, "q": "Un exportateur français reçoit 100 000 USD dans 3 mois. Comment se couvre-t-il et pourquoi ?", "model": "Il vend les 100 000 USD à terme (forward sell) à 3 mois. Il fixe à la signature le taux de conversion en euros, éliminant le risque de baisse du dollar.", "points": ["vente à terme", "3 mois", "élimination du risque de baisse USD", "prix en EUR certain"], "notations": ["F(3 mois) EUR/USD"], "why": "Cas d'école de couverture : à sens opposé pour un exportateur (vend à terme) vs importateur (achète à terme).", "id": "forex-015", "mat": "emi"}, {"cat": "cot", "ch": 2, "diff": 2, "q": "Distinguer cotation au certain et à l'incertain. Donner un exemple pour l'euro.", "model": "Au certain : 1 unité de monnaie nationale = X devises étrangères (ex. 1 € = 1,10 $). À l'incertain : X unités de monnaie nationale = 1 devise étrangère (ex. 1 $ = 0,91 €). Réciprocité : S_I = 1/S_C.", "points": ["définition au certain", "définition à l'incertain", "exemple chiffré", "réciprocité S_I = 1/S_C"], "notations": ["S_C au certain", "S_I à l'incertain"], "why": "La confusion certain/incertain reste le premier piège du chapitre 2.", "id": "cot-014", "mat": "emi"}, {"cat": "cot", "ch": 2, "diff": 3, "q": "Décrire l'arbitrage triangulaire et donner la formule liant trois taux au certain.", "model": "Si 1 A = X B et 1 B = Y C alors, par arbitrage sans risque, 1 A = X × Y C. Écarts par rapport à cette parité déclencheraient un profit sans risque, éliminé par la loi du prix unique.", "points": ["trois devises A, B, C", "formule multiplicative", "arbitrage sans risque", "convergence du taux croisé"], "notations": ["S(A/B)", "S(B/C)", "S(A/C) = S(A/B) × S(B/C)"], "why": "L'arbitrage triangulaire est le mécanisme qui garantit la cohérence des taux entre trois devises.", "id": "cot-015", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 2, "q": "Définir le taux de change effectif nominal (TCEN) et écrire sa formule (en niveau et en log).", "model": "TCEN = moyenne pondérée des taux bilatéraux, poids = parts des partenaires dans le commerce extérieur. En niveau : moyenne géométrique (Π (Sᵢ)^ωᵢ). En log : moyenne arithmétique (e_eff = Σ ωᵢ eᵢ, Σ ωᵢ = 1).", "points": ["moyenne pondérée", "poids = parts commerciales", "niveau = géométrique", "log = arithmétique"], "notations": ["e_eff en log", "ωᵢ", "Σ ωᵢ = 1"], "why": "Piège type examen : en niveau on multiplie (géométrique), en log on additionne (arithmétique).", "id": "tcr-013", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 2, "q": "Définir le taux de change réel et écrire la formule de variation log-linéarisée.", "model": "TCER = TCEN × P/P* (au certain). En variation log : Δq ≈ Δe + (π − π*). Interprétation : Δq > 0 = appréciation réelle = perte de compétitivité-prix, gain de pouvoir d'achat.", "points": ["formule niveau", "formule variation log", "interprétation compétitivité", "interprétation pouvoir d'achat"], "notations": ["q log du TCER", "π inflation domestique", "π* inflation étrangère"], "why": "Formule centrale du chapitre 2, à connaître par cœur en niveau ET en log.", "id": "tcr-014", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 3, "q": "Une hausse du TCEN de 3 % combinée à une inflation domestique de 4 % et étrangère de 1 %. Calculer la variation approximative du TCR et interpréter.", "model": "Δq ≈ Δe + (π − π*) = 3 + (4 − 1) = +6 %. Appréciation réelle de 6 % : forte perte de compétitivité-prix, gain de pouvoir d'achat pour les résidents.", "points": ["application formule log", "calcul +6 %", "interprétation appréciation réelle", "impact compétitivité"], "notations": ["Δq", "Δe", "π, π*"], "why": "Application chiffrée classique : détecter que Δe et (π−π*) se cumulent.", "id": "tcr-015", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 3, "q": "Exposer le dilemme (paradoxe) de Triffin et son verdict historique.", "model": "Pour fournir la liquidité mondiale en dollars, les États-Unis doivent accepter un déficit courant permanent, mais celui-ci mine la crédibilité de la convertibilité or à 35 $. Verdict : 1971, Nixon suspend la convertibilité.", "points": ["double contrainte (liquidité vs crédibilité)", "Bretton Woods", "1971 abandon convertibilité", "signification pour toute monnaie internationale"], "notations": ["convertibilité or", "35 $ l'once"], "why": "Un des concepts marquants du chapitre 2 : la fragilité intrinsèque d'un régime de change fixe adossé à une devise clef.", "id": "smi-014", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 2, "q": "Présenter la typologie des régimes de change du fixe au flottant.", "model": "Currency board / ancrage strict / ancrage glissant / ancrage sur panier / flottement géré / flottement pur. Chaque cran augmente la flexibilité et la marge de manœuvre monétaire, au prix d'une volatilité accrue.", "points": ["au moins 4 catégories", "gradation flexibilité", "arbitrage volatilité / autonomie", "exemples de pays si possible"], "notations": ["régimes fixes vs flottants"], "why": "Typologie à connaître pour situer chaque pays sur le spectre.", "id": "smi-015", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 2, "q": "Écrire la relation PCTI et expliquer en quoi elle est une relation d'arbitrage sans risque.", "model": "En logs : f − e = i* − i. Le report/déport à terme égale le différentiel d'intérêt. Elle tient sans hypothèse sur les anticipations car l'investisseur se couvre via le marché à terme.", "points": ["formule f − e = i* − i", "notion de couverture", "sans risque", "indépendance des anticipations"], "notations": ["f log du taux à terme", "e log du taux au comptant", "i, i*"], "why": "La PCTI est un pilier vérifié empiriquement — contrairement à la PNCTI.", "id": "parite-015", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "q": "Écrire la PNCTI, expliquer son sens et donner l'effet immédiat d'une hausse surprise du taux d'intérêt domestique.", "model": "En logs : i = i* − (eᵃ − e), soit e = eᵃ + (i − i*). Hausse surprise de i (i* et eᵃ inchangés) ⇒ e ↑ : appréciation immédiate. L'anticipation de dépréciation future compense le nouveau différentiel.", "points": ["formule PNCTI", "manipulation e = eᵃ + (i − i*)", "appréciation immédiate", "compensation ex post"], "notations": ["e log au certain", "eᵃ anticipation"], "why": "Piège récurrent du prof : le SENS de la variation immédiate de e après un choc sur i.", "id": "parite-016", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "q": "Commenter l'énoncé : « Les taux d'intérêt élevés attirent les capitaux et apprécient durablement la monnaie. »", "model": "Vrai à court terme : hausse surprise de i ⇒ appréciation immédiate (PNCTI). Faux à long terme : l'appréciation surréagit puis se corrige (Dornbusch, PPA). Empiriquement, le forward premium puzzle observe que des i élevés sont même associés à des appréciations moyennes ex post, contredisant la PNCTI naïve.", "points": ["vrai court terme", "surajustement puis correction", "forward premium puzzle", "nuance long terme"], "notations": ["PNCTI", "surajustement", "Dornbusch"], "why": "Question de commentaire type : mesurer les limites empiriques de la PNCTI.", "id": "parite-017", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 2, "q": "Présenter le modèle monétaire à prix flexibles (Frenkel).", "model": "Hypothèses : prix flexibles, PPA continue, équation quantitative Ms/P = L(Y, i). Conclusion : e ∝ Ms/Ms* (au certain) à Y, Y* donnés. Une hausse permanente de Ms x % ⇒ P x %, e ↓ x % (dépréciation nominale, neutralité monétaire).", "points": ["hypothèses (prix flex, PPA)", "équation quantitative", "formule e ∝ Ms/Ms*", "neutralité monétaire"], "notations": ["Ms domestique", "Ms* étranger", "L(Y, i)"], "why": "Modèle référence court chapitre 3, base pour Dornbusch (prix rigides à court terme).", "id": "monet-016", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 3, "q": "Décrire le mécanisme de surajustement de Dornbusch après une hausse permanente de l'offre de monnaie.", "model": "Prix rigides à court terme, PPA à long terme, PNCTI en continu. Ms ↑ ⇒ i ↓ ⇒ pour respecter la PNCTI avec i ↓, il faut e_future > e_court : la monnaie se déprécie plus qu'à long terme (surtire), puis se redresse au fil de l'ajustement des prix.", "points": ["prix rigides court terme", "PPA long terme", "PNCTI en continu", "surajustement", "convergence progressive"], "notations": ["e court", "e long", "i, i*"], "why": "Le surajustement explique la volatilité des taux de change nominaux à court terme.", "id": "monet-017", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 3, "q": "Rappeler le résultat de Meese et Rogoff (1983) et son enseignement pour l'économie du change.", "model": "Aucun modèle structurel de change (monétaire, portefeuille, PPA) ne bat significativement une marche aléatoire à horizon court (12 mois). Enseignement : la « déconnexion » du change vis-à-vis des fondamentaux à court terme, motive les modèles à information incomplète et à hétérogénéité des agents.", "points": ["année 1983", "modèles structurels vs marche aléatoire", "horizon 12 mois", "notion de déconnexion"], "notations": ["ARMA", "marche aléatoire"], "why": "Résultat empirique fondateur qui structure l'ensemble de la littérature moderne sur le change.", "id": "monet-018", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 2, "q": "Énoncer la condition Marshall-Lerner et l'illustrer par la courbe en J.", "model": "Condition : εX + εM > 1 (somme des élasticités-prix > 1). Court terme : volumes rigides, effet valeur domine, solde ↓. Moyen/long terme : volumes s'ajustent, si ML tient, solde ↑ : trajet en J.", "points": ["εX + εM > 1", "distinction effet valeur / volume", "trajectoire J", "phase courte et longue"], "notations": ["εX", "εM"], "why": "Un des points d'examen les plus attendus du chapitre 4.", "id": "depr-016", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 3, "q": "Définir le pricing to market et expliquer son effet sur le pass-through.", "model": "PTM : les exportateurs ajustent leurs marges plutôt que leurs prix affichés pour préserver leurs parts de marché. Conséquence : le pass-through du change vers les prix à l'importation est incomplet, ce qui atténue l'effet valeur d'une dépréciation et allonge la phase descendante de la courbe en J.", "points": ["définition PTM", "ajustement des marges", "pass-through incomplet", "conséquence sur la courbe en J"], "notations": ["pass-through", "marge exportateur"], "why": "Explique pourquoi les prix relatifs bougent moins que les taux nominaux.", "id": "depr-017", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 3, "q": "Le modèle de portefeuille : quel ajout fait-il par rapport à la PNCTI classique ?", "model": "Introduit le RISQUE : les investisseurs exigent une prime pour détenir la dette d'un pays selon sa PEN. Formule augmentée : i = i* − (eᵃ − e) + ρ, où ρ est la prime de risque. Un pays très endetté (PEN très négative) doit offrir un rendement supérieur ⇒ dépréciation immédiate compensatoire.", "points": ["introduction du risque", "prime ρ", "PNCTI augmentée", "lien PEN négative ⇒ ρ ↑"], "notations": ["ρ prime de risque", "PEN"], "why": "Extension naturelle de la PNCTI aux pays à PEN dégradée.", "id": "depr-018", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 2, "q": "Écrire la PPA absolue et la PPA relative, préciser leur horizon de validité.", "model": "PPA absolue : E = P/P* (au certain), même pouvoir d'achat partout. PPA relative : Δe ≈ π* − π (log-linéarisée). Horizon : très long terme, la PPA absolue rarement vérifiée à cause des non-échangeables ; PPA relative approximativement vérifiée à horizon décennal.", "points": ["formule PPA absolue", "formule PPA relative", "notion de long terme", "limites empiriques"], "notations": ["E niveau", "π, π*"], "why": "Deux versions à ne pas confondre : niveau vs variation, absolue vs relative.", "id": "equil-014", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 3, "q": "Détailler toutes les étapes de l'effet Balassa-Samuelson.", "model": "1) Gains de productivité dans le secteur échangeable. 2) Hausse des salaires dans l'échangeable. 3) Contagion salariale au secteur abrité (marché du travail unique). 4) Hausse des prix des non-échangeables. 5) Hausse du niveau général des prix ⇒ appréciation réelle. Explique pourquoi les pays émergents en rattrapage voient leur TCR s'apprécier.", "points": ["gain productivité échangeable", "hausse salaires échangeable", "contagion vers abrité", "hausse prix non-échangeables", "appréciation réelle"], "notations": ["secteurs échangeable / abrité"], "why": "Le prof exige TOUTES les étapes : sauter la contagion salariale est la faute canonique.", "id": "equil-015", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 3, "q": "Définir le TCEF (FEER) et expliquer son usage.", "model": "Fundamental Equilibrium Exchange Rate : taux de change compatible simultanément avec un solde courant soutenable (équilibre externe) et le plein emploi non-inflationniste (équilibre interne) à moyen terme. Sert de référence pour évaluer si une monnaie est sous- ou sur-évaluée.", "points": ["définition FEER", "équilibre externe", "équilibre interne", "moyen terme", "usage : sous/sur-évaluation"], "notations": ["FEER", "TCEF"], "why": "Concept normatif utilisé par les organisations internationales pour juger de la valeur d'équilibre d'un change.", "id": "equil-016", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 2, "q": "Énoncer le triangle d'incompatibilité de Mundell.", "model": "On ne peut pas avoir simultanément les trois : parité fixe, mobilité parfaite des capitaux, politique monétaire autonome. Un pays doit renoncer à au moins un des trois sommets.", "points": ["trois sommets nommés", "impossibilité simultanée", "choix d'un sommet à sacrifier", "exemples de pays"], "notations": ["triangle d'incompatibilité"], "why": "Théorème d'impossibilité qui fonde toute l'analyse des régimes de change.", "id": "mf-017", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "q": "En Mundell-Fleming, comparer l'efficacité des politiques budgétaire et monétaire en changes fixes et flexibles (mobilité parfaite).", "model": "Fixe + mobilité parfaite : budgétaire EFFICACE (BC accommode l'entrée de capitaux), monétaire INEFFICACE (sortie de capitaux compense Ms). Flexible + mobilité parfaite : budgétaire INEFFICACE (éviction totale par l'appréciation), monétaire EFFICACE (dépréciation soutient X − M).", "points": ["matrice 2×2 régime × politique", "fixe : budgétaire OK, monétaire KO", "flexible : monétaire OK, budgétaire KO", "mécanisme via i et K"], "notations": ["G, Ms, IS, LM, i, e"], "why": "Résultat central de MF : le régime de change détermine l'efficacité des politiques.", "id": "mf-018", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "q": "Qu'est-ce qu'une intervention stérilisée et pourquoi n'affecte-t-elle pas la courbe LM ?", "model": "Intervention sur le marché des changes (achat/vente de devises) compensée par une opération d'open market inverse sur la monnaie nationale, laissant Ms inchangé. Comme Ms ne bouge pas, la courbe LM ne se déplace pas — la politique monétaire de fait ne change pas.", "points": ["définition intervention", "opération d'open market compensatoire", "Ms inchangé", "LM inchangée"], "notations": ["Ms", "open market"], "why": "Concept clef pour comprendre l'autonomie apparente en régime fixe (via stérilisation partielle).", "id": "mf-019", "mat": "emi"}, {"cat": "bdp", "mat": "emi", "ch": 1, "diff": 2, "q": "Énoncer l'identité comptable de la balance des paiements (convention du cours) et définir la capacité de financement d'une économie.", "model": "Identité comptable : TC + CC − CF + EO = 0, où TC = compte de capital, CC = compte courant, CF = compte financier (convention : CF > 0 = sortie nette de capitaux), EO = erreurs et omissions. Capacité (ou besoin) de financement de l'économie = TC + CC. Si TC + CC > 0 : capacité (l'économie prête au reste du monde) ; si TC + CC < 0 : besoin (l'économie emprunte).", "points": ["identité TC + CC − CF + EO = 0", "signe du CF (convention du cours)", "capacité = TC + CC", "sens de la capacité vs besoin", "EO nécessaires pour équilibrer"], "notations": ["TC compte de capital", "CC compte courant", "CF compte financier", "EO erreurs et omissions"], "id": "bdp-024", "why": "Identité TC + CC − CF + EO = 0 et convention CF>0 (sortie) : au cœur du chapitre 1."}, {"cat": "cot", "mat": "emi", "ch": 2, "diff": 1, "q": "Définir la cotation au certain et à l'incertain. Écrire la relation entre les deux et donner un exemple pour la paire euro-dollar.", "model": "Cotation au certain pour un pays : nombre d'unités de monnaie étrangère pour 1 unité de monnaie nationale (ex. pour la zone euro : 1 EUR = 1,10 USD). Cotation à l'incertain : nombre d'unités de monnaie nationale pour 1 unité de monnaie étrangère (ex. pour la zone euro : 1 USD = 0,91 EUR). Relation : S_incertain = 1/S_certain. En France, l'euro est traditionnellement coté au certain (habitude du prof).", "points": ["certain = étrangère pour 1 nationale", "incertain = nationale pour 1 étrangère", "S_incertain = 1/S_certain", "exemple numérique cohérent", "convention du cours (euro au certain)"], "notations": ["S ou E (taux nominal)", "certain ou incertain"], "id": "cot-021", "why": "Convention du prof : euro coté au certain en France. Relation d'inversion S_i = 1/S_c à connaître par cœur."}, {"cat": "pen", "mat": "emi", "ch": 1, "diff": 3, "q": "Écrire l'équation d'accumulation de la position extérieure nette (PEN) dans le cas où l'actif est libellé en monnaie étrangère et le passif en monnaie nationale.", "model": "PEN_t = A_{t-1}(1+i_A)·(E_{t-1}/E_t) − L_{t-1}(1+i_L) + BC_t, où A = actif brut (libellé en monnaie étrangère, ici en dollars), L = passif brut (libellé en monnaie nationale), i_A et i_L leurs taux d'intérêt respectifs, E = taux au certain (nombre de dollars par euro), BC = solde courant de la période. Le terme E_{t-1}/E_t traduit l'effet de valorisation : une dépréciation de la monnaie nationale (E baisse) augmente la valeur en euros de l'actif en dollars.", "points": ["PEN = A − L (définition)", "capitalisation par (1+i_A) et (1+i_L)", "effet de valorisation E_{t-1}/E_t sur l'actif $", "addition du solde courant BC_t", "distinction stock (PEN) vs flux (BC)"], "notations": ["A actif brut", "L passif brut", "i_A, i_L taux d'intérêt", "E taux au certain", "BC solde courant"], "id": "pen-021", "why": "Effet de valorisation E_{t-1}/E_t : ce qui différencie la PEN d'un simple solde courant cumulé."}, {"cat": "si", "mat": "emi", "ch": 1, "diff": 2, "q": "Énoncer le paradoxe de Feldstein-Horioka (1980) et donner deux explications possibles à ce paradoxe.", "model": "Feldstein-Horioka (1980) : en mobilité parfaite, S et I nationaux devraient être décorrélés. Empiriquement (OCDE), la corrélation est forte (~0,9) → la mobilité parfaite est rejetée. Explications : biais méthodologique, contraintes d'endettement, biais national (préférence pour actifs domestiques).", "points": ["hypothèse : mobilité parfaite ⇒ décorrélation attendue", "résultat empirique : forte corrélation observée", "conclusion : rejet de la mobilité parfaite", "au moins deux explications parmi méthodo, contraintes, biais national", "référence : Feldstein-Horioka (1980)"], "notations": ["S épargne nationale", "I investissement national", "S/Y, I/Y en ratios au PIB"], "id": "si-020", "why": "Paradoxe fondateur de l'école Feldstein-Horioka : la mobilité de facto est inférieure à celle de jure."}, {"cat": "forex", "mat": "emi", "ch": 2, "diff": 2, "q": "Distinguer une opération de change au comptant (spot) d'une opération à terme (forward) et expliquer l'intérêt de la couverture à terme pour un exportateur.", "model": "Spot : livraison sous 2 jours ouvrés au taux du jour. Forward : contrat conclu à la signature pour une livraison future (1 mois, 3 mois...) à un cours convenu à l'avance (cours à terme f). Intérêt pour un exportateur facturant en devise étrangère : la vente à terme des devises futures fige la contre-valeur en monnaie nationale, éliminant le risque de change. Coût = renoncer à un éventuel gain si la devise s'apprécie.", "points": ["distinction spot vs forward (délai + cours convenu)", "risque exposition exportateur = dépréciation de la devise reçue", "couverture par vente à terme des devises futures", "élimination du risque = certitude sur contre-valeur", "coût = renoncer au gain potentiel"], "notations": ["S ou spot", "f cours à terme (forward)", "3M, 1M horizons standards"], "why": "Distinction spot / forward et logique de la couverture — au cœur du chapitre 2 sur le marché des changes.", "id": "forex-021"}, {"cat": "smi", "mat": "emi", "ch": 2, "diff": 2, "q": "Expliquer le paradoxe (ou dilemme) de Triffin (1960). Pourquoi a-t-il conduit à la fin de Bretton Woods en 1971 ?", "model": "Triffin (1960) : contradiction structurelle de Bretton Woods. Pour fournir la liquidité mondiale, les USA doivent avoir un déficit chronique (dollars exportés). Mais ce déficit érode la crédibilité de la convertibilité $ → or (35 $/once) : plus de dollars étrangers vs stock d'or fixe. Issue : Nixon suspend la convertibilité en août 1971.", "points": ["contradiction liquidité vs crédibilité", "déficit US = fournir liquidité", "déficit US = éroder la couverture-or", "convertibilité or à 35 $/once devient intenable", "issue : suspension en 1971 (Nixon)"], "notations": ["$ dollar", "or (oz = once)", "1944 Bretton Woods, 1971 fin"], "why": "Triffin explique STRUCTURELLEMENT la fin de Bretton Woods — pas juste un accident d'inflation. Fondamental pour comprendre le SMI actuel.", "id": "smi-023"}, {"cat": "residu", "mat": "croissance", "ch": 1, "diff": 2, "q": "Écrire la décomposition comptable de la croissance de Solow (1957) et expliquer ce qu'est le résidu.", "model": "g_Y = α · g_K + (1−α) · g_L + g_A, où α est la part du capital dans le revenu. Le résidu g_A = g_Y − α·g_K − (1−α)·g_L est la partie de la croissance non imputable aux facteurs mesurés — appelé « productivité totale des facteurs » (PTF). Il absorbe le progrès technique ET tout ce qui n'est pas mesuré (organisation, réallocation).", "points": ["équation g_Y = α·g_K + (1−α)·g_L + g_A", "α = part du capital", "g_A = résidu = ce qui reste", "interprétation PTF / progrès technique + non mesuré"], "notations": ["g_Y, g_K, g_L, g_A", "α part du capital"], "why": "Décomposition fondatrice, Partie_1_Solow.txt lignes 919-948.", "id": "residu-006"}, {"cat": "solow", "mat": "croissance", "ch": 2, "diff": 2, "q": "Énoncer la condition d'état régulier k* dans le modèle de Solow et expliquer sa stabilité.", "model": "État régulier : s · f(k*) = (δ + n) · k*. L'investissement par tête (s·f(k)) compense exactement l'usure et la dilution démographique ((δ+n)·k). Stabilité : si k < k*, alors s·f(k) > (δ+n)·k donc Δk > 0 (k monte) ; si k > k*, Δk < 0 (k baisse). Convergence monotone garantie par les rendements décroissants (conditions d'Inada).", "points": ["condition s·f(k*) = (δ+n)·k*", "interprétation économique de l'égalité", "mécanisme de convergence (Δk selon position vs k*)", "stabilité garantie par rendements décroissants"], "notations": ["k* état régulier", "s taux d'épargne", "δ dépréciation", "n croissance démographique"], "why": "Résultat central du modèle Solow, base pour toutes les analyses de statique comparative.", "id": "solow-011"}, {"cat": "kaldor", "mat": "croissance", "ch": 1, "diff": 2, "q": "Énumérer les faits stylisés de Kaldor concernant la croissance moderne et expliquer leur importance.", "model": "Kaldor identifie 6 faits stylisés : (1) taux de croissance de y positif et stable ; (2) K/L croît ; (3) K/Y stable ; (4) rendement r stable ; (5) parts factorielles stables (~1/3 - 2/3) ; (6) forte hétérogénéité inter-pays. Ces faits contraignent les théories : tout bon modèle doit les reproduire, notamment le fait 5 (partage stable) et le fait 6 (divergence entre pays).", "points": ["6 faits stylisés énumérés", "insistance sur stabilité K/Y et r", "parts factorielles 1/3 - 2/3", "hétérogénéité inter-pays"], "notations": ["y, K/L, K/Y, r, α"], "why": "Cadre de test empirique fondamental.", "id": "kaldor-007"}, {"cat": "mrw", "mat": "croissance", "ch": 2, "diff": 2, "q": "Expliquer le contenu et l'apport du modèle MRW (Mankiw-Romer-Weil 1992).", "model": "MRW augmentent Solow en introduisant le capital humain H dans la fonction : Y = K^α · H^β · (A·L)^(1−α−β). L'estimation donne α ≈ 1/3, β ≈ 1/3, 1−α−β ≈ 1/3 : chaque facteur rémunéré à sa productivité marginale, revenu partagé en trois tiers. Apport : meilleure explication empirique des écarts de revenu inter-pays, et validation de la convergence conditionnelle.", "points": ["fonction Y = K^α · H^β · (AL)^(1−α−β)", "estimation ≈ 1/3, 1/3, 1/3", "amélioration du pouvoir explicatif", "validation convergence conditionnelle"], "notations": ["K, H, A, L, α, β"], "why": "Étape empirique-clé pour Solow.", "id": "mrw-007"}, {"cat": "ak", "mat": "croissance", "ch": 3, "diff": 3, "q": "Rappeler la fonction de production du modèle AK et expliquer pourquoi la croissance y est endogène.", "model": "Modèle AK : Y = A · K, linéaire en K. La productivité marginale du capital reste constante (A), donc pas de rendements décroissants et pas d'état régulier borné. Le taux de croissance de long terme est g = s·A − (δ+n), fonction du taux d'épargne s : la politique économique (via s) affecte durablement la croissance. C'est cette dépendance à s qui rend la croissance ENDOGÈNE, contrairement à Solow.", "points": ["Y = A · K (linéaire)", "absence de rendements décroissants", "g_LT = s·A − (δ+n)", "dépendance de g à s = endogénéité"], "notations": ["A productivité, K capital, s taux d'épargne"], "why": "Modèle fondateur de la croissance endogène.", "id": "ak-007"}, {"cat": "romer", "mat": "croissance", "ch": 3, "diff": 3, "q": "Expliquer la propriété de non-rivalité des idées chez Paul Romer et son implication pour la croissance.", "model": "Non-rivalité : une même idée peut être utilisée simultanément et sans épuisement par plusieurs producteurs. Contrairement au capital physique (rival), une idée reste disponible après usage. Implication : la production d'idées échappe à la loi des rendements décroissants, ce qui permet une croissance endogène soutenue par l'accumulation d'idées. Nécessite en pratique un mécanisme d'excluabilité (brevets) pour maintenir l'incitation privée à investir.", "points": ["définition non-rivalité", "contraste avec K rival", "conséquence : rendements non décroissants", "besoin de brevets (excluabilité)"], "notations": ["A stock d'idées"], "why": "Propriété centrale, base de la croissance endogène par les idées.", "id": "romer-007"}, {"cat": "aghion", "mat": "croissance", "ch": 4, "diff": 3, "q": "Formuler la critique de Jones (1995) au modèle de Romer (1990) et présenter la solution semi-endogène.", "model": "Critique : Romer 1990 implique un effet d'échelle (doubler les chercheurs devrait doubler g). Empiriquement, la R&D est ×5 aux USA 1950-88, mais g_PTF reste stable. Solution semi-endogène : introduire un exposant λ < 1 sur L_A (duplication) et φ < 1 sur A (externalité moindre). Le taux de croissance de long terme dépend alors de n (démographie), pas de s_R. La politique de R&D affecte le niveau, pas la pente.", "points": ["effet d'échelle non validé empiriquement", "modification λ < 1 (duplication)", "g_LT dépend de n, pas s_R", "politique = effet niveau, pas pente"], "notations": ["L_A chercheurs, λ duplication, φ externalité, A idées"], "why": "Étape empirique majeure post-Romer.", "id": "aghion-007"}, {"cat": "malthus", "mat": "croissance", "ch": 4, "diff": 2, "q": "Expliquer le mécanisme du piège malthusien et pourquoi il a été rompu à partir du XIXᵉ siècle.", "model": "Piège malthusien : progrès technique ↑ y transitoirement, ↑ fertilité, ↑ L, avec terre fixe et rendements décroissants, y retombe à son niveau de subsistance. Long terme : y ≈ constant, L ↑. Rupture au XIXᵉ : (1) le progrès technique s'accélère assez vite pour dépasser l'ajustement démographique ; (2) la transition démographique fait baisser la fertilité malgré la hausse du revenu (arbitrage quantité/qualité des enfants).", "points": ["mécanisme démographique amplifiant", "revenu revient à subsistance", "rôle de la terre fixe", "rupture par accélération technique + transition démographique"], "notations": ["y revenu par tête, L population, terre fixe"], "why": "Cœur du chapitre Population et origines de la croissance.", "id": "malthus-008"}, {"cat": "olg", "mat": "croissance", "ch": 3, "diff": 2, "q": "Décrire le modèle OLG de Diamond (1965) : agents, contraintes, décisions.", "model": "OLG : chaque agent vit 2 périodes (jeune, âgé). Population croît au taux n. Les jeunes produisent, gagnent w, choisissent leur épargne s (arbitrage consommer à la période courante vs demain). Les âgés consomment leur épargne accumulée (1+r)·s, pas de choix. Contrainte intertemporelle : c1 + c2/(1+r) = w. Maximisation de U(c1, c2) sous cette contrainte donne s* fonction de w, r, préférences.", "points": ["2 générations coexistantes", "contrainte budgétaire intertemporelle", "décision d'épargne du jeune", "consommation de retraite des âgés"], "notations": ["c1, c2, w salaire, r taux, s épargne, n démographie"], "why": "Base des modèles OLG standards (Diamond 1965).", "id": "olg-007"}, {"cat": "harrod", "mat": "croissance", "ch": 1, "diff": 2, "q": "Décrire brièvement le modèle de Harrod-Domar et l'expression « fil du rasoir ».", "model": "Harrod (1939) et Domar (1947) : dynamisation keynésienne. Coefficient capital/production v fixe (pas de substitution K-L). Taux garanti g_w = s/v (épargne finance investissement). Sentier équilibré exige g = n (démographie). Fil du rasoir : rien n'assure g = n ; tout écart s'amplifie (surinvestissement puis récession, ou inverse). Solow (1956) résout en introduisant la substitution K-L.", "points": ["keynésien dynamique", "coefficient v fixe (Léontief)", "taux garanti g_w = s/v", "instabilité (fil du rasoir)"], "notations": ["s épargne, v coeff capital, g_w taux garanti, n démographie"], "why": "Étape historique précédant Solow.", "id": "harrod-007"}, {"cat": "convergence", "mat": "croissance", "ch": 2, "diff": 2, "q": "Distinguer convergence absolue et convergence conditionnelle. Laquelle est validée empiriquement (MRW 1992) ?", "model": "Convergence absolue : tous les pays convergent vers le même sentier régulier, donc les pays initialement plus pauvres croissent plus vite (rejetée empiriquement à l'échelle planétaire). Convergence conditionnelle : chaque pays converge vers SON sentier régulier propre (fonction de s, n, H), donc les écarts persistent si les structures diffèrent. MRW (1992) valident empiriquement la convergence conditionnelle en régressant g sur y initial + déterminants structurels.", "points": ["convergence absolue (rejet)", "convergence conditionnelle (validation)", "rôle des paramètres structurels s, n, H", "test économétrique MRW"], "notations": ["g, y, s, n, H"], "why": "Résultat central de MRW pour interpréter la variance inter-pays.", "id": "convergence-007"}, {"cat": "institutions", "mat": "croissance", "ch": 5, "diff": 3, "q": "Expliquer la distinction entre institutions inclusives et institutions extractives (Acemoglu-Robinson).", "model": "Institutions inclusives : droits de propriété sécurisés, État de droit, contestabilité politique, incitations à investir et innover (ex : Corée du Sud). Institutions extractives : capture des rentes par une élite, insécurité juridique, faibles incitations à l'accumulation (ex : Corée du Nord). Thèse Acemoglu-Robinson : inclusives favorisent la croissance, extractives la freinent. Illustration : contraste Nord/Sud Corée après 1945.", "points": ["inclusives : droits, incitations, contestabilité", "extractives : capture, insécurité, rentes", "effet sur croissance long terme", "exemple canonique Nord/Sud Corée"], "notations": ["institutions formelles + informelles"], "why": "Distinction canonique du chapitre Institutions et croissance.", "id": "institutions-007"}], "ETOILE": [{"id": "et-01", "name": "Paradoxe de Feldstein-Horioka", "aliases": ["feldstein horioka", "feldstein-horioka", "fh", "feldstein", "horioka", "paradoxe fh"], "clues": ["Je date de 1980.", "Je concerne la mobilité des capitaux.", "Je porte deux noms.", "Je compare épargne et investissement nationaux.", "Je constate qu'ils restent fortement corrélés par pays."], "mat": "emi"}, {"id": "et-02", "name": "Surajustement de Dornbusch", "aliases": ["dornbusch", "surajustement", "overshooting", "surajustement de dornbusch", "modèle de dornbusch"], "clues": ["Je suis un modèle du chapitre 3.", "Je combine prix rigides à court terme et PPA à long terme.", "Je fais surréagir le taux de change à un choc monétaire.", "Je prédis un retour vers la valeur de long terme.", "Je porte le nom d'un économiste allemand."], "mat": "emi"}, {"id": "et-03", "name": "Paradoxe de Triffin", "aliases": ["triffin", "dilemme de triffin", "paradoxe de triffin"], "clues": ["Je porte le nom d'un économiste belge.", "Je décris un dilemme historique.", "Je concerne une monnaie internationale.", "Je se joue sous Bretton Woods.", "J'oppose fournir la liquidité mondiale à préserver la crédibilité de la monnaie de réserve."], "mat": "emi"}, {"id": "et-04", "name": "Effet Balassa-Samuelson", "aliases": ["balassa samuelson", "balassa-samuelson", "bs", "effet bs", "balassa"], "clues": ["Je porte deux noms.", "Je concerne les pays émergents en rattrapage.", "Je passe par les gains de productivité.", "Je repose sur la contagion salariale vers le secteur abrité.", "Je fais s'apprécier le taux de change réel."], "mat": "emi"}, {"id": "et-05", "name": "Condition de Marshall-Lerner", "aliases": ["marshall lerner", "marshall-lerner", "ml", "condition ml", "condition de marshall lerner"], "clues": ["Je porte deux noms.", "Je concerne la balance commerciale.", "Je fais intervenir des élasticités-prix.", "Je pose une inégalité : la somme doit dépasser 1.", "Je conditionne l'amélioration du solde après une dépréciation."], "mat": "emi"}, {"id": "et-06", "name": "Triangle d'incompatibilité de Mundell", "aliases": ["mundell", "triangle d'incompatibilite", "trilemme", "triangle de mundell", "triangle incompatibilite"], "clues": ["Je suis un théorème d'impossibilité.", "Je concerne les régimes de change.", "Je fais intervenir trois éléments.", "Je force à en sacrifier un.", "Je porte le nom d'un économiste canadien prix Nobel."], "mat": "emi"}, {"id": "et-07", "name": "Courbe en J", "aliases": ["courbe en j", "courbe j", "j curve", "j-curve"], "clues": ["Je suis une lettre de l'alphabet.", "Je décris une dynamique temporelle.", "J'apparais après une dépréciation.", "Je descends avant de monter.", "Je suppose Marshall-Lerner pour la remontée."], "mat": "emi"}, {"id": "et-08", "name": "Paradoxe de Lucas", "aliases": ["lucas", "paradoxe de lucas"], "clues": ["Je date de 1990.", "Je concerne les flux de capitaux internationaux.", "Je porte un seul nom (Nobel 1995).", "Je constate que le capital ne va pas des pays riches vers les pauvres autant que la théorie le prédit.", "Je m'explique par le risque et le capital humain."], "mat": "emi"}, {"id": "et-09", "name": "TCEF (Taux de change effectif fondamental)", "aliases": ["tcef", "feer", "fundamental equilibrium exchange rate", "taux de change effectif fondamental"], "clues": ["Je suis un acronyme.", "Je désigne un taux de change d'équilibre.", "J'ai deux dimensions : externe et interne.", "Je concerne le moyen terme.", "Je sers à juger si une monnaie est sur ou sous-évaluée."], "mat": "emi"}, {"id": "et-10", "name": "Loi du prix unique", "aliases": ["loi du prix unique", "law of one price", "lop", "prix unique"], "clues": ["Je concerne un bien parfaitement échangeable.", "Je m'appuie sur l'arbitrage international.", "J'unifie les prix exprimés dans une monnaie commune.", "Je fonde la PPA absolue.", "Je m'exprime par une égalité entre prix domestique et prix étranger converti."], "mat": "emi"}, {"id": "et-11", "name": "Pricing to market", "aliases": ["pricing to market", "ptm", "pass through incomplete", "pass-through incomplet"], "clues": ["Je suis une pratique des exportateurs.", "Je concerne le comportement de marge.", "Je réduis le pass-through du change.", "Je vise à préserver les parts de marché.", "Je s'écris en anglais avec deux mots et un adverbe court."], "mat": "emi"}, {"id": "et-12", "name": "Théorème de Meese-Rogoff", "aliases": ["meese rogoff", "meese-rogoff", "mr", "meese", "rogoff", "deconnexion du change"], "clues": ["Je date de 1983.", "Je porte deux noms.", "Je concerne la prévision du taux de change.", "Je compare modèles structurels et marche aléatoire.", "Je conclus que la marche aléatoire n'est pas battue à court terme."], "mat": "emi"}, {"name": "Robert Solow", "mat": "croissance", "aliases": ["solow", "robert solow", "r. solow", "r solow"], "clues": ["Économiste américain né en 1924, mort en 2023.", "Enseignant au MIT pendant toute sa carrière.", "Nobel d'économie en 1987.", "Auteur d'une équation d'accumulation Δk = s·f(k) − (δ+n)·k.", "Son résidu porte son nom."], "id": "et-13"}, {"name": "Simon Kuznets", "mat": "croissance", "aliases": ["kuznets", "simon kuznets", "s. kuznets", "s kuznets"], "clues": ["Économiste américain d'origine russe, né en 1901 mort en 1985.", "Nobel d'économie en 1971.", "Il a défini la comptabilité nationale moderne et le PIB.", "Une courbe empirique reliant inégalités et développement porte son nom.", "Six faits stylisés célèbres de la croissance lui doivent leur base empirique."], "id": "et-14"}, {"id": "et-15", "name": "Thomas Malthus", "mat": "croissance", "aliases": ["malthus", "thomas malthus", "t. malthus", "t malthus"], "clues": ["Économiste et pasteur britannique né en 1766, mort en 1834.", "Auteur en 1798 d'un essai sur le principe de population.", "Selon lui la croissance démographique condamnait l'humanité à la misère.", "Un piège de subsistance à long terme porte son nom.", "Sa thèse est démentie par la révolution industrielle."]}, {"id": "et-16", "name": "Daron Acemoglu", "mat": "croissance", "aliases": ["acemoglu", "daron acemoglu", "d. acemoglu", "d acemoglu"], "clues": ["Économiste turco-américain né en 1967, actif au MIT.", "Nobel d'économie en 2024, partagé avec deux collègues.", "Il distingue quatre grandes causes fondamentales de la croissance.", "Co-auteur d'un livre à succès intitulé Why Nations Fail (2012).", "Il oppose institutions inclusives et institutions extractives."]}], "CHEATSHEET": {"sigles": [{"t": "BdP", "d": "Balance des paiements. Identité comptable du cours : TC + CC − CF + EO = 0."}, {"t": "CC", "d": "Compte courant. Biens + services + revenus primaires (dividendes, intérêts) + revenus secondaires (transferts)."}, {"t": "TC", "d": "Compte de capital. Transferts en capital (remises de dettes, brevets), poste souvent petit."}, {"t": "CF", "d": "Compte financier. IDE, portefeuille, autres investissements, réserves. Convention du cours : CF > 0 = sortie nette de capitaux."}, {"t": "EO", "d": "Erreurs et omissions. Bouclage statistique de la BdP, rarement nul."}, {"t": "IDE", "d": "Investissement direct étranger : prise de contrôle ≥ 10 % du capital d'une entreprise étrangère."}, {"t": "PEN", "d": "Position extérieure nette : stock d'avoirs sur l'étranger − stock d'engagements. Alimentée par le flux courant et les effets de valorisation."}, {"t": "PPA", "d": "Parité de pouvoir d'achat. Absolue : E = P/P*. Relative (log) : Δe ≈ π* − π."}, {"t": "PCTI", "d": "Parité couverte de taux d'intérêt : f − e = i* − i (arbitrage sans risque via marché à terme). Vérifiée empiriquement."}, {"t": "PNCTI", "d": "Parité non couverte : i = i* − (eᵃ − e), soit e = eᵃ + (i − i*). Suppose la neutralité au risque. Souvent contredite (forward premium puzzle)."}, {"t": "TCEN", "d": "Taux de change effectif nominal : moyenne pondérée des taux bilatéraux. Niveau = géométrique, log = arithmétique."}, {"t": "TCER", "d": "Taux de change effectif réel = TCEN × P/P*. Indicateur de compétitivité-prix et de pouvoir d'achat."}, {"t": "TCR", "d": "Taux de change réel. Δq ≈ Δe + (π − π*)."}, {"t": "TCEF / FEER", "d": "Taux de change effectif fondamental. Compatible avec équilibre externe et interne à moyen terme. Utilisé pour juger d'une sous/sur-évaluation."}, {"t": "ML", "d": "Condition de Marshall-Lerner : εX + εM > 1. Nécessaire pour qu'une dépréciation améliore le solde commercial."}, {"t": "BS", "d": "Effet Balassa-Samuelson. Productivité échangeable ↑ → salaires ↑ → contagion vers l'abrité → prix des non-échangeables ↑ → appréciation réelle."}, {"t": "PTM", "d": "Pricing to market. Les exportateurs ajustent leurs marges pour préserver leurs parts de marché : pass-through incomplet du change."}, {"t": "MF", "d": "Modèle Mundell-Fleming. Prix fixes, statique. Efficacité des politiques dépend du régime × mobilité des capitaux."}, {"t": "IS/LM", "d": "Courbes IS (marché des biens) et LM (marché monétaire). Base du modèle Mundell-Fleming."}, {"t": "BC", "d": "Banque centrale."}, {"t": "FH", "d": "Paradoxe de Feldstein-Horioka (1980) : S et I nationaux restent fortement corrélés, contredisant la mobilité parfaite."}, {"t": "OTC", "d": "Over-the-counter. Marché de gré à gré, décentralisé, sans carnet d'ordres central. Le forex est un marché OTC."}], "notations": [{"t": "e", "d": "Log du taux de change au certain (unités étrangères par unité nationale). Utilisé dans PNCTI, PPA relative, Dornbusch."}, {"t": "E", "d": "Taux de change au certain en niveau. Réciproque du taux à l'incertain : S_I = 1/S_C."}, {"t": "eᵃ", "d": "Anticipation du taux e à l'horizon considéré. Sous anticipations rationnelles : E[e_futur | info]."}, {"t": "f", "d": "Log du taux à terme (forward). PCTI : f − e = i* − i."}, {"t": "q", "d": "Log du taux de change réel. Δq ≈ Δe + (π − π*)."}, {"t": "i, i*", "d": "Taux d'intérêt domestique (i) et étranger (i*). Différentiel i − i* central pour PNCTI/PCTI."}, {"t": "π, π*", "d": "Taux d'inflation domestique (π) et étrangère (π*). Différentiel π − π* utilisé dans le TCR et la PPA relative."}, {"t": "Ms", "d": "Offre nominale de monnaie. Central dans les modèles monétaires : e ∝ Ms/Ms* sous PPA + neutralité."}, {"t": "ωᵢ", "d": "Poids commercial du partenaire i dans le calcul du TCEN. Σ ωᵢ = 1."}, {"t": "ρ", "d": "Prime de risque exigée par les investisseurs. Introduite dans le modèle de portefeuille (chap. 4) : i = i* − (eᵃ − e) + ρ."}, {"t": "εX, εM", "d": "Élasticités-prix des exportations et importations. Marshall-Lerner : εX + εM > 1."}, {"t": "S, I, T, G, X, M", "d": "Épargne privée, investissement, impôts, dépenses publiques, exportations, importations. (S − I) + (T − G) = X − M."}], "conventions": [{"t": "Signe du compte financier", "d": "Convention du cours : CF > 0 signifie une sortie nette de capitaux (excédent courant). Hausse des réserves officielles = signe positif dans CF. Attention : convention inverse dans certains manuels internationaux."}, {"t": "Identité de la BdP", "d": "TC + CC − CF + EO = 0. Le signe − devant CF vient de la convention ci-dessus. Capacité (+) / besoin (−) de financement = TC + CC."}, {"t": "PEN vs solde courant", "d": "PEN = STOCK d'actifs nets. Solde courant = FLUX annuel. Hors effets de valorisation : ΔPEN = CC. Piège récurrent : confondre stock et flux."}, {"t": "Sens du taux au certain", "d": "Au certain (convention européenne) : 1 € = X $. Une hausse de X = appréciation de l'euro. Ne pas confondre avec la cotation à l'incertain (1 $ = Y €)."}, {"t": "Sens de la PNCTI", "d": "e = eᵃ + (i − i*). À anticipation donnée, une hausse surprise de i entraîne e ↑ : appréciation immédiate. Comparer une différence de logs à un taux, jamais un ratio."}, {"t": "Horizon des taux d'intérêt", "d": "Un taux annuel de 4 % sur 3 mois rapporte ≈ 1 %. Toujours diviser par 4 pour un horizon trimestriel (ou par 12 pour un mois). Piège classique en devoir."}, {"t": "TCEN : niveau vs log", "d": "En niveau : moyenne géométrique pondérée. En log : moyenne arithmétique pondérée. Ne PAS additionner des taux en niveau."}, {"t": "Sens du TCR", "d": "Δq ≈ Δe + (π − π*). Q ↑ = appréciation réelle = perte de compétitivité-prix + gain de pouvoir d'achat. Symétrique pour la dépréciation."}, {"t": "Marshall-Lerner et courbe en J", "d": "εX + εM > 1 : condition NÉCESSAIRE pour qu'une dépréciation améliore le solde à moyen/long terme. À court terme (volumes rigides), le solde se dégrade d'abord (creux du J)."}, {"t": "MF statique vs Dornbusch dynamique", "d": "Mundell-Fleming = prix fixes + statique. Modèle monétaire (Frenkel) = prix flexibles. Dornbusch = dynamique avec rigidité des prix à court terme et surajustement du change."}, {"t": "Balassa-Samuelson : toutes les étapes", "d": "Productivité échangeable ↑ → salaires ↑ → contagion à l'abrité (marché du travail unique) → prix des non-échangeables ↑ → appréciation réelle. Sauter la contagion salariale est la faute canonique."}, {"t": "Intervention stérilisée", "d": "Achat/vente de devises compensé par une opération d'open market inverse. Ms inchangée → LM inchangée → aucun effet monétaire durable. Seule la composition du bilan BC change."}]}};

// ---------- PRNG (mulberry32, seedable) ----------
// Alimente TOUS les tirages du jeu ; Math.random est INTERDIT (SPEC §0).
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let SEED = 0;
let rng = null;

function initPRNG() {
  const url = new URL(window.location.href);
  const q = url.searchParams.get("seed");
  if (q !== null && /^-?\d+$/.test(q)) {
    SEED = parseInt(q, 10) >>> 0;
  } else {
    // Seed initial : trois sources d'entropie, XORées.
    const t1 = Date.now() >>> 0;
    const t2 = (performance.now() * 1000) >>> 0;
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    SEED = (t1 ^ t2 ^ buf[0]) >>> 0;
  }
  rng = mulberry32(SEED);
  console.log("[emi] seed=" + SEED);
}

function rngInt(n) {
  // n > 0. Retourne 0..n-1.
  return Math.floor(rng() * n);
}

function rngPick(arr) {
  return arr[rngInt(arr.length)];
}

function rngShuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rngInt(i + 1);
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

// ---------- helpers ----------
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function norm(s) {
  return String(s)
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}
