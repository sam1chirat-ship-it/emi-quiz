<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1230">
<meta name="format-detection" content="telephone=no">
<title>Les 12 coups de l'EMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root {
  --ink: #0B1230;
  --ink2: #14204A;
  --ink3: #1E2E63;
  --gold: #FFC93C;
  --vert: #4DE6A8;
  --orange: #FF9F43;
  --rouge: #FF4D5A;
  --bleu: #4FC3F7;
  --cream: #FFF4E0;
  --muted: #8E9BC7;
  --line: rgba(79, 195, 247, .3);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --pile-bas: 0px;
  --sans: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
  --serif: 'Lora', Georgia, serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  color: var(--cream);
  font-family: var(--serif);
  min-height: 100%;
}
body {
  padding-top: max(20px, var(--sat));
  padding-bottom: 0;
  padding-left: var(--sal);
  padding-right: var(--sar);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(1200px 800px at 50% -10%, #1a2860 0%, transparent 60%),
    linear-gradient(180deg, var(--ink) 0%, #070B22 100%);
  min-height: 100vh;
}
input, textarea, #logwrap, #logwrap * {
  -webkit-user-select: auto;
  user-select: auto;
  -webkit-touch-callout: default;
}
input[type=text], input[type=password] {
  background: var(--ink3);
  color: var(--cream);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: var(--serif);
  font-size: 16px;
}

/* topbar : z-index 4 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: max(30px, calc(10px + var(--sat))) 12px 8px;
  background: linear-gradient(180deg, rgba(11, 18, 48, .92) 0%, rgba(11, 18, 48, .0) 100%);
  backdrop-filter: blur(4px);
}
.topbar .spacer { flex: 1; }
.topbar button {
  font-family: var(--sans);
  letter-spacing: .06em;
}

/* header : z-index 3 (flux) */
header {
  position: relative;
  z-index: 3;
  padding: 8px 16px 4px;
  text-align: center;
}
header h1 {
  font-family: var(--sans);
  font-size: 34px;
  letter-spacing: .08em;
  margin: 0;
  color: var(--gold);
  text-shadow: 0 2px 0 #6b4a00, 0 4px 20px rgba(255, 201, 60, .3);
}
header .sub {
  font-family: var(--sans);
  color: var(--muted);
  letter-spacing: .12em;
  font-size: 13px;
  margin-top: 2px;
}

/* pupitres : 4 colonnes en flex */
#pupitres {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 10px 12px 6px;
}
.pod {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 6px 6px;
  text-align: center;
  min-height: 76px;
  position: relative;
  transition: transform .15s ease, border-color .15s ease, opacity .3s ease;
}
.pod.active {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(255, 201, 60, .35);
}
.pod.out { opacity: .35; filter: grayscale(1); }
.pod-name {
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: .05em;
  color: var(--cream);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.feux {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin: 4px 0 2px;
}
.feu {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #1c2447;
  border: 1px solid rgba(255, 255, 255, .08);
}
.feu.on-0 { background: var(--vert); box-shadow: 0 0 6px var(--vert); }
.feu.on-1 { background: var(--orange); box-shadow: 0 0 6px var(--orange); }
.feu.on-2 { background: var(--rouge); box-shadow: 0 0 6px var(--rouge); }
.pod-score {
  font-family: var(--sans);
  font-size: 18px;
  color: var(--gold);
  letter-spacing: .04em;
}

/* banner : position relative dans le flux (ARCHITECTURE §2.4 #B1) */
#banner {
  position: relative;
  z-index: 3;
  margin: 6px 12px 0;
  padding: 8px 12px;
  border-radius: 10px;
  font-family: var(--sans);
  letter-spacing: .06em;
  text-align: center;
  min-height: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height .18s ease, padding .18s ease, margin .18s ease;
  opacity: 0;
}
#banner.show {
  max-height: 60px;
  opacity: 1;
  padding: 8px 12px;
  margin: 6px 12px 6px;
}
#banner.good { background: rgba(77, 230, 168, .16); color: var(--vert); border: 1px solid rgba(77, 230, 168, .4); }
#banner.bad { background: rgba(255, 77, 90, .18); color: var(--rouge); border: 1px solid rgba(255, 77, 90, .4); }
#banner.warn { background: rgba(255, 159, 67, .18); color: var(--orange); border: 1px solid rgba(255, 159, 67, .4); }
#banner.info { background: rgba(79, 195, 247, .14); color: var(--bleu); border: 1px solid rgba(79, 195, 247, .4); }

/* stage : le flux principal, padding-bottom via --pile-bas */
main#stage {
  position: relative;
  z-index: 3;
  padding: 12px 12px calc(var(--pile-bas) + 24px);
  min-height: 40vh;
}

/* setup */
.setup h2 {
  font-family: var(--sans);
  font-size: 22px;
  letter-spacing: .08em;
  color: var(--cream);
  margin: 8px 0 6px;
}
.setup .hint {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 12px;
}
.cats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.cat-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 999px;
  background: var(--ink3);
  border: 1px solid var(--line);
  color: var(--muted);
  font-family: var(--sans);
  letter-spacing: .04em;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
}
.cat-chip.on {
  color: var(--ink);
  background: var(--gold);
  border-color: var(--gold);
}
.cat-chip .jauge {
  display: inline-block;
  width: 28px;
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, .1);
  overflow: hidden;
  vertical-align: middle;
}
.cat-chip .jauge span {
  display: block;
  height: 100%;
  background: var(--vert);
  transition: width .3s ease;
}
.cat-chip.on .jauge { background: rgba(0, 0, 0, .12); }
.cat-chip.on .jauge span { background: var(--ink); }

/* carte question */
.card {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 14px 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .02) inset;
  margin-bottom: 12px;
}
.eyebrow {
  font-family: var(--sans);
  letter-spacing: .1em;
  font-size: 12px;
  color: var(--bleu);
  margin-bottom: 6px;
  text-transform: uppercase;
}
.qtext {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.4;
  color: var(--cream);
  margin: 0 0 12px;
}
.why {
  background: rgba(79, 195, 247, .08);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--cream);
  font-size: 15px;
  line-height: 1.45;
  margin-top: 10px;
}
.why .lbl {
  font-family: var(--sans);
  color: var(--bleu);
  letter-spacing: .06em;
  font-size: 12px;
  margin-bottom: 4px;
}
.answered-good, .answered-bad {
  border-radius: 8px;
  padding: 8px 10px;
  margin: 6px 0;
  font-family: var(--sans);
  letter-spacing: .06em;
  font-size: 14px;
}
.answered-good { background: rgba(77, 230, 168, .14); color: var(--vert); border: 1px solid rgba(77, 230, 168, .35); }
.answered-bad  { background: rgba(255, 77, 90, .16); color: var(--rouge); border: 1px solid rgba(255, 77, 90, .35); }

/* boutons : effet Duolingo (border-bottom 5px, :active translate) */
button {
  font-family: var(--sans);
  letter-spacing: .06em;
  font-size: 15px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  border-bottom-width: 5px;
  background: var(--ink3);
  color: var(--cream);
  cursor: pointer;
  transition: transform .06s ease, background .12s ease;
}
button:active { transform: translateY(3px); border-bottom-width: 2px; margin-bottom: 3px; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.b-gold  { background: var(--gold); color: #1a1200; border-color: #b58a1e; border-bottom-color: #6b4a00; }
button.b-vert  { background: var(--vert); color: #072016; border-color: #2fa676; border-bottom-color: #0f5a3c; }
button.b-rouge { background: var(--rouge); color: #200608; border-color: #a83b45; border-bottom-color: #52161c; }
button.b-ghost { background: transparent; border-color: var(--line); }
button.b-sm    { padding: 8px 10px; font-size: 13px; border-bottom-width: 4px; }

/* rangée de boutons : le premier prend toute la largeur (ARCHITECTURE §10 #B4) */
.btnrow {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.btnrow > button {
  flex: 1 1 0;
  min-width: 0;
}
.btnrow > button:first-child {
  flex: 1 1 100%;
}

/* liste de choix qcm : boutons pleine largeur, alignés à gauche */
.choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 6px;
}
.choices > button {
  text-align: left;
  font-family: var(--serif);
  font-size: 15px;
  letter-spacing: 0;
  padding: 12px 12px;
  white-space: normal;
  line-height: 1.35;
}
.choices > button.correct {
  background: rgba(77, 230, 168, .18);
  border-color: rgba(77, 230, 168, .5);
  color: var(--vert);
}
.choices > button.wrong {
  background: rgba(255, 77, 90, .18);
  border-color: rgba(255, 77, 90, .5);
  color: var(--rouge);
}
.choices > button:disabled { opacity: .85; }

/* format sens : ctx + shock + var, 4 boutons ↑ ↓ = ? */
.sens-ctx {
  font-family: var(--serif);
  color: var(--muted);
  font-style: italic;
  font-size: 14px;
  line-height: 1.35;
  margin: 4px 0 8px;
}
.sens-shock, .sens-var {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.35;
  margin: 4px 0;
  color: var(--cream);
}
.sens-lbl {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 11px;
  color: var(--bleu);
  margin-right: 6px;
  text-transform: uppercase;
}
.sens-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.sens-btn {
  font-family: var(--sans);
  font-size: 22px;
  letter-spacing: 0;
  padding: 14px 6px;
  min-height: 52px;
}

/* mémo (cheatsheet) — modal plein écran */
#modal .cheatsheet-sheet {
  max-width: 480px;
  width: 100%;
  padding: 14px 14px 8px;
  max-height: calc(100vh - 40px - var(--sat) - var(--sab));
  display: flex;
  flex-direction: column;
}
.cs-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.cs-head h2 {
  font-family: var(--sans);
  letter-spacing: .08em;
  color: var(--gold);
  margin: 0;
  font-size: 22px;
}
#cs-search {
  width: 100%;
  background: var(--ink3);
  color: var(--cream);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-family: var(--serif);
  font-size: 15px;
  margin-bottom: 8px;
}
.cs-body {
  overflow-y: auto;
  flex: 1 1 auto;
  padding: 4px 2px 8px;
}
.cs-empty {
  color: var(--muted);
  padding: 12px;
  text-align: center;
  font-style: italic;
  font-size: 14px;
}
.cs-sec { margin: 8px 0 14px; }
.cs-sec h3 {
  font-family: var(--sans);
  letter-spacing: .08em;
  color: var(--bleu);
  font-size: 13px;
  margin: 4px 0 6px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
  padding-bottom: 4px;
}
.cs-sec h3 .cs-count {
  color: var(--muted);
  font-family: var(--sans);
  font-weight: normal;
  margin-left: 6px;
  font-size: 12px;
}
.cs-item {
  margin: 6px 0 8px;
  padding: 6px 0;
  border-bottom: 1px dashed rgba(79, 195, 247, .18);
}
.cs-item:last-child { border-bottom: none; }
.cs-item dt {
  font-family: var(--sans);
  letter-spacing: .04em;
  color: var(--gold);
  font-size: 14px;
  margin-bottom: 2px;
}
.cs-item dd {
  font-family: var(--serif);
  color: var(--cream);
  margin: 0;
  font-size: 14px;
  line-height: 1.4;
}

/* sélecteur matière (SPEC §2) — apparaît automatiquement dès qu'un
   item d'une seconde matière existe dans la banque (cf. getMats). */
.mats {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 4px 0 10px;
}
.mats-lbl {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  margin-right: 4px;
}

/* toggle express + hint dans le setup */
.setup-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0 14px;
  flex-wrap: wrap;
}
.setup-toggle-hint {
  color: var(--muted);
  font-family: var(--serif);
  font-size: 12px;
  font-style: italic;
}

/* bandeau règne au setup */
.regne-banner {
  background: linear-gradient(90deg, rgba(255,201,60,.18), rgba(255,201,60,.06));
  border: 1px solid rgba(255,201,60,.35);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
}
.regne-banner .rb-title {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 16px;
  color: var(--gold);
}
.regne-banner .rb-sub {
  font-family: var(--serif);
  color: var(--cream);
  font-size: 13px;
  margin-top: 2px;
}

/* coup de maître : réponse-modèle, chrono indicatif, notation */
.maitre-chrono {
  font-family: var(--sans);
  letter-spacing: .04em;
  font-size: 13px;
  color: var(--muted);
  margin-top: 10px;
}
.maitre-chrono #maitre-chrono {
  color: var(--gold);
  font-weight: 600;
  margin-left: 6px;
}
.ouverte-model {
  background: rgba(255, 201, 60, .08);
  border: 1px solid rgba(255, 201, 60, .3);
  border-radius: 10px;
  padding: 8px 12px;
  margin: 10px 0 6px;
  font-size: 15px;
  line-height: 1.45;
  color: var(--cream);
}
.ouverte-model .lbl {
  font-family: var(--sans);
  letter-spacing: .06em;
  font-size: 11px;
  color: var(--gold);
  margin-bottom: 4px;
}
.ouverte-lbl {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 11px;
  color: var(--bleu);
  text-transform: uppercase;
  margin: 10px 0 4px;
}
.ouverte-pts { list-style: disc inside; padding-left: 4px; margin: 0; font-size: 14px; line-height: 1.4; }

/* étoile mystérieuse (SPEC §1.7) */
#etoile { background: rgba(11, 18, 48, .95); }
.etoile-sheet {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 16px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
  text-align: left;
}
.etoile-sheet h2 {
  font-family: var(--sans);
  font-size: 24px;
  letter-spacing: .08em;
  color: var(--gold);
  margin: 0 0 4px;
  text-align: center;
}
.etoile-hint {
  color: var(--muted);
  font-size: 13px;
  text-align: center;
  margin-bottom: 12px;
}
.etoile-clues {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
}
.etoile-clues li {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 8px 10px;
  margin: 4px 0;
  border-radius: 8px;
  background: var(--ink3);
  border: 1px solid var(--line);
  font-size: 14px;
  line-height: 1.4;
}
.etoile-clues li .clue-n {
  font-family: var(--sans);
  letter-spacing: .04em;
  color: var(--gold);
  min-width: 18px;
  text-align: right;
}
.etoile-clues li.masked { opacity: .5; }
.etoile-clues li.masked .masked-txt { color: var(--muted); font-style: italic; }
.etoile-clues li.revealed { border-color: rgba(255, 201, 60, .35); }
.etoile-input { margin: 12px 0 8px; }
.etoile-input input {
  width: 100%;
  background: var(--ink3);
  color: var(--cream);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  font-family: var(--serif);
  font-size: 16px;
}
.etoile-verdict {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 20px;
  padding: 10px 12px;
  border-radius: 10px;
  text-align: center;
  margin: 12px 0 8px;
}
.etoile-verdict.good { background: rgba(77, 230, 168, .18); color: var(--vert); border: 1px solid rgba(77, 230, 168, .4); }
.etoile-verdict.bad  { background: rgba(255, 77, 90, .16); color: var(--rouge); border: 1px solid rgba(255, 77, 90, .35); }

/* coup fatal : 2 horloges (SPEC §1.5) */
.clocks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 10px 0 12px;
}
.clock {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.clock.active {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(255, 201, 60, .28);
  animation: fatalPulse 1.1s ease-in-out infinite;
}
@keyframes fatalPulse {
  0%,100% { box-shadow: 0 0 0 2px rgba(255, 201, 60, .28); }
  50%     { box-shadow: 0 0 0 4px rgba(255, 201, 60, .48); }
}
.clock-name {
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: .04em;
  color: var(--cream);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.clock-bar {
  height: 8px;
  border-radius: 4px;
  background: rgba(255, 255, 255, .08);
  overflow: hidden;
  margin: 4px 0;
}
.clock-bar span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--vert), var(--gold));
  transition: width .12s linear;
}
.clock-val {
  font-family: var(--sans);
  letter-spacing: .04em;
  font-size: 12px;
  color: var(--muted);
  text-align: right;
}
.fatal-msg {
  margin-top: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(79, 195, 247, .12);
  border: 1px solid var(--line);
  color: var(--bleu);
  font-family: var(--sans);
  letter-spacing: .04em;
  font-size: 13px;
  text-align: center;
}

/* format ordre : pile + choix + verdict */
.order-lbl {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 11px;
  color: var(--bleu);
  text-transform: uppercase;
  margin: 10px 0 4px;
}
.order-pile {
  list-style: decimal inside;
  margin: 0 0 6px;
  padding: 8px 10px;
  background: var(--ink3);
  border: 1px dashed var(--line);
  border-radius: 10px;
  color: var(--cream);
  font-size: 14px;
  line-height: 1.4;
}
.order-pile li { padding: 2px 0; }
.order-pile li.empty { color: var(--muted); }
.order-choices {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.order-choices > button {
  text-align: left;
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: 0;
  padding: 10px 12px;
  white-space: normal;
  line-height: 1.35;
}
.order-choices > button:disabled {
  opacity: .35;
  text-decoration: line-through;
}
.order-recap { font-size: 14px; line-height: 1.4; margin: 6px 0; }
.order-recap li.mismatch { color: var(--rouge); }
.order-recap li.match    { color: var(--vert); }

/* coup bas — bandeau au-dessus de la question et bandeau de verdict */
.coup-bas-btn {
  display: flex;
  justify-content: flex-end;
  margin: 4px 0 6px;
}
.coup-bas-btn button {
  background: rgba(255, 159, 67, .15);
  color: var(--orange);
  border-color: rgba(255, 159, 67, .4);
  border-bottom-color: rgba(255, 159, 67, .5);
}
.coupbas-note {
  background: rgba(255, 159, 67, .12);
  border: 1px solid rgba(255, 159, 67, .35);
  border-radius: 10px;
  padding: 8px 12px;
  margin-bottom: 8px;
  font-size: 14px;
  color: var(--cream);
}
.coupbas-note .cb-lbl {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 11px;
  color: var(--orange);
  margin-right: 6px;
}
.coupbas-note .cb-hint {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

/* verdict d'une manche de duel */
.duel-round {
  font-family: var(--sans);
  letter-spacing: .06em;
  font-size: 13px;
  color: var(--bleu);
  background: rgba(79, 195, 247, .12);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  margin-bottom: 8px;
  text-align: center;
}

/* liste d'erreurs (bilan §1.9) */
.errlist { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.errlist .err {
  background: rgba(255, 77, 90, .08);
  border: 1px solid rgba(255, 77, 90, .28);
  border-radius: 10px;
  padding: 8px 10px;
}
.errlist .err .cat {
  font-family: var(--sans);
  letter-spacing: .06em;
  font-size: 11px;
  color: var(--rouge);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.errlist .err .qtxt { font-size: 14px; line-height: 1.35; }
.errlist .err .ta {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}
.errlist .err .ta b { color: var(--vert); }
.errlist .err .ta i { color: var(--rouge); font-style: normal; }
.jauges { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.jauges .row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}
.jauges .row .name {
  flex: 1 1 0;
  font-family: var(--sans);
  letter-spacing: .04em;
  color: var(--cream);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.jauges .row .bar {
  flex: 1 1 0;
  height: 8px;
  border-radius: 4px;
  background: rgba(255, 255, 255, .08);
  overflow: hidden;
  max-width: 140px;
}
.jauges .row .bar span {
  display: block;
  height: 100%;
  background: var(--vert);
}
.jauges .row .pct {
  font-family: var(--sans);
  letter-spacing: .04em;
  color: var(--muted);
  width: 34px;
  text-align: right;
  font-size: 12px;
}

/* overlay d'annonce (élimination, duel) */
#overlay .sheet .duel-title {
  font-family: var(--sans);
  color: var(--rouge);
  letter-spacing: .08em;
  font-size: 14px;
  margin-bottom: 4px;
}
#overlay .sheet .vs {
  font-family: var(--sans);
  font-size: 24px;
  color: var(--cream);
  margin: 4px 0;
  letter-spacing: .06em;
}
#overlay .sheet .verdict-elim {
  font-family: var(--sans);
  letter-spacing: .06em;
  color: var(--rouge);
  font-size: 20px;
  margin: 6px 0 4px;
}

/* écran bilan (fin J1) */
.bilan h2 {
  font-family: var(--sans);
  font-size: 26px;
  letter-spacing: .08em;
  color: var(--gold);
  margin: 8px 0 6px;
}
.bilan .score-big {
  font-family: var(--sans);
  font-size: 48px;
  letter-spacing: .04em;
  color: var(--cream);
  text-align: center;
  margin: 10px 0 4px;
}

/* overlays : z-index 50 · modal 60 · etoile 85 · boot 95 */
#overlay, #modal, #etoile, #boot {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px calc(20px + var(--sar)) calc(20px + var(--sab)) calc(20px + var(--sal));
  background: rgba(11, 18, 48, .82);
  backdrop-filter: blur(6px);
}
#overlay.show, #modal.show, #etoile.show, #boot.show { display: flex; }
#overlay { z-index: 50; }
#modal { z-index: 60; }
#etoile { z-index: 85; }
#boot { z-index: 95; background: var(--ink); }

#overlay .sheet, #modal .sheet {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 16px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
}
#overlay .sheet h2 {
  font-family: var(--sans);
  font-size: 24px;
  letter-spacing: .08em;
  color: var(--gold);
  margin: 0 0 6px;
}
#overlay .sheet .rules {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.4;
  margin-bottom: 12px;
}
#boot .sheet {
  text-align: center;
  padding: 24px;
}
#boot .sheet h1 {
  font-family: var(--sans);
  font-size: 32px;
  letter-spacing: .08em;
  color: var(--gold);
  margin: 0 0 8px;
}
#boot .sheet .hint { color: var(--muted); font-size: 14px; margin: 8px 0 16px; }

/* prefers-reduced-motion : coupe toutes les animations (ARCHITECTURE §2.4) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>

<script>
"use strict";
const DATA = {"CATS": {"bdp": {"name": "Balance des paiements", "ch": 1, "mat": "emi"}, "pen": {"name": "Position extérieure nette", "ch": 1, "mat": "emi"}, "si": {"name": "Épargne-investissement", "ch": 1, "mat": "emi"}, "forex": {"name": "Marché des changes", "ch": 2, "mat": "emi"}, "cot": {"name": "Cotation & taux croisés", "ch": 2, "mat": "emi"}, "tcr": {"name": "Taux effectifs & TCR", "ch": 2, "mat": "emi"}, "smi": {"name": "SMI & régimes de change", "ch": 2, "mat": "emi"}, "parite": {"name": "Parités de taux d'intérêt", "ch": 3, "mat": "emi"}, "monet": {"name": "Modèles monétaires", "ch": 3, "mat": "emi"}, "depr": {"name": "Dépréciation & balance", "ch": 4, "mat": "emi"}, "equil": {"name": "Change d'équilibre", "ch": 5, "mat": "emi"}, "mf": {"name": "Mundell-Fleming", "ch": 6, "mat": "emi"}, "residu": {"name": "Comptabilité de la croissance", "ch": 1, "mat": "croissance"}, "kaldor": {"name": "Faits stylisés (Kaldor)", "ch": 1, "mat": "croissance"}, "harrod": {"name": "Harrod-Domar", "ch": 1, "mat": "croissance"}, "solow": {"name": "Modèle de Solow", "ch": 2, "mat": "croissance"}, "mrw": {"name": "Capital humain (MRW, Lucas)", "ch": 2, "mat": "croissance"}, "convergence": {"name": "Convergence conditionnelle / absolue", "ch": 2, "mat": "croissance"}, "ak": {"name": "AK & learning by doing", "ch": 3, "mat": "croissance"}, "romer": {"name": "Romer 1990 & Jones 1995 (idées)", "ch": 3, "mat": "croissance"}, "aghion": {"name": "Aghion-Howitt (destruction créatrice)", "ch": 3, "mat": "croissance"}, "malthus": {"name": "Malthus & Galor unifiée", "ch": 4, "mat": "croissance"}, "olg": {"name": "Générations imbriquées (Diamond)", "ch": 4, "mat": "croissance"}, "institutions": {"name": "Institutions & environnement", "ch": 5, "mat": "croissance"}}, "BOTS": [{"name": "La Cambiste", "acc": {"qcm": 0.7, "vf": 0.7, "sens": 0.45, "ordre": 0.35, "calc": 0.65, "qcm3": 0.75}}, {"name": "Le Bachoteur", "acc": {"qcm": 0.6, "vf": 0.75, "sens": 0.55, "ordre": 0.55, "calc": 0.4, "qcm3": 0.65}}, {"name": "L'Arbitragiste", "acc": {"qcm": 0.5, "vf": 0.55, "sens": 0.6, "ordre": 0.4, "calc": 0.75, "qcm3": 0.6}}], "QCM": [{"id": "bdp-001", "cat": "bdp", "ch": 1, "diff": 1, "q": "Selon la convention du cours, un solde du compte financier positif (CF > 0) signifie :", "choices": ["une sortie nette de capitaux", "une entrée nette de capitaux", "un déficit courant", "une erreur nette d'enregistrement"], "a": 0, "trap": "signe-bdp", "why": "Convention du cours : CF > 0 = sortie nette de capitaux, ce qui correspond à un excédent courant (capacité de financement).", "mat": "emi"}, {"id": "bdp-002", "cat": "bdp", "ch": 1, "diff": 2, "q": "L'identité comptable de la balance des paiements, selon le cours, s'écrit :", "choices": ["TC + CF − CC + EO = 0", "TC + CC + CF + EO = 0 (variante avec CF positif)", "TC + CC − CF = 0", "TC + CC − CF + EO = 0"], "a": 3, "trap": "signe-bdp", "why": "TC + CC − CF + EO = 0 (le signe − devant CF vient de la convention : CF > 0 = sortie de capitaux).", "mat": "emi"}, {"id": "pen-001", "cat": "pen", "ch": 1, "diff": 1, "q": "La position extérieure nette (PEN) est :", "choices": ["un stock d'avoirs nets sur le reste du monde", "un flux annuel de capitaux", "le solde du compte courant", "le solde du compte financier"], "a": 0, "trap": "stock-flux", "why": "PEN = stock (encours d'actifs moins passifs à un instant t) ; le solde courant est le flux qui l'alimente.", "mat": "emi"}, {"id": "pen-002", "cat": "pen", "ch": 1, "diff": 2, "q": "Hors effets de valorisation, la variation de la PEN sur une période est égale :", "choices": ["au solde courant de la période", "à la balance commerciale seule", "au déficit du compte financier", "à la variation des réserves de change"], "a": 0, "trap": "bc-bcour", "why": "Sans effets de valorisation, ΔPEN = CC : le solde courant (biens + services + revenus + transferts), pas la seule balance commerciale.", "mat": "emi"}, {"id": "si-001", "cat": "si", "ch": 1, "diff": 2, "q": "L'identité macroéconomique en économie ouverte s'écrit :", "choices": ["(S − I) + (T − G) = X − M", "S + I + G = X − M", "S − I = T − G", "X − M = C + G"], "a": 0, "why": "Épargne privée nette + épargne publique = solde courant. Un excédent courant traduit un excès d'épargne domestique.", "mat": "emi"}, {"id": "forex-001", "cat": "forex", "ch": 2, "diff": 1, "q": "La monnaie véhiculaire dominante du marché des changes est :", "choices": ["le yen", "le renminbi chinois depuis 2015 environ", "le dollar américain", "la livre sterling"], "a": 2, "why": "Le dollar intervient dans environ 88 % des transactions ; les paires exotiques passent par le dollar avant conversion.", "mat": "emi"}, {"id": "forex-002", "cat": "forex", "ch": 2, "diff": 2, "q": "Un exportateur français doit recevoir 100 000 USD dans 3 mois. Pour se couvrir contre une baisse du dollar, sa couverture standard est :", "choices": ["vend ses dollars à terme (forward sell)", "achète des dollars à terme (forward buy)", "achète une option de vente d'euros", "conclut un swap euro-yen"], "a": 0, "why": "L'exportateur qui recevra des dollars veut fixer à la signature le prix auquel il les vendra ; il les vend à terme.", "mat": "emi"}, {"id": "cot-001", "cat": "cot", "ch": 2, "diff": 1, "q": "En cotation au certain (1 € = X $), une hausse du taux traduit :", "choices": ["une appréciation de l'euro", "une dépréciation de l'euro", "aucun effet, seul le compte courant change", "une baisse des exportations européennes"], "a": 0, "trap": "certain-incertain", "why": "Au certain, une hausse du taux = plus de devises par unité de monnaie nationale, donc appréciation de la monnaie nationale.", "mat": "emi"}, {"id": "cot-002", "cat": "cot", "ch": 2, "diff": 2, "q": "On connaît 1 USD = 100 JPY et 1 USD = 0,80 EUR (à l'incertain, du point de vue américain). Combien vaut 1 EUR en JPY ?", "choices": ["125 JPY", "80 JPY", "0,008 JPY", "20 JPY"], "a": 0, "trap": "certain-incertain", "why": "1 EUR = (100 / 0,80) JPY = 125 JPY. Piège : ne pas confondre 100 × 0,80 = 80 (mauvais sens) ou 1/(100×0,80).", "mat": "emi"}, {"id": "tcr-001", "cat": "tcr", "ch": 2, "diff": 2, "q": "Une hausse du taux de change réel (défini au certain, TCER = TCEN × P/P*) signifie :", "choices": ["une appréciation réelle : perte de compétitivité-prix, gain de pouvoir d'achat", "une dépréciation réelle : gain de compétitivité", "aucun effet sur les termes de l'échange", "une hausse mécanique des exportations"], "a": 0, "trap": "certain-incertain", "why": "Q ↑ = les biens nationaux deviennent relativement plus chers à l'étranger : compétitivité-prix ↓, pouvoir d'achat national ↑.", "mat": "emi"}, {"id": "smi-001", "cat": "smi", "ch": 2, "diff": 3, "q": "Le paradoxe (ou dilemme) de Triffin décrit :", "choices": ["l'impossibilité d'un étalon-or moderne", "l'échec du régime des changes flottants dans les années 1970", "une contradiction entre fournir la liquidité mondiale et préserver la crédibilité de la monnaie de réserve", "une perte de confiance dans le dollar résultant uniquement de l'inflation américaine des années 1960-1970"], "a": 2, "why": "Pour fournir des dollars au monde, les États-Unis doivent creuser leur déficit, ce qui à terme mine la convertibilité du dollar en or (Bretton Woods).", "mat": "emi"}, {"id": "smi-002", "cat": "smi", "ch": 2, "diff": 2, "q": "Le régime de Bretton Woods (1944-1971) reposait sur :", "choices": ["un système officiel de changes flottants entre les monnaies membres, encadré et supervisé par le FMI", "des parités fixes des monnaies vis-à-vis du dollar, lui-même convertible en or", "l'étalon-or classique entre toutes les monnaies", "une monnaie unique mondiale gérée par le FMI"], "a": 1, "why": "Bretton Woods : parités fixes ±1 % contre dollar, et convertibilité or à 35 $ l'once uniquement pour les banques centrales.", "mat": "emi"}, {"id": "parite-001", "cat": "parite", "ch": 3, "diff": 2, "q": "Sous la PNCTI (e = log du taux au certain, eᵃ son anticipation), la relation reliant i, i*, e, eᵃ est :", "choices": ["i − i* = Eᵃ / E", "i = i* + (eᵃ − e)", "i = i* − (eᵃ − e), soit e = eᵃ + (i − i*)", "i = i* + f, où f est le taux à terme observé au comptant sur le marché forex"], "a": 2, "trap": "sens-parite", "why": "PNCTI : le différentiel de taux compense l'anticipation de dépréciation. Ne pas confondre avec la PCTI qui utilise le taux à terme f.", "mat": "emi"}, {"id": "parite-002", "cat": "parite", "ch": 3, "diff": 1, "q": "Un taux d'intérêt annuel de 4 % rapporte, sur un horizon de 3 mois (annualisation standard) :", "choices": ["environ 1 %", "environ 4 %", "environ 12 %", "environ 0,04 %"], "a": 0, "trap": "horizon", "why": "4 % annuel sur 1/4 d'année ≈ 1 %. Piège classique du cours : ne pas laisser un taux annuel tel quel dans un calcul trimestriel.", "mat": "emi"}, {"id": "monet-001", "cat": "monet", "ch": 3, "diff": 2, "q": "Dans le modèle monétaire à prix flexibles (Frenkel), une hausse permanente de l'offre de monnaie nationale entraîne :", "choices": ["une baisse des prix domestiques", "aucun effet sur le taux de change (neutralité monétaire à long terme parfaite)", "une appréciation nominale de la monnaie", "une dépréciation nominale immédiate d'ampleur équivalente"], "a": 3, "trap": "fixe-flexible", "why": "Prix flexibles : la neutralité monétaire s'applique ; l'offre de monnaie ↑ x % fait grimper P de x % et déprécie e de x % (PPA).", "mat": "emi"}, {"id": "depr-001", "cat": "depr", "ch": 4, "diff": 2, "q": "La condition Marshall-Lerner pour qu'une dépréciation améliore la balance commerciale s'écrit :", "choices": ["εX + εM > 1", "εX × εM > 1", "εX − εM > 0", "εX + εM < 1"], "a": 0, "trap": "ml-symetrie", "why": "Somme des élasticités-prix > 1 : les effets volumes doivent l'emporter sur l'effet valeur pour que la dépréciation soit favorable.", "mat": "emi"}, {"id": "depr-002", "cat": "depr", "ch": 4, "diff": 2, "q": "La courbe en J décrit :", "choices": ["l'effet d'une appréciation sur les exportations", "une amélioration immédiate suivie d'une dégradation progressive à long terme du solde commercial", "une dégradation initiale puis une amélioration du solde commercial après une dépréciation", "l'effet dynamique d'un durcissement monétaire"], "a": 2, "trap": "ml-symetrie", "why": "À court terme les volumes sont rigides (contrats), l'effet valeur domine → solde ↓. À moyen terme Marshall-Lerner joue → solde ↑.", "mat": "emi"}, {"id": "equil-001", "cat": "equil", "ch": 5, "diff": 3, "q": "L'effet Balassa-Samuelson enchaîne les étapes suivantes :", "choices": ["appréciation nominale immédiate uniquement, sans effet sur les prix", "productivité ↑ → baisse des prix domestiques → dépréciation réelle immédiate observable", "productivité échangeable ↑ → salaires ↑ → contagion à l'abrité → prix non-échangeables ↑ → appréciation réelle", "hausse des taux d'intérêt puis entrée de capitaux → appréciation"], "a": 2, "trap": "bs-etapes", "why": "Le prof exige toutes les étapes : la contagion salariale du secteur échangeable au secteur abrité est celle qu'on oublie.", "mat": "emi"}, {"id": "mf-001", "cat": "mf", "ch": 6, "diff": 2, "q": "Le triangle d'incompatibilité de Mundell énonce qu'un pays ne peut avoir simultanément que deux des trois éléments :", "choices": ["inflation basse, chômage bas, croissance forte", "ouverture commerciale complète, ouverture financière parfaite et démocratie politique stable", "changes fixes, mobilité parfaite des capitaux, politique monétaire autonome", "épargne, investissement, budget équilibré"], "a": 2, "why": "Fixe + mobilité parfaite ⇒ la politique monétaire est asservie à la parité. On ne peut choisir que deux sommets du triangle.", "mat": "emi"}, {"id": "mf-002", "cat": "mf", "ch": 6, "diff": 3, "q": "En Mundell-Fleming, changes flexibles et mobilité parfaite des capitaux, une hausse des dépenses publiques :", "choices": ["n'a aucun effet sur Y : éviction totale par l'appréciation", "fait fortement augmenter Y sans autre effet", "déprécie la monnaie et améliore la balance commerciale", "ne modifie ni le taux d'intérêt ni le change"], "a": 0, "trap": "mf-regime", "why": "G ↑ ⇒ i ↑ ⇒ entrées de capitaux ⇒ appréciation ⇒ X−M ↓ jusqu'à annuler l'effet initial : la politique budgétaire est inefficace ici.", "mat": "emi"}, {"id": "pen-005", "cat": "pen", "ch": 1, "diff": 2, "q": "Deux pays ont le même déficit courant chaque année sur dix ans, mais l'un voit sa PEN se dégrader deux fois plus vite. L'explication la plus plausible est :", "choices": ["des effets de valorisation défavorables au premier", "une comptabilité fautive du second", "des exportations plus faibles", "un taux d'épargne plus élevé"], "a": 0, "trap": "stock-flux", "why": "La PEN est un stock : la revalorisation des actifs et passifs libellés en devises change le stock sans qu'aucun flux courant supplémentaire n'ait eu lieu.", "mat": "emi"}, {"id": "si-005", "cat": "si", "ch": 1, "diff": 2, "q": "À S et I constants, une baisse du déficit budgétaire (T − G ↑) implique :", "choices": ["une amélioration du solde courant X − M", "une aggravation du solde courant X − M", "aucun effet sur X − M", "une baisse mécanique de l'épargne privée"], "a": 0, "why": "(S − I) + (T − G) = X − M. Toutes choses égales par ailleurs, (T − G) ↑ ⇒ X − M ↑.", "mat": "emi"}, {"id": "si-006", "cat": "si", "ch": 1, "diff": 3, "q": "Dans la zone euro pré-2010, l'intégration financière a essentiellement :", "choices": ["financé des bulles immobilières périphériques plutôt que l'industrie", "réalisé la convergence de productivité attendue", "fait disparaître le paradoxe de Feldstein-Horioka", "réduit les déséquilibres courants entre le nord et le sud"], "a": 0, "why": "Constat du cours : les capitaux ont financé des bulles immobilières (Espagne, Irlande) et non le rattrapage productif.", "mat": "emi"}, {"id": "cot-005", "cat": "cot", "ch": 2, "diff": 2, "q": "1 € = 1,25 $ et 1 € = 150 JPY. Combien vaut 1 $ en JPY (arbitrage triangulaire) ?", "choices": ["120 JPY", "125 JPY", "187,5 JPY", "0,83 JPY"], "a": 0, "why": "1 $ = 150 / 1,25 = 120 JPY. Passer par la monnaie commune (€) et diviser dans le bon sens.", "mat": "emi"}, {"id": "tcr-005", "cat": "tcr", "ch": 2, "diff": 2, "q": "Un pays commerce avec deux partenaires : Δe₁ = +2 % (ω₁ = 0,7) et Δe₂ = −3 % (ω₂ = 0,3). La variation du TCEN vaut :", "choices": ["+0,5 %", "−0,5 %", "−1 %", "+1 %"], "a": 0, "why": "0,7 × 2 + 0,3 × (−3) = 1,4 − 0,9 = 0,5 %.", "mat": "emi"}, {"id": "tcr-006", "cat": "tcr", "ch": 2, "diff": 2, "q": "Δe = +5 %, π = 3 %, π* = 1 %. La variation du TCR (au certain) est approximativement :", "choices": ["+7 %", "+3 %", "+1 %", "−1 %"], "a": 0, "why": "Δq ≈ Δe + (π − π*) = 5 + (3 − 1) = 7 %.", "mat": "emi"}, {"id": "smi-005", "cat": "smi", "ch": 2, "diff": 2, "q": "Les accords de la Jamaïque (1976) ont officialisé :", "choices": ["la parité fixe entre euro et dollar avec bandes de fluctuation", "le retour à l'étalon-or", "la fin du FMI", "les changes flottants gérés"], "a": 3, "why": "Ratification de l'abandon de la convertibilité or de 1971 et légalisation formelle des changes flottants.", "mat": "emi"}, {"id": "monet-006", "cat": "monet", "ch": 3, "diff": 2, "q": "Dans le modèle monétaire à prix flexibles, une hausse durable de la production nationale Y :", "choices": ["déprécie la monnaie", "apprécie la monnaie (demande de monnaie ↑)", "est neutre sur le change", "provoque une hyperinflation immédiate et incontrôlable des prix"], "a": 1, "why": "Y ↑ ⇒ demande de monnaie L(Y) ↑ ⇒ à Ms donné, P ↓ ⇒ par PPA, e ↑.", "mat": "emi"}, {"id": "monet-007", "cat": "monet", "ch": 3, "diff": 2, "q": "Le résultat de Meese et Rogoff (1983) implique surtout que :", "choices": ["les taux d'intérêt sont exogènes", "la PPA est vérifiée à court terme", "les modèles structurels de change ne battent pas la marche aléatoire à court terme", "les modèles ARMA structurels dominent tous les autres à tous les horizons observés"], "a": 2, "why": "Constat empirique fondateur de la « déconnexion du change ».", "mat": "emi"}, {"id": "depr-006", "cat": "depr", "ch": 4, "diff": 2, "q": "Le pass-through incomplet du change vers les prix à l'importation s'explique surtout par :", "choices": ["l'inertie des banques centrales", "la lenteur des ajustements salariaux et des contrats de long terme entre importateurs", "la rigidité de la demande finale", "l'ajustement des marges des exportateurs (pricing to market)"], "a": 3, "why": "Pour préserver leurs parts de marché, les exportateurs absorbent une partie de la variation du change dans leur marge.", "mat": "emi"}, {"id": "equil-006", "cat": "equil", "ch": 5, "diff": 2, "q": "Le TCEF (FEER) désigne :", "choices": ["un taux de long terme fondé strictement sur la PPA absolue de Cassel", "un taux compatible avec équilibre externe et interne à moyen terme", "un taux calculé sur l'indice Big Mac", "un taux fixé chaque année par le FMI"], "a": 1, "why": "TCEF : équilibre externe (solde courant soutenable) et interne (plein emploi non-inflationniste).", "mat": "emi"}, {"id": "equil-007", "cat": "equil", "ch": 5, "diff": 2, "q": "Un pays émergent en rattrapage rapide de productivité voit, selon Balassa-Samuelson :", "choices": ["son taux de change réel s'apprécier", "son taux nominal se déprécier durablement", "une hyperinflation systématique", "une baisse de sa PEN"], "a": 0, "trap": "bs-etapes", "why": "Productivité échangeable ↑ ⇒ salaires ↑ ⇒ contagion à l'abrité ⇒ prix non-échangeables ↑ ⇒ appréciation réelle.", "mat": "emi"}, {"id": "mf-009", "cat": "mf", "ch": 6, "diff": 3, "q": "En Mundell-Fleming, changes fixes et mobilité parfaite des capitaux, une hausse de l'offre de monnaie :", "choices": ["est neutralisée par la sortie de capitaux ; Y inchangé", "fait fortement augmenter Y", "provoque une forte appréciation", "déclenche une hyperinflation"], "a": 0, "trap": "mf-regime", "why": "Ms ↑ ⇒ i baisse ⇒ sortie de capitaux ⇒ BC vend des devises pour tenir la parité ⇒ Ms revient au point de départ.", "mat": "emi"}, {"id": "forex-006", "cat": "forex", "ch": 2, "diff": 2, "q": "Un importateur français doit payer 100 000 USD dans trois mois. La couverture classique consiste à :", "choices": ["acheter les dollars à terme (forward buy)", "vendre les dollars à terme (forward sell)", "acheter une option de vente d'euros", "attendre et payer au comptant"], "a": 0, "why": "L'importateur veut fixer à la signature le prix d'achat des dollars futurs : achat à terme.", "mat": "emi"}, {"cat": "bdp", "ch": 1, "diff": 2, "q": "Le compte de transferts (TC) inclut principalement :", "choices": ["les variations de réserves officielles", "les investissements directs étrangers (IDE) et de portefeuille", "les envois de fonds des migrants et les aides internationales", "les échanges de biens de consommation"], "a": 2, "why": "TC couvre les transferts unilatéraux : remises de fonds, dons, aide au développement.", "id": "bdp-009", "mat": "emi"}, {"cat": "pen", "ch": 1, "diff": 3, "q": "Un pays a une PEN de −800 Md€ et un déficit courant annuel constant de 40 Md€. Sans effets de valorisation, dans combien d'années la PEN atteindra-t-elle −1 000 Md€ ?", "choices": ["5 ans", "10 ans", "20 ans", "25 ans"], "a": 0, "trap": "stock-flux", "why": "ΔPEN = CC hors valorisation = −40 Md€/an. Pour aller de −800 à −1 000 : 200 / 40 = 5 ans.", "id": "pen-009", "mat": "emi"}, {"cat": "forex", "ch": 2, "diff": 2, "q": "Un swap de change est utilisé principalement pour :", "choices": ["spéculer sur la volatilité", "gérer la trésorerie court terme en devises sans exposition nette", "réaliser un arbitrage triangulaire", "financer un investissement de long terme via un instrument dérivé équivalent"], "a": 1, "why": "Swap = spot + terme inverse : l'exposition nette est nulle, seule la trésorerie change.", "id": "forex-009", "mat": "emi"}, {"cat": "cot", "ch": 2, "diff": 1, "q": "L'usage international dominant pour coter un taux de change est :", "choices": ["au certain, sauf pour le dollar contre la plupart des devises", "toujours à l'incertain", "toujours au certain", "une convention aléatoire pays par pays"], "a": 0, "why": "Le dollar est le plus souvent coté à l'incertain (1 USD = X yens), sauf paires majeures comme EUR/USD et GBP/USD.", "id": "cot-009", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 3, "q": "Le régime de l'étalon de change-or (Gold Exchange Standard, 1922-1939) se distingue de l'étalon-or classique par :", "choices": ["l'adoption officielle des changes flottants entre les pays européens signataires", "l'abandon complet de l'or", "l'ajout de devises fortes convertibles comme réserves", "la centralisation par le FMI"], "a": 2, "why": "Gold Exchange Standard : réserves en or ET en devises convertibles (livre sterling puis dollar) ; élargit la base monétaire mondiale.", "id": "smi-009", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 3, "q": "Dans Dornbusch, la vitesse de convergence vers le nouvel équilibre de long terme dépend de :", "choices": ["la vitesse d'ajustement des prix", "la crédibilité de la banque centrale seule", "l'élasticité des exportations", "la parité fixe éventuelle"], "a": 0, "trap": "statique-dyn", "why": "Le retour à la PPA est piloté par la rigidité des prix : plus les prix sont rapides à ajuster, plus le surajustement se résorbe vite.", "id": "monet-010", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 2, "q": "Une hausse durable des coûts salariaux unitaires dans un pays, à taux nominal fixe, provoque :", "choices": ["une dépréciation réelle", "une appréciation réelle et une perte de compétitivité", "aucun effet sur la balance commerciale", "une amélioration mécanique et immédiate du solde courant par baisse des importations"], "a": 1, "why": "P ↑ à P* et e constants ⇒ q = e × P/P* augmente : appréciation réelle.", "id": "depr-010", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 2, "q": "Le TCER (taux de change effectif réel) diffère du TCR bilatéral par :", "choices": ["l'exclusion de l'inflation", "l'utilisation d'un indice de matières premières plutôt que d'un panier de biens et services", "l'agrégation pondérée sur plusieurs partenaires", "la fréquence annuelle plutôt que trimestrielle"], "a": 2, "why": "TCER : moyenne géométrique pondérée par les parts commerciales des taux de change réels bilatéraux.", "id": "equil-009", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "q": "En Mundell-Fleming, changes flexibles et mobilité imparfaite des capitaux, une hausse de G :", "choices": ["augmente Y mais moins qu'en économie fermée", "n'a aucun effet sur Y", "provoque une éviction totale", "déprécie fortement la monnaie"], "a": 0, "trap": "mf-regime", "why": "Mobilité imparfaite = l'ajustement du change est partiel, l'effet expansionniste subsiste (mais amoindri).", "id": "mf-011", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 2, "q": "La différence essentielle entre PCTI et PNCTI est :", "choices": ["l'existence d'un contrôle des capitaux", "la maturité de l'opération (PCTI = court terme uniquement, PNCTI = horizon plus long, moyen à long terme)", "la monnaie de référence", "la couverture (PCTI utilise le taux à terme, PNCTI l'anticipation)"], "a": 3, "trap": "sens-parite", "why": "PCTI : arbitrage couvert via forward, tient toujours. PNCTI : condition d'anticipation, testable et souvent réfutée.", "id": "parite-009", "mat": "emi"}, {"cat": "bdp", "ch": 1, "diff": 2, "q": "Dans la BdP française, une acquisition par un groupe américain d'une usine française apparaît :", "choices": ["aux erreurs et omissions", "au compte courant, côté crédit, considérée comme une vente de services financiers exceptionnels", "en IDE au compte financier, côté engagement (CF négatif dans la convention du cours)", "n'est jamais enregistrée"], "a": 2, "trap": "signe-bdp", "why": "IDE entrant = engagement pour le pays receveur → CF < 0 (entrée nette de capitaux, convention du cours).", "id": "bdp-016", "mat": "emi"}, {"cat": "pen", "ch": 1, "diff": 3, "q": "Un pays a une PEN de +200 Md€ et un excédent courant annuel de 20 Md€. Sans effets de valorisation, quelle sera la PEN dans 5 ans ?", "choices": ["+300 Md€", "+100 Md€", "+400 Md€", "+220 Md€"], "a": 0, "trap": "stock-flux", "why": "ΔPEN = CC (hors valorisation) → +20 × 5 = +100 ajouté au stock initial de 200 = +300 Md€.", "id": "pen-015", "mat": "emi"}, {"cat": "si", "ch": 1, "diff": 2, "q": "Un pays affiche X − M = −40, S − I = −60. Selon l'identité, T − G vaut :", "choices": ["+20", "−20", "−100", "0"], "a": 0, "why": "(S − I) + (T − G) = X − M ⇒ T − G = (X − M) − (S − I) = −40 − (−60) = +20.", "id": "si-014", "mat": "emi"}, {"cat": "forex", "ch": 2, "diff": 2, "q": "Un swap €/$ à 3 mois consiste, du point de vue de la banque française :", "choices": ["à acheter deux options d'achat", "à vendre les $ à terme uniquement, sans opération miroir au comptant", "à acheter des $ au comptant et à les revendre à terme", "à payer une prime de risque à la BCE"], "a": 2, "why": "Swap = deux jambes opposées simultanées — pas d'exposition nette, juste un déplacement de trésorerie.", "id": "forex-016", "mat": "emi"}, {"cat": "cot", "ch": 2, "diff": 2, "q": "Le sens de la cotation au certain pour le dollar face à l'euro (point de vue européen) donne :", "choices": ["1 € = X $ (X est le prix de l'euro en dollars)", "1 $ = X € (X est le prix du dollar en euros)", "peu importe, c'est symétrique", "il n'y a pas de convention"], "a": 0, "trap": "certain-incertain", "why": "Convention européenne : au certain = 1 unité de monnaie nationale vaut X devises.", "id": "cot-016", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 3, "q": "Si TCEN diminue de 2 % et P/P* augmente de 3 %, la variation approximative du TCER est :", "choices": ["+1 %", "−5 %", "+5 %", "−1 %"], "a": 0, "why": "En log : Δq ≈ Δe + (π − π*) = −2 + 3 = +1 % (appréciation réelle malgré la baisse nominale).", "id": "tcr-016", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 3, "q": "Un pays choisit le coin « fixe + politique monétaire autonome » du triangle de Mundell. Que doit-il sacrifier ?", "choices": ["sa monnaie", "la mobilité parfaite des capitaux", "sa banque centrale", "sa politique commerciale, notamment les tarifs douaniers et les quotas d'importation"], "a": 1, "why": "Fixe + monétaire autonome impose des contrôles de capitaux (cas Chine, années 2000).", "id": "smi-016", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "q": "Sous PNCTI, les investisseurs anticipent une dépréciation de 2 % de la monnaie sur un an. Pour quel différentiel de taux i − i* la PNCTI tient-elle ?", "choices": ["+2 %", "−2 %", "0 %", "+4 %"], "a": 0, "trap": "sens-parite", "why": "PNCTI : i − i* = eᵃ − e (dépréciation attendue). Dépréciation de 2 % ⇒ i − i* = +2 %.", "id": "parite-018", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 2, "q": "Le « forward premium puzzle » est la constatation empirique que :", "choices": ["les taux d'intérêt s'égalisent au niveau mondial", "les taux à terme observés prédisent parfaitement le spot futur qui sera réellement observé", "les monnaies à taux élevé s'apprécient en moyenne, contredisant la PNCTI", "les banques centrales fixent le taux à terme"], "a": 2, "why": "Contradiction empirique de la PNCTI : ex ante on prédit dépréciation, ex post on voit souvent appréciation.", "id": "parite-019", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 3, "q": "Dans Dornbusch, une hausse permanente de Ms de 5 %. À court terme, la dépréciation nominale est :", "choices": ["supérieure à 5 %", "exactement 5 %", "inférieure à 5 %", "nulle"], "a": 0, "trap": "statique-dyn", "why": "Surajustement : e sous-tire au-delà de la valeur de long terme (5 %) puis se corrige progressivement.", "id": "monet-019", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 3, "q": "Dans le modèle monétaire à prix flexibles, une hausse de la demande de monnaie L(Y, i) (à Ms donné) :", "choices": ["apprécie la monnaie", "déprécie la monnaie", "n'a aucun effet sur le change", "provoque une hyperinflation"], "a": 0, "why": "Demande de monnaie ↑ ⇒ P doit baisser pour équilibrer ⇒ par PPA, e ↑ (appréciation).", "id": "monet-020", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 3, "q": "Un pays a εX = 0,3 et εM = 0,4. Une dépréciation nominale de 10 % va :", "choices": ["dégrader le solde commercial (ML non vérifiée)", "améliorer le solde commercial", "ne rien changer", "provoquer une réévaluation"], "a": 0, "trap": "ml-symetrie", "why": "εX + εM = 0,7 < 1 : Marshall-Lerner non vérifiée, l'effet valeur domine, le solde se dégrade.", "id": "depr-019", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 2, "q": "Le modèle de portefeuille (chap. 4) ajoute au modèle monétaire :", "choices": ["une prime de risque dépendant de la PEN", "des anticipations irrationnelles", "un régime de change unique", "l'hypothèse de non-arbitrage"], "a": 0, "why": "Innovation clef : introduire ρ (prime) et lier ρ à la PEN — un pays très endetté doit payer plus.", "id": "depr-020", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 3, "q": "La formule complète de Balassa-Samuelson prédit qu'un pays dont la productivité relative T/N (échangeable / abrité) augmente verra son TCR :", "choices": ["s'apprécier", "se déprécier", "rester stable", "diverger"], "a": 0, "trap": "bs-etapes", "why": "Gain de productivité T > N ⇒ contagion salariale ⇒ P_N ↑ ⇒ prix relatifs domestiques ↑ ⇒ q ↑.", "id": "equil-017", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 2, "q": "L'indice « Big Mac » de The Economist est une approximation empirique de :", "choices": ["la PNCTI", "la PPA absolue à partir d'un panier simplifié", "l'effet Balassa-Samuelson", "le TCER effectif ajusté des pouvoirs d'achat de long terme relatifs"], "a": 1, "why": "Le Big Mac joue le rôle d'un panier standardisé de biens ; la PPA absolue prédit que son prix converti doit être identique partout.", "id": "equil-018", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "q": "En Mundell-Fleming, changes flexibles, mobilité parfaite. La banque centrale baisse Ms. L'effet sur Y est :", "choices": ["négatif (Y baisse)", "positif (Y augmente)", "nul (Y inchangé)", "ambigu"], "a": 0, "trap": "mf-regime", "why": "Ms ↓ ⇒ i ↑ ⇒ entrées de capitaux ⇒ appréciation ⇒ X − M ↓ ⇒ Y ↓ (chemin miroir de la hausse Ms).", "id": "mf-020", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "q": "Sous MF changes fixes + mobilité parfaite, si la BC baisse son taux directeur, l'effet immédiat est :", "choices": ["une entrée de capitaux et une appréciation", "une sortie de capitaux et une vente de devises par la BC pour tenir la parité", "un gel du taux", "une hausse mécanique de la masse monétaire Ms via l'effet Cambridge sur la demande de monnaie"], "a": 1, "trap": "mf-regime", "why": "i < i* ⇒ sortie de K ⇒ BC vend devises ⇒ Ms ↓ retour au point de départ. Politique monétaire inefficace.", "id": "mf-021", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 2, "q": "Le « péché originel » (Eichengreen) désigne :", "choices": ["la faillite d'un pays européen", "la sortie de Bretton Woods", "l'incapacité d'un pays émergent à s'endetter en sa propre monnaie", "l'inflation américaine des années 70 due au déficit budgétaire de la guerre du Vietnam"], "a": 2, "why": "Concept clef : les pays émergents empruntent en dollars/euros ; une dépréciation aggrave mécaniquement leur dette.", "id": "smi-017", "mat": "emi"}, {"cat": "bdp", "ch": 1, "diff": 2, "q": "Le solde de la balance des services couvre notamment :", "choices": ["réserves officielles de change", "IDE et investissements de portefeuille, y compris obligations souveraines émises", "biens manufacturés", "tourisme, transports, assurances, redevances de propriété intellectuelle"], "a": 3, "why": "Services = tourisme, transport, assurance, licences/redevances, télécom, informatique — poste distinct des biens et du financier.", "id": "bdp-018", "mat": "emi"}, {"cat": "bdp", "ch": 1, "diff": 3, "q": "Dans la lecture de la BdP française récente, le solde des revenus primaires est structurellement :", "choices": ["déficitaire malgré la PEN positive, à cause du poids de la dette publique", "excédentaire grâce aux revenus d'investissement à l'étranger", "toujours nul", "égal au solde commercial"], "a": 1, "why": "La France perçoit plus de revenus sur ses actifs étrangers qu'elle n'en verse — poste stabilisateur du CC.", "id": "bdp-019", "mat": "emi"}, {"cat": "pen", "ch": 1, "diff": 2, "q": "La PEN se décompose usuellement en :", "choices": ["IDE, investissements de portefeuille, autres investissements, réserves", "biens, services, transferts", "actifs risqués et actifs sûrs", "avoirs sur les particuliers et sur les entreprises"], "a": 0, "why": "Décomposition standard cohérente avec la BdP : IDE / portefeuille (actions, obligations) / autres (prêts, dépôts) / réserves BC.", "id": "pen-017", "mat": "emi"}, {"cat": "pen", "ch": 1, "diff": 3, "q": "Un pays a une PEN largement négative mais un solde des revenus primaires positif. Comment est-ce possible ?", "choices": ["actifs à l'étranger à haut rendement, engagements à taux bas (privilège exorbitant)", "erreur statistique", "réserves de change surévaluées", "ce n'est pas possible"], "a": 0, "why": "Cas typique des États-Unis : IDE à haut rendement à l'étranger, Treasuries à taux bas détenus par le reste du monde — « exorbitant privilege ».", "id": "pen-018", "mat": "emi"}, {"cat": "si", "ch": 1, "diff": 2, "q": "L'expression « déficits jumeaux » désigne :", "choices": ["déficit budgétaire (T − G < 0) et déficit courant (X − M < 0) simultanés", "déficit commercial de biens et de services", "déficit courant et déficit du compte financier", "déficit épargne et déficit investissement"], "a": 0, "why": "États-Unis années 80 sous Reagan : les deux déficits se sont creusés ensemble, illustrant (S − I) + (T − G) = X − M.", "id": "si-015", "mat": "emi"}, {"cat": "si", "ch": 1, "diff": 3, "q": "Selon le paradoxe de Feldstein-Horioka, le coefficient de régression de I/Y sur S/Y à l'échelle des pays est empiriquement :", "choices": ["proche de 1 (forte corrélation)", "proche de 0 (indépendance)", "négatif", "supérieur à 2"], "a": 0, "why": "Coefficient d'environ 0,9 dans l'étude originale de 1980 pour l'OCDE : loin du 0 qu'impliquerait la mobilité parfaite.", "id": "si-016", "mat": "emi"}, {"cat": "si", "ch": 1, "diff": 2, "q": "Le paradoxe de Lucas s'observe empiriquement par :", "choices": ["flux de capitaux Nord → Sud plus faibles que prédit", "flux Sud → Nord massifs", "convergence rapide des PIB", "élasticité nulle du capital"], "a": 0, "why": "Théorie : capital doit aller là où sa productivité marginale est élevée (Sud). Empirique : flux vers le Nord dominants (Sud finance le Nord).", "id": "si-017", "mat": "emi"}, {"cat": "forex", "ch": 2, "diff": 3, "q": "Le rôle d'une chambre de compensation (clearing house) sur un marché à terme est :", "choices": ["collecter la TVA", "fixer le taux de change à terme officiel entre les principales paires de devises", "réguler l'inflation", "se substituer à la contrepartie et neutraliser le risque de contrepartie"], "a": 3, "why": "La chambre s'interpose : chaque partie fait face à la chambre, pas à l'autre. Elle demande un appel de marge quotidien.", "id": "forex-017", "mat": "emi"}, {"cat": "forex", "ch": 2, "diff": 2, "q": "Une option de vente (put) EUR/USD à strike 1,08 protège l'exportateur français :", "choices": ["contre une hausse de l'euro", "contre une hausse du dollar au-dessus du strike 1,08 fixé aujourd'hui", "contre une baisse du dollar (dépréciation USD sous 1/1,08 ≈ 0,93 €/$)", "contre l'inflation américaine"], "a": 2, "why": "Put à strike 1,08 sur EUR/USD (au certain) donne droit de vendre 1 EUR contre 1,08 $ : plancher sous le prix à terme du dollar.", "id": "forex-018", "mat": "emi"}, {"cat": "cot", "ch": 2, "diff": 3, "q": "1 GBP = 1,25 USD et 1 EUR = 1,10 USD. Combien vaut 1 GBP en EUR (arbitrage triangulaire) ?", "choices": ["1,136 EUR", "0,88 EUR", "1,375 EUR", "1,10 EUR"], "a": 0, "why": "1 GBP = 1,25 USD ; 1 USD = 1/1,10 EUR ≈ 0,909 EUR. 1 GBP = 1,25 × 0,909 ≈ 1,136 EUR.", "id": "cot-018", "mat": "emi"}, {"cat": "cot", "ch": 2, "diff": 2, "q": "Sur le marché des changes, un carnet d'ordre centralisé existe :", "choices": ["non — c'est un marché OTC décentralisé, entre banques et via des plateformes", "oui, à New York et Londres", "oui, tenu par la BCE", "oui, sur Bloomberg uniquement"], "a": 0, "why": "Le forex est le prototype du marché OTC : liquidité fournie par les grandes banques, pas de carnet central unique.", "id": "cot-019", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 3, "q": "Une variation du TCEN log-linéarisée pondérée : Δe_eff = 0,4 × (+3 %) + 0,3 × (−2 %) + 0,3 × (+1 %) donne :", "choices": ["+0,9 %", "+2 %", "+0,7 %", "−0,9 %"], "a": 0, "why": "0,4×3 + 0,3×(−2) + 0,3×1 = 1,2 − 0,6 + 0,3 = 0,9 %.", "id": "tcr-018", "mat": "emi"}, {"cat": "tcr", "ch": 2, "diff": 3, "q": "Un TCER en niveau vaut 1,05 (par rapport à une base 1). L'interprétation la plus juste est :", "choices": ["monnaie 5 % plus chère en termes réels que la base", "inflation excédentaire de 5 % par rapport à la base", "PIB supérieur de 5 %", "5 % de déficit courant"], "a": 0, "why": "TCER > 1 = appréciation réelle vs la base. C'est un niveau relatif de prix, pas un différentiel d'inflation direct.", "id": "tcr-019", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 3, "q": "L'ancrage sur un panier (basket peg) est une variante du régime fixe qui :", "choices": ["flotte librement contre l'euro", "stabilise la monnaie contre un ensemble pondéré de devises partenaires", "utilise l'or comme référence", "ne concerne historiquement que les paradis fiscaux et les micro-États sans banque centrale propre"], "a": 1, "why": "Objectif : lisser la volatilité en cas d'oscillations d'une seule devise dominante. Exemple : Chine et le CFETS basket.", "id": "smi-019", "mat": "emi"}, {"cat": "smi", "ch": 2, "diff": 2, "q": "Dans les critères de « peur du flottement » (Calvo-Reinhart 2002), les pays émergents :", "choices": ["se ferment aux capitaux", "laissent leur monnaie flotter librement sans jamais intervenir sur le marché des changes forex", "adoptent tous l'euro", "interviennent souvent sur le change même en régime officiellement flottant"], "a": 3, "why": "« Fear of floating » : peur des dépréciations pour raisons de dette en devises → interventions fréquentes malgré un régime flottant sur le papier.", "id": "smi-020", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "q": "Sous PCTI, si f < e (taux à terme inférieur au comptant, au certain), alors :", "choices": ["i < i*", "i > i* (le pays domestique a un taux plus élevé)", "i = i*", "on ne peut rien dire sans connaître le niveau exact du taux d'anticipation eᵃ des agents"], "a": 1, "trap": "sens-parite", "why": "PCTI : f − e = i* − i. f < e ⇒ i* − i < 0 ⇒ i > i*. Prime à terme négative = report à terme = compensation du différentiel.", "id": "parite-022", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 2, "q": "L'hypothèse d'anticipations rationnelles suppose que :", "choices": ["les banques centrales sont infaillibles", "les agents ne se trompent jamais dans leurs anticipations individuelles concernant l'avenir des variables économiques", "les taux d'intérêt sont toujours corrects", "les agents utilisent toute l'information disponible sans biais systématique"], "a": 3, "why": "Hypothèse fondatrice de la macro moderne : E[erreur | info] = 0. Compatible avec des erreurs, pas avec des biais.", "id": "parite-023", "mat": "emi"}, {"cat": "parite", "ch": 3, "diff": 3, "q": "L'écart entre le taux à terme f et le spot futur e_{t+1} anticipé s'appelle :", "choices": ["spread bid-ask", "prime forward, définie comme la différence observable entre taux à terme et taux spot courant", "prime de risque (risk premium)", "erreur d'anticipation"], "a": 2, "why": "f − E[e_{t+1}] = prime de risque : compense les investisseurs neutres au risque, corrige la PNCTI naïve.", "id": "parite-024", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 3, "q": "Dans le modèle Dornbusch, le degré de surajustement dépend :", "choices": ["de l'inflation étrangère", "de la balance commerciale seule et de son évolution trimestrielle post-choc dornbuschien", "de la parité fixe éventuelle", "de l'élasticité de la demande de monnaie et de la vitesse d'ajustement des prix"], "a": 3, "trap": "statique-dyn", "why": "Plus les prix sont rigides à court terme, plus l'overshooting est marqué ; plus la demande de monnaie est sensible à i, plus le retour se fait vite.", "id": "monet-022", "mat": "emi"}, {"cat": "monet", "ch": 3, "diff": 2, "q": "Le modèle de Frenkel (1976) est appelé « modèle monétaire » car :", "choices": ["il concerne uniquement les banques centrales", "il fixe une politique monétaire nationale contracyclique en régime de change flottant pur", "le taux de change s'explique par l'offre et la demande relatives de monnaie", "il ignore le commerce"], "a": 2, "why": "Chaînage : e = P/P* (PPA), P dépend de Ms via l'équation quantitative. e devient fonction de Ms/Ms*, Y/Y*, i, i*.", "id": "monet-023", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 2, "q": "Le pass-through nominal en zone euro sur les prix à l'importation vers les prix à la consommation est, en moyenne :", "choices": ["modéré (30-50 %) et retardé", "complet et immédiat", "nul", "supérieur à 100 %"], "a": 0, "why": "Marges d'ajustement (PTM), diversification des fournisseurs, part des importations dans le panier ⇒ pass-through partiel et graduel.", "id": "depr-022", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 3, "q": "L'AS-AD ouvert avec biens échangeables et non échangeables : une dépréciation nominale fait :", "choices": ["baisser tous les prix", "monter tous les prix uniformément, échangeables comme non-échangeables, à court terme", "monter le prix des échangeables, laisser stables les non-échangeables à court terme", "ne rien changer"], "a": 2, "why": "Prix des échangeables lié au change : P_T = e × P*_T. Non-échangeables déterminés localement ⇒ TCR ↑ (compétitivité ↓).", "id": "depr-023", "mat": "emi"}, {"cat": "depr", "ch": 4, "diff": 2, "q": "L'allocation intertemporelle enseigne qu'un pays peut structurellement afficher un déficit courant si :", "choices": ["sa PEN est nulle", "il n'a pas de banque centrale ni de mécanisme de contrôle monétaire national indépendant", "il est en régime fixe", "il investit en début de période pour rembourser avec des recettes futures"], "a": 3, "why": "Justification économique du déficit : lissage de la consommation face à un revenu croissant, ou financement de l'investissement productif.", "id": "depr-024", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 3, "q": "Selon Balassa-Samuelson, la corrélation empirique entre productivité relative T/N et TCR est :", "choices": ["aléatoire", "négative : plus productif implique un TCR bas et une monnaie plus faible", "nulle", "positive : plus productif = TCR élevé (monnaie plus forte)"], "a": 3, "trap": "bs-etapes", "why": "Régression classique : le TCR d'un pays s'apprécie avec sa productivité relative dans les échangeables (mécanisme BS).", "id": "equil-020", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 2, "q": "Un pays observe TCER = 1,20 (base 1). Sur les 3 déterminants du TCR long terme (productivité, termes de l'échange, dette extérieure), lequel colle le mieux ?", "choices": ["détérioration structurelle et durable des termes de l'échange nationaux", "gain de productivité relative dans les échangeables", "hausse de la dette extérieure", "baisse de la population active"], "a": 1, "why": "Balassa-Samuelson prédit l'appréciation réelle par le canal productivité — cohérent avec un rattrapage émergent.", "id": "equil-021", "mat": "emi"}, {"cat": "equil", "ch": 5, "diff": 3, "q": "Le TCEF (FEER) est estimé par la Commission européenne pour évaluer la sous/sur-évaluation. Un excédent courant excessif suggère que la monnaie est :", "choices": ["insensible à l'analyse FEER", "sur-évaluée (elle devrait se déprécier structurellement à moyen terme)", "à sa juste valeur", "sous-évaluée (elle devrait s'apprécier)"], "a": 3, "why": "Excédent courant excessif = déséquilibre externe corrigible par une appréciation réelle ⇒ monnaie sous-évaluée selon FEER.", "id": "equil-022", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "q": "En Mundell-Fleming, sous changes fixes et mobilité imparfaite des capitaux (κ fini), une hausse de G a un effet sur Y :", "choices": ["identique à celui en mobilité parfaite", "négatif, car la hausse de G évince entièrement l'investissement privé domestique", "nul", "positif, mais moindre qu'en changes flexibles + mobilité imparfaite"], "a": 3, "trap": "mf-regime", "why": "En fixe + mobilité imparfaite, le mécanisme d'ajustement passe par une accommodation partielle des flux de capitaux : effet expansionniste mais amoindri.", "id": "mf-024", "mat": "emi"}, {"cat": "mf", "ch": 6, "diff": 3, "q": "Une intervention de la BC stérilisée à 100 % dans un régime fixe avec mobilité parfaite :", "choices": ["provoque une hyperinflation", "déprécie durablement la monnaie, via l'effet portefeuille classique de rééquilibrage", "n'a aucun effet durable, seule la composition des actifs du bilan BC change", "annule la parité"], "a": 2, "trap": "sterilise", "why": "Sans effet sur Ms (open market compensatoire) → LM inchangée → ni Y ni i changent durablement. Seul le bilan BC (or, devises, obligations) est modifié.", "id": "mf-025", "mat": "emi"}, {"cat": "bdp", "mat": "emi", "ch": 1, "diff": 2, "q": "Selon la convention du cours, l'identité comptable de la balance des paiements s'écrit :", "choices": ["TC + CC − CF + EO = 0", "TC + CC + CF + EO = 0", "TC − CC − CF + EO = 0", "TC + CC − CF = 0 (les erreurs et omissions sont négligeables)"], "a": 0, "trap": "signe-bdp", "why": "Convention du cours : TC + CC − CF + EO = 0. Le compte financier CF entre avec un signe négatif dans l'identité. Capacité (ou besoin) de financement = TC + CC. Les EO (erreurs et omissions) équilibrent la balance et ne sont jamais négligeables en pratique.", "id": "bdp-021"}, {"cat": "bdp", "mat": "emi", "ch": 1, "diff": 2, "q": "Un pays affiche un solde du compte courant négatif et un solde du compte financier négatif au sens de la convention du cours. Comment interpréter cette situation ?", "choices": ["Déficit courant financé par une entrée nette de capitaux", "Excédent courant financé par une sortie nette de capitaux", "Situation comptable impossible", "Baisse des réserves officielles nécessairement compensée par les erreurs et omissions"], "a": 0, "trap": "signe-bdp", "why": "Convention du cours : CF < 0 = entrée nette de capitaux. Un déficit courant (CC < 0) est financé par une entrée nette de capitaux (CF < 0). L'identité TC + CC − CF + EO = 0 tient : les deux soldes négatifs se compensent au signe près.", "id": "bdp-022"}, {"cat": "tcr", "mat": "emi", "ch": 2, "diff": 2, "q": "Le taux de change effectif nominal (TCEN) d'une monnaie i par rapport à J partenaires commerciaux se calcule comme :", "choices": ["Moyenne géométrique pondérée des taux de change bilatéraux, poids = parts commerciales", "Moyenne arithmétique simple des taux de change bilatéraux", "Somme des taux de change bilatéraux", "Produit des taux de change bilatéraux, non pondéré"], "a": 0, "trap": "niveau-log", "why": "En niveau, TCEN = moyenne géométrique pondérée : Ê_i = Π (E_ij)^ω_ij, avec Σ ω_ij = 1. Les poids sont les parts du partenaire j dans les échanges extérieurs de i. En variation (log), on obtient la moyenne arithmétique pondérée des taux de variation bilatéraux.", "id": "tcr-021"}, {"cat": "tcr", "mat": "emi", "ch": 2, "diff": 2, "q": "Un pays a deux partenaires commerciaux, poids 50/50. Sur l'année, sa monnaie s'apprécie de 10 % contre le premier et se déprécie de 10 % contre le second. Quelle est la variation du TCEN en log ?", "choices": ["0 % (0,5 × 10 % + 0,5 × (−10 %))", "+10 % (moyenne géométrique)", "+2 % (compensation partielle)", "Indéterminée sans connaître les niveaux initiaux"], "a": 0, "trap": "niveau-log", "why": "En log, la variation du TCEN est la moyenne arithmétique pondérée des variations bilatérales : 0,5 × 10 % + 0,5 × (−10 %) = 0 %. C'est précisément l'intérêt du log : éviter l'effet de base qui apparaît en niveau.", "id": "tcr-022"}, {"cat": "residu", "mat": "croissance", "ch": 1, "diff": 2, "q": "Selon la comptabilité de la croissance (Solow 1957), la croissance du PIB se décompose en :", "choices": ["produit de la démographie et de l'investissement", "somme des contributions du travail et du capital seulement, sans PTF", "contribution du capital + contribution du travail + résidu (PTF)", "part du salaire dans le revenu multiplié par la croissance de L"], "a": 2, "why": "g_Y = α·g_K + (1−α)·g_L + g_A. Le résidu g_A est la croissance de la productivité totale des facteurs (PTF), aussi appelé résidu de Solow. Introduction 2025-26, §Solow 1957.", "id": "residu-001"}, {"cat": "residu", "mat": "croissance", "ch": 1, "diff": 3, "q": "Dans une application de la comptabilité de la croissance aux pays d'Asie du Sud-Est (Singapour, Hong Kong…), quel est le résultat marquant identifié dans les cours ?", "choices": ["la croissance provient à 90 % du progrès technique endogène", "la croissance est tirée par l'accumulation des facteurs plutôt que par la PTF", "la contribution du capital physique est nulle et négligeable dans l'estimation régionale", "la démographie explique l'essentiel de la croissance"], "a": 1, "why": "Résultat étudié en cours (Partie 1 Solow, section D) : dans plusieurs pays asiatiques la croissance de la PTF n'explique qu'une faible fraction ; la croissance est tirée par l'accumulation. Débat Young / Krugman des années 1990.", "id": "residu-002"}, {"cat": "residu", "mat": "croissance", "ch": 1, "diff": 2, "q": "Le résidu de Solow doit être interprété comme :", "choices": ["l'effet de l'immigration nette", "uniquement le progrès technique au sens strict, à l'exclusion de tout autre facteur", "l'erreur statistique du calcul du PIB", "le progrès technique et tout ce que la comptabilité ne mesure pas"], "a": 3, "why": "Résidu = « progrès technique OU autre chose » (Solow 1957 lui-même le reconnaît). Inclut effets non mesurés : qualité des facteurs, réallocation sectorielle, changement institutionnel. Partie 1 Solow, section E (limites).", "id": "residu-003"}, {"cat": "solow", "mat": "croissance", "ch": 2, "diff": 1, "q": "Dans le modèle de Solow, l'équation d'accumulation du capital par tête (avec dépréciation δ et démographie n) s'écrit :", "choices": ["Δk = s·(δ + n)·k", "Δk = f(k) − c(t) sans dépréciation ni démographie prises en compte", "Δk = s·f(k) − (δ + n)·k", "Δk = f(k) − s·k"], "a": 2, "why": "Δk = i − (δ+n)·k, avec i = s·f(k). Le terme (δ+n)·k représente l'usure du capital et la dilution par la démographie (croissance en volume par tête).", "id": "solow-001"}, {"cat": "solow", "mat": "croissance", "ch": 2, "diff": 2, "q": "À l'état régulier k* du modèle de Solow (sans progrès technique), le capital par tête vérifie :", "choices": ["s·f(k*) = 0", "s·f(k*) > (δ + n)·k* (situation de surinvestissement soutenu)", "s·f(k*) < (δ + n)·k*", "s·f(k*) = (δ + n)·k*"], "a": 3, "why": "État régulier : Δk = 0 donc l'investissement s·f(k*) compense exactement l'usure et la dilution (δ+n)·k*. Au-dessus de k*, investissement < dilution donc k baisse ; en dessous, il monte : équilibre stable.", "id": "solow-002"}, {"cat": "solow", "mat": "croissance", "ch": 2, "diff": 3, "q": "La règle d'or de Solow (Phelps 1961) désigne le taux d'épargne s_or qui maximise :", "choices": ["la consommation par tête à l'état régulier", "le stock de capital par tête à l'état régulier", "le taux de croissance de long terme du PIB", "l'investissement brut annuel"], "a": 0, "why": "s_or maximise c* = (1−s)·f(k*). Condition : f'(k_or) = δ + n (productivité marginale du capital = taux de dilution total). Épargner plus que s_or est dynamiquement inefficace.", "id": "solow-003"}, {"cat": "solow", "mat": "croissance", "ch": 2, "diff": 2, "q": "Une hausse permanente du taux d'épargne s dans Solow (sans progrès technique) a quel effet sur le taux de croissance de long terme du PIB par tête ?", "choices": ["hausse temporaire uniquement (effet de niveau, pas de pente)", "hausse permanente proportionnelle à s", "aucun effet à long terme (le taux de croissance reste nul)", "baisse permanente et immédiate strictement proportionnelle au taux d'épargne"], "a": 0, "why": "Solow sans PT : à long terme le taux de croissance du PIB par tête est nul. Une hausse de s élève k* et donc y*, mais l'effet est un effet de NIVEAU (transition) ; le taux de croissance retombe à 0 (ou à g_A avec PT exogène).", "id": "solow-004"}, {"cat": "kaldor", "mat": "croissance", "ch": 1, "diff": 1, "q": "Parmi les faits stylisés de Kaldor caractérisant la croissance moderne des pays développés, on retient :", "choices": ["la stabilité du ratio capital/PIB (K/Y) et du taux de rendement r", "la baisse continue du ratio K/Y", "la hausse permanente et continue du taux de rendement réel du capital sur le long terme", "l'instabilité de la répartition capital/travail"], "a": 0, "why": "Faits stylisés (Introduction 2025-26) : (4) constance de r, (5) constance de K/Y, (6) stabilité des parts (1/3 capital, 2/3 travail) — sur le long terme.", "id": "kaldor-001"}, {"cat": "kaldor", "mat": "croissance", "ch": 1, "diff": 2, "q": "Selon le fait stylisé n°6 de Kaldor, les parts du capital (rK/Y) et du travail (wL/Y) dans le revenu se répartissent typiquement :", "choices": ["environ 1/3 pour le capital, 2/3 pour le travail", "environ 1/2 pour chacun", "2/3 pour le capital, 1/3 pour le travail", "environ 9/10 pour le travail, 1/10 pour le capital, dans les économies avancées"], "a": 0, "why": "Fait 6 de Kaldor : rapport 1/3 - 2/3 du long terme. Cohérent avec Cobb-Douglas Y = K^α·L^(1−α) et α ≈ 1/3.", "id": "kaldor-002"}, {"cat": "mrw", "mat": "croissance", "ch": 2, "diff": 2, "q": "Le modèle de Mankiw-Romer-Weil (1992) augmente Solow en :", "choices": ["introduisant explicitement le capital humain dans la fonction de production", "supprimant la dépréciation du capital physique", "remplaçant Cobb-Douglas par une fonction CES entièrement calibrée sur données OCDE", "endogénéisant le progrès technique via la R&D"], "a": 0, "why": "MRW (1992) ajoutent H (capital humain) : Y = K^α · H^β · (A·L)^(1−α−β). Résultat clé : α tombe à 1/3, 1/3 du revenu rémunère H, et le modèle réconcilie mieux Solow avec les données. Partie_1_Solow.txt lignes 1004-1075.", "id": "mrw-001"}, {"cat": "mrw", "mat": "croissance", "ch": 2, "diff": 2, "q": "Dans MRW (1992), la part du capital physique dans le revenu tombe à environ 1/3 parce que :", "choices": ["il faut tenir compte de la corruption dans les pays émergents", "le capital humain se substitue au travail non qualifié", "les trois facteurs K, H, (A·L) se partagent le revenu à parts approximativement égales", "le progrès technique explique désormais 2/3 de la croissance à lui seul, tous pays confondus"], "a": 2, "why": "MRW : α ≈ 1/3 pour K, β ≈ 1/3 pour H, (1−α−β) ≈ 1/3 pour A·L. Chaque facteur rémunéré à sa productivité marginale ⇒ partage tiers/tiers/tiers du revenu. Partie_1_Solow.txt ligne 1057.", "id": "mrw-002"}, {"cat": "mrw", "mat": "croissance", "ch": 2, "diff": 1, "q": "Comment MRW (1992) approximent-ils l'accumulation d'investissement en capital humain dans leur test empirique ?", "choices": ["par le nombre de brevets déposés par pays et par an dans les statistiques OMPI-INSEE", "par le PIB par tête de la génération précédente", "par le taux d'inflation moyen sur la décennie", "par la part de la population en âge de scolarisation secondaire effectivement scolarisée"], "a": 3, "why": "MRW utilisent un proxy scolaire (taux de scolarisation secondaire) comme approximation « très grossière » (Rubin) des investissements en capital humain. Partie_1_Solow.txt ligne 1065.", "id": "mrw-003"}, {"cat": "ak", "mat": "croissance", "ch": 3, "diff": 2, "q": "Dans les modèles AK, la fonction de production agrégée est :", "choices": ["linéaire en le stock de capital K : Y = A·
