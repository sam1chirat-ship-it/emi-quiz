<!doctype html><meta charset=utf-8>
<title>smoke</title>
<style>body{font-family:monospace;padding:20px;white-space:pre-wrap;font-size:11px}</style>
<div id="out">chargement…</div>
<iframe id="f" src="http://127.0.0.1:8734/index.html?seed=1" width="420" height="820" style="border:1px solid #444"></iframe>
<script>
const errs = [];
const wait = ms => new Promise(r => setTimeout(r, ms));
window.addEventListener('error', e => errs.push('parent.error: '+e.message));
const f = document.getElementById('f');
function tap(el){ if(!el) throw new Error('tap: absent'); el.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true})); }
f.addEventListener('load', async () => {
  const cw = f.contentWindow, cd = f.contentDocument;
  cw.addEventListener('error', e => errs.push('iframe.error: '+e.message));
  await wait(300);
  const log = [];
  try {
    tap(cd.querySelector('#boot [data-act="bootStart"]')); await wait(150);
    // Ouvrir COURS
    tap(cd.querySelector('.topbar [data-act="cours"]')); await wait(200);
    const nItems = cd.querySelectorAll('#cours .cours-index-item').length;
    const nAvail = cd.querySelectorAll('#cours .cours-index-item.avail').length;
    log.push('index items='+nItems+' avail='+nAvail);
    // Ouvrir un cours dispo (parite)
    tap(cd.querySelector('#cours [data-act="coursOpen"][data-v="parite"]')); await wait(200);
    const h1 = cd.querySelector('#cours .cours-topbar h1');
    const blockHead = cd.querySelector('#cours .cours-block .cb-head');
    log.push('lesson h1='+(h1?h1.textContent:'?')+' block='+(blockHead?blockHead.textContent:'?'));
    // Suivant
    tap(cd.querySelector('#cours [data-act="coursNext"]')); await wait(150);
    const blockHead2 = cd.querySelector('#cours .cours-block .cb-head');
    log.push('after next block='+(blockHead2?blockHead2.textContent:'?'));
    // Sommaire
    tap(cd.querySelector('#cours [data-act="coursIndex"]')); await wait(150);
    log.push('back to index');
    // Fermer
    tap(cd.querySelector('#cours [data-act="coursClose"]')); await wait(100);
    const isShown = cd.getElementById('cours').classList.contains('show');
    log.push('closed shown='+isShown);
  } catch (e) { errs.push('smoke: '+e.message); }
  document.getElementById('out').textContent =
    'JS errors: '+errs.length+'\n'+
    (errs.length?errs.join('\n')+'\n\n':'\n')+
    log.join('\n');
});
</script>
