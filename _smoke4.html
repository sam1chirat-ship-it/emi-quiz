<!doctype html><meta charset=utf-8>
<title>emi-smoke4</title>
<style>body{font-family:monospace;padding:20px;white-space:pre-wrap;font-size:11px}</style>
<div id="out">chargement…</div>
<iframe id="f" src="http://127.0.0.1:8734/index.html?seed=42" width="420" height="820" style="border:1px solid #444"></iframe>
<script>
const out = document.getElementById('out');
const errs = [];
window.addEventListener('error', e => errs.push('parent.error: ' + e.message));
const f = document.getElementById('f');
const log = [];
const wait = ms => new Promise(r => setTimeout(r, ms));
function tap(el){ if(!el) throw new Error("tap: absent"); el.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,cancelable:true})); }
function s(cw){ try { return cw.eval("S"); } catch(e){ return null; } }
function readA(cw){ try { return cw.eval("S.q.a"); } catch(e){ return null; } }
function readSteps(cw){ try { return cw.eval("S.q.steps"); } catch(e){ return null; } }

f.addEventListener('load', async () => {
  const cw = f.contentWindow, cd = f.contentDocument;
  cw.addEventListener('error', e => errs.push('iframe.error: ' + e.message));
  await wait(300);
  try {
    tap(cd.querySelector('#boot [data-act="bootStart"]'));
    await wait(120);
    cw.eval('localStorage.removeItem("emi.srs.v1"); localStorage.removeItem("emi.settings.v1");');
    tap(cd.querySelector('[data-act="startShow"]'));
    await wait(120);
    tap(cd.querySelector('[data-act="introOK"]'));
    await wait(200);

    let coupBasDone = false;
    for (let i = 0; i < 80; i++) {
      const S = s(cw);
      if (!S) { log.push(`step ${i}: S=null`); break; }
      log.push(`step ${i} scr=${S.screen} manche=${S.manche} phase=${S.phase} fmt=${S.qFmt} qIdx=${S.qIdx} duel=${S.duel?"y":"n"} coupBas=${S.coupBas} scores=[${S.players.map(p=>p.score+(p.out?"×":"")).join(',')}]`);
      if (S.screen === "bilan") break;
      const phase = S.phase;

      // Intro overlay du CPC
      if (phase === "intro") {
        tap(cd.querySelector('[data-act="introOK"]'));
        log.push("  → introOK cpc");
        await wait(180);
        continue;
      }

      if (phase === "q" || phase === "duel") {
        // Test du coup bas en cpc, à la première occasion
        if (!coupBasDone && S.manche === "cpc" && S.coupBas && phase === "q") {
          tap(cd.querySelector('[data-act="coupBas"]'));
          log.push("  → COUP BAS");
          coupBasDone = true;
          await wait(150);
          const next = cd.querySelector('[data-act="next"]');
          if (next) { tap(next); log.push("  → next after coup bas"); await wait(180); }
          continue;
        }
        const fmt = S.qFmt;
        if (fmt === "ordre") {
          const steps = readSteps(cw);
          const n = steps.length;
          // Répond juste : clique dans l'ordre 0..n-1 des vraies étapes
          for (let k = 0; k < n; k++) {
            const btn = cd.querySelector(`[data-act="order"][data-v="${k}"]`);
            if (!btn) { log.push(`  ordre: pas de bouton ${k}`); break; }
            tap(btn);
            await wait(50);
          }
          const valid = cd.querySelector('[data-act="orderValid"]');
          if (!valid) { log.push("  pas de valider"); break; }
          tap(valid); log.push(`  → orderValid (juste, ${n} steps)`);
          await wait(150);
        } else {
          const good = readA(cw);
          let btn;
          if (fmt === "qcm") btn = cd.querySelector(`.choices > button[data-v="${good}"]`);
          else if (fmt === "vf") btn = cd.querySelector(`[data-act="answer"][data-v="${good?"true":"false"}"]`);
          else if (fmt === "sens") btn = cd.querySelector(`[data-act="answer"][data-v="${good}"]`);
          if (!btn) { log.push("  pas de bouton"); break; }
          tap(btn); log.push(`  → answer JUSTE (${fmt}, good=${good})`);
          await wait(100);
        }
        const next = cd.querySelector('[data-act="next"]');
        if (!next) { log.push("  pas de next"); break; }
        tap(next); log.push("  → next");
        await wait(180);
      } else if (phase === "elim") {
        tap(cd.querySelector('[data-act="next"]')); log.push("  → elim next");
        await wait(180);
      } else {
        log.push("  phase inattendue"); break;
      }
    }
  } catch (e) { errs.push("smoke.exception: " + e.message); }

  const S = s(cw);
  const bilanH = cd.querySelector('#stage .bilan h2');
  out.textContent = "Errors JS : " + errs.length + "\n" +
    (errs.length ? errs.join("\n") + "\n\n" : "\n") +
    "Fin : screen=" + (S&&S.screen) + " phase=" + (S&&S.phase) + " manche=" + (S&&S.manche) + "\n" +
    "Bilan title : " + (bilanH ? bilanH.textContent : "(pas de bilan)") + "\n" +
    "asked=" + (S?S.asked.length:null) + " errors=" + (S?S.errors.length:null) + "\n" +
    "Players : " + JSON.stringify(S?S.players.map(p=>({n:p.name,s:p.score,feu:p.feu,out:p.out})):null) + "\n\n" +
    "Trace :\n" + log.join("\n");
});
</script>
