<!doctype html><meta charset=utf-8>
<title>smoke</title>
<style>body{font-family:monospace;padding:10px;white-space:pre-wrap;font-size:11px}</style>
<div id="out">…</div>
<iframe id="f" src="http://127.0.0.1:8734/index.html?seed=1" width="375" height="200" style="border:1px solid #444"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById('f');
f.addEventListener('load', async () => {
  const cd = f.contentDocument;
  await wait(300);
  cd.querySelector('#boot [data-act="bootStart"]').click();
  await wait(150);
  const tb = cd.querySelector('.topbar');
  const bs = Array.from(cd.querySelectorAll('.topbar button'));
  const lines = [`viewport=375 · topbar clientW=${tb.clientWidth} scrollW=${tb.scrollWidth} overflow=${tb.scrollWidth>tb.clientWidth?'DÉBORDE':'ok'}`];
  bs.forEach(b => {
    const r = b.getBoundingClientRect();
    lines.push(`  ${b.textContent.padEnd(9)} ${r.left.toFixed(0).padStart(3)}..${r.right.toFixed(0).padEnd(3)} w=${r.width.toFixed(0)} h=${r.height.toFixed(0)} clickable=${r.right <= 375}`);
  });
  document.getElementById('out').textContent = lines.join('\n');
});
</script>
