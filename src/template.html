<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1230">
<meta name="format-detection" content="telephone=no">
<title>Les 12 coups de l'EMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root {
  --ink: #0B1230;
  --ink2: #14204A;
  --ink3: #1E2E63;
  --gold: #FFC93C;
  --vert: #4DE6A8;
  --orange: #FF9F43;
  --rouge: #FF4D5A;
  --bleu: #4FC3F7;
  --cream: #FFF4E0;
  --muted: #8E9BC7;
  --line: rgba(79, 195, 247, .3);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --pile-bas: 0px;
  --sans: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
  --serif: 'Lora', Georgia, serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--ink);
  color: var(--cream);
  font-family: var(--serif);
  min-height: 100%;
}
body {
  padding-top: max(20px, var(--sat));
  padding-bottom: 0;
  padding-left: var(--sal);
  padding-right: var(--sar);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(1200px 800px at 50% -10%, #1a2860 0%, transparent 60%),
    linear-gradient(180deg, var(--ink) 0%, #070B22 100%);
  min-height: 100vh;
}
input, textarea, #logwrap, #logwrap * {
  -webkit-user-select: auto;
  user-select: auto;
  -webkit-touch-callout: default;
}
input[type=text], input[type=password] {
  background: var(--ink3);
  color: var(--cream);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-family: var(--serif);
  font-size: 16px;
}

/* topbar : z-index 4 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  gap: 8px;
  align-items: center;
  padding: max(30px, calc(10px + var(--sat))) 12px 8px;
  background: linear-gradient(180deg, rgba(11, 18, 48, .92) 0%, rgba(11, 18, 48, .0) 100%);
  backdrop-filter: blur(4px);
}
.topbar .spacer { flex: 1; }
.topbar button {
  font-family: var(--sans);
  letter-spacing: .06em;
}

/* header : z-index 3 (flux) */
header {
  position: relative;
  z-index: 3;
  padding: 8px 16px 4px;
  text-align: center;
}
header h1 {
  font-family: var(--sans);
  font-size: 34px;
  letter-spacing: .08em;
  margin: 0;
  color: var(--gold);
  text-shadow: 0 2px 0 #6b4a00, 0 4px 20px rgba(255, 201, 60, .3);
}
header .sub {
  font-family: var(--sans);
  color: var(--muted);
  letter-spacing: .12em;
  font-size: 13px;
  margin-top: 2px;
}

/* pupitres : 4 colonnes en flex */
#pupitres {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 10px 12px 6px;
}
.pod {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 6px 6px;
  text-align: center;
  min-height: 76px;
  position: relative;
  transition: transform .15s ease, border-color .15s ease, opacity .3s ease;
}
.pod.active {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(255, 201, 60, .35);
}
.pod.out { opacity: .35; filter: grayscale(1); }
.pod-name {
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: .05em;
  color: var(--cream);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.feux {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin: 4px 0 2px;
}
.feu {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #1c2447;
  border: 1px solid rgba(255, 255, 255, .08);
}
.feu.on-0 { background: var(--vert); box-shadow: 0 0 6px var(--vert); }
.feu.on-1 { background: var(--orange); box-shadow: 0 0 6px var(--orange); }
.feu.on-2 { background: var(--rouge); box-shadow: 0 0 6px var(--rouge); }
.pod-score {
  font-family: var(--sans);
  font-size: 18px;
  color: var(--gold);
  letter-spacing: .04em;
}

/* banner : position relative dans le flux (ARCHITECTURE §2.4 #B1) */
#banner {
  position: relative;
  z-index: 3;
  margin: 6px 12px 0;
  padding: 8px 12px;
  border-radius: 10px;
  font-family: var(--sans);
  letter-spacing: .06em;
  text-align: center;
  min-height: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height .08s ease, padding .08s ease, margin .08s ease, opacity .08s ease;
  opacity: 0;
}
#banner.show {
  max-height: 60px;
  opacity: 1;
  padding: 8px 12px;
  margin: 6px 12px 6px;
}
#banner.good { background: rgba(77, 230, 168, .16); color: var(--vert); border: 1px solid rgba(77, 230, 168, .4); }
#banner.bad { background: rgba(255, 77, 90, .18); color: var(--rouge); border: 1px solid rgba(255, 77, 90, .4); }
#banner.warn { background: rgba(255, 159, 67, .18); color: var(--orange); border: 1px solid rgba(255, 159, 67, .4); }
#banner.info { background: rgba(79, 195, 247, .14); color: var(--bleu); border: 1px solid rgba(79, 195, 247, .4); }

/* stage : le flux principal, padding-bottom via --pile-bas */
main#stage {
  position: relative;
  z-index: 3;
  padding: 12px 12px calc(var(--pile-bas) + 24px);
  min-height: 40vh;
}

/* setup */
.setup h2 {
  font-family: var(--sans);
  font-size: 22px;
  letter-spacing: .08em;
  color: var(--cream);
  margin: 8px 0 6px;
}
.setup .hint {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 12px;
}
.cats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.cat-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 999px;
  background: var(--ink3);
  border: 1px solid var(--line);
  color: var(--muted);
  font-family: var(--sans);
  letter-spacing: .04em;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
}
.cat-chip.on {
  color: var(--ink);
  background: var(--gold);
  border-color: var(--gold);
}
.cat-chip .jauge {
  display: inline-block;
  width: 28px;
  height: 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, .1);
  overflow: hidden;
  vertical-align: middle;
}
.cat-chip .jauge span {
  display: block;
  height: 100%;
  background: var(--vert);
  transition: width .3s ease;
}
.cat-chip.on .jauge { background: rgba(0, 0, 0, .12); }
.cat-chip.on .jauge span { background: var(--ink); }

/* carte question */
.card {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 14px 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .02) inset;
  margin-bottom: 12px;
}
.eyebrow {
  font-family: var(--sans);
  letter-spacing: .1em;
  font-size: 12px;
  color: var(--bleu);
  margin-bottom: 6px;
  text-transform: uppercase;
}
.qtext {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.4;
  color: var(--cream);
  margin: 0 0 12px;
}
.why {
  background: rgba(79, 195, 247, .08);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--cream);
  font-size: 15px;
  line-height: 1.45;
  margin-top: 10px;
}
.why .lbl {
  font-family: var(--sans);
  color: var(--bleu);
  letter-spacing: .06em;
  font-size: 12px;
  margin-bottom: 4px;
}
.answered-good, .answered-bad {
  border-radius: 8px;
  padding: 8px 10px;
  margin: 6px 0;
  font-family: var(--sans);
  letter-spacing: .06em;
  font-size: 14px;
}
.answered-good { background: rgba(77, 230, 168, .14); color: var(--vert); border: 1px solid rgba(77, 230, 168, .35); }
.answered-bad  { background: rgba(255, 77, 90, .16); color: var(--rouge); border: 1px solid rgba(255, 77, 90, .35); }

/* boutons : effet Duolingo (border-bottom 5px, :active translate) */
button {
  font-family: var(--sans);
  letter-spacing: .06em;
  font-size: 15px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  border-bottom-width: 5px;
  background: var(--ink3);
  color: var(--cream);
  cursor: pointer;
  transition: transform .06s ease, background .12s ease;
}
button:active { transform: translateY(3px); border-bottom-width: 2px; margin-bottom: 3px; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.b-gold  { background: var(--gold); color: #1a1200; border-color: #b58a1e; border-bottom-color: #6b4a00; }
button.b-vert  { background: var(--vert); color: #072016; border-color: #2fa676; border-bottom-color: #0f5a3c; }
button.b-rouge { background: var(--rouge); color: #200608; border-color: #a83b45; border-bottom-color: #52161c; }
button.b-ghost { background: transparent; border-color: var(--line); }
button.b-sm    { padding: 8px 10px; font-size: 13px; border-bottom-width: 4px; }

/* rangée de boutons : le premier prend toute la largeur (ARCHITECTURE §10 #B4) */
.btnrow {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.btnrow > button {
  flex: 1 1 0;
  min-width: 0;
}
.btnrow > button:first-child {
  flex: 1 1 100%;
}

/* liste de choix qcm : boutons pleine largeur, alignés à gauche */
.choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 6px;
}
.choices > button {
  text-align: left;
  font-family: var(--serif);
  font-size: 15px;
  letter-spacing: 0;
  padding: 12px 12px;
  white-space: normal;
  line-height: 1.35;
}
.choices > button.correct {
  background: rgba(77, 230, 168, .18);
  border-color: rgba(77, 230, 168, .5);
  color: var(--vert);
}
.choices > button.wrong {
  background: rgba(255, 77, 90, .18);
  border-color: rgba(255, 77, 90, .5);
  color: var(--rouge);
}
.choices > button:disabled { opacity: .85; }

/* format sens : ctx + shock + var, 4 boutons ↑ ↓ = ? */
.sens-ctx {
  font-family: var(--serif);
  color: var(--muted);
  font-style: italic;
  font-size: 14px;
  line-height: 1.35;
  margin: 4px 0 8px;
}
.sens-shock, .sens-var {
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.35;
  margin: 4px 0;
  color: var(--cream);
}
.sens-lbl {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 11px;
  color: var(--bleu);
  margin-right: 6px;
  text-transform: uppercase;
}
.sens-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.sens-btn {
  font-family: var(--sans);
  font-size: 22px;
  letter-spacing: 0;
  padding: 14px 6px;
  min-height: 52px;
}

/* mémo (cheatsheet) — modal plein écran */
#modal .cheatsheet-sheet {
  max-width: 480px;
  width: 100%;
  padding: 14px 14px 8px;
  max-height: calc(100vh - 40px - var(--sat) - var(--sab));
  display: flex;
  flex-direction: column;
}
.cs-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.cs-head h2 {
  font-family: var(--sans);
  letter-spacing: .08em;
  color: var(--gold);
  margin: 0;
  font-size: 22px;
}
#cs-search {
  width: 100%;
  background: var(--ink3);
  color: var(--cream);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-family: var(--serif);
  font-size: 15px;
  margin-bottom: 8px;
}
.cs-body {
  overflow-y: auto;
  flex: 1 1 auto;
  padding: 4px 2px 8px;
}
.cs-empty {
  color: var(--muted);
  padding: 12px;
  text-align: center;
  font-style: italic;
  font-size: 14px;
}
.cs-sec { margin: 8px 0 14px; }
.cs-sec h3 {
  font-family: var(--sans);
  letter-spacing: .08em;
  color: var(--bleu);
  font-size: 13px;
  margin: 4px 0 6px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
  padding-bottom: 4px;
}
.cs-sec h3 .cs-count {
  color: var(--muted);
  font-family: var(--sans);
  font-weight: normal;
  margin-left: 6px;
  font-size: 12px;
}
.cs-item {
  margin: 6px 0 8px;
  padding: 6px 0;
  border-bottom: 1px dashed rgba(79, 195, 247, .18);
}
.cs-item:last-child { border-bottom: none; }
.cs-item dt {
  font-family: var(--sans);
  letter-spacing: .04em;
  color: var(--gold);
  font-size: 14px;
  margin-bottom: 2px;
}
.cs-item dd {
  font-family: var(--serif);
  color: var(--cream);
  margin: 0;
  font-size: 14px;
  line-height: 1.4;
}

/* sélecteur matière (SPEC §2) — apparaît automatiquement dès qu'un
   item d'une seconde matière existe dans la banque (cf. getMats). */
.mats {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 4px 0 10px;
}
.mats-lbl {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  margin-right: 4px;
}

/* toggle express + hint dans le setup */
.setup-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0 14px;
  flex-wrap: wrap;
}
.setup-toggle-hint {
  color: var(--muted);
  font-family: var(--serif);
  font-size: 12px;
  font-style: italic;
}

/* bandeau règne au setup */
.regne-banner {
  background: linear-gradient(90deg, rgba(255,201,60,.18), rgba(255,201,60,.06));
  border: 1px solid rgba(255,201,60,.35);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 12px;
}
.regne-banner .rb-title {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 16px;
  color: var(--gold);
}
.regne-banner .rb-sub {
  font-family: var(--serif);
  color: var(--cream);
  font-size: 13px;
  margin-top: 2px;
}

/* coup de maître : réponse-modèle, chrono indicatif, notation */
.maitre-chrono {
  font-family: var(--sans);
  letter-spacing: .04em;
  font-size: 13px;
  color: var(--muted);
  margin-top: 10px;
}
.maitre-chrono #maitre-chrono {
  color: var(--gold);
  font-weight: 600;
  margin-left: 6px;
}
.ouverte-model {
  background: rgba(255, 201, 60, .08);
  border: 1px solid rgba(255, 201, 60, .3);
  border-radius: 10px;
  padding: 8px 12px;
  margin: 10px 0 6px;
  font-size: 15px;
  line-height: 1.45;
  color: var(--cream);
}
.ouverte-model .lbl {
  font-family: var(--sans);
  letter-spacing: .06em;
  font-size: 11px;
  color: var(--gold);
  margin-bottom: 4px;
}
.ouverte-lbl {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 11px;
  color: var(--bleu);
  text-transform: uppercase;
  margin: 10px 0 4px;
}
.ouverte-pts { list-style: disc inside; padding-left: 4px; margin: 0; font-size: 14px; line-height: 1.4; }

/* étoile mystérieuse (SPEC §1.7) */
#etoile { background: rgba(11, 18, 48, .95); }
.etoile-sheet {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 16px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
  text-align: left;
}
.etoile-sheet h2 {
  font-family: var(--sans);
  font-size: 24px;
  letter-spacing: .08em;
  color: var(--gold);
  margin: 0 0 4px;
  text-align: center;
}
.etoile-hint {
  color: var(--muted);
  font-size: 13px;
  text-align: center;
  margin-bottom: 12px;
}
.etoile-clues {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
}
.etoile-clues li {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 8px 10px;
  margin: 4px 0;
  border-radius: 8px;
  background: var(--ink3);
  border: 1px solid var(--line);
  font-size: 14px;
  line-height: 1.4;
}
.etoile-clues li .clue-n {
  font-family: var(--sans);
  letter-spacing: .04em;
  color: var(--gold);
  min-width: 18px;
  text-align: right;
}
.etoile-clues li.masked { opacity: .5; }
.etoile-clues li.masked .masked-txt { color: var(--muted); font-style: italic; }
.etoile-clues li.revealed { border-color: rgba(255, 201, 60, .35); }
.etoile-input { margin: 12px 0 8px; }
.etoile-input input {
  width: 100%;
  background: var(--ink3);
  color: var(--cream);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  font-family: var(--serif);
  font-size: 16px;
}
.etoile-verdict {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 20px;
  padding: 10px 12px;
  border-radius: 10px;
  text-align: center;
  margin: 12px 0 8px;
}
.etoile-verdict.good { background: rgba(77, 230, 168, .18); color: var(--vert); border: 1px solid rgba(77, 230, 168, .4); }
.etoile-verdict.bad  { background: rgba(255, 77, 90, .16); color: var(--rouge); border: 1px solid rgba(255, 77, 90, .35); }

/* coup fatal : 2 horloges (SPEC §1.5) */
.clocks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 10px 0 12px;
}
.clock {
  background: var(--ink2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.clock.active {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(255, 201, 60, .28);
  animation: fatalPulse 1.1s ease-in-out infinite;
}
@keyframes fatalPulse {
  0%,100% { box-shadow: 0 0 0 2px rgba(255, 201, 60, .28); }
  50%     { box-shadow: 0 0 0 4px rgba(255, 201, 60, .48); }
}
.clock-name {
  font-family: var(--sans);
  font-size: 13px;
  letter-spacing: .04em;
  color: var(--cream);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.clock-bar {
  height: 8px;
  border-radius: 4px;
  background: rgba(255, 255, 255, .08);
  overflow: hidden;
  margin: 4px 0;
}
.clock-bar span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--vert), var(--gold));
  transition: width .12s linear;
}
.clock-val {
  font-family: var(--sans);
  letter-spacing: .04em;
  font-size: 12px;
  color: var(--muted);
  text-align: right;
}
.fatal-msg {
  margin-top: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(79, 195, 247, .12);
  border: 1px solid var(--line);
  color: var(--bleu);
  font-family: var(--sans);
  letter-spacing: .04em;
  font-size: 13px;
  text-align: center;
}

/* format ordre : pile + choix + verdict */
.order-lbl {
  font-family: var(--sans);
  letter-spacing: .08em;
  font-size: 11px;
  color: var(--bleu);
  text-transform: uppercase;
  margin: 10px 0 4px;
}
.order-pile {
  list-style: decimal inside;
  margin: 0 0 6px;
  padding: 8px 10px;
  background: var(--ink3);
  border: 1px dashed var(--line);
  border-radius: 10px;
  color: var(--cream);
  font-size: 14px;

<script>
"use strict";
/*__DATA__*/

/* ============================================================
 *  Les 12 coups de l'EMI — moteur v1 (J1 : coup d'envoi qcm/vf)
 *  Conventions SPEC : PRNG seedable, S sérialisable, délégation
 *  par data-act, aucun onclick=, aucun console.error.
 * ============================================================ */

// Chaînes UI. Objet plat, pas d'i18n multi-langue (SPEC §0).
const T = {
  title: "Les 12 coups de l'EMI",
  setup: {
    h: "Choisis tes catégories",
    hint: "Un clic pour cocher / décocher. Il en faut au moins une.",
    start: "Lancer l'émission",
  },
  manches: {
    envoi:   { name: "Coup d'envoi",     rules: "4 candidats · 8 questions max · QCM & Vrai/Faux · 100 pts." },
    cpc:     { name: "Coup par coup",    rules: "3 candidats · 6 questions max · Sens & Ordre · 150 / 200 pts · 1 coup bas possible." },
    fatal:   { name: "Coup fatal",       rules: "2 candidats · 2 horloges de 90 s · calc & qcm à 3 choix · pas de points, on joue le titre." },
    maitre:  { name: "Coup de maître",   rules: "À venir (J5)." },
    etoile:  { name: "Étoile mystérieuse", rules: "À venir (J5)." },
  },
  vrai: "Vrai",
  faux: "Faux",
  next: "Suivant",
  ok: "C'est parti",
  correct: "Bonne réponse",
  wrong: "Mauvaise réponse",
  feuOrange: "Feu orange",
  feuRouge: "Feu rouge",
  finManche: "Fin de la manche",
  rejouer: "Rejouer",
  bootTitle: "Les 12 coups de l'EMI",
  bootHint: "Révisions L3 Paris 1 · Économie Monétaire Internationale",
  bootStart: "Commencer",
};

// Points par format (SPEC §1.4)
const POINTS = { qcm: 100, vf: 100, sens: 150, ordre: 200, qcm3: 0, calc: 0 };
// Le coup fatal ne rapporte pas de points (§1.4) : on joue le titre.

// Paliers du coup de maître (SPEC §1.6). L'index = nombre de « Su ».
const PALIERS = [1, 10, 100, 1000, 10000];
const MAITRE_TIME_MS = 45000;  // chrono indicatif, non bloquant

// Express mode (SPEC §1.10, v1.1) : émission raccourcie.
// Normal : 8 / 6 / 90 s / 5.  Express : 4 / 3 / 60 s / 3.
function isExpress() { return !!(S && S.express); }

// SRS (SPEC §5.1) — intervalles par boîte, en jours
const INTERVAL_DAYS = [0, 1, 2, 4, 7];
const DAY_MS = 24 * 60 * 60 * 1000;
const INTERVAL_MS = INTERVAL_DAYS.map(d => d * DAY_MS);

// Clefs localStorage (SPEC §5.4)
const KEY_SRS = "emi.srs.v1";
const KEY_SETTINGS = "emi.settings.v1";
const KEY_REGNE = "emi.regne.v1";

// ---------- PRNG (mulberry32, seedable) ----------
// Alimente TOUS les tirages du jeu ; Math.random est INTERDIT (SPEC §0).
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let SEED = 0;
let rng = null;

function initPRNG() {
  const url = new URL(window.location.href);
  const q = url.searchParams.get("seed");
  if (q !== null && /^-?\d+$/.test(q)) {
    SEED = parseInt(q, 10) >>> 0;
  } else {
    // Seed initial : trois sources d'entropie, XORées.
    const t1 = Date.now() >>> 0;
    const t2 = (performance.now() * 1000) >>> 0;
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    SEED = (t1 ^ t2 ^ buf[0]) >>> 0;
  }
  rng = mulberry32(SEED);
  console.log("[emi] seed=" + SEED);
}

function rngInt(n) {
  // n > 0. Retourne 0..n-1.
  return Math.floor(rng() * n);
}

function rngPick(arr) {
  return arr[rngInt(arr.length)];
}

function rngShuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rngInt(i + 1);
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

// ---------- helpers ----------
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function norm(s) {
  return String(s)
    .toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

// ---------- localStorage ----------
function loadJSON(key, def) {
  try {
    const s = localStorage.getItem(key);
    if (!s) return def;
    return JSON.parse(s);
  } catch (e) {
    return def;
  }
}

function saveJSON(key, obj) {
  try { localStorage.setItem(key, JSON.stringify(obj)); }
  catch (e) { /* quota, mode privé — silencieux, l'export/import reste dispo */ }
}

// Cache SRS en mémoire (J34.B) : loadJSON parse ~kilo-octets à chaque
// appel, ce qui coûte 20-50 ms sur Safari mobile. On charge une seule
// fois par démarrage, et on persiste de façon différée (setTimeout 0)
// pour ne jamais bloquer un tap.
let _srsCache = null;
let _srsPersistPending = false;
function loadSRS() {
  if (_srsCache === null) _srsCache = loadJSON(KEY_SRS, {});
  return _srsCache;
}
function saveSRS(o) {
  _srsCache = o;
  if (_srsPersistPending) return;
  _srsPersistPending = true;
  setTimeout(() => {
    _srsPersistPending = false;
    saveJSON(KEY_SRS, _srsCache);
  }, 0);
}
function loadRegne() {
  const def = { maitre: false, jours: 0, cagnotte: 0, etoile: null, etoilesTrouvees: [], palmares: [] };
  const r = loadJSON(KEY_REGNE, def);
  // Rétro-compat : force les listes.
  if (!Array.isArray(r.etoilesTrouvees)) r.etoilesTrouvees = [];
  if (!Array.isArray(r.palmares))        r.palmares = [];
  return r;
}
function saveRegne(o)   { saveJSON(KEY_REGNE, o); }

// Liste unique des matières effectivement présentes dans la banque d'items
// (§2 SPEC). Se base sur les items — pas sur DATA.CATS — pour que le
// sélecteur reste transparent tant qu'aucun item d'une matière n'existe,
// même si des CATS de cette matière ont déjà été déclarées (structure prête).
function getMats() {
  const set = new Set();
  const bank = [].concat(
    DATA.QCM || [], DATA.VF || [], DATA.SENS || [],
    DATA.ORDRE || [], DATA.OUVERTE || [], DATA.ETOILE || []
  );
  for (const it of bank) {
    if (typeof it.mat === "string" && it.mat.trim()) set.add(it.mat);
  }
  return Array.from(set);
}

// Ids des catégories de la matière donnée.
function catIdsFor(mat) {
  const cats = DATA.CATS || {};
  return Object.keys(cats).filter(cid => cats[cid] && cats[cid].mat === mat);
}

function loadSettings() {
  const mats = getMats();
  const defaultMat = mats[0] || "emi";
  const s = loadJSON(KEY_SETTINGS, null);
  if (!s) {
    const cids = catIdsFor(defaultMat);
    return { mat: defaultMat, cats: cids.slice(), sfx: true, express: false };
  }
  // Rétro-compat : injecte mat si absent.
  if (!s.mat || !mats.includes(s.mat)) s.mat = defaultMat;
  const cids = catIdsFor(s.mat);
  if (!Array.isArray(s.cats)) s.cats = cids.slice();
  // Nettoyage : ne garde que les cats valides ET dans la matière courante.
  s.cats = s.cats.filter(c => cids.includes(c));
  if (!s.cats.length) s.cats = cids.slice();
  return s;
}
function saveSettings(o) { saveJSON(KEY_SETTINGS, o); }

// ---------- SRS ----------
function srsUpdate(id, ok) {
  const srs = loadSRS();
  const now = Date.now();
  const cur = srs[id] || { box: 0, due: now, ok: 0, ko: 0, last: 0 };
  if (ok) {
    cur.box = Math.min(4, cur.box + 1);
    cur.ok = (cur.ok | 0) + 1;
    cur.due = now + INTERVAL_MS[cur.box];
  } else {
    cur.box = 0;
    cur.ko = (cur.ko | 0) + 1;
    cur.due = now;
  }
  cur.last = now;
  srs[id] = cur;
  saveSRS(srs);
}

// SPEC §5.2 : priorité échus (par box ↑) → jamais vus → autres (par due ↑).
// Pas de pondération par faiblesse de catégorie en J1 (NOTES §5).
function pickDue(fmt, cats) {
  const bank =
    (fmt === "qcm")     ? DATA.QCM :
    (fmt === "vf")      ? DATA.VF :
    (fmt === "sens")    ? DATA.SENS :
    (fmt === "ordre")   ? DATA.ORDRE :
    (fmt === "ouverte") ? DATA.OUVERTE :
    null;
  if (!bank) throw new Error("pickDue: format inconnu " + fmt);
  const now = Date.now();
  const srs = loadSRS();
  const asked = new Set(S ? S.asked : []);
  const mat = S && S.mat;
  // Filtre matière (défense en profondeur : les cats sélectionnées sont
  // déjà restreintes à la matière, mais on refiltre explicitement au cas
  // où un item aurait migré de matière sans que la sélection ait suivi).
  const inCats = bank.filter(it =>
    cats.includes(it.cat) && (!mat || it.mat === mat)
  );

  let cands = inCats.filter(it => !asked.has(it.id));
  if (!cands.length) {
    // Banque épuisée pour la session : on ignore le filtre « non posés ».
    if (S && !S.warned[fmt]) {
      console.log("[emi] banque " + fmt + " épuisée pour cats=" + cats.join(","));
      S.warned[fmt] = true;
    }
    cands = inCats;
    if (!cands.length) return null;
  }

  const due = [];
  const fresh = [];
  const later = [];
  for (const it of cands) {
    const st = srs[it.id];
    if (!st) fresh.push(it);
    else if (st.due <= now) due.push(it);
    else later.push(it);
  }
  due.sort((a, b) => srs[a.id].box - srs[b.id].box);
  later.sort((a, b) => srs[a.id].due - srs[b.id].due);

  const pool = due.length ? due : (fresh.length ? fresh : later);
  return rngPick(pool);
}

// ---------- générateurs calc (SPEC §4) ----------
// Chaque GEN[name](rng) retourne { q, choices, a, why, cat, ch, diff }.
// Contraintes : faisable de tête, distracteurs = confusions du prof.
const GEN = {
  // 1. Taux croisé au certain à partir de deux taux à l'incertain.
  //    1 USD = A JPY  et  1 USD = B EUR  →  1 EUR = A/B JPY
  cross(rng) {
    const A = 100 + rngInt(4) * 10;     // 100, 110, 120, 130
    // B = 1 exclu : donnerait good = A/B = A·B = bad1.
    const Bs = [0.8, 0.9, 1.25];
    const B = Bs[rngInt(Bs.length)];
    const good = Math.round(A / B);
    const bad1 = Math.round(A * B);      // mauvais sens (mul au lieu de div)
    const bad2 = Math.round(B / A * 10000) / 10000;  // inverse
    const bad3 = Math.round(A / B / 2);  // moitié
    return {
      cat: "cot", ch: 2, diff: 2,
      q: `1 USD = ${A} JPY et 1 USD = ${B} EUR (à l'incertain, point de vue américain). Combien vaut 1 EUR en JPY ?`,
      choices: [
        good + " JPY",
        bad1 + " JPY",
        bad2 + " JPY",
        bad3 + " JPY"
      ],
      a: 0,
      why: `1 EUR = A/B = ${A}/${B} = ${good} JPY. Attention : A×B (${bad1}) confond le sens du taux ; 1/(A×B) (${bad2}) inverse tout.`
    };
  },

  // 2. Variation du TCR (log-linéarisée) : Δq = Δe + (π − π*).
  varTCR(rng) {
    // Reject-sampling : garantit 4 réponses distinctes.
    let dE, pi, piS;
    for (let att = 0; att < 20; att++) {
      dE  = [-5, -3, 2, 4, 5][rngInt(5)];
      pi  = [1, 2, 3, 4][rngInt(4)];
      piS = [0, 1, 2][rngInt(3)];
      if (pi === piS) continue;
      const g0 = dE + (pi - piS);
      const b1 = dE;
      const b2 = dE + (piS - pi);
      const b3 = pi - piS;
      if (new Set([g0, b1, b2, b3]).size === 4) break;
    }
    const good = dE + (pi - piS);
    const bad1 = dE;                    // oubli de l'inflation
    const bad2 = dE + (piS - pi);       // signe inversé
    const bad3 = pi - piS;              // oubli de Δe
    return {
      cat: "tcr", ch: 2, diff: 2,
      q: `Δe = ${dE} %, π = ${pi} %, π* = ${piS} %. Variation du TCR (au certain) ?`,
      choices: [good + " %", bad1 + " %", bad2 + " %", bad3 + " %"],
      a: 0,
      why: `Δq ≈ Δe + (π − π*) = ${dE} + (${pi} − ${piS}) = ${good} %. Distracteurs : oubli d'un terme, signe inversé.`
    };
  },

  // 3. Variation du TCEN pondérée : Σ ω_i Δe_i.
  neer(rng) {
    // Reject-sampling pour éviter les collisions bad1 = bad3 quand
    // (dE1+dE2)/2 = w1·dE1, fréquentes avec certains couples.
    let w1, w2, dE1, dE2, gg, b1, b2, b3;
    for (let att = 0; att < 20; att++) {
      const w1s = [0.5, 0.6, 0.7, 0.8];
      w1 = w1s[rngInt(w1s.length)];
      w2 = Math.round((1 - w1) * 10) / 10;
      dE1 = [-4, -2, 2, 4, 5][rngInt(5)];
      dE2 = [-3, -1, 1, 3][rngInt(4)];
      gg = Math.round((w1 * dE1 + w2 * dE2) * 10) / 10;
      b1 = Math.round((dE1 + dE2) / 2 * 10) / 10;
      b2 = Math.round((w1 * dE1 - w2 * dE2) * 10) / 10;
      b3 = Math.round(w1 * dE1 * 10) / 10;
      if (new Set([gg, b1, b2, b3]).size === 4) break;
    }
    const good = gg, bad1 = b1, bad2 = b2, bad3 = b3;
    return {
      cat: "tcr", ch: 2, diff: 2,
      q: `Deux partenaires : ω₁ = ${w1}, Δe₁ = ${dE1} % ; ω₂ = ${w2}, Δe₂ = ${dE2} %. Variation du TCEN ?`,
      choices: [good + " %", bad1 + " %", bad2 + " %", bad3 + " %"],
      a: 0,
      why: `Δe_TCEN = ω₁·Δe₁ + ω₂·Δe₂ = ${w1}×${dE1} + ${w2}×${dE2} = ${good} %. Piège fréquent : oublier la pondération (moyenne simple) ou inverser le signe d'un partenaire.`
    };
  },

  // 4. Solde d'un compte à partir de crédits/débits (biens + services).
  bdp(rng) {
    let xB, mB, xS, mS, good;
    for (let att = 0; att < 20; att++) {
      xB = 100 + rngInt(20) * 5;
      mB = 100 + rngInt(20) * 5;
      xS = 20 + rngInt(10) * 5;
      mS = 20 + rngInt(10) * 5;
      good = (xB - mB) + (xS - mS);
      const b1 = xB - mB;
      const b2 = -good;
      const b3 = (xB + xS) - mB;
      if (good !== 0 && new Set([good, b1, b2, b3]).size === 4) break;
    }
    // La ligne suivante reste pour lisibilité — good/bad{1,2,3} recalculés.
    good = (xB - mB) + (xS - mS);
    const bad1 = (xB - mB);             // oubli des services
    const bad2 = (mB - xB) + (mS - xS); // signe inversé
    const bad3 = (xB + xS) - mB;        // oubli des imports de services (structurellement ≠ good de mS)
    return {
      cat: "bdp", ch: 1, diff: 2,
      q: `Balance des paiements (Md€) : exports biens ${xB}, imports biens ${mB}, exports services ${xS}, imports services ${mS}. Solde biens + services ?`,
      choices: [good + " Md€", bad1 + " Md€", bad2 + " Md€", bad3 + " Md€"],
      a: 0,
      why: `Solde = (X_B − M_B) + (X_S − M_S) = (${xB} − ${mB}) + (${xS} − ${mS}) = ${good} Md€. Piège : oublier les services (${bad1}) ou une des importations (${bad3}).`
    };
  },

  // 5. Capacité (besoin) de financement = TC + CC, et sens du CF.
  capfin(rng) {
    const TC = -rngInt(10) - 1;              // TC négatif petit
    const CC = [-20, -10, 10, 20][rngInt(4)];
    const good = TC + CC;
    // Signe du CF (convention du cours) : CapFin > 0 → CF > 0 (sortie K).
    const cfSign = good >= 0 ? "positif (sortie nette de capitaux)"
                              : "négatif (entrée nette de capitaux)";
    const goodTxt = good + " Md€ · CF " + cfSign;
    const bad1 = TC - CC;                     // erreur signe CC
    const bad2 = CC;                          // TC omis
    const bad3 = (good) + " Md€ · CF " + (good >= 0 ? "négatif (entrée)" : "positif (sortie)");
    return {
      cat: "bdp", ch: 1, diff: 3,
      q: `TC = ${TC} Md€, CC = ${CC} Md€. Capacité (+) ou besoin (−) de financement et sens du compte financier ?`,
      choices: [goodTxt, bad1 + " Md€", bad2 + " Md€ · TC omis", bad3],
      a: 0,
      why: `CapFin = TC + CC = ${TC} + ${CC} = ${good} Md€. Convention du cours : CapFin > 0 ⇒ CF > 0 = sortie nette de capitaux.`
    };
  },

  // 6. Parité PNCTI : e = eᵃ + (i − i*) sur horizon annualisé/trimestriel.
  uip(rng) {
    // Taux annuels, horizon trimestriel (÷ 4). Reject-sampling car i = i*
    // triple-doublonnait good/bad1/bad2 = 100.
    let i, iS;
    for (let att = 0; att < 20; att++) {
      i  = 4 * (rngInt(5) + 2);       // 8, 12, 16, 20, 24 %
      iS = 4 * (rngInt(4) + 1);       // 4, 8, 12, 16 %
      if (i === iS) continue;
      const diff = (i - iS) / 4;
      const g0 = 100 + diff, b1 = 100 + (i - iS), b2 = 100 - diff, b3 = 100 + (i + iS) / 4;
      if (new Set([g0, b1, b2, b3]).size === 4) break;
    }
    const eA = 100;                    // eᵃ = 100 (base 100)
    // PNCTI : e = eᵃ + (i − i*) sur l'horizon → sur 3 mois : (i − i*)/4
    const diff = (i - iS) / 4;
    const good = eA + diff;
    const bad1 = eA + (i - iS);        // oubli de l'horizon
    const bad2 = eA - diff;             // signe inversé
    const bad3 = eA + (i + iS) / 4;     // somme des taux au lieu du différentiel
    return {
      cat: "parite", ch: 3, diff: 3,
      q: `PNCTI : eᵃ = 100, i = ${i} % annuel, i* = ${iS} % annuel. Horizon 3 mois. Taux e aujourd'hui ?`,
      choices: [good.toFixed(2), bad1.toFixed(2), bad2.toFixed(2), bad3.toFixed(2)],
      a: 0,
      why: `e = eᵃ + (i − i*)/horizon = 100 + (${i} − ${iS})/4 = ${good.toFixed(2)}. Convention du cours PNCTI. Piège : oublier l'annualisation (${bad1.toFixed(2)}) ou confondre différentiel et somme des taux.`
    };
  },

  // 7. PPA relative : Δe ≈ π* − π (au certain, log-linéarisée).
  ppa(rng) {
    // π* = 0 exclu (rendait bad1 = bad2 = π) ; π = π* exclu (bad1 = 0 = bad3).
    let pi  = [2, 3, 4, 5][rngInt(4)];
    let piS = [1, 2, 3][rngInt(3)];
    if (pi === piS) pi = (pi === 5) ? pi - 1 : pi + 1;
    const good = piS - pi;
    const bad1 = pi - piS;             // signe inversé (piège classique)
    const bad2 = pi + piS;             // somme au lieu de différence
    const bad3 = 0;                    // ignore PPA relative
    return {
      cat: "equil", ch: 5, diff: 2,
      q: `PPA relative sur un an : π = ${pi} %, π* = ${piS} %. Variation attendue du taux de change au certain (Δe) ?`,
      choices: [`${good} %`, `${bad1} %`, `${bad2} %`, `${bad3} %`],
      a: 0,
      why: `PPA relative : Δe ≈ π* − π = ${piS} − ${pi} = ${good} %. Δe < 0 = dépréciation nominale (l'inflation domestique dépasse l'étrangère).`
    };
  },

  // 8. Effet de valorisation sur la PEN (SPEC §1, chap. 1).
  //    ΔPEN = CC + effet valo. Ici on isole l'effet valo pur.
  pen_valo(rng) {
    const avoirs = 200 + rngInt(6) * 50;       // 200 à 450 Md€
    let engagts = 100 + rngInt(6) * 50;        // 100 à 350 Md€
    if (engagts === avoirs) engagts += 50;     // évite good = bad1
    const dPct = [-10, -5, 5, 10][rngInt(4)];  // variation % des avoirs en devises
    // Effet de valorisation sur les avoirs (engagements en monnaie nationale ici).
    const good = Math.round(avoirs * dPct / 100);
    const bad1 = Math.round(engagts * dPct / 100);         // confond avoirs / engagements
    const bad2 = Math.round((avoirs + engagts) * dPct / 100); // total et non net
    const bad3 = -good;                                     // signe inversé
    const sens = dPct > 0 ? "hausse" : "baisse";
    return {
      cat: "pen", ch: 1, diff: 3,
      q: `PEN : avoirs en devises ${avoirs} Md€, engagements en monnaie nationale ${engagts} Md€. Les actifs étrangers subissent une ${sens} de ${Math.abs(dPct)} % (effet de valorisation). Impact sur la PEN ?`,
      choices: [`${good} Md€`, `${bad1} Md€`, `${bad2} Md€`, `${bad3} Md€`],
      a: 0,
      trap: "stock-flux",
      why: `Seuls les avoirs libellés en devises sont revalorisés : ΔPEN_valo = ${avoirs} × ${dPct}/100 = ${good} Md€. Les engagements en monnaie nationale ne bougent pas.`
    };
  },

  // === CROISSANCE (SPEC §9 J26) ============================================

  // C1. Résidu de Solow : g_A = g_Y − α·g_K − (1−α)·g_L.
  residu_g(rng) {
    const gY = 2 + rngInt(5);              // 2..6
    let gK = 2 + rngInt(5);                // 2..6
    let gL = rngInt(3);                    // 0..2
    // Exclure gK = gL (donne good = bad2 quand K et L sont symétriques).
    if (gK === gL) gK = (gK === 6) ? gK - 1 : gK + 1;
    const alphas = [0.3, 1/3, 0.4];
    const a = alphas[rngInt(alphas.length)];
    const aTxt = a === 1/3 ? "1/3" : a.toString();
    const round1 = (x) => Math.round(x * 10) / 10;
    const good = round1(gY - a * gK - (1 - a) * gL);
    const bad1 = round1(gY - gK - gL);                  // α oublié (pondérations à 1)
    const bad2 = round1(gY - a * gL - (1 - a) * gK);    // α inversé (K↔L)
    const bad3 = round1(gY + a * gK + (1 - a) * gL);    // signe inversé
    return {
      cat: "residu", ch: 1, diff: 2,
      q: `Comptabilité de la croissance : g_Y = ${gY} %, g_K = ${gK} %, g_L = ${gL} %, α = ${aTxt}. Résidu de Solow g_A ?`,
      choices: [`${good} %`, `${bad1} %`, `${bad2} %`, `${bad3} %`],
      a: 0,
      why: `g_A = g_Y − α·g_K − (1−α)·g_L = ${gY} − ${aTxt}·${gK} − (1−${aTxt})·${gL} = ${good} %. Piège : oublier les pondérations ou inverser K/L.`
    };
  },

  // C2. Part factorielle Kaldor (fait stylisé 5).
  kaldor_alpha(rng) {
    const rK = 25 + rngInt(4) * 5;    // 25, 30, 35, 40
    const wL = 100 - rK;               // Y = 100
    const good = Math.round(rK * 100) / 100;
    const bad1 = wL;                    // part travail au lieu de capital
    const bad2 = Math.round(rK / wL * 100) / 100;   // ratio r·K / w·L au lieu de r·K / Y
    const bad3 = Math.round((rK - wL));              // différence brute
    return {
      cat: "kaldor", ch: 1, diff: 1,
      q: `Y = 100, rémunération du capital r·K = ${rK}, rémunération du travail w·L = ${wL}. Part du capital α = r·K/Y ?`,
      choices: [`${good} %`, `${bad1} %`, `${bad2}`, `${bad3} %`],
      a: 0,
      why: `α = r·K/Y = ${rK}/100 = ${good} %. Kaldor (fait 5) : cette part est stable ~1/3, la part du travail ~2/3.`
    };
  },

  // C3. Harrod-Domar : taux garanti g_w = s/v.
  harrod_gw(rng) {
    // Paramètres calibrés pour éviter les collisions v/s·100 = s±v.
    const ss = [12, 15, 18];
    const s = ss[rngInt(ss.length)];
    const vs = [3, 4, 5];
    const v = vs[rngInt(vs.length)];
    const round2 = (x) => Math.round(x * 100) / 100;
    const good = round2(s / v);
    const bad1 = round2(s * v);          // produit au lieu de ratio
    const bad2 = round2(v / s * 100);    // ratio inversé (v/s en %)
    const bad3 = round2(s + v);          // somme
    return {
      cat: "harrod", ch: 2, diff: 2,
      q: `Harrod-Domar : taux d'épargne s = ${s} %, coefficient de capital v = K/Y = ${v}. Taux garanti g_w ?`,
      choices: [`${good} %`, `${bad1} %`, `${bad2} %`, `${bad3} %`],
      a: 0,
      why: `g_w = s/v = ${s}/${v} = ${good} %. Piège : v est un ratio K/Y sans dimension, s un taux — la division donne bien un taux de croissance.`
    };
  },

  // C4. Solow : capital par tête à l'état régulier (α = 1/2, forme fermée).
  //     k* = (s/(δ+n))^{1/(1−α)} = (s/(δ+n))² avec α = 1/2.
  solow_kstar(rng) {
    const ss = [0.2, 0.25, 0.3];
    const s = ss[rngInt(ss.length)];
    const dns = [0.05, 0.10];
    const dn = dns[rngInt(dns.length)];
    const ratio = s / dn;
    const good = Math.round(ratio * ratio * 100) / 100;
    const bad1 = Math.round(ratio * 100) / 100;              // sans exposant (oubli 1/(1−α))
    const bad2 = Math.round((dn / s) * (dn / s) * 100) / 100; // ratio inversé
    const bad3 = Math.round((s - dn) * 100 * 100) / 100;      // différence au lieu de ratio, mise à l'échelle × 100
    return {
      cat: "solow", ch: 2, diff: 3,
      q: `Solow, technologie Cobb-Douglas α = 1/2 : s = ${s}, δ + n = ${dn}. Capital par tête à l'état régulier k* ?`,
      choices: [`${good}`, `${bad1}`, `${bad2}`, `${bad3}`],
      a: 0,
      why: `k* = (s/(δ+n))^{1/(1−α)} = (${s}/${dn})² = ${good}. Avec α = 1/2, l'exposant vaut 2 ; sans exposant on trouve seulement le ratio s/(δ+n).`
    };
  },

  // C5. MRW : y = A · k^α · h^β avec α = 0,3, β = 0,3. Variation de y si k↑Δ %.
  mrw_elast(rng) {
    const dks = [3, 5, 10, 20];
    const dk = dks[rngInt(dks.length)];
    const alpha = 0.3;
    const beta = 0.3;
    const round1 = (x) => Math.round(x * 10) / 10;
    const good = round1(alpha * dk);
    const bad1 = round1(dk);                     // élasticité 1 (oubli α)
    const bad2 = round1(beta * dk + alpha * dk); // ajoute la contribution de h (fixe pourtant)
    const bad3 = round1((1 - alpha - beta) * dk); // élasticité au travail (1−α−β)
    return {
      cat: "mrw", ch: 3, diff: 2,
      q: `MRW : y = A · k^α · h^β, α = β = 0,3. Capital par tête k ↑ ${dk} %, capital humain h et A inchangés. Variation approximative de y ?`,
      choices: [`+${good} %`, `+${bad1} %`, `+${bad2} %`, `+${bad3} %`],
      a: 0,
      why: `Δy ≈ α·Δk = 0,3·${dk} = ${good} %. L'élasticité de y à k dans MRW est α, pas 1 (Solow simple) ni α+β.`
    };
  },

  // C6. Convergence : temps de mi-parcours vers y*, T = ln(2)/β.
  convergence_t(rng) {
    // β = 1 exclu : bad2 (=β) coïnciderait avec bad3 (=ln2·β ≈ 1).
    const betas = [2, 3, 5];     // en % par an
    const b = betas[rngInt(betas.length)];
    const ln2 = 0.693;
    const good = Math.round(ln2 / (b / 100));
    const bad1 = Math.round(100 / b);       // 1/β sans ln 2 (temps caractéristique de e-folding en années)
    const bad2 = Math.round(b);              // confusion β = temps
    const bad3 = Math.round(ln2 * b);        // multiplie au lieu de diviser
    return {
      cat: "convergence", ch: 2, diff: 3,
      q: `Convergence conditionnelle : vitesse β = ${b} % par an, ln(2) ≈ 0,693. Temps pour combler la moitié de l'écart au sentier régulier ?`,
      choices: [`≈ ${good} ans`, `≈ ${bad1} ans`, `≈ ${bad2} ans`, `≈ ${bad3} ans`],
      a: 0,
      why: `T_{1/2} = ln(2)/β = 0,693/${b/100} ≈ ${good} ans. Piège fréquent : 1/β donne le temps de réduction d'un facteur e (≈ 63 %), pas de moitié.`
    };
  },

  // C7. AK : g = s·A − (δ + n). Paramètres calibrés pour garantir g > 0.
  ak_g(rng) {
    // s·A dans [0,06 ; 0,09] et δ+n dans [0,02 ; 0,04] → g ∈ [0,02 ; 0,07].
    const ss = [0.25, 0.30];
    const s = ss[rngInt(ss.length)];
    const As = [0.20, 0.25, 0.30];
    const A = As[rngInt(As.length)];
    const dns = [0.02, 0.03, 0.04];
    const dn = dns[rngInt(dns.length)];
    const round2 = (x) => Math.round(x * 10000) / 100;   // en %, deux décimales
    const good = round2(s * A - dn);
    const bad1 = round2(s * A);              // oubli (δ+n)
    const bad2 = round2(s * A + dn);         // signe inversé
    const bad3 = round2(s + A - dn);         // somme s+A au lieu de produit
    return {
      cat: "ak", ch: 3, diff: 2,
      q: `Modèle AK : Y = A·K, taux d'épargne s = ${(s*100)} %, A = ${(A*100)} %, δ + n = ${(dn*100)} %. Taux de croissance de long terme g ?`,
      choices: [`${good} %`, `${bad1} %`, `${bad2} %`, `${bad3} %`],
      a: 0,
      why: `g = s·A − (δ+n) = ${s}·${A} − ${dn} = ${good} %. Le taux d'épargne agit sur la CROISSANCE de long terme (endogène), pas seulement sur le niveau.`
    };
  },

  // C8. Romer : g = δ·φ·L_R (progrès semi-linéaire dans L_R).
  romer_g(rng) {
    const deltas = [0.05, 0.10, 0.20];       // productivité de la recherche
    const dl = deltas[rngInt(deltas.length)];
    // φ = 1 exclu : good = δ·L_R coïnciderait avec bad2 (oubli φ).
    const phis = [0.5, 0.75];                 // externalité des idées
    const ph = phis[rngInt(phis.length)];
    const lrs = [5, 10, 20, 50];              // chercheurs
    const lr = lrs[rngInt(lrs.length)];
    const good = Math.round(dl * ph * lr * 100) / 100;
    const bad1 = Math.round(dl + ph + lr);       // somme
    const bad2 = Math.round(dl * lr * 100) / 100; // oubli de φ
    const bad3 = Math.round(ph * lr * 100) / 100; // oubli de δ
    return {
      cat: "romer", ch: 3, diff: 2,
      q: `Romer (1990) : g_A = δ · φ · L_R avec δ = ${dl}, φ = ${ph}, L_R = ${lr}. Taux de croissance des idées ?`,
      choices: [`${good}`, `${bad1}`, `${bad2}`, `${bad3}`],
      a: 0,
      why: `g_A = δ·φ·L_R = ${dl}·${ph}·${lr} = ${good}. Effet d'échelle : doubler L_R double g. Cet effet a été critiqué par Jones (semi-endogène).`
    };
  },

  // C9. Aghion / Jones semi-endogène : g_A = n·λ / (1−φ).
  aghion_gsemi(rng) {
    const ns = [1, 2, 3];              // croissance démo en %
    const n = ns[rngInt(ns.length)];
    const lambdas = [0.5, 0.75, 1];
    const lam = lambdas[rngInt(lambdas.length)];
    const phis = [0.4, 0.5, 0.6];
    const ph = phis[rngInt(phis.length)];
    const good = Math.round(n * lam / (1 - ph) * 100) / 100;
    const bad1 = Math.round(n * lam * 100) / 100;              // oubli du dénominateur
    const bad2 = Math.round((n * lam) / (1 + ph) * 100) / 100; // signe erroné dans le dénominateur
    const bad3 = Math.round(n * lam * (1 - ph) * 100) / 100;    // produit au lieu de ratio (1−φ)
    return {
      cat: "aghion", ch: 3, diff: 3,
      q: `Modèle semi-endogène (Jones) : g_A = n·λ/(1−φ), n = ${n} %, λ = ${lam}, φ = ${ph}. Taux de croissance de long terme ?`,
      choices: [`${good} %`, `${bad1} %`, `${bad2} %`, `${bad3} %`],
      a: 0,
      why: `g_A = n·λ/(1−φ) = ${n}·${lam}/(1−${ph}) = ${good} %. Contrairement à Romer, g dépend de n (croissance des chercheurs), pas de leur niveau : pas d'effet d'échelle.`
    };
  },

  // C10. OLG (Diamond, log-utilité) : épargne du jeune s* = β·w/(1+β).
  //     β = 1 exclu (donnerait good = w/2, ambigu avec la "moitié naïve").
  olg_save(rng) {
    const ws = [80, 100, 120, 150];
    const w = ws[rngInt(ws.length)];
    const betas = [0.5, 1.5, 3];
    const b = betas[rngInt(betas.length)];
    const round2 = (x) => Math.round(x * 100) / 100;
    const good = round2(b * w / (1 + b));
    const bad1 = round2(w / (1 + b));      // oubli du numérateur β
    const bad2 = round2(b * w);            // oubli de (1+β) au dénominateur
    const bad3 = round2(w / (2 + b));      // décalage du dénominateur (1+β → 2+β)
    return {
      cat: "olg", ch: 2, diff: 3,
      q: `OLG Diamond, utilité U = ln c₁ + β · ln c₂, β = ${b}, salaire du jeune w = ${w}. Épargne optimale s* ?`,
      choices: [`${good}`, `${bad1}`, `${bad2}`, `${bad3}`],
      a: 0,
      why: `s* = β·w/(1+β) = ${b}·${w}/(1+${b}) = ${good}. Sous log-utilité, la propension à épargner β/(1+β) est INDÉPENDANTE du taux d'intérêt (effets substitution et revenu s'annulent).`
    };
  },

  // C11. Malthus : piège malthusien, y = A/L = ȳ (subsistance).
  //      À l'état stationnaire, ↑ A ⇒ L ∝ A, y reste à ȳ.
  malthus_L(rng) {
    const factors = [2, 3, 4];
    const f = factors[rngInt(factors.length)];
    const round2 = (x) => Math.round(x * 100) / 100;
    return {
      cat: "malthus", ch: 2, diff: 2,
      q: `Piège malthusien : y = A/L, y = ȳ (subsistance) à l'état stationnaire. Le progrès technique multiplie A par ${f}. À long terme, la population L est multipliée par ?`,
      choices: [
        `× ${f}`,
        `× 1 (le revenu augmente à long terme)`,
        `× ${f * f} (confusion d'exposant : L ∝ A²)`,
        `× ${round2(1/f)} (la démographie diminue)`
      ],
      a: 0,
      why: `À l'état stationnaire y = ȳ constant : A/L = ȳ ⇒ L = A/ȳ, donc L ∝ A. A × ${f} ⇒ L × ${f}. Le progrès technique est absorbé par la démographie : y reste à la subsistance (essence du piège).`
    };
  }
};

const CONT = {
  nextQ: () => nextQ(),
  endManche: () => endManche(),
};

function botAccOverride(base) {
  // ?bots=weak|strong surcharge tous les acc à 0.1 / 0.9 (SPEC Annexe A).
  // Utile pour le playtest et pour le réglage.
  const q = new URL(window.location.href).searchParams.get("bots");
  if (q === "weak")   return { qcm: 0.10, vf: 0.10, sens: 0.10, ordre: 0.10, calc: 0.10, qcm3: 0.10, ouverte: 0.10 };
  if (q === "strong") return { qcm: 0.90, vf: 0.90, sens: 0.90, ordre: 0.90, calc: 0.90, qcm3: 0.90, ouverte: 0.90 };
  return base;
}

function newShow(settings) {
  const mats = getMats();
  const mat = (settings.mat && mats.includes(settings.mat)) ? settings.mat : (mats[0] || "emi");
  const catsInMat = catIdsFor(mat);
  const cats = (settings.cats && settings.cats.length)
    ? settings.cats.filter(c => catsInMat.includes(c))
    : catsInMat.slice();
  if (!cats.length) cats.push.apply(cats, catsInMat);
  const botDef = DATA.BOTS;
  S = {
    screen: "show",
    manche: "envoi",
    phase: "intro",
    players: [
      { name: "Vous",         bot: false, score: 0, feu: 0, combo: 1, out: false, acc: null },
      { name: botDef[0].name, bot: true,  score: 0, feu: 0, combo: 1, out: false, acc: botAccOverride(botDef[0].acc) },
      { name: botDef[1].name, bot: true,  score: 0, feu: 0, combo: 1, out: false, acc: botAccOverride(botDef[1].acc) },
      { name: botDef[2].name, bot: true,  score: 0, feu: 0, combo: 1, out: false, acc: botAccOverride(botDef[2].acc) },
    ],
    cur: 0,
    q: null,
    qFmt: "",
    qIdx: 0,
    asked: [],
    answered: null,
    duel: null,
    after: null,
    clocks: null,
    coupBas: true,
    maitre: null,
    cagnotte: 0,
    errors: [],
    log: [],
    warned: {},
    timer: 0,
    timerMax: 0,
    seed: SEED,
    mat: mat,
    cats: cats,
    sfx: settings.sfx !== false,
    express: !!settings.express,
    manchesLoggees: [],
    newlyRed: null,
    elimInfo: null,
    orderPick: null,
    orderPerm: null,
    fatal: null,       // { a, b, cur } — indices S.players. cur ∈ {0,1}.
    fatalMsg: null,    // "réflexion..." / verdict rapide affiché en fatal.
    etoile: null,      // { id, name, aliases, clues, indicesRevealed, guessed, matched }
    etoileWon: false,  // vrai si l'étoile a été trouvée cette émission
    regneSaved: false, // évite les updates multiples du règne en fin d'émission
  };
}

// TIMERS module-level (non-sérialisables, hors S).
const TIMERS = { clock: null, botThink: null, verdictHide: null };

function clearTimers() {
  if (TIMERS.clock)        { clearInterval(TIMERS.clock);      TIMERS.clock = null; }
  if (TIMERS.botThink)     { clearTimeout(TIMERS.botThink);    TIMERS.botThink = null; }
  if (TIMERS.verdictHide)  { clearTimeout(TIMERS.verdictHide); TIMERS.verdictHide = null; }
}

// ---------- bandeau ----------
let bannerTimer = null;
function banner(kind, text) {
  const el = document.getElementById("banner");
  if (!el) return;
  el.className = "";
  el.textContent = text;
  // Placement : entre #pupitres et #stage (déjà le cas dans le DOM).
  el.classList.add(kind, "show");
  if (bannerTimer) clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => {
    el.classList.remove("show");
  }, 1400);
}
// J34.B : appelé sur tap « Suivant » pour ne pas laisser le banner
// « traîner » pendant que la question suivante charge.
function bannerClearNow() {
  const el = document.getElementById("banner");
  if (el) el.classList.remove("show");
  if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
}

// ---------- flux question ----------
function fmtForNext() {
  // Alternance des formats selon la manche.
  if (S.manche === "envoi") return (S.qIdx % 2 === 0) ? "qcm" : "vf";
  if (S.manche === "cpc")   return (S.qIdx % 2 === 0) ? "sens" : "ordre";
  throw new Error("fmtForNext: manche non gérée " + S.manche);
}

function maxQForManche(m) {
  const ex = isExpress();
  if (m === "envoi")  return ex ? 4 : 8;
  if (m === "cpc")    return ex ? 3 : 6;
  if (m === "maitre") return ex ? 3 : 5;
  return 0;
}

function fatalClockMs() {
  return isExpress() ? 60000 : 90000;
}

function nextQ() {
  const fmt = fmtForNext();
  const it = pickDue(fmt, S.cats);
  if (!it) {
    // Aucune banque disponible dans les cats cochées pour ce format :
    // tenter l'autre format de la manche (fallback pédagogique).
    const otherFmt =
      (fmt === "qcm")  ? "vf"   :
      (fmt === "vf")   ? "qcm"  :
      (fmt === "sens") ? "ordre":
      "sens";
    const it2 = pickDue(otherFmt, S.cats);
    if (!it2) { endManche(); return; }
    S.q = it2;
    S.qFmt = otherFmt;
  } else {
    S.q = it;
    S.qFmt = fmt;
  }
  S.asked.push(S.q.id);
  S.phase = "q";
  S.answered = null;
  S.orderPick = null;
  S.orderPerm = null;
  shuffleCurrentQ();
  render();
}

// SPEC — anti-répétition (J34) : à chaque tirage, on mélange l'ordre
// d'affichage des choix (qcm/qcm3/calc). data-v reste l'index original
// dans q.choices ; seul l'ordre visuel change → aucun impact sur
// answer(), just re-shuffle sur chaque nouvelle question. S.qOrder est
// une permutation stable pour l'affichage courant, sérialisable.
function shuffleCurrentQ() {
  const q = S && S.q;
  if (!q || !Array.isArray(q.choices)) { if (S) S.qOrder = null; return; }
  const fmt = S.qFmt;
  if (fmt !== "qcm" && fmt !== "qcm3" && fmt !== "calc") { S.qOrder = null; return; }
  const idxs = q.choices.map((_, i) => i);
  S.qOrder = rngShuffle(idxs);
}

// Renvoie la liste des indices de bots qui passent NOUVELLEMENT au rouge
// (feu 1 → 2) sur cette question, dans l'ordre où ils sont joués.
function botAnswerAll(fmt) {
  const newlyRed = [];
  for (let i = 1; i < S.players.length; i++) {
    const b = S.players[i];
    if (b.out) continue;
    const acc = (b.acc && typeof b.acc[fmt] === "number") ? b.acc[fmt] : 0.5;
    const botOk = rng() < acc;
    const prev = b.feu;
    if (botOk) {
      b.score += POINTS[fmt] | 0;
    } else {
      b.feu = Math.min(2, b.feu + 1);
    }
    if (b.feu === 2 && prev < 2) newlyRed.push(i);
  }
  return newlyRed;
}

// answer({ok, given}) : goulot unique (SPEC §6.4).
// Route selon la phase courante : duel → answerDuel, sinon flux normal.
function answer(payload) {
  if (S && S.duel) { answerDuel(payload); return; }
  resolveNormal(payload);
}

function resolveNormal(payload) {
  const p = S.players[0];
  const fmt = S.qFmt;
  const ok = !!payload.ok;
  const prevFeuJ = p.feu;

  if (ok) {
    const mul = (p.combo >= 3) ? 1.5 : 1;
    const pts = Math.floor(POINTS[fmt] * mul);
    p.score += pts;
    p.combo = (p.combo | 0) + 1;
    banner("good", T.correct + " +" + pts);
  } else {
    p.combo = 1;
    p.feu = Math.min(2, p.feu + 1);
    S.errors.push({ id: S.q.id, fmt, given: payload.given, ok: false });
    if (p.feu === 2)      banner("bad", T.feuRouge);
    else if (p.feu === 1) banner("warn", T.feuOrange);
    else                  banner("bad", T.wrong);
  }
  srsUpdate(S.q.id, ok);
  const newlyRedBots = botAnswerAll(fmt);

  const newlyRed = [];
  if (p.feu === 2 && prevFeuJ < 2) newlyRed.push(0);
  for (const b of newlyRedBots) newlyRed.push(b);
  S.newlyRed = newlyRed;

  S.answered = { given: payload.given, ok };
  S.phase = "why";
  S.after = "nextQ";
  render();
}

function pickDuelOpponent(red) {
  // Adversaire = candidat au score le plus bas parmi les vivants, hors red.
  let best = -1, bestScore = Infinity;
  for (let i = 0; i < S.players.length; i++) {
    if (i === red) continue;
    const p = S.players[i];
    if (p.out) continue;
    if (p.score < bestScore) { best = i; bestScore = p.score; }
  }
  return best;
}

function endQ() {
  // La question qui vient d'être répondue compte : on incrémente qIdx.
  S.qIdx = (S.qIdx | 0) + 1;
  const max = maxQForManche(S.manche);

  // Duel déclenché par feu rouge ?
  if (S.newlyRed && S.newlyRed.length > 0) {
    const red = S.newlyRed[0]; // priorité à l'ordre de résolution
    S.newlyRed = null;
    const opp = pickDuelOpponent(red);
    if (opp >= 0) {
      const afterCont = (max && S.qIdx >= max) ? "endManche" : "nextQ";
      enterDuel(red, opp, afterCont);
      return;
    }
  }

  // Flux normal.
  if (max && S.qIdx >= max) {
    checkEndOfManche();
    return;
  }
  nextQ();
}

// ---------- duel ----------
function enterDuel(a, b, afterCont) {
  S.duel = { a: a, b: b, wins: [0, 0], n: 0 };
  S.after = afterCont;
  const pA = S.players[a], pB = S.players[b];

  // Bot vs bot : résolution synchrone, on ne montre pas les 3 questions.
  if (pA.bot && pB.bot) {
    const res = playBotDuel(a, b);
    S.duel.wins = res.wins;
    S.duel.n = res.n;
    finishDuel(res.winner, res.loser);
    return;
  }

  // Joueur dans le duel : première question sens.
  const it = pickDue("sens", S.cats);
  if (!it) {
    // Aucune sens dispo — le score le plus bas est éliminé par défaut.
    const loser = (pA.score <= pB.score) ? a : b;
    const winner = (loser === a) ? b : a;
    finishDuel(winner, loser);
    return;
  }
  S.q = it;
  S.qFmt = "sens";
  S.asked.push(it.id);
  S.phase = "duel";
  S.answered = null;
  banner("info", "DUEL · " + pA.name + " vs " + pB.name);
  render();
}

function playBotDuel(a, b) {
  const pA = S.players[a], pB = S.players[b];
  const wins = [0, 0];
  let n = 0;
  while (true) {
    n++;
    const okA = rng() < (pA.acc && pA.acc.sens != null ? pA.acc.sens : 0.5);
    const okB = rng() < (pB.acc && pB.acc.sens != null ? pB.acc.sens : 0.5);
    if (okA && !okB) wins[0]++;
    else if (!okA && okB) wins[1]++;
    if (wins[0] >= 2) return { winner: a, loser: b, wins: wins, n: n };
    if (wins[1] >= 2) return { winner: b, loser: a, wins: wins, n: n };
    if (n >= 3 && wins[0] !== wins[1]) {
      const winner = wins[0] > wins[1] ? a : b;
      const loser  = winner === a ? b : a;
      return { winner: winner, loser: loser, wins: wins, n: n };
    }
    if (n > 30) {
      // Filet ultime en cas de bots à égalité stricte prolongée.
      return { winner: a, loser: b, wins: wins, n: n };
    }
  }
}

function answerDuel(payload) {
  const d = S.duel;
  const pA = S.players[d.a], pB = S.players[d.b];
  let okA, okB;
  if (!pA.bot) {
    okA = payload.ok;
    okB = rng() < (pB.acc && pB.acc.sens != null ? pB.acc.sens : 0.5);
  } else {
    okA = rng() < (pA.acc && pA.acc.sens != null ? pA.acc.sens : 0.5);
    okB = payload.ok;
  }
  if (okA && !okB) d.wins[0]++;
  else if (!okA && okB) d.wins[1]++;
  d.n++;
  // SRS : uniquement pour la réponse du joueur.
  srsUpdate(S.q.id, payload.ok);
  if (!payload.ok) S.errors.push({ id: S.q.id, fmt: "sens", given: payload.given, ok: false });
  S.answered = { okA: okA, okB: okB, given: payload.given, ok: payload.ok };
  S.phase = "why";
  render();
}

function endDuelQ() {
  const d = S.duel;
  const done =
    (d.wins[0] >= 2 || d.wins[1] >= 2) ||
    (d.n >= 3 && d.wins[0] !== d.wins[1]);
  if (done) {
    const winner = d.wins[0] > d.wins[1] ? d.a : d.b;
    const loser  = (winner === d.a) ? d.b : d.a;
    finishDuel(winner, loser);
    return;
  }
  // Prochaine question sens.
  const it = pickDue("sens", S.cats);
  if (!it) {
    const loser = (S.players[d.a].score <= S.players[d.b].score) ? d.a : d.b;
    const winner = (loser === d.a) ? d.b : d.a;
    finishDuel(winner, loser);
    return;
  }
  S.q = it;
  S.qFmt = "sens";
  S.asked.push(it.id);
  S.phase = "duel";
  S.answered = null;
  render();
}

function finishDuel(winnerIdx, loserIdx) {
  S.players[loserIdx].out = true;
  // Feux des survivants remis à zéro (§1.3).
  for (const p of S.players) { if (!p.out) p.feu = 0; }
  const afterCont = S.after || "nextQ";
  const winsCopy = S.duel ? S.duel.wins.slice() : [0, 0];
  S.duel = null;
  S.after = null;
  S.elimInfo = {
    kind: "duel",
    winnerName: S.players[winnerIdx].name,
    loserName: S.players[loserIdx].name,
    wins: winsCopy,
    cont: afterCont,
  };
  S.phase = "elim";
  render();
}

function checkEndOfManche() {
  // §1.3 al. 2 : fin de manche sans rouge → dernier au score en danger.
  let last = -1, lastScore = Infinity;
  for (let i = 0; i < S.players.length; i++) {
    const p = S.players[i];
    if (p.out) continue;
    if (p.score < lastScore) { lastScore = p.score; last = i; }
  }
  if (last < 0) { endManche(); return; }

  // Joueur dernier → duel vs avant-dernier.
  if (last === 0) {
    let second = -1, secondScore = Infinity;
    for (let i = 1; i < S.players.length; i++) {
      const p = S.players[i];
      if (p.out) continue;
      if (p.score < secondScore) { secondScore = p.score; second = i; }
    }
    if (second < 0) { endManche(); return; }
    enterDuel(0, second, "endManche");
    return;
  }
  // Bot dernier → out direct.
  S.players[last].out = true;
  S.elimInfo = {
    kind: "danger",
    winnerName: null,
    loserName: S.players[last].name,
    wins: null,
    cont: "endManche",
  };
  S.phase = "elim";
  render();
}

function emissionOver() {
  clearTimers();
  // Joueur out. Passe par endEmission qui gère l'archivage éventuel.
  endEmission();
}

// ---------- étoile mystérieuse (SPEC §1.7) ----------
function startEtoile() {
  clearTimers();
  const regne = loadRegne();
  // Récupère l'étoile en cours (si le règne en portait déjà une non trouvée)
  // ou tire une nouvelle étoile fraîche (pas dans etoilesTrouvees).
  let etoileMeta = null;
  if (regne.etoile && regne.etoile.id) {
    etoileMeta = (DATA.ETOILE || []).find(e => e.id === regne.etoile.id) || null;
  }
  if (!etoileMeta) {
    const done = new Set(regne.etoilesTrouvees || []);
    const mat = S && S.mat;
    const remaining = (DATA.ETOILE || []).filter(e =>
      !done.has(e.id) && (!mat || e.mat === mat)
    );
    if (!remaining.length) {
      // Toutes les étoiles ont déjà été trouvées : rien à jouer.
      endEmission();
      return;
    }
    etoileMeta = rngPick(remaining);
  }
  // SPEC §1.7 : "Chaque coup de maître réussi révèle un indice de plus."
  // On stocke le compteur des indices révélés dans regne.etoile.indices.
  const prev = (regne.etoile && regne.etoile.id === etoileMeta.id) ? (regne.etoile.indices | 0) : 0;
  const indicesRevealed = Math.min(5, prev + 1);
  S.etoile = {
    id: etoileMeta.id,
    name: etoileMeta.name,
    aliases: etoileMeta.aliases || [],
    clues: etoileMeta.clues || [],
    indicesRevealed: indicesRevealed,
    proposed: false,
    guessValue: "",
    matched: false,
  };
  S.manche = "etoile";
  S.phase = "guess";
  render();
}

function submitEtoile(rawGuess) {
  const et = S.etoile;
  if (!et || et.proposed) return;
  const g = norm(rawGuess || "");
  et.guessValue = rawGuess;
  et.proposed = true;
  // Match : nom normalisé OU un alias normalisé.
  const nName = norm(et.name);
  const cand = new Set([nName, ...(et.aliases || []).map(a => norm(a))]);
  et.matched = cand.has(g) && g.length > 0;
  if (et.matched) S.etoileWon = true;
  render();
}

// ---------- fin d'émission : mise à jour du règne (§1.8) ----------
function endEmission() {
  clearTimers();
  if (S.regneSaved) { S.screen = "bilan"; render(); return; }
  S.regneSaved = true;
  const regne = loadRegne();
  const joueurOut = !!S.players[0].out;

  if (!joueurOut) {
    // Le joueur est resté vivant (ou a gagné le fatal + éventuellement
    // le coup de maître). Il devient / reste Maître de midi.
    if (!regne.maitre) { regne.maitre = true; regne.jours = 1; }
    else regne.jours += 1;
    regne.cagnotte = (regne.cagnotte | 0) + (S.cagnotte | 0);
    if (S.etoileWon && S.etoile) {
      regne.etoilesTrouvees.push(S.etoile.id);
      regne.etoile = null;                    // prochain tirage à la reprise
    } else if (S.etoile) {
      regne.etoile = { id: S.etoile.id, indices: S.etoile.indicesRevealed | 0 };
    }
    saveRegne(regne);
    S.screen = "bilan";
    S.phase = "victory";
    render();
    return;
  }

  // Joueur éliminé.
  if (regne.maitre) {
    regne.palmares.push({
      jours: regne.jours | 0,
      cagnotte: regne.cagnotte | 0,
      etoiles: (regne.etoilesTrouvees || []).slice(),
    });
    regne.palmares.sort((a, b) => (b.jours - a.jours) || (b.cagnotte - a.cagnotte));
    regne.palmares = regne.palmares.slice(0, 5);
    // Reset règne, étoile en cours conservée (SPEC §1.8).
    const savedEtoile = regne.etoile;
    regne.maitre = false;
    regne.jours = 0;
    regne.cagnotte = 0;
    regne.etoilesTrouvees = [];
    regne.etoile = savedEtoile;
    saveRegne(regne);
  }
  S.screen = "bilan";
  S.phase = "over";
  render();
}

function endManche() {
  // Transition manche → manche suivante (SPEC §1.4).
  // Joueur out ? emissionOver a déjà été appelé.
  const alive = S.players.filter(p => !p.out).map((p, i) => S.players.indexOf(p));
  const aliveBots = S.players.slice(1).filter(p => !p.out).length;

  if (S.manche === "envoi") {
    if (aliveBots < 1) { emissionOver(); return; }
    // Si seulement 2 joueurs vivants au sortir du coup d'envoi, on saute
    // le coup par coup et on va direct au coup fatal (SPEC §1.5 : 2
    // candidats). Sinon transition cpc.
    if (S.players.filter(p => !p.out).length <= 2) {
      startFatal();
      return;
    }
    S.manche = "cpc";
    S.qIdx = 0;
    S.newlyRed = null;
    S.elimInfo = null;
    S.coupBas = true;         // relance le droit au coup bas (SPEC §1.4)
    S.orderPick = null;
    S.orderPerm = null;
    S.phase = "intro";
    render();
    return;
  }

  if (S.manche === "cpc") {
    // Fin cpc → fatal.
    if (aliveBots < 1) { emissionOver(); return; }
    startFatal();
    return;
  }

  if (S.manche === "fatal") {
    // Cas rare : les deux clocks ont expiré simultanément (impossible en
    // pratique), ou banque épuisée. Fallback → bilan.
    S.screen = "bilan";
    S.phase = "endfatal";
    render();
    return;
  }

  // Manches maitre/etoile pas encore implémentées (J5).
  S.screen = "bilan";
  S.phase = "";
  render();
}

// ---------- coup fatal (SPEC §1.5) ----------
function startFatal() {
  // 2 candidats : le joueur si vivant + le bot au plus haut score parmi
  // les vivants (au sens du cours, on affronte le meilleur bot restant).
  clearTimers();
  const joueurAlive = !S.players[0].out;
  const bots = S.players.slice(1).map((p, i) => ({ p, idx: i + 1 })).filter(x => !x.p.out);
  bots.sort((x, y) => y.p.score - x.p.score);
  if (!joueurAlive) {
    // Deux meilleurs bots s'affrontent.
    if (bots.length < 2) { emissionOver(); return; }
    S.fatal = { a: bots[0].idx, b: bots[1].idx, cur: 0 };
  } else {
    if (!bots.length) { emissionOver(); return; }
    S.fatal = { a: 0, b: bots[0].idx, cur: 0 };
  }
  S.manche = "fatal";
  S.qIdx = 0;
  const clk = fatalClockMs();
  S.clocks = [clk, clk];
  S.newlyRed = null;
  S.elimInfo = null;
  S.phase = "intro";
  S.fatalMsg = null;
  render();
}

function fatalPlayerIdx(cur) {
  return cur === 0 ? S.fatal.a : S.fatal.b;
}

function nextFatalQ() {
  clearTimers();
  S.qIdx = (S.qIdx | 0) + 1;
  // Alterne calc / qcm3.
  const fmt = (S.qIdx % 2 === 1) ? "calc" : "qcm3";
  let item;
  if (fmt === "calc") {
    const mat = S.mat || "emi";
    const names = Object.keys(GEN).filter(n => GEN_MAT[n] === mat);
    if (names.length === 0) {
      // Aucun générateur pour cette matière : bascule sur qcm3 pour ne pas planter.
      const q = pickDue("qcm", S.cats);
      if (!q) { finishFatal(1 - S.fatal.cur); return; }
      item = shrinkQCM(q);
      S.asked.push(q.id);
      S.q = item; S.qFmt = "qcm3"; S.phase = "q"; S.answered = null; S.fatalMsg = null;
      shuffleCurrentQ();
      startClock();
      const p = S.players[fatalPlayerIdx(S.fatal.cur)];
      if (p.bot) scheduleBotAnswerFatal();
      render();
      return;
    }
    const name = rngPick(names);
    const gen = GEN[name](rng);
    item = Object.assign({}, gen, {
      id: "calc-" + name + "-" + S.qIdx + "-" + SEED.toString(16),
      _generated: true,
      _gen: name,
    });
  } else {
    // qcm à 3 choix : tirer un qcm ordinaire, retirer un distracteur.
    const q = pickDue("qcm", S.cats);
    if (!q) { finishFatal(1 - S.fatal.cur); return; }
    item = shrinkQCM(q);
    S.asked.push(q.id);
  }
  S.q = item;
  S.qFmt = fmt;
  S.phase = "q";
  S.answered = null;
  S.fatalMsg = null;
  shuffleCurrentQ();
  // Démarre le chrono du candidat actuel.
  startClock();
  // Si c'est un bot, planifier la réponse après réflexion.
  const p = S.players[fatalPlayerIdx(S.fatal.cur)];
  if (p.bot) scheduleBotAnswerFatal();
  render();
}

function shrinkQCM(q) {
  // Copie profonde, retire un distracteur au hasard (jamais la bonne).
  // Faute de marqueur trapIdx, on retire aléatoirement un mauvais choix.
  // Le distracteur du trap peut donc être supprimé (limite documentée
  // dans NOTES.md, à corriger avec un champ optionnel trapIdx en J5+).
  const goodIdx = q.a;
  const badIdxs = [0, 1, 2, 3].filter(i => i !== goodIdx);
  const dropIdx = rngPick(badIdxs);
  const keep = [0, 1, 2, 3].filter(i => i !== dropIdx);
  const choices = keep.map(i => q.choices[i]);
  const newGood = keep.indexOf(goodIdx);
  return {
    id: q.id,
    cat: q.cat,
    ch: q.ch,
    diff: q.diff,
    q: q.q,
    choices: choices,
    a: newGood,
    trap: q.trap || null,
    why: q.why || "",
    _shrunk: true,
    _originalId: q.id,
  };
}

function startClock() {
  clearInterval(TIMERS.clock);
  const step = 100;
  const startedAt = Date.now();
  const cur = S.fatal.cur;
  const startMs = S.clocks[cur];
  TIMERS.clock = setInterval(() => {
    if (!S || S.manche !== "fatal" || S.phase !== "q") return;
    const elapsed = Date.now() - startedAt;
    S.clocks[cur] = Math.max(0, startMs - elapsed);
    if (S.clocks[cur] <= 0) {
      clearInterval(TIMERS.clock); TIMERS.clock = null;
      finishFatal(1 - cur);
      return;
    }
    updateClocksUI();
  }, step);
}

function scheduleBotAnswerFatal() {
  clearTimeout(TIMERS.botThink);
  const think = 4000 + Math.floor(rng() * 8001); // 4 à 12 s
  S.fatalMsg = "Réflexion…";
  TIMERS.botThink = setTimeout(() => {
    if (!S || S.manche !== "fatal" || S.phase !== "q") return;
    const p = S.players[fatalPlayerIdx(S.fatal.cur)];
    const acc = (p.acc && typeof p.acc[S.qFmt] === "number") ? p.acc[S.qFmt] : 0.5;
    const botOk = rng() < acc;
    fatalRespond(botOk, null);
  }, think);
}

function fatalRespond(ok, given) {
  clearInterval(TIMERS.clock); TIMERS.clock = null;
  clearTimeout(TIMERS.botThink); TIMERS.botThink = null;
  // Enregistre pour bilan.
  if (!ok && S.players[fatalPlayerIdx(S.fatal.cur)] && !S.players[fatalPlayerIdx(S.fatal.cur)].bot) {
    S.errors.push({ id: S.q.id, fmt: S.qFmt, given: given, ok: false });
  }
  // SRS uniquement pour le joueur, pas pour les calc générés.
  const curP = S.players[fatalPlayerIdx(S.fatal.cur)];
  if (!curP.bot && !S.q._generated) {
    srsUpdate(S.q._originalId || S.q.id, ok);
  }
  const goodTxt = (S.qFmt === "calc")
    ? String(S.q.choices ? S.q.choices[S.q.a] : "?")
    : (S.q.choices ? String(S.q.choices[S.q.a]) : "?");
  S.fatalMsg = ok ? ("Bonne réponse : " + goodTxt)
                  : ("Mauvaise. Réponse : " + goodTxt);
  banner(ok ? "good" : "bad", curP.name + " " + (ok ? "trouve" : "rate"));

  if (ok) {
    // Change de main.
    S.fatal.cur = 1 - S.fatal.cur;
  }
  // Rerender pour figer l'horloge et afficher le verdict brièvement.
  render();
  // Enchaîne la question suivante après un très court délai (rythme fatal).
  clearTimeout(TIMERS.verdictHide);
  TIMERS.verdictHide = setTimeout(() => {
    if (!S || S.manche !== "fatal") return;
    nextFatalQ();
  }, 1200);
}

function finishFatal(winnerCur) {
  clearTimers();
  const winnerIdx = fatalPlayerIdx(winnerCur);
  const loserIdx = fatalPlayerIdx(1 - winnerCur);
  S.players[loserIdx].out = true;
  S.elimInfo = null;
  S.duel = null;
  S.fatalMsg = null;
  if (winnerIdx === 0) {
    // Joueur vainqueur du coup fatal → coup de maître (§1.6).
    startMaitre();
    return;
  }
  // Joueur perdu → émission terminée.
  endEmission();
}

// ---------- coup de maître (SPEC §1.6) ----------
function startMaitre() {
  clearTimers();
  S.manche = "maitre";
  S.qIdx = 0;
  S.maitre = { n: 0, su: 0, palier: PALIERS[0], revealed: false, timeLeft: MAITRE_TIME_MS };
  S.phase = "intro";
  render();
}

function nextMaitreQ() {
  clearTimers();
  const item = pickDue("ouverte", S.cats);
  if (!item) {
    // Banque épuisée : on figera la cagnotte au palier atteint.
    finishMaitre("banque");
    return;
  }
  S.q = item;
  S.qFmt = "ouverte";
  S.asked.push(item.id);
  S.maitre.n += 1;
  S.maitre.revealed = false;
  S.maitre.timeLeft = MAITRE_TIME_MS;
  S.phase = "q";
  render();
  startMaitreChrono();
}

function startMaitreChrono() {
  clearInterval(TIMERS.clock);
  const step = 100;
  const startedAt = Date.now();
  const startMs = S.maitre.timeLeft;
  TIMERS.clock = setInterval(() => {
    if (!S || S.manche !== "maitre" || S.phase !== "q" || S.maitre.revealed) return;
    S.maitre.timeLeft = Math.max(0, startMs - (Date.now() - startedAt));
    const el = document.getElementById("maitre-chrono");
    if (el) el.textContent = (S.maitre.timeLeft / 1000).toFixed(1) + " s";
    if (S.maitre.timeLeft <= 0) {
      clearInterval(TIMERS.clock); TIMERS.clock = null;
      if (el) el.textContent = "temps écoulé";
    }
  }, step);
}

function grade(kind) {
  // kind ∈ "su", "moitie", "pasSu".
  clearInterval(TIMERS.clock); TIMERS.clock = null;
  const m = S.maitre;
  if (kind === "su") {
    m.su += 1;
    m.palier = PALIERS[Math.min(m.su, PALIERS.length - 1)];
    if (m.su >= maxQForManche("maitre")) { finishMaitre("complete"); return; }
    nextMaitreQ();
    return;
  }
  if (kind === "moitie") {
    if (m.n >= maxQForManche("maitre")) { finishMaitre("run"); return; }
    nextMaitreQ();
    return;
  }
  // Pas su : cagnotte figée au palier atteint (SPEC §1.6).
  finishMaitre("pasSu");
}

function finishMaitre(reason) {
  clearTimers();
  const m = S.maitre;
  S.cagnotte = PALIERS[Math.min(m.su, PALIERS.length - 1)];
  if (m.su >= maxQForManche("maitre")) {
    // Tous les Su décrochés → accès à l'étoile mystérieuse (§1.6).
    startEtoile();
    return;
  }
  // Sinon : fin d'émission (le joueur reste Maître mais n'a pas
  // décroché de nouvelle étoile).
  endEmission();
}

// ---------- rendu ----------
function renderPupitres() {
  const el = document.getElementById("pupitres");
  if (!el) return;
  if (!S || S.screen === "setup") { el.innerHTML = ""; return; }
  const rows = S.players.map((p, i) => {
    const active = (i === 0 && S.screen === "show") ? " active" : "";
    const out = p.out ? " out" : "";
    const feux = [0, 1, 2].map(j => {
      const on = (j <= p.feu) ? (" on-" + p.feu) : "";
      return '<span class="feu' + on + '"></span>';
    }).join("");
    return (
      '<div class="pod' + active + out + '">' +
        '<div class="pod-name">' + esc(p.name) + '</div>' +
        '<div class="feux">' + feux + '</div>' +
        '<div class="pod-score">' + (p.score | 0) + '</div>' +
      '</div>'
    );
  });
  el.innerHTML = rows.join("");
}

function renderSetup() {
  const stage = document.getElementById("stage");
  const overlay = document.getElementById("overlay");
  overlay.classList.remove("show"); overlay.innerHTML = "";
  document.getElementById("subtitle").textContent = "Setup";

  const settings = loadSettings();
  const srs = loadSRS();

  const mats = getMats();
  const catsInMat = catIdsFor(settings.mat);
  // Sélecteur matière : visible seulement si plusieurs matières
  // existent dans DATA.CATS (SPEC §2 : étape transparente en v1).
  const matSelector = (mats.length > 1) ? (
    '<div class="mats">' +
      '<div class="mats-lbl">Matière</div>' +
      mats.map(m =>
        '<span class="cat-chip' + (m === settings.mat ? ' on' : '') +
          '" data-act="pickMat" data-v="' + esc(m) + '">' + esc(m.toUpperCase()) + '</span>'
      ).join("") +
    '</div>'
  ) : "";

  const chips = catsInMat.map(cid => {
    const cat = DATA.CATS[cid];
    const on = settings.cats.includes(cid) ? " on" : "";
    // Jauge = part des items de la cat en boîte ≥ 2 (§5.3).
    const bank = [].concat(DATA.QCM || [], DATA.VF || [], DATA.SENS || [], DATA.ORDRE || [], DATA.OUVERTE || []);
    const inCat = bank.filter(it => it.cat === cid);
    const knownIds = Object.keys(srs);
    const good = inCat.filter(it => knownIds.includes(it.id) && srs[it.id].box >= 2).length;
    const pct = inCat.length ? Math.round(100 * good / inCat.length) : 0;
    return (
      '<span class="cat-chip' + on + '" data-act="toggleCat" data-v="' + esc(cid) + '">' +
        esc(cat.name) +
        ' <span class="jauge"><span style="width:' + pct + '%"></span></span>' +
      '</span>'
    );
  }).join("");

  const regne = loadRegne();
  const regneBanner = regne.maitre ? (
    '<div class="regne-banner">' +
      '<div class="rb-title">Jour ' + (regne.jours | 0) + ' du règne</div>' +
      '<div class="rb-sub">Cagnotte : ' + (regne.cagnotte | 0) + ' pts · Étoiles : ' + (regne.etoilesTrouvees || []).length +
        (regne.etoile ? ' · Étoile en cours (' + (regne.etoile.indices | 0) + '/5 indices)' : '') +
      '</div>' +
    '</div>'
  ) : "";

  const expressChip =
    '<div class="setup-toggle">' +
      '<span class="cat-chip' + (settings.express ? ' on' : '') + '" data-act="toggleExpress">' +
        (settings.express ? '⚡ Express' : 'Express') +
      '</span>' +
      '<span class="setup-toggle-hint">' +
        (settings.express ? '4 / 3 / 60 s / 3 — ~5 min' : '8 / 6 / 90 s / 5 — ~12 min') +
      '</span>' +
    '</div>';

  stage.innerHTML =
    '<section class="setup">' +
      regneBanner +
      '<h2>' + esc(T.setup.h) + '</h2>' +
      '<div class="hint">' + esc(T.setup.hint) + '</div>' +
      matSelector +
      '<div class="cats">' + chips + '</div>' +
      expressChip +
      '<div class="btnrow">' +
        '<button class="b-gold" data-act="startShow">' + esc(T.setup.start) + '</button>' +
      '</div>' +
    '</section>';
}
